<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browser Agent Local Fixture</title>
<style>body{margin:0;background:#f4f3ef;color:#20231f;font:16px system-ui}main{max-width:620px;margin:60px auto;padding:32px;background:white;border:1px solid #ddd;border-radius:16px}label{display:block;margin:22px 0 6px}input{box-sizing:border-box;padding:12px;width:100%;font:inherit;border:1px solid #8c9589;border-radius:6px}button{margin-top:24px;background:#202e25;color:white;border:0;border-radius:7px;padding:12px 22px;font:inherit}#status{padding:18px;border-radius:8px;margin-top:24px}#status[data-state=done]{background:#0d9657;color:white}</style>
<main><small>LOCAL EVALUATION FIXTURE</small><h1>Create a support request</h1><p>The agent must fill both fields, submit once, and verify the visible result.</p>
<form id="request"><label for="name">Full name</label><input id="name" autocomplete="off" required><label for="email">Email address</label><input id="email" type="email" autocomplete="off" required><button id="save" type="submit">Save request</button></form><div id="status" role="status" data-state="pending">Waiting for a completed request.</div></main>
<script>document.querySelector('#request').addEventListener('submit',event=>{event.preventDefault();const status=document.querySelector('#status');status.dataset.state='done';status.textContent='Request saved for '+document.querySelector('#name').value+'.';document.querySelector('#save').disabled=true;});</script></html>
