groups:
  - id: foundations
    title: Foundations
    summary: The math, the networks and the transformer that every later answer builds on.
  - id: models
    title: Models
    summary: How a model is tuned after training, served to users, and fit into GPU memory.
  - id: applications
    title: Applications
    summary: Retrieval, prompts, structured output, evaluation and models that see and hear.
  - id: agents
    title: Agents
    summary: Agent loops, protocols, teams of agents, sandboxes and evidence from binaries.
  - id: production
    title: Production
    summary: "Operating a model service: releases, observability, cost, capacity and safety."
  - id: rounds
    title: Rounds
    summary: "Whole interview rounds: system design, incidents, coding and behavioral questions."
