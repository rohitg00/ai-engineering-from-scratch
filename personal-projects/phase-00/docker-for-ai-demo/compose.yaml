services:
  ai-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: aiefs-ai-dev:cpu
    platform: linux/arm64
    command: ["python", "app.py"]
    ports:
      - "5000:5000"
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.19.0
    platform: linux/arm64
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  qdrant-data:
