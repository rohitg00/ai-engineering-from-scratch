<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .edge { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">multi-server client with an explicit protocol-era boundary</text>

  <rect x="40" y="55" width="880" height="120" class="cold"/>
  <text x="480" y="80" text-anchor="middle" class="head">client registry</text>
  <text x="60" y="108" class="step">server/discover probe -&gt; modern result or recognized modern error -&gt; stay modern</text>
  <text x="60" y="130" class="step">unrecognized error or timeout -&gt; isolated legacy initialize fallback</text>
  <text x="60" y="154" class="small">cache era per peer; every modern request still repeats version + capabilities + clientInfo</text>

  <path d="M200,175 L200,220" class="edge" marker-end="url(#arrow)"/>
  <path d="M480,175 L480,220" class="edge" marker-end="url(#arrow)"/>
  <path d="M760,175 L760,220" class="edge" marker-end="url(#arrow)"/>

  <rect x="55" y="225" width="290" height="150" class="cool"/>
  <text x="200" y="250" text-anchor="middle" class="head">modern peer: files</text>
  <text x="75" y="278" class="small">server/discover -&gt; 2026-07-28</text>
  <text x="75" y="298" class="small">tools: read, search</text>
  <text x="75" y="318" class="small">lists: sorted + cache hints</text>
  <text x="75" y="340" class="small">calls: fresh params._meta</text>

  <rect x="360" y="225" width="240" height="150" class="hot"/>
  <text x="480" y="250" text-anchor="middle" class="head">legacy peer: archive</text>
  <text x="380" y="278" class="small">discover -&gt; unrecognized -32601</text>
  <text x="380" y="298" class="small">then initialize + initialized</text>
  <text x="380" y="318" class="small">tools: restore, search</text>
  <text x="380" y="340" class="small">legacy wire stays legacy</text>

  <rect x="615" y="225" width="290" height="150" class="cool"/>
  <text x="760" y="250" text-anchor="middle" class="head">modern peer: notes</text>
  <text x="635" y="278" class="small">server/discover -&gt; 2026-07-28</text>
  <text x="635" y="298" class="small">tools: create, search</text>
  <text x="635" y="318" class="small">lists: sorted + cache hints</text>
  <text x="635" y="340" class="small">calls: fresh params._meta</text>

  <rect x="40" y="400" width="880" height="105" class="box"/>
  <text x="480" y="425" text-anchor="middle" class="head">deterministic merged namespace and route table</text>
  <text x="60" y="452" class="step">create | read | restore | search | files/search | notes/search</text>
  <text x="60" y="477" class="small">canonical name -&gt; peer + local name; silent overwrite is forbidden</text>
  <text x="480" y="528" text-anchor="middle" class="caption">A peer record is client bookkeeping, not server-side protocol session state.</text>
</svg>
