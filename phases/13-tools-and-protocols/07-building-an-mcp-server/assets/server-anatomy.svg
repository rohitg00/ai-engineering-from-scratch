<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .edge { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">stateless stdio MCP server anatomy</text>

  <rect x="35" y="55" width="210" height="400" class="cold"/>
  <text x="140" y="80" text-anchor="middle" class="head">client process</text>
  <text x="55" y="116" class="step">each request includes</text>
  <text x="55" y="138" class="small">protocolVersion</text>
  <text x="55" y="156" class="small">clientCapabilities</text>
  <text x="55" y="174" class="small">clientInfo (SHOULD)</text>
  <text x="55" y="220" class="step">stdio transport</text>
  <text x="55" y="242" class="small">one JSON object per line</text>
  <text x="55" y="260" class="small">EOF ends process lifetime</text>
  <text x="55" y="306" class="step">no protocol session</text>
  <text x="55" y="328" class="small">no initialize gate</text>
  <text x="55" y="346" class="small">no remembered capabilities</text>

  <path d="M245,230 L315,230" class="edge" marker-end="url(#arrow)"/>
  <path d="M315,285 L245,285" class="edge" marker-end="url(#arrow)"/>

  <rect x="315" y="55" width="610" height="400" class="box"/>
  <text x="620" y="80" text-anchor="middle" class="head">server process</text>

  <rect x="335" y="100" width="570" height="70" class="hot"/>
  <text x="620" y="122" text-anchor="middle" class="step">parse -&gt; validate current _meta -&gt; route</text>
  <text x="620" y="146" text-anchor="middle" class="small">unsupported version returns -32022 with requested and supported</text>

  <rect x="335" y="190" width="170" height="90" class="cool"/>
  <text x="420" y="214" text-anchor="middle" class="step">tools</text>
  <text x="420" y="238" text-anchor="middle" class="small">list, search, create</text>
  <text x="420" y="260" text-anchor="middle" class="small">deterministic list</text>

  <rect x="525" y="190" width="170" height="90" class="cold"/>
  <text x="610" y="214" text-anchor="middle" class="step">resources</text>
  <text x="610" y="238" text-anchor="middle" class="small">list and read</text>
  <text x="610" y="260" text-anchor="middle" class="small">private cache scope</text>

  <rect x="715" y="190" width="170" height="90" class="cool"/>
  <text x="800" y="214" text-anchor="middle" class="step">prompts</text>
  <text x="800" y="238" text-anchor="middle" class="small">list and get</text>
  <text x="800" y="260" text-anchor="middle" class="small">stable templates</text>

  <rect x="335" y="300" width="570" height="125" class="cool"/>
  <text x="620" y="324" text-anchor="middle" class="step">complete response wrapper</text>
  <text x="355" y="350" class="small">resultType: complete</text>
  <text x="355" y="372" class="small">_meta.io.modelcontextprotocol/serverInfo</text>
  <text x="355" y="394" class="small">cacheable results also include ttlMs + cacheScope</text>
  <text x="355" y="414" class="small">server/discover is a mandatory handler</text>

  <text x="480" y="490" text-anchor="middle" class="caption">A dual-era deployment keeps any legacy initialize adapter separate from this modern path.</text>
</svg>
