<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machine</title>
<script>
(function () {
  function apply() {
    var t = localStorage.getItem('theme');
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  }
  apply();
  window.addEventListener('storage', function (e) {
    if (e.key === 'theme' || e.key === null) apply();
  });
})();
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fafaf5;
  --bg-surface: #f3f1e8;
  --ink: #1a1a1a;
  --ink-soft: #4a4a4a;
  --ink-mute: #7a7a78;
  --rule-soft: rgba(26, 26, 26, 0.16);
  --blueprint: #3553ff;
  --blueprint-tint: rgba(53, 83, 255, 0.08);
  --blueprint-tint-strong: rgba(53, 83, 255, 0.18);
  --warn: #b8870f;
  --desk: #e9e3d6;
  --mat: #d9dde8;
  --font-mono: 'JetBrains Mono', ui-monospace, 'Consolas', monospace;
  --font-body: 'Source Serif 4', 'Source Serif Pro', 'Iowan Old Style', Georgia, serif;
}
[data-theme="dark"] {
  --bg: #0a0d1a;
  --bg-surface: #131830;
  --ink: #e8e6dc;
  --ink-soft: #a8a6a0;
  --ink-mute: #7a7878;
  --rule-soft: rgba(232, 230, 220, 0.18);
  --blueprint: #6b8eff;
  --blueprint-tint: rgba(107, 142, 255, 0.12);
  --blueprint-tint-strong: rgba(107, 142, 255, 0.22);
  --warn: #d4a83d;
  --desk: #151a2e;
  --mat: #1e2440;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 14px;
}
.mc-card {
  position: relative;
  width: 100%;
  max-width: 1180px;
  background: var(--bg-surface);
  border: 1px solid var(--rule-soft);
  padding: 16px;
}
.mc-body {
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr);
  gap: 16px;
}
.mc-rail { min-width: 0; }
.mc-fig {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--blueprint);
  margin: 0 0 4px;
}
.mc-title {
  font-size: 1.3rem;
  line-height: 1.25;
  margin: 0 0 10px;
}
.mc-steps {
  list-style: none;
  margin: 12px 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.mc-steps button {
  width: 100%;
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  text-align: left;
  min-height: 44px;
  padding: 8px 10px;
  border: 1px solid var(--rule-soft);
  border-radius: 2px;
  background: var(--bg);
  color: var(--ink-soft);
  cursor: pointer;
}
.mc-steps button .n { color: var(--ink-mute); font-size: 0.68rem; }
.mc-steps button.is-now {
  border-color: var(--blueprint);
  background: var(--blueprint-tint);
  color: var(--ink);
}
.mc-steps button.is-now .n { color: var(--blueprint); }
.mc-steps button.is-done { opacity: 0.6; }
.mc-steps button:hover { border-color: var(--blueprint); }
.mc-say {
  font-size: 0.95rem;
  line-height: 1.55;
  color: var(--ink-soft);
  margin: 12px 0;
  min-height: 3em;
}
.mc-stage { min-width: 0; display: flex; flex-direction: column; }
.mc-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.mc-question {
  font-size: 1.02rem;
  line-height: 1.4;
  margin: 0;
  flex: 1 1 320px;
}
.mc-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.mc-seg {
  display: inline-flex;
  border: 1px solid var(--rule-soft);
}
.mc-seg button {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  min-height: 44px;
  padding: 0 14px;
  border: 0;
  background: transparent;
  color: var(--ink-soft);
  cursor: pointer;
}
.mc-seg button + button { border-left: 1px solid var(--rule-soft); }
.mc-seg button.is-on { background: var(--blueprint-tint); color: var(--blueprint); }
.mc-apart {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--ink-soft);
}
.mc-apart input { width: 100px; accent-color: var(--blueprint); }
.mc-btn {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  min-height: 44px;
  padding: 0 14px;
  border: 1px solid var(--rule-soft);
  border-radius: 2px;
  background: var(--bg);
  color: var(--ink);
  cursor: pointer;
}
.mc-btn:hover { border-color: var(--blueprint); }
.mc-btn:disabled { opacity: 0.4; cursor: default; }
:focus-visible { outline: 2px solid var(--blueprint); outline-offset: 2px; }
.mc-canvas-wrap {
  position: relative;
  border: 1px solid var(--rule-soft);
  background: var(--bg);
  height: clamp(380px, 64vh, 700px);
  overflow: hidden;
}
.mc-canvas-wrap.is-blueprint {
  background:
    radial-gradient(var(--rule-soft) 1px, transparent 1px) 0 0 / 22px 22px,
    var(--bg);
}
.mc-canvas-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.mc-plate {
  position: absolute;
  inset: 12px;
  border: 1px solid var(--rule-soft);
  pointer-events: none;
  display: none;
}
.mc-canvas-wrap.is-blueprint .mc-plate { display: block; }
.mc-caption {
  position: absolute;
  top: 20px;
  left: 24px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--blueprint);
  pointer-events: none;
  display: none;
}
.mc-canvas-wrap.is-blueprint .mc-caption { display: block; }
.mc-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.mc-leaders { position: absolute; inset: 0; width: 100%; height: 100%; }
.mc-tag {
  position: absolute;
  transform: translate(-50%, -50%);
  font-family: var(--font-mono);
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--blueprint);
  background: var(--bg);
  border: 1px solid var(--blueprint);
  padding: 2px 6px;
  white-space: nowrap;
}
.mc-tag.mc-tag-callout { transform: translate(0, -50%); }
.mc-tag.mc-tag-flow {
  color: var(--ink-soft);
  border-color: var(--rule-soft);
  text-transform: none;
  letter-spacing: 0;
  font-size: 0.66rem;
}
.mc-fallback {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
  color: var(--ink-soft);
  font-size: 1rem;
  background:
    radial-gradient(var(--rule-soft) 1px, transparent 1px) 0 0 / 22px 22px,
    var(--bg);
}
.mc-fallback[hidden] { display: none; }
.mc-readouts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 10px 0 0;
}
.mc-chip {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--ink-soft);
  border: 1px solid var(--rule-soft);
  background: var(--bg);
  padding: 8px 12px;
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
}
.mc-chip b { color: var(--blueprint); font-weight: 700; }
details.mc-parts { margin: 10px 0 0; }
details.mc-parts summary {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-mute);
  cursor: pointer;
  min-height: 44px;
  display: flex;
  align-items: center;
}
details.mc-parts summary:hover { color: var(--blueprint); }
.mc-parts-group { margin-bottom: 8px; }
.mc-parts-group .g {
  font-family: var(--font-mono);
  font-size: 0.64rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-mute);
  display: block;
  margin-bottom: 4px;
}
.mc-parts-list { display: flex; flex-wrap: wrap; gap: 6px; }
.mc-part-btn {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  min-height: 44px;
  padding: 6px 10px;
  border: 1px solid var(--rule-soft);
  border-radius: 2px;
  background: var(--bg);
  color: var(--ink-soft);
  cursor: pointer;
}
.mc-part-btn:hover { border-color: var(--blueprint); color: var(--ink); }
.mc-part-btn.is-on { border-color: var(--blueprint); color: var(--blueprint); background: var(--blueprint-tint); }
.mc-foot {
  border-top: 1px solid var(--rule-soft);
  margin-top: 12px;
  padding-top: 10px;
}
.mc-big { font-size: 1rem; line-height: 1.5; margin: 0 0 6px; }
.mc-big b { color: var(--blueprint); }
.mc-note, .mc-honest {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--ink-mute);
  margin: 4px 0 0;
}
.mc-panel {
  position: absolute;
  top: 16px;
  right: 16px;
  width: min(300px, calc(100% - 32px));
  background: var(--bg);
  border: 1px solid var(--blueprint);
  padding: 14px;
  z-index: 5;
}
.mc-panel[hidden] { display: none; }
.mc-panel h2 { font-size: 1.05rem; margin: 0 34px 6px 0; }
.mc-panel .g {
  font-family: var(--font-mono);
  font-size: 0.66rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin: 0 0 8px;
}
.mc-panel .x {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 44px;
  height: 44px;
  border: 0;
  background: transparent;
  color: var(--ink-mute);
  font-family: var(--font-mono);
  font-size: 1rem;
  cursor: pointer;
}
.mc-panel .x:hover { color: var(--blueprint); }
.mc-panel p { font-size: 0.9rem; line-height: 1.5; margin: 0 0 10px; }
.mc-panel .sent {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--blueprint);
}
@media (max-width: 720px) {
  body { padding: 0; }
  .mc-card { border: 0; padding: 12px; }
  .mc-body { grid-template-columns: 1fr; }
  .mc-steps {
    flex-direction: row;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding-bottom: 4px;
  }
  .mc-steps li { flex: 0 0 auto; scroll-snap-align: start; }
  .mc-steps button { width: auto; white-space: nowrap; }
  .mc-toolbar { gap: 8px; }
  .mc-canvas-wrap { height: 52vh; }
  .mc-panel { position: fixed; left: 12px; right: 12px; top: auto; bottom: 12px; width: auto; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div class="mc-card">
  <div class="mc-body">
    <aside class="mc-rail">
      <p class="mc-fig" id="fig" hidden>FIG <span id="figNum"></span></p>
      <h1 class="mc-title" id="title"></h1>
      <div class="mc-seg" role="group" aria-label="Step mode">
        <button type="button" id="autoBtn">Auto</button>
        <button type="button" id="manualBtn" class="is-on">Manual</button>
      </div>
      <ol class="mc-steps" id="steps"></ol>
      <p class="mc-say" id="say"></p>
      <button type="button" class="mc-btn" id="startOver">Start over</button>
    </aside>
    <section class="mc-stage">
      <div class="mc-toolbar">
        <p class="mc-question" id="question"></p>
        <div class="mc-controls">
          <div class="mc-seg" role="group" aria-label="View">
            <button type="button" id="view3d" class="is-on">3D</button>
            <button type="button" id="viewBp">Blueprint</button>
          </div>
          <label class="mc-apart">Apart
            <input type="range" id="apart" min="0" max="1" step="0.01" value="0">
          </label>
          <button type="button" class="mc-btn" id="saveBtn">Save image</button>
        </div>
      </div>
      <div class="mc-canvas-wrap" id="canvasWrap">
        <div class="mc-plate"></div>
        <div class="mc-caption" id="caption"></div>
        <div class="mc-labels" id="labels"><svg class="mc-leaders" id="leaders"></svg></div>
        <div class="mc-fallback" id="fallback" hidden>This browser could not start 3D graphics. The steps and parts below still work.</div>
      </div>
      <div class="mc-readouts" id="readouts"></div>
      <details class="mc-parts" id="partsDetails">
        <summary id="partsSummary">Parts</summary>
        <div id="parts"></div>
      </details>
    </section>
  </div>
  <footer class="mc-foot">
    <p class="mc-big"><b>The big idea:</b> <span id="bigIdea"></span></p>
    <p class="mc-note" id="note" hidden></p>
    <p class="mc-honest" id="honest"></p>
  </footer>
  <aside class="mc-panel" id="panel" hidden aria-label="Part details">
    <button type="button" class="x" id="panelClose" aria-label="Close part details">&times;</button>
    <h2 id="panelLabel"></h2>
    <p class="g" id="panelGroup"></p>
    <p id="panelExplain"></p>
    <button type="button" class="mc-btn" id="askBtn">Ask your tutor about this part</button>
    <p class="sent" id="panelSent" hidden>Sent. Look in your terminal.</p>
    <p id="panelOffline" hidden>Open this file through the lesson screen to ask your tutor.</p>
  </aside>
</div>
<script id="machine-spec" type="application/json">__MACHINE_SPEC__</script>
<script>
(function () {
  var spec = JSON.parse(document.getElementById('machine-spec').textContent);
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    fig: $('fig'), figNum: $('figNum'), title: $('title'), say: $('say'),
    steps: $('steps'), question: $('question'), canvasWrap: $('canvasWrap'),
    caption: $('caption'), labels: $('labels'), leaders: $('leaders'), fallback: $('fallback'),
    readouts: $('readouts'), parts: $('parts'), partsSummary: $('partsSummary'), bigIdea: $('bigIdea'),
    note: $('note'), honest: $('honest'), panel: $('panel'),
    panelLabel: $('panelLabel'), panelGroup: $('panelGroup'), panelExplain: $('panelExplain'),
    panelClose: $('panelClose'), askBtn: $('askBtn'), panelSent: $('panelSent'),
    panelOffline: $('panelOffline'), apart: $('apart'), saveBtn: $('saveBtn'),
    view3d: $('view3d'), viewBp: $('viewBp'), autoBtn: $('autoBtn'), manualBtn: $('manualBtn'),
    startOver: $('startOver'),
  };

  document.title = spec.title;
  els.title.textContent = spec.title;
  if (spec.fig) {
    els.fig.hidden = false;
    els.figNum.textContent = spec.fig;
  }
  els.caption.textContent = (spec.fig ? 'FIG ' + spec.fig + ' \u00b7 ' : '') + spec.title;
  els.question.textContent = spec.question;
  els.bigIdea.textContent = spec.bigIdea;
  if (spec.note) {
    els.note.hidden = false;
    els.note.textContent = spec.note;
  }
  els.honest.textContent = 'Built by your tutor from ' + (spec.lesson || 'this lesson') + '. Not reviewed by the course authors.';

  var state = {
    step: 0,
    apart: spec.steps[0].explode || 0,
    mode: '3d',
    auto: false,
    selected: null,
  };
  var autoTimer = null;

  function canAsk() {
    return !!(window.lessonScreen && typeof window.lessonScreen.send === 'function');
  }

  function tutorSend(evt) {
    if (canAsk()) window.lessonScreen.send(evt);
  }

  function uiState() {
    var step = spec.steps[state.step];
    return {
      stepIndex: state.step,
      focus: step.focus && step.focus.length ? step.focus.slice() : null,
      flows: step.flows || [],
      view: step.view || 'iso',
      apart: state.apart,
      mode: state.mode,
      selected: state.selected,
      reduced: !!reduced,
    };
  }

  function pushState() {
    if (window.mcScene) window.mcScene.sync(uiState());
  }

  function renderRail() {
    Array.prototype.forEach.call(els.steps.children, function (li, i) {
      var btn = li.firstChild;
      btn.classList.toggle('is-now', i === state.step);
      btn.classList.toggle('is-done', i < state.step);
    });
    els.say.textContent = spec.steps[state.step].say;
    els.apart.value = String(state.apart);
  }

  function renderReadouts() {
    var values = {};
    spec.readouts.forEach(function (r) { values[r.id] = r.value; });
    for (var i = 0; i <= state.step; i++) {
      var over = spec.steps[i].readouts || {};
      for (var k in over) values[k] = over[k];
    }
    while (els.readouts.firstChild) els.readouts.removeChild(els.readouts.firstChild);
    spec.readouts.forEach(function (r) {
      var chip = document.createElement('span');
      chip.className = 'mc-chip';
      chip.appendChild(document.createTextNode(r.label + ' '));
      var b = document.createElement('b');
      b.textContent = values[r.id];
      chip.appendChild(b);
      els.readouts.appendChild(chip);
    });
  }

  function renderPartsList() {
    var groups = [];
    var byGroup = {};
    spec.parts.forEach(function (p) {
      var g = p.group || '';
      if (!byGroup[g]) {
        byGroup[g] = [];
        groups.push(g);
      }
      byGroup[g].push(p);
    });
    els.partsSummary.textContent = 'Parts (' + spec.parts.length + ')';
    groups.forEach(function (g) {
      var wrap = document.createElement('div');
      wrap.className = 'mc-parts-group';
      if (g) {
        var label = document.createElement('span');
        label.className = 'g';
        label.textContent = g;
        wrap.appendChild(label);
      }
      var row = document.createElement('div');
      row.className = 'mc-parts-list';
      byGroup[g].forEach(function (p) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'mc-part-btn';
        b.setAttribute('data-part-id', p.id);
        b.textContent = p.label;
        b.addEventListener('click', function () { selectPart(p.id); });
        row.appendChild(b);
      });
      wrap.appendChild(row);
      els.parts.appendChild(wrap);
    });
  }

  function markPartButtons() {
    Array.prototype.forEach.call(els.parts.querySelectorAll('.mc-part-btn'), function (b) {
      b.classList.toggle('is-on', b.getAttribute('data-part-id') === state.selected);
    });
  }

  function selectPart(id) {
    state.selected = id;
    markPartButtons();
    var p = spec.parts.find(function (x) { return x.id === id; });
    if (!p) return;
    els.panelLabel.textContent = p.label;
    els.panelGroup.textContent = p.group || '';
    els.panelGroup.hidden = !p.group;
    els.panelExplain.textContent = p.explain;
    els.panelSent.hidden = true;
    if (canAsk()) {
      els.askBtn.hidden = false;
      els.panelOffline.hidden = true;
    } else {
      els.askBtn.hidden = true;
      els.panelOffline.hidden = false;
    }
    els.panel.hidden = false;
    pushState();
  }

  function closePanel() {
    els.panel.hidden = true;
    state.selected = null;
    markPartButtons();
    pushState();
  }

  function stopAuto() {
    if (autoTimer) {
      clearInterval(autoTimer);
      autoTimer = null;
    }
    if (state.auto) {
      state.auto = false;
      renderModeSeg();
    }
  }

  function renderModeSeg() {
    els.autoBtn.classList.toggle('is-on', state.auto);
    els.manualBtn.classList.toggle('is-on', !state.auto);
    els.view3d.classList.toggle('is-on', state.mode === '3d');
    els.viewBp.classList.toggle('is-on', state.mode === 'blueprint');
  }

  function goStep(i, user) {
    var next = Math.max(0, Math.min(spec.steps.length - 1, i));
    if (user) stopAuto();
    state.step = next;
    state.apart = spec.steps[next].explode || 0;
    renderRail();
    renderReadouts();
    pushState();
    if (user) tutorSend({ type: 'step', step: next + 1, label: spec.steps[next].title });
  }

  function setMode(mode, user) {
    if (user) stopAuto();
    state.mode = mode;
    renderModeSeg();
    els.canvasWrap.classList.toggle('is-blueprint', mode === 'blueprint');
    pushState();
  }

  spec.steps.forEach(function (s, i) {
    var li = document.createElement('li');
    var b = document.createElement('button');
    b.type = 'button';
    var n = document.createElement('span');
    n.className = 'n';
    n.textContent = String(i + 1).padStart(2, '0');
    b.appendChild(n);
    b.appendChild(document.createTextNode(s.title));
    b.addEventListener('click', function () { goStep(i, true); });
    li.appendChild(b);
    els.steps.appendChild(li);
  });

  els.autoBtn.addEventListener('click', function () {
    if (state.auto) {
      stopAuto();
      return;
    }
    state.auto = true;
    renderModeSeg();
    if (state.step >= spec.steps.length - 1) goStep(0, false);
    autoTimer = setInterval(function () {
      if (state.step >= spec.steps.length - 1) {
        stopAuto();
        return;

    const e = projectedExtents(viewName, apart);
    const { dir, right, up } = viewBasis(viewName);
    const cx = (e.minX + e.maxX) / 2;
    const cy = (e.minY + e.maxY) / 2;
    const target = right.clone().multiplyScalar(cx).add(up.clone().multiplyScalar(cy));
    const tanV = Math.tan(THREE.MathUtils.degToRad(camP.fov / 2));
    const aspect = Math.max(wrap.clientWidth / Math.max(wrap.clientHeight, 1), 0.01);
    const tanH = tanV * aspect;
    let dist = 1;
    spec.parts.forEach((p) => {
      partCorners(p, apart, lift).forEach((c) => {
        const vx = c.dot(right) - cx;
        const vy = c.dot(up) - cy;
        const along = c.dot(dir) - target.dot(dir);
        dist = Math.max(dist, along + Math.abs(vx) / (tanH * FILL), along + Math.abs(vy) / (tanV * FILL));
      });
    });
    dist = Math.max(dist, modelRadius);
    const pos = target.clone().add(dir.clone().multiplyScalar(dist));
    return { target, pos, dist };
  }

  function fitOrtho(viewName, apart) {
    const e = projectedExtents(viewName, apart);
    const { dir, right, up } = viewBasis(viewName);
    const cx = (e.minX + e.maxX) / 2;
    const cy = (e.minY + e.maxY) / 2;
    const target = right.clone().multiplyScalar(cx).add(up.clone().multiplyScalar(cy));
    const aspect = Math.max(wrap.clientWidth / Math.max(wrap.clientHeight, 1), 0.01);
    let halfW = ((e.maxX - e.minX) / 2) / FILL;
    let halfH = ((e.maxY - e.minY) / 2) / FILL;
    if (halfW / halfH < aspect) halfW = halfH * aspect;
    else halfH = halfW / aspect;
    const depth = (e.maxZ - e.minZ) / 2 + modelRadius;
    const pos = target.clone().add(dir.clone().multiplyScalar(Math.max(depth, 10)));
    return { target, pos, halfW, halfH };
  }

  let current = null;
  let hoverId = null;
  let calloutTags = [];
  let visible = true;
  let rafId = null;

  function sync(state) {
    const dur = state.reduced || reduced ? 0 : 600;
    tween.t0 = performance.now();
    tween.dur = Math.max(dur, 1);
    const positions = new Map();
    spec.parts.forEach((p) => positions.set(p.id, partCenter(p, state.apart)));
    tween.parts = spec.parts.map((p) => {
      const mesh = partMeshes.get(p.id);
      const bp = partMeshesBp.get(p.id);
      const to = positions.get(p.id);
      const inFocus = !state.focus || state.focus.includes(p.id);
      return {
        mesh, bp,
        from: mesh.position.clone(),
        fromBp: bp.mesh.position.clone(),
        to,
        opFrom: mesh.material.opacity !== undefined ? mesh.material.opacity : 1,
        opTo: inFocus ? 1 : 0.25,
        inFocus,
      };
    });

    const fp = fitPersp(state.view, state.apart);
    tween.cam = {
      posFrom: camP.position.clone(),
      posTo: fp.pos,
      targetFrom: controlsP.target.clone(),
      targetTo: fp.target,
    };
    controlsP.minDistance = fp.dist * 0.35;
    controlsP.maxDistance = fp.dist * 3;

    const fo = fitOrtho(state.view, state.apart);
    tween.ortho = {
      halfWFrom: Math.abs(camO.right),
      halfWTo: fo.halfW,
      halfHFrom: Math.abs(camO.top),
      halfHTo: fo.halfH,
    };
    camO.position.copy(fo.pos);
    camO.up.set(0, 1, 0);
    if (state.view === 'top') camO.up.set(0, 0, -1);
    camO.lookAt(fo.target);
    controlsO.target.copy(fo.target);
    controlsO.update();

    fitShadow();

    const activeFlowIds = new Set(state.flows);
    flows.forEach((f, id) => {
      const on = activeFlowIds.has(id);
      f.tube.visible = on && state.mode === '3d';
      f.dash.visible = on && state.mode === 'blueprint';
      f.arrow.visible = on && state.mode === 'blueprint';
      f.beads.forEach((b) => { b.visible = on && state.mode === '3d'; });
      f.tag.hidden = !on;
      if (on) f.tag.textContent = f.spec.label || f.spec.id;
      f.dashMat.opacity = on ? 1 : 0;
    });

    calloutTags.forEach((t) => t.el.remove());
    calloutTags = [];
    if (state.mode === 'blueprint') {
      const focused = state.focus || spec.parts.map((p) => p.id);
      focused.forEach((id) => {
        const p = spec.parts.find((x) => x.id === id);
        if (!p) return;
        const el = document.createElement('div');
        el.className = 'mc-tag mc-tag-callout';
        el.textContent = p.label;
        labels.appendChild(el);
        calloutTags.push({ el, id });
      });
    }

    const prevMode = current ? current.mode : null;
    current = state;
    if (prevMode !== state.mode) {
      controlsP.enabled = state.mode === '3d';
      controlsO.enabled = state.mode === 'blueprint';
      if (state.mode === '3d') controlsP.update();
    }
    spec.parts.forEach((p) => {
      const inFocus = !state.focus || state.focus.includes(p.id);
      const bp = partMeshesBp.get(p.id);
      const line = inFocus ? new THREE.Color(themeColors().blueprint) : bpDim();
      bp.hull.uniforms.uColor.value = line;
      bp.hull.uniforms.uWidthPx.value = inFocus ? 1.6 : 1.0;
      bp.mesh.material.color.copy(
        inFocus
          ? (p.tone === 'accent' ? bpAccent() : bpPaper())
          : (p.tone === 'accent' ? bpAccent() : bpPaper()).lerp(bpPaper(), 0.65),
      );
      if (bp.edgesMat) {
        bp.edgesMat.color = line;
        bp.edgesMat.linewidth = inFocus ? 1.25 : 1.0;
      }
    });
    requestRender();
  }

  function applyTween(now) {
    const k = Math.min(1, (now - tween.t0) / tween.dur);
    const e = easeOut(k);
    tween.parts.forEach((t) => {
      t.mesh.position.lerpVectors(t.from, t.to, e);
      t.bp.mesh.position.lerpVectors(t.fromBp, t.to, e);
      const op = t.opFrom + (t.opTo - t.opFrom) * e;
      t.mesh.material.transparent = op < 1;
      t.mesh.material.opacity = op;
      t.mesh.material.depthWrite = op >= 1;
      const ol = partOutlines.get(t.mesh.userData.partId);
      if (ol) {
        ol.hull3dMat.uniforms.uOpacity.value = ol.hullBase * op;
        if (ol.crease3dMat) ol.crease3dMat.opacity = ol.creaseBase * op;
      }
    });
    if (tween.cam && current && current.mode === '3d') {
      camP.position.lerpVectors(tween.cam.posFrom, tween.cam.posTo, e);
      controlsP.target.lerpVectors(tween.cam.targetFrom, tween.cam.targetTo, e);
      controlsP.update();
    }
    if (tween.ortho && current && current.mode === 'blueprint') {
      const w = tween.ortho.halfWFrom + (tween.ortho.halfWTo - tween.ortho.halfWFrom) * e;
      const h = tween.ortho.halfHFrom + (tween.ortho.halfHTo - tween.ortho.halfHFrom) * e;
      camO.left = -w; camO.right = w; camO.top = h; camO.bottom = -h;
      camO.updateProjectionMatrix();
      controlsO.update();
    }
    return k < 1;
  }

  function projectTo(v3, cam) {
    const v = v3.clone().project(cam);
    return {
      x: (v.x * 0.5 + 0.5) * wrap.clientWidth,
      y: (-v.y * 0.5 + 0.5) * wrap.clientHeight,
      behind: v.z > 1,
    };
  }

  function rectsOverlap(a, b, pad) {
    return a.x - pad < b.x + b.w && a.x + a.w + pad > b.x && a.y - pad < b.y + b.h && a.y + a.h + pad > b.y;
  }

  function updateTags() {
    while (leaders.firstChild) leaders.removeChild(leaders.firstChild);
    if (!current) return;
    const W = wrap.clientWidth;
    const H = wrap.clientHeight;
    const cam = current.mode === 'blueprint' ? camO : camP;
    const placed = [];

    if (current.mode === 'blueprint') {
      const anchors = calloutTags.map((t) => {
        const entry = partMeshesBp.get(t.id);
        const w = entry.mesh.position.clone();
        w.y += modelBp.position.y + halfHeight(spec.parts.find((x) => x.id === t.id)) + 0.05;
        const s = projectTo(w, camO);
        return { t, s };
      });
      let bx0 = Infinity, bx1 = -Infinity;
      spec.parts.forEach((p) => {
        partCorners(p, current.apart, lift).forEach((c) => {
          const s = projectTo(c, camO);
          if (s.x < bx0) bx0 = s.x;
          if (s.x > bx1) bx1 = s.x;
        });
      });
      const midX = (bx0 + bx1) / 2;
      const leftCol = [];
      const rightCol = [];
      anchors.forEach((a) => {
        (a.s.x < midX ? leftCol : rightCol).push(a);
      });
      const cols = [
        { list: leftCol, right: false },
        { list: rightCol, right: true },
      ];
      const ns = 'http://www.w3.org/2000/svg';
      cols.forEach((col) => {
        col.list.sort((a, b) => a.s.y - b.s.y);
        let y = 30;
        col.list.forEach((a) => {
          const el = a.t.el;
          const tw = el.offsetWidth || 60;
          const th = el.offsetHeight || 16;
          y = Math.max(y, a.s.y - th / 2);
          let x;
          if (col.right) {
            x = Math.min(W - 16 - tw, bx1 + 26);
            el.style.left = x + 'px';
          } else {
            x = Math.max(16, bx0 - 26 - tw);
            el.style.left = x + 'px';
          }
          el.style.top = y + th / 2 + 'px';
          placed.push({ x, y, w: tw, h: th });
          const dot = document.createElementNS(ns, 'circle');
          dot.setAttribute('cx', a.s.x);
          dot.setAttribute('cy', a.s.y);
          dot.setAttribute('r', '2.5');
          dot.setAttribute('fill', css('--blueprint'));
          leaders.appendChild(dot);
          const line = document.createElementNS(ns, 'line');
          const edgeX = col.right ? x : x + tw;
          line.setAttribute('x1', a.s.x);
          line.setAttribute('y1', a.s.y);
          line.setAttribute('x2', edgeX);
          line.setAttribute('y2', y + th / 2);
          line.setAttribute('stroke', css('--blueprint'));
          line.setAttribute('stroke-width', '1');
          leaders.appendChild(line);
          y += th + 6;
        });
      });
    }

    const offsets = [[12, -18], [-12, -18], [12, 18], [-12, 18], [16, -34], [-16, -34], [16, 34], [-16, 34]];
    flows.forEach((f) => {
      if (f.tag.hidden) return;
      const pt = f.curve.getPoint(0.5).clone();
      pt.y += (current.mode === 'blueprint' ? modelBp : model3d).position.y;
      const a = projectTo(pt, cam);
      const tw = f.tag.offsetWidth || 50;
      const th = f.tag.offsetHeight || 14;
      let ok = false;
      for (const [ox, oy] of offsets) {
        const x = a.x + ox;
        const y = a.y + oy;
        const r = { x: x - tw / 2, y: y - th / 2, w: tw, h: th };
        if (r.x < 4 || r.y < 4 || r.x + r.w > W - 4 || r.y + r.h > H - 4) continue;
        if (placed.some((p) => rectsOverlap(r, p, 3))) continue;
        f.tag.style.left = x + 'px';
        f.tag.style.top = y + 'px';
        f.tag.style.display = '';
        placed.push(r);
        ok = true;
        break;
      }
      if (!ok) f.tag.style.display = 'none';
    });
  }

  function resize() {
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camP.aspect = w / h;
    camP.updateProjectionMatrix();
    lineMats.forEach((m) => m.resolution.set(w, h));
    hullMats.forEach((m) => m.uniforms.uResolution.value.set(w, h));
    if (current) {
      const fo = fitOrtho(current.view, current.apart);
      camO.left = -fo.halfW; camO.right = fo.halfW;
      camO.top = fo.halfH; camO.bottom = -fo.halfH;
      camO.updateProjectionMatrix();
      const fp = fitPersp(current.view, current.apart);
      if (!interacting) {
        tween.cam = null;
        camP.position.copy(fp.pos);
        controlsP.target.copy(fp.target);
        controlsP.update();
      }
    }
    requestRender();
  }
  new ResizeObserver(resize).observe(wrap);

  function render(now) {
    const tweening = applyTween(now || performance.now());
    const flowsOn = current && current.flows.length && !reduced && !(current && current.reduced);
    const t = (now || performance.now()) / 1000;
    if (current && current.mode === '3d') {
      flows.forEach((f) => {
        if (!f.tube.visible) return;
        f.beads.forEach((b, i) => {
          const ft = reduced ? i / 3 : (t * 0.25 + i / 3) % 1;
          const pos = f.curve.getPoint(ft);
          pos.y += model3d.position.y;
          b.position.copy(pos);
        });
      });
    }
    updateTags();
    if (current && current.mode === 'blueprint') {
      renderer.toneMapping = THREE.NoToneMapping;
      renderer.render(sceneBp, camO);
    } else {
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.render(scene3d, camP);
    }
    const busy = tweening || interacting || performance.now() < dampingUntil || (flowsOn && current && current.mode === '3d');
    return busy;
  }

  function loop(now) {
    rafId = null;
    if (!visible) return;
    const busy = render(now);
    if (busy) rafId = requestAnimationFrame(loop);
  }

  function requestRender() {
    if (rafId === null && visible) rafId = requestAnimationFrame(loop);
  }

  new IntersectionObserver((entries) => {
    const was = visible;
    visible = entries[0] ? entries[0].isIntersecting : true;
    if (visible && !was) requestRender();
  }).observe(wrap);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) requestRender();
  });

  const ray = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let downAt = null;

  function pick(e) {
    const r = renderer.domElement.getBoundingClientRect();
    pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(pointer, current && current.mode === 'blueprint' ? camO : camP);
    const pool = current && current.mode === 'blueprint'
      ? Array.from(partMeshesBp.values()).map((x) => x.mesh)
      : Array.from(partMeshes.values());
    const hits = ray.intersectObjects(pool, true);
    for (const h of hits) {
      let o = h.object;
      while (o && !o.userData.partId) o = o.parent;
      if (o) return o.userData.partId;
    }
    return null;
  }

  renderer.domElement.addEventListener('pointermove', (e) => {
    const id = pick(e);
    if (id !== hoverId) {
      hoverId = id;
      renderer.domElement.style.cursor = id ? 'pointer' : '';
      spec.parts.forEach((p) => {
        const mesh = partMeshes.get(p.id);
        const base = baseEmissive.get(p.id);
        if (p.material === 'glow') return;
        if (p.id === current?.selected) {
          mesh.material.emissive = new THREE.Color(themeColors().blueprint).multiplyScalar(0.35);
        } else if (p.id === hoverId) {
          mesh.material.emissive = base.clone().add(new THREE.Color(themeColors().blueprint).multiplyScalar(0.12));
        } else {
          mesh.material.emissive = base.clone();
        }
      });
      requestRender();
    }
  });
  renderer.domElement.addEventListener('pointerdown', (e) => {
    downAt = { x: e.clientX, y: e.clientY };
  });
  renderer.domElement.addEventListener('pointerup', (e) => {
    if (!downAt) return;
    const dx = e.clientX - downAt.x;
    const dy = e.clientY - downAt.y;
    downAt = null;
    if (dx * dx + dy * dy > 36) return;
    const id = pick(e);
    if (id) window.mcUI.selectPart(id);
  });

  function applyTheme() {
    const c = themeColors();
    scene3d.background.set(c.desk);
    scene3d.fog.color.set(c.desk);
    if (floorMesh) {
      floorMesh.material.map = deskTexture(c.desk);
      floorMesh.material.needsUpdate = true;
    }
    if (matMesh) matMesh.material.color.set(c.desk).multiplyScalar(c.dark ? 1.35 : 0.92);
    partMeshes.forEach((mesh, id) => {
      const p = spec.parts.find((x) => x.id === id);
      const ol = partOutlines.get(id);
      const line = new THREE.Color(p.material === 'glass' ? c.blueprint : (c.dark ? '#f3f1e8' : '#23262f'));
      if (ol) {
        ol.hull3dMat.uniforms.uColor.value = line;
        ol.hullBase = p.material === 'glass' ? 0.5 : (c.dark ? 0.35 : 0.55);
        if (ol.crease3dMat) {
          ol.crease3dMat.color = line;
          ol.creaseBase = p.material === 'glass' ? 0.5 : (c.dark ? 0.14 : 0.18);
        }
      }
    });
    partMeshesBp.forEach(({ mesh, hull, edgesMat }, id) => {
      const p = spec.parts.find((x) => x.id === id);
      mesh.material.color.copy(p.tone === 'accent' ? bpAccent() : bpPaper());
      hull.uniforms.uColor.value = new THREE.Color(c.blueprint);
      if (edgesMat) edgesMat.color.set(c.blueprint);
    });
    flows.forEach((f) => {
      f.tube.material.color.set(c.blueprint);
      f.dashMat.color.set(c.blueprint);
      f.arrow.material.color.set(c.blueprint);
      f.beads.forEach((b) => b.material.emissive.set(c.blueprint));
    });
    requestRender();
  }
  window.addEventListener('storage', (e) => {
    if (e.key === 'theme' || e.key === null) setTimeout(applyTheme, 0);
  });

  window.mcScene = {
    sync,
    metrics() {
      const box = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
      const cam = current && current.mode === 'blueprint' ? camO : camP;
      spec.parts.forEach((p) => {
        partCorners(p, current ? current.apart : 0, lift).forEach((c) => {
          const s = projectTo(c, cam);
          if (s.x < box.minX) box.minX = s.x;
          if (s.x > box.maxX) box.maxX = s.x;
          if (s.y < box.minY) box.minY = s.y;
          if (s.y > box.maxY) box.maxY = s.y;
        });
      });
      const W = wrap.clientWidth, H = wrap.clientHeight;
      return {
        wPct: Math.round(((box.maxX - box.minX) / W) * 1000) / 10,
        hPct: Math.round(((box.maxY - box.minY) / H) * 1000) / 10,
        stageW: W,
        stageH: H,
      };
    },
    save() {
      render(performance.now());
      const isBp = current && current.mode === 'blueprint';
      let data;
      if (isBp) {
        const c = document.createElement('canvas');
        c.width = renderer.domElement.width;
        c.height = renderer.domElement.height;
        const g = c.getContext('2d');
        g.fillStyle = themeColors().bg;
        g.fillRect(0, 0, c.width, c.height);
        g.drawImage(renderer.domElement, 0, 0);
        data = c.toDataURL('image/png');
      } else {
        data = renderer.domElement.toDataURL('image/png');
      }
      const a = document.createElement('a');
      a.href = data;
      a.download = `${slug}-${isBp ? 'blueprint' : '3d'}.png`;
      a.click();
    },
  };

  resize();
  const fp0 = fitPersp('iso', spec.steps[0].explode || 0);
  camP.position.copy(fp0.pos);
  controlsP.target.copy(fp0.target);
  controlsP.update();
  window.mcUI.ready();
})();
</script>
</body>
</html>
