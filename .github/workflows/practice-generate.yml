name: Practice problems generate

on:
  workflow_dispatch:
    inputs:
      lessons:
        description: 'Lesson paths, separated by spaces, for example phases/03-deep-learning-core/06-optimizers'
        required: true
        default: ''
      model:
        description: 'Model for the draft. Haiku escalates a failing draft to sonnet once. Opus is only for a manual run.'
        required: false
        default: 'haiku'
        type: choice
        options:
          - haiku
          - sonnet
          - opus
      max_problems:
        description: 'Largest number of problems in one run'
        required: false
        default: '5'
      token_budget:
        description: 'Largest number of tokens for the whole run'
        required: false
        default: '1500000'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: practice-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice title=Practice::ANTHROPIC_API_KEY is not set. Nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        if: steps.key.outputs.ready == 'true'
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ready == 'true'
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        if: steps.key.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Check the inputs
        id: plan
        if: steps.key.outputs.ready == 'true'
        env:
          LESSONS: ${{ inputs.lessons }}
          MODEL_INPUT: ${{ inputs.model }}
          MAX_PROBLEMS: ${{ inputs.max_problems }}
          TOKEN_BUDGET: ${{ inputs.token_budget }}
        run: |
          set -euo pipefail
          model="${MODEL_INPUT:-haiku}"
          case "$model" in haiku|sonnet|opus) ;; *) echo "unknown model: $model"; exit 1 ;; esac
          limit="${MAX_PROBLEMS:-5}"
          budget="${TOKEN_BUDGET:-1500000}"
          [[ "$limit" =~ ^[0-9]+$ ]] || { echo "max_problems must be a number"; exit 1; }
          [[ "$budget" =~ ^[0-9]+$ ]] || { echo "token_budget must be a number"; exit 1; }
          lessons=""
          for lesson in $LESSONS; do
            [[ "$lesson" =~ ^phases/[0-9]{2}-[a-z0-9-]+/[0-9]{2}-[a-z0-9-]+/?$ ]] || { echo "not a lesson path: $lesson"; exit 1; }
            lessons="$lessons ${lesson%/}"
          done
          [ -n "$lessons" ] || { echo "give at least one lesson path"; exit 1; }
          {
            echo "lessons=$lessons"
            echo "model=$model"
            echo "limit=$limit"
            echo "budget=$budget"
          } >> "$GITHUB_OUTPUT"
      - name: Install the writer tools outside the repository
        if: steps.key.outputs.ready == 'true'
        run: |
          python3 -m pip install 'numpy>=2.2,<3'
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/gen" @anthropic-ai/sdk@0.134.0
      - name: Write the problems
        if: steps.key.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NODE_PATH: ${{ runner.temp }}/gen/node_modules
          PRACTICE_PYTHON: python3
          LESSONS: ${{ steps.plan.outputs.lessons }}
          MODEL: ${{ steps.plan.outputs.model }}
          LIMIT: ${{ steps.plan.outputs.limit }}
          BUDGET: ${{ steps.plan.outputs.budget }}
        run: |
          set -uo pipefail
          node scripts/practice/generate.js $LESSONS --model "$MODEL" --escalate sonnet --limit "$LIMIT" --token-budget "$BUDGET" --summary "$RUNNER_TEMP/summary.json" || true
          test -s "$RUNNER_TEMP/summary.json"
      - name: Report the run in the job summary
        if: steps.key.outputs.ready == 'true'
        run: node scripts/practice/report.js "$RUNNER_TEMP/summary.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Run the practice gates
        if: steps.key.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python3 scripts/practice/validate.py
          node site/build-practice.js --check
      - name: Open a pull request for review
        if: steps.key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- practice)" ]; then
            echo "::notice title=Practice::No problem was written."
            exit 0
          fi
          branch="practice/auto-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add practice
          node scripts/practice/report.js "$RUNNER_TEMP/summary.json" --pr > "$RUNNER_TEMP/body.md"
          node scripts/practice/report.js "$RUNNER_TEMP/summary.json" --commit > "$RUNNER_TEMP/commit.txt"
          git commit -q -F "$RUNNER_TEMP/commit.txt"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          gh pr create --base main --head "$branch" --title "feat(practice): new problems" --body-file "$RUNNER_TEMP/body.md"
