name: Interview bank

on:
  pull_request:
    paths:
      - 'interviews/**'
      - 'scripts/interviews/**'
      - 'site/build-interviews.js'
      - 'site/interviews.js'
      - 'site/interviews.css'
      - 'site/test_interviews.js'
      - 'site/lesson-markdown.js'
      - 'manuals/**'
      - 'learning-paths/**'
      - '.github/workflows/interviews.yml'
  push:
    branches: [main]
    paths:
      - 'interviews/**'
      - 'scripts/interviews/**'
      - 'site/build-interviews.js'
      - '.github/workflows/interviews.yml'

permissions:
  contents: read

concurrency:
  group: interviews-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Front matter, sections, links, numbers, denylist, evidence and generated READMEs
        run: node scripts/interviews/validate.js
      - name: Each validator rule fails with a clear message
        run: node --test scripts/interviews/test_validate.js
      - name: Pages, folded answers, routes and discovery
        run: node --test site/test_interviews.js
      - name: No answer shows outside a folded answer, same bytes twice
        run: node site/build-interviews.js --check
