name: Manuals

on:
  pull_request:
    paths:
      - 'manuals/**'
      - 'site/build-manuals.js'
      - 'site/build-projects.js'
      - 'site/test_manuals.js'
      - 'scripts/audit_manuals.js'
      - '.github/workflows/manuals.yml'
  push:
    branches: [main]
    paths:
      - 'manuals/**'
      - 'site/build-manuals.js'
      - 'site/build-projects.js'
      - 'site/test_manuals.js'
      - 'scripts/audit_manuals.js'
      - '.github/workflows/manuals.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manuals-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Renderer, figure lint and audit tests
        run: node --test site/test_manuals.js
      - name: Editorial audit, figure lint, provenance and capture drift
        run: node scripts/audit_manuals.js

  pdf:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cache Paged.js and its browser
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm/_npx
            ~/.cache/puppeteer
          key: pagedjs-cli-0.4.3-${{ runner.os }}
      - name: Write print editions
        env:
          SCOPE: ${{ github.event_name == 'release' && '--ready' || '' }}
        run: node site/build-manuals.js --print dist/manuals $SCOPE
      - name: Paginate with Paged.js
        id: paginate
        run: |
          set -euo pipefail
          shopt -s nullglob
          count=0
          for page in dist/manuals/*/print.html; do
            id="$(basename "$(dirname "$page")")"
            npx --yes pagedjs-cli@0.4.3 "$page" -o "dist/manuals/aiefs-manual-${id}.pdf"
            count=$((count + 1))
          done
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "paginated $count manual(s)"
      - name: Upload PDFs
        if: github.event_name == 'workflow_dispatch' && steps.paginate.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: manuals-pdf
          path: dist/manuals/*.pdf
      - name: Attach to release
        if: github.event_name == 'release' && steps.paginate.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/manuals/*.pdf --clobber
