name: Manuals

on:
  pull_request:
    paths:
      - 'manuals/**'
      - 'site/build-manuals.js'
      - 'site/build-projects.js'
      - 'site/test_manuals.js'
      - 'scripts/audit_manuals.js'
      - '.github/workflows/manuals.yml'
  push:
    branches: [main]
    paths:
      - 'manuals/**'
      - 'site/build-manuals.js'
      - 'site/build-projects.js'
      - 'site/test_manuals.js'
      - 'scripts/audit_manuals.js'
      - '.github/workflows/manuals.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the PDFs to, for example v2026.10.2. Leave empty to upload an artifact only.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: manuals-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the release tag
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: '[[ "$TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]] || { echo "invalid tag: $TAG"; exit 1; }'
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Renderer, figure lint and audit tests
        run: node --test site/test_manuals.js
      - name: Editorial audit, figure lint, provenance and capture drift
        run: node scripts/audit_manuals.js

  pdf:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cache Paged.js
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: pagedjs-cli-0.4.3-system-chrome-${{ runner.os }}
      - name: Write print editions
        env:
          SCOPE: ${{ (github.event_name == 'release' || inputs.tag != '') && '--ready' || '' }}
        run: node site/build-manuals.js --print dist/manuals $SCOPE
      - name: Paginate with Paged.js
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          shopt -s nullglob
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          "$chrome" --version
          for page in dist/manuals/*/print.html; do
            id="$(basename "$(dirname "$page")")"
            PUPPETEER_EXECUTABLE_PATH="$chrome" timeout 600 \
              npx --yes pagedjs-cli@0.4.3 "$page" -o "dist/manuals/aiefs-manual-${id}.pdf" \
              --browserArgs=--no-sandbox -t 300000
            test -s "dist/manuals/aiefs-manual-${id}.pdf"
          done
      - name: Upload PDFs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: manuals-pdf
          path: dist/manuals/*.pdf
          if-no-files-found: ignore
      - name: Attach to release
        if: (github.event_name == 'release' || inputs.tag != '') && hashFiles('dist/manuals/*.pdf') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/manuals/*.pdf --clobber
