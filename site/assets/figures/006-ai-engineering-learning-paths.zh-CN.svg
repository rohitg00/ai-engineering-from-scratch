<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc" lang="zh-CN">
  <title id="title">AI 工程学习路径</title>
  <desc id="desc">AI 工程连接四条核心学习路径：构建与部署 AI 应用、软件工程基础、智能体辅助工程，以及产品判断与交付。</desc>
  <style>
    .bg{fill:#fafaf5}.line{fill:none;stroke:#3553ff;stroke-width:2}.node{fill:#fafaf5;stroke:#1a1a1a;stroke-width:2}.root{fill:#fafaf5;stroke:#1a1a1a;stroke-width:3}.label{fill:#1a1a1a;font:600 19px ui-monospace,"PingFang SC","Microsoft YaHei",monospace;text-anchor:middle}.small{fill:#555;font:400 14px ui-monospace,"PingFang SC","Microsoft YaHei",monospace;text-anchor:middle}
    @media(prefers-color-scheme:dark){.bg{fill:#080b18}.node,.root{fill:#10162c;stroke:#d9dded}.label{fill:#f4f1e8}.small{fill:#aab2cf}.line{stroke:#7892ff}}
  </style>
  <rect class="bg" width="1200" height="520"/>
  <path class="line" d="M600 142V190M165 190H1035M165 190V244M455 190V244M745 190V244M1035 190V244"/>
  <rect class="node root" x="425" y="58" width="350" height="84" rx="4"/>
  <text class="label" x="600" y="94">AI 工程</text>
  <text class="small" x="600" y="119">学习系统、理解工作、亲手构建</text>
  <g>
    <rect class="node" x="30" y="244" width="270" height="184" rx="4"/>
    <text class="label" x="165" y="286"><tspan x="165">构建与部署</tspan><tspan x="165" dy="26">AI 应用</tspan></text>
    <text class="small" x="165" y="354"><tspan x="165">模型、数据、评测</tspan><tspan x="165" dy="22">服务、发布、运维</tspan></text>
  </g>
  <g>
    <rect class="node" x="320" y="244" width="270" height="184" rx="4"/>
    <text class="label" x="455" y="286"><tspan x="455">软件工程</tspan><tspan x="455" dy="26">基础</tspan></text>
    <text class="small" x="455" y="354"><tspan x="455">仓库、接口</tspan><tspan x="455" dy="22">测试、安全、运维</tspan></text>
  </g>
  <g>
    <rect class="node" x="610" y="244" width="270" height="184" rx="4"/>
    <text class="label" x="745" y="286"><tspan x="745">智能体辅助</tspan><tspan x="745" dy="26">工程</tspan></text>
    <text class="small" x="745" y="354"><tspan x="745">界定、规划、委派</tspan><tspan x="745" dy="22">验证、评审、改进</tspan></text>
  </g>
  <g>
    <rect class="node" x="900" y="244" width="270" height="184" rx="4"/>
    <text class="label" x="1035" y="286"><tspan x="1035">产品判断</tspan><tspan x="1035" dy="26">与交付</tspan></text>
    <text class="small" x="1035" y="354"><tspan x="1035">成果、证据、风险</tspan><tspan x="1035" dy="22">范围、指标、反馈</tspan></text>
  </g>
</svg>
