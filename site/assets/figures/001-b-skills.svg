      .face-strong { fill: #3553ff; fill-opacity: 0.18; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; }
    </style>
  </defs>

  <rect width="120" height="120" fill="#fafaf5"/>
  <text class="mono ink" x="10" y="15" font-size="7" letter-spacing="1.4">FIG_001.B</text>

  <rect class="face" x="30" y="20" width="52" height="54"/>
  <rect class="face-strong" x="30" y="20" width="52" height="13"/>
  <rect class="bp" x="30" y="20" width="52" height="54" stroke-width="1.6"/>
  <line class="bp" x1="30" y1="33" x2="82" y2="33" stroke-width="1.2"/>
  <text class="mono ink" x="56" y="29.5" font-size="7" letter-spacing="0.8" text-anchor="middle">SKILL.md</text>

  <line class="bp" x1="36" y1="42" x2="76" y2="42" stroke-width="1.2"/>
  <line class="bp" x1="36" y1="49" x2="70" y2="49" stroke-width="1.2"/>
  <line class="bp" x1="36" y1="56" x2="76" y2="56" stroke-width="1.2"/>
  <line class="bp" x1="36" y1="63" x2="62" y2="63" stroke-width="1.2"/>

  <line class="bp" x1="56" y1="74" x2="56" y2="87" stroke-width="1.6"/>
  <polyline class="bp" points="51,82 56,87 61,82" stroke-width="1.6"/>

  <rect class="face-strong" x="26" y="86" width="12" height="6"/>
  <rect class="bp" x="26" y="86" width="12" height="6" stroke-width="1"/>
  <rect class="face-strong" x="74" y="86" width="12" height="6"/>
  <rect class="bp" x="74" y="86" width="12" height="6" stroke-width="1"/>
  <path class="bp" d="M20 80 V96 H92 V80" stroke-width="1.6"/>

  <text class="mono ink" x="60" y="110" font-size="8.5" letter-spacing="2.2" text-anchor="middle">SKILL</text>
