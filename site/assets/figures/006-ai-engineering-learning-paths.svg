<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">AI Engineering Learning Paths</title>
  <desc id="desc">AI Engineering connects four core learning paths: building and deploying AI applications, software engineering fundamentals, agent-assisted engineering, and product judgment and delivery.</desc>
  <style>
    .bg{fill:#fafaf5}.line{fill:none;stroke:#3553ff;stroke-width:2}.node{fill:#fafaf5;stroke:#1a1a1a;stroke-width:2}.root{fill:#fafaf5;stroke:#1a1a1a;stroke-width:3}.label{fill:#1a1a1a;font:600 19px ui-monospace,SFMono-Regular,Menlo,monospace;text-anchor:middle}.small{fill:#555;font:400 14px ui-monospace,SFMono-Regular,Menlo,monospace;text-anchor:middle}
    @media(prefers-color-scheme:dark){.bg{fill:#080b18}.node,.root{fill:#10162c;stroke:#d9dded}.label{fill:#f4f1e8}.small{fill:#aab2cf}.line{stroke:#7892ff}}
  </style>
  <rect class="bg" width="1200" height="520"/>
  <path class="line" d="M600 142V190M165 190H1035M165 190V244M455 190V244M745 190V244M1035 190V244"/>
  <rect class="node root" x="425" y="58" width="350" height="84" rx="4"/>
  <text class="label" x="600" y="94">AI ENGINEERING</text>
  <text class="small" x="600" y="119">learn the system, the work, and the build</text>
  <g>
    <rect class="node" x="30" y="244" width="270" height="184" rx="4"/>
    <text class="label" x="165" y="286"><tspan x="165">BUILDING AND DEPLOYING</tspan><tspan x="165" dy="26">AI APPLICATIONS</tspan></text>
    <text class="small" x="165" y="354"><tspan x="165">models, data, evaluation</tspan><tspan x="165" dy="22">serving, release, operation</tspan></text>
  </g>
  <g>
    <rect class="node" x="320" y="244" width="270" height="184" rx="4"/>
    <text class="label" x="455" y="286"><tspan x="455">SOFTWARE ENGINEERING</tspan><tspan x="455" dy="26">FUNDAMENTALS</tspan></text>
    <text class="small" x="455" y="354"><tspan x="455">repositories, interfaces</tspan><tspan x="455" dy="22">tests, security, operations</tspan></text>
  </g>
  <g>
    <rect class="node" x="610" y="244" width="270" height="184" rx="4"/>
    <text class="label" x="745" y="286"><tspan x="745">AGENT-ASSISTED</tspan><tspan x="745" dy="26">ENGINEERING</tspan></text>
    <text class="small" x="745" y="354"><tspan x="745">frame, plan, delegate</tspan><tspan x="745" dy="22">verify, review, improve</tspan></text>
  </g>
  <g>
    <rect class="node" x="900" y="244" width="270" height="184" rx="4"/>
    <text class="label" x="1035" y="286"><tspan x="1035">PRODUCT JUDGMENT</tspan><tspan x="1035" dy="26">AND DELIVERY</tspan></text>
    <text class="small" x="1035" y="354"><tspan x="1035">outcomes, evidence, risk</tspan><tspan x="1035" dy="22">scope, metrics, feedback</tspan></text>
  </g>
</svg>
