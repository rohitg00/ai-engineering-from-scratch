<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="FIG_001.C: the agent loop, where the model calls a tool, reads the observation, and decides again">
  <defs>
    <style>
      .bp { stroke: #3553ff; fill: none; stroke-linejoin: round; stroke-linecap: round; }
      .ink { fill: #3553ff; }
      .face { fill: #3553ff; fill-opacity: 0.08; }
      .face-strong { fill: #3553ff; fill-opacity: 0.18; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; }
    </style>
  </defs>

  <rect width="120" height="120" fill="#fafaf5"/>
  <text class="mono ink" x="10" y="15" font-size="7" letter-spacing="1.4">FIG_001.C</text>

  <rect class="face-strong" x="42" y="28" width="36" height="18"/>
  <rect class="bp" x="42" y="28" width="36" height="18" stroke-width="1.6"/>
  <text class="mono ink" x="60" y="40" font-size="8" letter-spacing="1.2" text-anchor="middle">LLM</text>

  <rect class="face" x="70" y="72" width="38" height="18"/>
  <rect class="bp" x="70" y="72" width="38" height="18" stroke-width="1.4"/>
  <text class="mono ink" x="89" y="84" font-size="7.5" letter-spacing="1" text-anchor="middle">TOOL</text>

  <rect class="face" x="12" y="72" width="38" height="18"/>
  <rect class="bp" x="12" y="72" width="38" height="18" stroke-width="1.4"/>
  <text class="mono ink" x="31" y="84" font-size="7.5" letter-spacing="1" text-anchor="middle">OBS</text>

  <line class="bp" x1="70" y1="48" x2="85" y2="70" stroke-width="1.6"/>
  <polyline class="bp" points="78.7,67 85,70 84.5,63.1" stroke-width="1.6"/>

  <line class="bp" x1="69" y1="81" x2="52" y2="81" stroke-width="1.6"/>
  <polyline class="bp" points="57,77 52,81 57,85" stroke-width="1.6"/>

  <line class="bp" x1="35" y1="70" x2="50" y2="48" stroke-width="1.6"/>
  <polyline class="bp" points="43.7,51 50,48 49.5,54.9" stroke-width="1.6"/>

  <text class="mono ink" x="60" y="110" font-size="8.5" letter-spacing="2.2" text-anchor="middle">AGENT</text>
</svg>
