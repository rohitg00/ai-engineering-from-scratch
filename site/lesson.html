  <style>
    .scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      background: var(--blueprint);
      z-index: 9999;
      width: 100%;
      transform: scaleX(0);
      transform-origin: left center;
      will-change: transform;
    }

    .lesson-layout {
      display: flex;
      padding-top: 64px;
      min-height: 100vh;
    }

    .lesson-sidebar {
      position: fixed;
      top: 64px;
      left: 0;
      bottom: 0;
      width: 240px;
      background: var(--bg);
      border-right: 1px solid var(--rule-soft);
      overflow-y: auto;
      z-index: 50;
      padding: 24px 0;
      transition: transform var(--motion-drawer) var(--ease-drawer);
    }

    .lesson-sidebar-toggle {
      display: none;
      position: fixed;
      top: 74px;
      left: 10px;
      z-index: 60;
      background: var(--bg-surface);
      border: 1px solid var(--rule-soft);
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 1rem;
      color: var(--ink);
      align-items: center;
      justify-content: center;
      transition:
        transform var(--motion-press) var(--ease-out),
        border-color var(--motion-feedback) var(--ease-out),
        color var(--motion-feedback) var(--ease-out);
    }

    .lesson-sidebar-toggle:hover {
      border-color: var(--blueprint);
      color: var(--blueprint);
    }

    .lesson-sidebar-toggle:active {
      transform: scale(0.97);
      transition: transform var(--motion-press) var(--ease-out);
    }

    .lesson-sidebar::-webkit-scrollbar { width: 4px; }
    .lesson-sidebar::-webkit-scrollbar-thumb { background: var(--rule-soft); }

    .sidebar-phase-header {
      padding: 18px 20px 8px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--ink-mute);
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .sidebar-lesson-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 20px;
      font-family: var(--font-body);
      font-size: 0.92rem;
      color: var(--ink-soft);
      text-decoration: none;
      border-left: 2px solid transparent;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }

    .sidebar-lesson-link:hover {
      background: var(--blueprint-tint);
      color: var(--ink);
    }

    .sidebar-lesson-link.active {
      color: var(--blueprint);
      background: var(--blueprint-tint);
      border-left-color: var(--blueprint);
    }

    .sidebar-lesson-link.disabled {
      opacity: 0.5;
    }

    .sidebar-lesson-dot {
      width: 8px;
      height: 8px;
      flex-shrink: 0;
      border: 1px solid var(--ink-mute);
      background: transparent;
    }

    .sidebar-lesson-dot.complete {
      background: var(--blueprint);
      border-color: var(--blueprint);
    }

    .sidebar-lesson-dot.in-progress {
      background: linear-gradient(135deg, var(--blueprint) 0%, var(--blueprint) 50%, transparent 50%, transparent 100%);
      border-color: var(--blueprint);
    }

    .sidebar-lesson-dot.planned {
      border-style: dashed;
    }

    .sidebar-phase-nav {
      padding: 18px 20px;
      border-top: 1px solid var(--rule-soft);
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sidebar-phase-nav a {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
      text-decoration: none;
      border-bottom: none;
    }

    .sidebar-phase-nav a:hover {
      color: var(--blueprint);
    }

    .lesson-main {
      flex: 1;
      min-width: 0;
      margin-left: 240px;
      display: flex;
      justify-content: center;
      padding: 56px 32px 96px;
    }

    .lesson-content {
      max-width: 720px;
      width: 100%;
      min-width: 0;
    }

    .lesson-article {
      max-width: 100%;
      overflow-wrap: break-word;
      word-wrap: break-word;
    }

    .lesson-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 16px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--rule-soft);
      border-top-color: var(--blueprint);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .lesson-loading-text {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-mute);
    }

    .lesson-error {
      text-align: left;
      padding: 64px 0;
    }

    .lesson-error h2 {
      font-family: var(--font-display);
      font-size: 1.8rem;
      text-transform: uppercase;
      color: var(--blueprint);
      margin-bottom: 12px;
    }

    .lesson-error p {
      color: var(--ink-soft);
      margin-bottom: 24px;
    }

    .lesson-article h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: var(--blueprint);
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--blueprint);
      line-height: 1;
    }

    .lesson-article h2 {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 3vw, 1.9rem);
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: var(--ink);
      margin-top: 56px;
      margin-bottom: 18px;
      padding-bottom: 0;
      border-bottom: none;
      line-height: 1.05;
    }

    .lesson-article h2.section-build,
    .lesson-article h2.section-use,
    .lesson-article h2.section-ship {
      border-left: 3px solid var(--blueprint);
      padding-left: 16px;
    }

    .lesson-article h3 {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
      margin-top: 36px;
      margin-bottom: 12px;
    }

    .lesson-article h1,
    .lesson-article h2,
    .lesson-article h3 {
      scroll-margin-top: var(--header-offset, 92px);
    }

    .lesson-article p {
      font-family: var(--font-body);
      font-size: 1.06rem;
      line-height: 1.7;
      color: var(--ink);
      margin-bottom: 18px;
      text-align: justify;
      hyphens: auto;
      -webkit-hyphens: auto;
    }

    .lesson-article > p:first-of-type::first-letter,
    .lesson-article .drop-cap::first-letter {
      float: left;
      font-family: var(--font-display);
      font-size: 4rem;
      line-height: 0.85;
      padding: 0.06em 0.16em 0 0;
      color: var(--blueprint);
    }

    .lesson-article .motto {
      font-family: var(--font-body);
      font-style: italic;
      font-size: 1.15rem;
      line-height: 1.55;
      color: var(--ink);
      border-left: 2px solid var(--blueprint);
      background: var(--blueprint-tint);
      padding: 18px 22px;
      margin: 24px 0 32px;
      text-align: left;
    }

    .lesson-article blockquote {
      border-left: 2px solid var(--blueprint);
      background: var(--blueprint-tint);
      padding: 14px 22px;
      margin: 20px 0;
      color: var(--ink);
      font-family: var(--font-body);
      font-style: italic;
      text-align: left;
    }

    .lesson-article strong {
      color: var(--ink);
      font-weight: 600;
    }

    .lesson-article em {
      font-style: italic;
    }

    .lesson-article a {
      color: var(--blueprint);
      text-decoration: none;
      border-bottom: 1px solid var(--blueprint);
      transition: background 0.15s;
    }

    .lesson-article a:hover {
      background: var(--blueprint-tint);
    }

    .lesson-article hr {
      border: none;
      height: 6px;
      margin: 40px 0;
      background-image:
        repeating-linear-gradient(to right, var(--blueprint) 0, var(--blueprint) 4px, transparent 4px, transparent 8px),
        repeating-linear-gradient(to right, transparent 0, transparent 8px, var(--blueprint-tint-strong) 8px, var(--blueprint-tint-strong) 14px);
      background-size: 100% 3px, 100% 3px;
      background-position: 0 0, 0 3px;
      background-repeat: no-repeat;
    }

    .lesson-article ul {
      list-style: none;
      padding-left: 22px;
      margin-bottom: 18px;
    }

    .lesson-article ul li {
      font-family: var(--font-body);
      font-size: 1.06rem;
      line-height: 1.7;
      color: var(--ink);
      position: relative;
      padding-left: 6px;
      margin-bottom: 4px;
      text-align: left;
    }

    .lesson-article ul li::before {
      content: "";
      position: absolute;
      left: -16px;
      top: 0.65em;
      width: 6px;
      height: 6px;
      background: var(--blueprint);
    }

    .lesson-article ol {
      list-style: none;
      padding-left: 28px;
      margin-bottom: 18px;
      counter-reset: ol-counter;
    }

    .lesson-article ol li {
      font-family: var(--font-body);
      font-size: 1.06rem;
      line-height: 1.7;
      color: var(--ink);
      position: relative;
      padding-left: 6px;
      margin-bottom: 4px;
      counter-increment: ol-counter;
      text-align: left;
    }

    .lesson-article ol li::before {
      content: counter(ol-counter, decimal-leading-zero);
      position: absolute;
      left: -28px;
      top: 0.1em;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--blueprint);
    }

    .lesson-article code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--code-bg);
      padding: 1px 6px;
      border: 1px solid var(--rule-soft);
      color: var(--blueprint);
    }

    .lesson-article pre {
      position: relative;
      margin: 20px 0;
      padding-top: 44px;
      overflow: hidden;
      border: 1px solid var(--rule-soft);
      background: var(--code-bg);
    }

    .lesson-article pre code {
      display: block;
      background: var(--code-bg);
      color: var(--ink);
      padding: 22px 24px;
      font-size: 0.86rem;
      line-height: 1.6;
      overflow-x: auto;
      border: none;
    }

    .code-lang {
      position: absolute;
      top: 0;
      left: 0;
      max-width: calc(100% - 88px);
      height: 44px;
      display: inline-flex;
      align-items: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      padding: 0 12px;
      background: var(--blueprint);
      color: var(--bg);
      z-index: 2;
    }

    .code-copy {
      position: absolute;
      top: 0;
      right: 0;
      min-width: 88px;
      min-height: 44px;
      background: transparent;
      border: 1px solid var(--rule-soft);
      padding: 8px 12px;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-soft);
      cursor: pointer;
      z-index: 2;
      transition:
        transform var(--motion-press) var(--ease-out),
        color var(--motion-feedback) var(--ease-out),
        border-color var(--motion-feedback) var(--ease-out);
    }

    .code-copy:hover {
      color: var(--blueprint);
      border-color: var(--blueprint);
    }

    .syn-keyword { color: var(--blueprint); font-weight: 500; }
    .syn-string { color: var(--ink); }
    .syn-number { color: var(--blueprint); }
    .syn-comment { color: var(--ink-mute); font-style: italic; }
    .syn-function { color: var(--ink); font-weight: 500; }
    .syn-operator { color: var(--ink-soft); }

    [data-theme="dark"] .syn-keyword { color: var(--blueprint); }
    [data-theme="dark"] .syn-string { color: var(--ink); }
    [data-theme="dark"] .syn-number { color: var(--blueprint); }
    [data-theme="dark"] .syn-comment { color: var(--ink-mute); }
    [data-theme="dark"] .syn-function { color: var(--ink); }
    [data-theme="dark"] .syn-operator { color: var(--ink-soft); }

    .lesson-article .table-wrap {
      overflow-x: auto;
      margin: 24px 0;
      border: 1px solid var(--rule-soft);
    }

    .lesson-article table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-body);
      font-size: 0.96rem;
    }

    .lesson-article thead th {
      background: var(--bg-surface);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--ink);
    }

    .lesson-article tbody td {
      padding: 11px 16px;
      border-bottom: 1px solid var(--rule-soft);
      color: var(--ink);
      vertical-align: top;
    }

    .lesson-article tbody tr:last-child td { border-bottom: none; }

    .lesson-article tbody tr:hover {
      background: var(--blueprint-tint);
    }

    .lesson-article .key-terms-table .col-says {
      font-family: var(--font-body);
      font-style: italic;
      color: var(--ink-soft);
    }

    .learning-objectives {
      background: transparent;
      border: 1px solid var(--blueprint);
      padding: 22px 26px;
      margin: 24px 0 32px;
    }

    .learning-objectives-title {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--blueprint);
      margin: 0 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .learning-objectives ul { margin: 0; padding-left: 20px; }
    .learning-objectives li {
      margin-bottom: 6px;
      color: var(--ink);
      line-height: 1.55;
      font-size: 0.98rem;
      text-align: left;
    }

    .lesson-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 28px;
      padding: 14px 0;
      border-top: 1px solid var(--rule-soft);
      border-bottom: 1px solid var(--rule-soft);
    }

    .lesson-meta-tag {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 10px;
      border: 1px solid var(--rule-soft);
      color: var(--ink-soft);
      background: transparent;
    }

    .lesson-meta-tag.time-tag {
      border-color: var(--blueprint);
      color: var(--blueprint);
      background: var(--blueprint-tint);
    }

    .lesson-action-panel {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      margin: 24px 0 34px;
      border: 1px solid var(--blueprint);
      background: var(--blueprint-tint);
      overflow: hidden;
    }

    .lesson-action-head {
      min-width: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--blueprint);
    }

    .lesson-action-head > *,
    .lesson-action-body > *,
    .lesson-action-command-row > * {
      min-width: 0;
    }

    .lesson-action-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.45rem;
      line-height: 1;
      text-transform: uppercase;
      color: var(--blueprint);
    }

    .lesson-action-intro {
      max-width: 450px;
      margin: 7px 0 0;
      font-family: var(--font-body);
      font-size: 0.94rem;
      line-height: 1.45;
      color: var(--ink-soft);
      text-align: left;
    }

    .lesson-action-status {
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .lesson-action-loop {
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      border-bottom: 1px solid var(--rule-soft);
    }

    .lesson-action-step {
      min-width: 0;
      min-height: 112px;
      padding: 14px 12px;
      border: 0;
      border-right: 1px solid var(--rule-soft);
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition:
        color var(--motion-feedback) var(--ease-out),
        background-color var(--motion-feedback) var(--ease-out),
        opacity var(--motion-feedback) var(--ease-out);
    }

    .lesson-action-step:last-child { border-right: 0; }

    .lesson-action-step:hover,
    .lesson-action-step:focus-visible {
      color: var(--blueprint);
      background: var(--bg-surface);
    }

    .lesson-action-step.is-done {
      background: var(--blueprint);
      color: var(--bg);
    }

    .lesson-action-step-num,
    .lesson-action-step-title,
    .lesson-action-step-copy {
      display: block;
    }

    .lesson-action-step-num {
      font-family: var(--font-mono);
      font-size: 0.64rem;
      letter-spacing: 0.12em;
      opacity: 0.72;
    }

    .lesson-action-step-title {
      margin-top: 7px;
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .lesson-action-step-copy {
      margin-top: 6px;
      font-family: var(--font-body);
      font-size: 0.78rem;
      line-height: 1.35;
      color: inherit;
      opacity: 0.82;
    }

    .lesson-action-body {
      min-width: 0;
      display: grid;
      gap: 14px;
      padding: 18px 20px 20px;
    }

    .lesson-action-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .lesson-action-tag {
      padding: 3px 8px;
      border: 1px solid var(--rule-soft);
      background: var(--bg);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .lesson-action-run,
    .lesson-action-path {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      border: 1px solid var(--rule-soft);
      background: var(--bg);
      padding: 14px 16px;
    }

    .lesson-action-label {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--blueprint);
    }

    .lesson-action-command-row {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 9px;
    }

    .lesson-action-command {
      min-width: 0;
      max-width: 100%;
      flex: 1;
      overflow-wrap: anywhere;
      word-break: break-word;
      padding: 9px 10px;
      background: var(--code-bg);
      border: 1px solid var(--rule-soft);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      line-height: 1.45;
      color: var(--blueprint);
      white-space: pre-wrap;
    }

    .lesson-action-copy {
      min-height: 44px;
      padding: 7px 10px;
      border: 1px solid var(--rule-soft);
      background: transparent;
      color: var(--ink-soft);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;

      font-size: 0.82rem;
      letter-spacing: 0;
      text-transform: none;
      color: var(--ink-mute);
      text-align: left;
      max-width: none;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }

    .timeline-item.current .timeline-label {
      color: var(--blueprint);
      font-weight: 500;
    }

    .timeline-index {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      color: var(--ink-mute);
      letter-spacing: 0.08em;
    }

    .timeline-item.current .timeline-index,
    .timeline-item.done .timeline-index { color: var(--blueprint); }

    .timeline-ellipsis {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--ink-mute);
      letter-spacing: 0.08em;
      padding: 12px;
      white-space: nowrap;
      background: var(--code-bg);
    }

    .path-panel-context {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .path-panel-context .ai-panel-subtitle {
      margin: 0;
      color: var(--ink);
      font-weight: 500;
    }

    .path-position {
      flex: 0 0 auto;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: var(--ink-mute);
      white-space: nowrap;
    }


    .phase-progress-bar {
      width: 100%;
      height: 3px;
      background: var(--rule-soft);
      overflow: hidden;
      margin: 12px 0 7px;
    }

    .phase-progress-fill {
      width: 100%;
      height: 100%;
      background: var(--blueprint);
      transform: scaleX(var(--lesson-progress, 0));
      transform-origin: left center;
      transition: transform var(--motion-enter) var(--ease-out);
    }

    .phase-progress-text {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      color: var(--ink-soft);
      text-align: left;
    }

    .path-completion-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--rule-soft);
    }

    .path-completion-actions a {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--blueprint);
      text-decoration: none;
    }

    .path-completion-actions a:hover { text-decoration: underline; }

    .learning-path-preflights {
      display: grid;
      gap: 10px;
      margin: 18px 0 2px;
      padding-top: 16px;
      border-top: 1px solid var(--rule-soft);
    }

    .learning-path-preflight {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px 18px;
      align-items: center;
      padding: 14px 16px;
      border: 1px solid var(--rule-soft);
      background: var(--code-bg);
    }

    .learning-path-preflight-copy { min-width: 0; }

    .learning-path-preflight-label,
    .learning-path-preflight-status {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .learning-path-preflight-label {
      color: var(--blueprint);
      margin-bottom: 5px;
    }

    .learning-path-preflight-title {
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .learning-path-preflight-description {
      color: var(--ink-soft);
      font-family: var(--font-body);
      font-size: 0.88rem;
      line-height: 1.45;
      margin-top: 4px;
    }

    .learning-path-preflight-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .learning-path-preflight-status { color: var(--ink-mute); }
    .learning-path-preflight.confirmed { border-color: var(--blueprint); }
    .learning-path-preflight.confirmed .learning-path-preflight-status { color: var(--blueprint); }

    .learning-path-confirm[disabled] {
      cursor: default;
      opacity: 0.7;
    }

    .learning-path-locked {
      cursor: not-allowed;
      opacity: 0.48;
    }

    .learning-path-locked:hover {
      color: var(--ink-mute);
      border-color: transparent;
    }

    .prerequisite-callout:focus {
      outline: 2px solid var(--blueprint);
      outline-offset: 3px;
    }

    .phase-complete-callout {
      position: relative;
      overflow: hidden;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--blueprint);
      text-align: center;
      margin-top: 14px;
      padding: 14px;
      border: 1px solid var(--blueprint);
      background: var(--blueprint-tint);
      display: none;
    }

    .phase-complete-callout.visible {
      display: block;
      opacity: 1;
      transform: none;
    }

    .phase-complete-callout.visible::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--blueprint);
      transform: scaleX(1);
      transform-origin: left center;
    }

    .phase-complete-callout.visible.is-entering {
      opacity: 0;
      transform: translateY(8px);
    }

    .phase-complete-callout.visible.is-entering::before {
      transform: scaleX(0);
    }

    .phase-complete-callout.visible.is-entered {
      transition:
        opacity var(--motion-enter) var(--ease-out),
        transform var(--motion-enter) var(--ease-out);
    }

    .phase-complete-callout.visible.is-entered::before {
      transition: transform var(--motion-drawer) var(--ease-out);
    }

    .continue-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
    }

    .phase-finished {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--bg);
      background: var(--blueprint);
      padding: 8px 16px;
    }

    .continue-links {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .continue-link {
      font-family: var(--font-body);
      font-size: 0.96rem;
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }

    .continue-link:hover {
      color: var(--blueprint);
      border-bottom-color: var(--blueprint);
    }

    .continue-callout {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      color: var(--ink-soft);
      background: var(--code-bg);
      padding: 12px 18px;
      border: 1px solid var(--rule-soft);
      max-width: 480px;
    }

    .continue-callout code { color: var(--blueprint); }

    .panel-loading {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-mute);
      text-align: center;
      padding: 20px;
    }

    .panel-fallback {
      text-align: left;
      padding: 16px 0;
    }

    .panel-fallback a {
      color: var(--blueprint);
      text-decoration: none;
      border-bottom: 1px solid var(--blueprint);
      font-family: var(--font-body);
      font-size: 0.95rem;
    }

    .lesson-cert-notice {
      margin: 0 0 28px;
    }

    .lesson-cert-breadcrumb {
      margin: 0 0 18px;
      flex-wrap: wrap;
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation: none;
        border-color: var(--rule-soft);
        border-top-color: var(--blueprint);
      }

      .lesson-sidebar,
      .phase-progress-fill {
        transition: none;
      }

      .phase-complete-callout.visible,
      .phase-complete-callout.visible.is-entering,
      .phase-complete-callout.visible.is-entered {
        opacity: 1;
        transform: none;
        transition: none;
      }

      .phase-complete-callout.visible::before,
      .phase-complete-callout.visible.is-entering::before,
      .phase-complete-callout.visible.is-entered::before {
        transform: scaleX(1);
        transition: none;
      }

      .quiz-explanation.visible,
      .quiz-score.visible {
        animation: lesson-feedback-fade var(--motion-feedback) ease both;
      }

      .lesson-sidebar-toggle:active,
      .quiz-option:active:not(.disabled),
      .quiz-retry:active,
      .lesson-nav-btn:active,
      .output-btn:active,
      .code-card-btn:active,
      .code-copy:active,
      .mermaid-btn:active {
        transform: none;
      }
    }

    .toc-sidebar {
      position: fixed;
      top: 64px;
      right: 0;
      bottom: 0;
      width: 240px;
      background: transparent;
      overflow-y: auto;
      z-index: 40;
      padding: 56px 24px 80px;
      display: none;
      scrollbar-width: thin;
      scrollbar-color: var(--rule-soft) transparent;
    }

    .toc-sidebar[aria-hidden="true"] { display: none; }

    .toc-sidebar::-webkit-scrollbar { width: 3px; }
    .toc-sidebar::-webkit-scrollbar-thumb { background: var(--rule-soft); }

    .toc-header {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--blueprint);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      margin-bottom: 18px;
    }

    .toc-nav {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      position: relative;
      border-left: 1px solid var(--rule-soft);
    }

    .toc-item { line-height: 1.4; }

    .toc-link {
      font-family: var(--font-body);
      font-size: 0.84rem;
      color: var(--ink-soft);
      text-decoration: none;
      display: block;
      border-left: 2px solid transparent;
      padding: 5px 16px;
      margin-left: -1px;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toc-h3 .toc-link {
      padding-left: 28px;
      font-size: 0.78rem;
    }

    .toc-link:hover {
      color: var(--ink);
      background: var(--blueprint-tint);
    }

    .toc-link:focus-visible {
      outline: 2px solid var(--blueprint);
      outline-offset: 2px;
    }

    .toc-link.active {
      color: var(--blueprint);
      border-left-color: var(--blueprint);
      font-weight: 500;
    }

    @media (min-width: 1280px) {
      .lesson-main { padding-right: 240px; }
      .toc-sidebar { display: block; }
    }

    @media (max-width: 1279px) {
      .lesson-main { padding-right: 32px; }
    }

    @media (min-width: 1440px) {
      .lesson-article { max-width: 760px; }
      .lesson-sidebar { width: 280px; min-width: 280px; }
      .lesson-main { margin-left: 280px; padding-right: 280px; }
      .toc-sidebar { width: 280px; }
    }

    @media (max-width: 900px) {
      html,
      body {
        overflow-x: hidden;
      }
      .lesson-layout { padding-top: 56px; }
      .lesson-sidebar { transform: translateX(-100%); }
      .lesson-sidebar.open { transform: translateX(0); }
      .lesson-sidebar-toggle {
        display: flex;
        top: auto;
        right: 16px;
        bottom: 18px;
        left: auto;
        width: auto;
        height: 44px;
        padding: 0 14px;
        gap: 8px;
        border-color: var(--blueprint);
        background: var(--modal-bg);
        color: var(--blueprint);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .lesson-sidebar {
        top: 56px;
        width: min(360px, 88vw);
        padding: 18px 0 88px;
        border-right-color: var(--blueprint);
        box-shadow: 16px 0 40px rgba(0, 0, 0, 0.22);
      }
      .sidebar-phase-header {
        padding: 18px 18px 8px;
      }
      .sidebar-lesson-link {
        padding: 10px 18px;
        font-size: 1rem;
        line-height: 1.35;
      }
      .lesson-main {
        margin-left: 0;
        justify-content: stretch;
        padding: 44px 20px 80px;
      }
      .lesson-content { max-width: none; }
    }

    @media (max-width: 768px) {
      .lesson-main { padding: 40px 16px 60px; }
      .lesson-article { max-width: 100%; }
      .lesson-article h1 {
        font-size: clamp(2.05rem, 11vw, 3rem);
        line-height: 0.95;
        margin-bottom: 16px;
        padding-bottom: 14px;
      }
      .lesson-article h2 {
        margin-top: 42px;
        font-size: clamp(1.35rem, 8vw, 1.9rem);
      }
      .lesson-article h3 {
        margin-top: 28px;
        font-size: 0.84rem;
        line-height: 1.35;
      }
      .lesson-article p,
      .lesson-article ul li,
      .lesson-article ol li { font-size: 1rem; line-height: 1.65; }
      .lesson-article p {
        text-align: left;
        hyphens: none;
        -webkit-hyphens: none;
      }
      .lesson-article > p:first-of-type::first-letter { font-size: 3rem; }
      .lesson-article pre code { font-size: 0.78rem; padding: 14px 14px; }
      .lesson-article table { font-size: 0.84rem; display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .lesson-article table th,
      .lesson-article table td { padding: 8px 10px; white-space: nowrap; }
      .lesson-article .motto { font-size: 1.05rem; padding: 14px 16px; }
      .learning-objectives,
      .quiz-section,
      .quiz-container {
        padding: 18px 16px;
      }
      .lesson-meta {
        gap: 6px;
        margin-bottom: 24px;
      }
      .lesson-meta-tag {
        font-size: 0.66rem;
        letter-spacing: 0.07em;
        padding: 3px 8px;
      }
      .lesson-action-head {
        flex-direction: column;
        padding: 16px;
      }
      .lesson-action-loop {
        grid-template-columns: 1fr;
      }
      .lesson-action-step {
        min-height: 0;
        border-right: 0;
        border-bottom: 1px solid var(--rule-soft);
      }
      .lesson-action-step:last-child { border-bottom: 0; }
      .lesson-action-body { padding: 16px; }
      .lesson-action-command-row { flex-direction: column; }
      .lesson-action-copy { width: 100%; }
      .ai-panels { margin-top: 40px; gap: 20px; }
      .ai-panel { padding: 22px 16px; }
      .ai-panel--compact,
      .ai-panel--path,
      .ai-panel--continue { padding: 16px; }
      .ai-panel-header {
        align-items: flex-start;
        gap: 10px;
      }
      .ai-panel-title {
        font-size: 1.22rem;
        line-height: 1.05;
      }
      .output-cards,
      .code-cards { grid-template-columns: 1fr; }
      .output-cards.single .output-card,
      .code-cards.single .code-card {
        grid-template-columns: minmax(0, 1fr);
      }
      .output-cards.single .output-card > *,
      .code-cards.single .code-card > * {
        grid-column: 1;
        grid-row: auto;
      }
      .learning-timeline { grid-template-columns: minmax(0, 1fr); }
      .timeline-item {
        display: grid;
        grid-template-columns: 52px minmax(0, 1fr);
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
      }
      .timeline-step-meta { margin-bottom: 0; }
      .timeline-item + .timeline-item,
      .timeline-ellipsis + .timeline-item,
      .timeline-item + .timeline-ellipsis {
        border-left: 0;
        border-top: 1px solid var(--rule-soft);
      }
      .timeline-label { -webkit-line-clamp: 2; }
      .timeline-ellipsis {
        justify-content: flex-start;
        border-left: 0;
        border-top: 1px solid var(--rule-soft);
      }
      .path-panel-context {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }
      .lesson-nav-bottom { grid-template-columns: minmax(0, 1fr); }
      .lesson-nav-btn + .lesson-nav-btn {
        border-left: 0;
        border-top: 1px solid var(--rule-soft);
      }
      .lesson-nav-btn { max-width: 100%; min-height: 78px; }
      .lesson-nav-btn.next { text-align: left; }
    }

    @media (max-width: 480px) {
      .lesson-main { padding: 36px 12px 56px; }
      .lesson-sidebar-toggle {
        right: 12px;
        bottom: 14px;
        height: 44px;
        padding: 0 12px;
      }
      .lesson-article p,
      .lesson-article ul li,
      .lesson-article ol li { font-size: 0.96rem; }
      .lesson-article h1 { font-size: clamp(1.9rem, 12vw, 2.55rem); }
      .lesson-article > p:first-of-type::first-letter { font-size: 2.6rem; }
      .lesson-article ul { padding-left: 18px; }
      .lesson-article ol { padding-left: 24px; }
      .learning-objectives,
      .quiz-section,
      .quiz-container {
        padding: 16px 12px;
      }
      .learning-objectives-title,
      .quiz-title {
        align-items: flex-start;
        font-size: 0.66rem;
        line-height: 1.35;
      }
      .quiz-option {
        gap: 10px;
        padding: 10px 12px;
      }
      .ai-panel { padding: 18px 12px; }
      .code-card,
      .output-card {
        padding: 14px;
      }
      .code-card-actions,
      .output-actions {
        display: grid;
        grid-template-columns: 1fr;
      }
      .code-card-btn,
      .output-btn {
        text-align: center;
        min-height: 44px;
      }
      .learning-path-preflight {
        grid-template-columns: 1fr;
      }
      .learning-path-preflight-actions {
        align-items: stretch;
      }
    }
  </style>
</head>

  <script>
    (function () {

      var btn = document.getElementById('themeToggle');

          var next = current === 'light' ? 'dark' : 'light';

      function preferredScrollBehavior() {

      if (!lessonPath) {

      var phaseMatch = lessonPath.match(/phases\/(\d+-[^/]+)/);

      var currentLessonSlug = lessonMatch ? lessonMatch[1] : null;

      var currentPhaseIndex = -1;
      var currentLessonIndex = -1;
      var flatLessons = [];
      var ACTIVE_REF = (typeof window !== 'undefined' && window.__AIFS_REF) ? window.__AIFS_REF : 'main';
      var REPO_TREE = 'https://github.com/rohitg00/ai-engineering-from-scratch/tree/' + encodeURIComponent(ACTIVE_REF) + '/';
      var certificationTrack = null;
      var certificationOriginTrack = null;
      var certificationLesson = null;
      var certificationMode = false;
      var certificationSupplementalMode = false;
      var learningPath = null;
      var learningPathMode = false;
      var PROGRESS_STORAGE_KEY = 'aifs:progress:v2';

      function certificationData() {
        return typeof CERTIFICATIONS !== 'undefined' && CERTIFICATIONS ? CERTIFICATIONS : null;
      }

      function certificationRefPath(ref) {
        return typeof ref === 'string' ? ref : ref && ref.path ? ref.path : '';
      }

      function certificationTrackContains(track, path) {
        return !!(track && Array.isArray(track.lessons) && track.lessons.some(function (ref) {
          return certificationRefPath(ref) === path;
        }));
      }

      function findCertificationTrack(id) {
        var certs = certificationData();
        if (!certs || !Array.isArray(certs.tracks)) return null;
        return certs.tracks.find(function (track) {
          return track.id === id || track.slug === id || track.examCode === id;
        }) || null;
      }

      function certificationContextTrack() {
        return certificationTrack || certificationOriginTrack || null;
      }

      function certificationTrackLabel(track) {
        return track && (track.examCode || track.shortName || track.credential || track.title || track.id) || 'Certification';
      }

      function phaseLessonForPath(path) {
        if (typeof PHASES === 'undefined') return null;
        for (var pi = 0; pi < PHASES.length; pi++) {
          for (var li = 0; li < PHASES[pi].lessons.length; li++) {
            var phaseLesson = PHASES[pi].lessons[li];
            var match = phaseLesson.url && phaseLesson.url.match(/(phases\/[^/?#]+\/[^/?#]+)/);
            if (match && match[1] === path) return { phase: PHASES[pi], lesson: phaseLesson, phaseIndex: pi, lessonIndex: li };
          }

        return null;
      }

      function learningPathEntryPath(entry) {
        return typeof entry === 'string' ? entry : entry && entry.path ? entry.path : '';
      }

      function findLearningPath(id) {
        if (!id || typeof LEARNING_PATHS === 'undefined' || !Array.isArray(LEARNING_PATHS)) return null;
        return LEARNING_PATHS.find(function (path) { return path && path.id === id; }) || null;
      }

      function inferLearningPath(target) {
        if (!target || typeof LEARNING_PATHS === 'undefined' || !Array.isArray(LEARNING_PATHS)) return null;
        var preferredIds = ['agent-skills', 'model-context-protocol'];
        for (var i = 0; i < preferredIds.length; i++) {
          var preferred = findLearningPath(preferredIds[i]);
          if (preferred && learningPathContains(preferred, target)) return preferred;
        }
        return LEARNING_PATHS.find(function (path) { return learningPathContains(path, target); }) || null;
      }

      function learningPathEntries(path, includeOptional) {
        if (!path) return [];
        var required = Array.isArray(path.lessons) ? path.lessons : [];
        var optional = includeOptional && Array.isArray(path.optionalLessons) ? path.optionalLessons : [];

      }

      function learningPathContains(path, target) {
        return learningPathEntries(path, true).some(function (entry) {
          return learningPathEntryPath(entry) === target;
        });
      }

      function learningPathLessonHref(path) {
        return 'lesson.html?path=' + encodeURIComponent(path) +
          '&learningPath=' + encodeURIComponent(learningPath.id);
      }

      function learningPathPrerequisiteLabel(path) {
        var core = phaseLessonForPath(path);
        if (!core) return path;
        return 'Phase ' + String(core.phase.id).padStart(2, '0') + ' · ' + core.lesson.name;
      }

      function unmetLearningPathPrerequisites(entry) {
        var prerequisites = entry && Array.isArray(entry.prerequisitePaths)
          ? entry.prerequisitePaths
          : [];
        return prerequisites.filter(function (prerequisitePath) {
          return !(window.AIFSProgress && window.AIFSProgress.isLessonComplete(prerequisitePath));
        });
      }

      function learningPathPrerequisiteChecks(entry) {
        if (!learningPathMode || !window.AIFSLearningPathProgress) return [];
        return window.AIFSLearningPathProgress.unmetChecks(learningPath, entry);
      }

      function learningPathCheckIds(entry) {
        return entry && Array.isArray(entry.prerequisiteChecks)
          ? entry.prerequisiteChecks.filter(function (id) { return typeof id === 'string' && id.length > 0; })
          : [];
      }

      function learningPathPrerequisitePaths(entry) {
        return entry && Array.isArray(entry.prerequisitePaths)
          ? entry.prerequisitePaths.filter(function (path) { return typeof path === 'string' && path.length > 0; })
          : [];
      }

      function learningPathEntryLocked(entry) {
        return unmetLearningPathPrerequisites(entry).length > 0 ||
          learningPathPrerequisiteChecks(entry).length > 0;
      }

      function learningPathGateClass(entry) {
        return learningPathEntryLocked(entry) ? ' learning-path-locked' : '';
      }

      function learningPathGateAttributes(entry) {
        var ids = learningPathCheckIds(entry);
        var paths = learningPathPrerequisitePaths(entry);
        if (!ids.length && !paths.length) return '';

          ' data-learning-path-gate="true"' +
          ' data-prerequisite-checks="' + escapeAttr(ids.join(' ')) + '"' +

      }

      function learningPathPreflightDefinitions() {

        var referenced = {};

          for (var checkIndex = 0; checkIndex < ids.length; checkIndex++) referenced[ids[checkIndex]] = true;
        }
        var definitions = Array.isArray(learningPath.prerequisites) ? learningPath.prerequisites : [];
        return Object.keys(referenced).map(function (id) {
          return definitions.find(function (entry) { return entry && entry.id === id; });
        }).filter(Boolean);
      }

      function learningPathPreflightHtml() {
        var checks = learningPathPreflightDefinitions();
        if (!checks.length) return '';
        var html = '<div class="learning-path-preflights" aria-label="Knowledge preflights">';
        for (var index = 0; index < checks.length; index++) {
          var check = checks[index];
          var confirmed = window.AIFSLearningPathProgress && window.AIFSLearningPathProgress.isConfirmed(learningPath.id, check.id);

          html += '<div class="learning-path-preflight-copy"><div class="learning-path-preflight-label">Required knowledge preflight</div>';
          html += '<div class="learning-path-preflight-title">' + escapeHtml(check.title || check.id) + '</div>';
          if (check.description) html += '<div class="learning-path-preflight-description">' + escapeHtml(check.description) + '</div>';
          html += '</div><div class="learning-path-preflight-actions">';
          html += '<div class="learning-path-preflight-status" role="status" aria-live="polite">' + (confirmed ? 'Confirmed' : 'Confirmation required') + '</div>';
          html += '<button type="button" class="output-btn learning-path-confirm" data-learning-path-check-id="' + escapeAttr(check.id) + '" aria-pressed="' + (confirmed ? 'true' : 'false') + '" onclick="confirmLearningPathCheck(this)"' + (confirmed ? ' disabled' : '') + '>' + (confirmed ? 'Confirmed' : 'Confirm preflight') + '</button>';
          html += '</div></div>';
        }
        html += '</div>';
        return html;
      }

      function learningPathPrerequisiteCallout(entry, heading) {
        var unmet = unmetLearningPathPrerequisites(entry);
        var unmetChecks = learningPathPrerequisiteChecks(entry);
        if (!unmet.length && !unmetChecks.length) return '';
        var html = '<div class="continue-callout prerequisite-callout" role="status" tabindex="-1" data-learning-path-prerequisite-callout="true"' +
          ' data-prerequisite-paths="' + escapeAttr(unmet.join(' ')) + '"' +
          ' data-prerequisite-checks="' + escapeAttr(unmetChecks.map(function (check) { return check.id; }).join(' ')) + '"><strong>' +
          escapeHtml(heading || 'Prerequisite check') + '</strong><br>';
        for (var index = 0; index < unmet.length; index++) {

            html += '<span>Complete this lesson: ' + escapeHtml(label) + '.</span>';

            var href = insideFocusedPath
              ? learningPathLessonHref(prerequisitePath)

          }
          if (index < unmet.length - 1) html += '<br>';
        }
        if (unmet.some(function (prerequisitePath) { return !learningPathContains(learningPath, prerequisitePath); })) {
          html += '<br><span>The external prerequisite opens in a new tab so this focused route stays in place.</span>';
        }
        for (var checkIndex = 0; checkIndex < unmetChecks.length; checkIndex++) {
          var check = unmetChecks[checkIndex];
          if (unmet.length || checkIndex > 0) html += '<br>';
          html += '<span>Knowledge preflight: ' + escapeHtml(check.title || check.id) + '.</span>';
          html += '<button type="button" class="output-btn learning-path-confirm" data-learning-path-check-id="' + escapeAttr(check.id) + '" aria-pressed="false" onclick="confirmLearningPathCheck(this)">Confirm preflight</button>';
        }
        html += '</div>';
        return html;
      }

      function linkUnmetLearningPathCheckIds(link) {
        if (!learningPathMode || !link || !window.AIFSLearningPathProgress) return [];
        var ids = (link.getAttribute('data-prerequisite-checks') || '').split(/\s+/).filter(Boolean);
        return ids.filter(function (id) {
          return !window.AIFSLearningPathProgress.isConfirmed(learningPath.id, id);

      function linkUnmetLearningPathPrerequisitePaths(link) {
        if (!learningPathMode || !link) return [];
        var paths = (link.getAttribute('data-prerequisite-paths') || '').split(/\s+/).filter(Boolean);
        return paths.filter(function (path) {
          return !(window.AIFSProgress && window.AIFSProgress.isLessonComplete(path));

      }

      function linkHasUnmetLearningPathPrerequisite(link) {
        if (!learningPathMode || !link) return false;
        return linkUnmetLearningPathPrerequisitePaths(link).length > 0 ||
          linkUnmetLearningPathCheckIds(link).length > 0;

      function syncLearningPathGateLinks() {
        var links = document.querySelectorAll('a[data-learning-path-gate]');

      function findLearningPathConfirmButton(checkId) {

      function lessonProgressClass(path, readable) {

      function currentCertificationQuizVersion() {

      function mutateLessonProgress(mutator) {

          if (!state || typeof state !== 'object' || !state.lessons || typeof state.lessons !== 'object') return false;
          var lesson = state.lessons[lessonPath];
          if (!lesson || typeof lesson !== 'object') {
            lesson = { answers: {}, quizPassedAt: null, checkpoints: {}, completedAt: null, completionSource: '', visitedAt: Date.now() };
            state.lessons[lessonPath] = lesson;

          if (!mutator(lesson)) return false;
          state.updatedAt = Date.now();
          localStorage.setItem(PROGRESS_STORAGE_KEY, JSON.stringify(state));
          return true;

          return false;
        }
      }

      function mutateCertificationLessonProgress(mutator) {
        if (!certificationLesson) return false;
        return mutateLessonProgress(mutator);
      }

      function syncCertificationQuizProgressVersion() {
        var currentVersion = currentCertificationQuizVersion();
        if (!currentVersion) return;
        mutateCertificationLessonProgress(function (lesson) {
          var storedVersion = lesson.quizVersion === undefined || lesson.quizVersion === null
            ? ''
            : String(lesson.quizVersion);
          if (storedVersion === currentVersion) return false;
          lesson.answers = {};
          lesson.quizPassedAt = null;
          lesson.quizVersion = currentVersion;
          return true;

      }

      function clearQuizSectionProgress(section) {
        if (!section) return false;

        if (!questionIds.length) return false;
        var currentVersion = currentCertificationQuizVersion();

          if (!lesson.answers || typeof lesson.answers !== 'object') lesson.answers = {};
          for (var i = 0; i < questionIds.length; i++) delete lesson.answers[questionIds[i]];
          lesson.quizPassedAt = null;
          if (currentVersion) lesson.quizVersion = currentVersion;
          return true;
        });
        if (changed) refreshProgressUi();
        return changed;
      }

      function initializeLessonData() {
        var certs = certificationData();
        certificationLesson = certs && certs.lessonsByPath ? certs.lessonsByPath[lessonPath] || null : null;
        certificationOriginTrack = originatingTrackId ? findCertificationTrack(originatingTrackId) : null;
        certificationTrack = null;

        if (certificationOriginTrack && certificationTrackContains(certificationOriginTrack, lessonPath)) {
          certificationTrack = certificationOriginTrack;
        } else if (!certificationOriginTrack) {
          var requestedTrack = requestedTrackId ? findCertificationTrack(requestedTrackId) : null;
          if (requestedTrack && certificationTrackContains(requestedTrack, lessonPath)) {
            certificationTrack = requestedTrack;
          } else if (requestedTrack) {
            certificationOriginTrack = requestedTrack;
          }

        if (!certificationTrack && !certificationOriginTrack && certificationLesson && Array.isArray(certificationLesson.trackIds)) {

      function extractPhaseSlug(phase, index) {
        if (phase.url) {

      function extractLessonSlug(lesson, index) {
        if (lesson.url) {

      function initScrollProgress() {

        function update() {
          var scrollTop = window.scrollY || document.documentElement.scrollTop;
          var docHeight = document.documentElement.scrollHeight - window.innerHeight;
          var ratio = docHeight > 0 ? scrollTop / docHeight : 0;

        function schedule() {

      function fetchRepositoryFile(relativePath) {
        var source = window.AIFSContentSource;
        var localPreview = !!(source && typeof source.isLocal === 'function' && source.isLocal());
        var fetchOptions = localPreview ? { cache: 'no-store' } : undefined;
        var primary = source && source.repoUrl
          ? source.repoUrl(relativePath)
          : 'https://raw.githubusercontent.com/rohitg00/ai-engineering-from-scratch/' + ACTIVE_REF + '/' + relativePath;
        var fallback = source && source.rawRepoUrl ? source.rawRepoUrl(relativePath) : primary;

        return fetch(primary, fetchOptions).then(function (response) {
          if (response.ok) return response;
          throw new Error('fetch-failed');
        }).catch(function (error) {
          if (!fallback || fallback === primary) throw error;

      var lessonFetchSequence = 0;

      function fetchLesson(path, retried, requestSequence) {
        if (!retried || !requestSequence) requestSequence = ++lessonFetchSequence;
        if (certificationLesson && path === certificationLesson.path && typeof certificationLesson.markdown === 'string') {
          applyRenderedLanguage('en');
          lessonQuizPromise = Promise.resolve(certificationLesson.quiz || null);
          try {
            renderLesson(certificationLesson.markdown);
          } catch (embeddedError) {
            console.error('renderLesson failed', embeddedError);
            showError('Render error', 'Loaded the certification lesson but failed to render it. Details are in the browser console.');
            return;
          }
          lessonQuizPromise.then(function (embeddedQuiz) {
            if (!embeddedQuiz || requestSequence !== lessonFetchSequence) return;
            try { renderQuiz(embeddedQuiz); }
            catch (quizError) { console.error('renderQuiz failed', quizError); }
          });
          return;
        }

        // Local previews read the checked-out repository first. Deploys and a
        // missing local file use the branch-aware raw source from build-meta.
        var enPath = path + '/docs/en.md';
        var lang = currentLang();
        var translatedUrl = 'https://raw.githubusercontent.com/rohitg00/ai-engineering-from-scratch/translations/i18n/'
          + lang + '/' + path + '/docs/' + lang + '.md';

        if (!retried || !lessonQuizPromise) {

            .then(function (res) { return res.json(); })

              .then(function (data) {

      function lessonActionRunFile(files) {
        if (!Array.isArray(files)) return null;
        var supported = /\.(py|ts|js|rs|jl|sh)$/i;
        for (var i = 0; i < files.length; i++) {
          var name = files[i] && String(files[i].name || '').trim();
          if (/^main\.(py|ts|js|rs|jl|sh)$/i.test(name)) return files[i];
        }
        for (var j = 0; j < files.length; j++) {
          var fallbackName = files[j] && String(files[j].name || '').trim();
          if (files.length === 1 && supported.test(fallbackName)) return files[j];
        }
        return null;
      }
