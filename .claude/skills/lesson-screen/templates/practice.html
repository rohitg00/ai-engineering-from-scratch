(function () {
  function apply() {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}

  }
  apply();

<style>

.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 22px; }

.links a::after { content: "\2197"; font: 500 0.9rem var(--font-mono); color: var(--blueprint); }
.cmd { display: flex; align-items: stretch; max-width: 760px; border: 1px solid var(--rule-soft); background: var(--bg-surface); }

.cmd .btn { border: 0; border-left: 1px solid var(--rule-soft); min-width: 92px; justify-content: center; }
.exercise { max-width: 760px; margin: 0; padding: 16px 18px; border-left: 2px solid var(--blueprint); background: var(--bg); text-wrap: pretty; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (hover: hover) and (pointer: fine) {
  .step:hover:not([aria-selected="true"]) { background: var(--paper-rule); }
  .term:hover:not([aria-expanded="true"]) { border-color: var(--blueprint); }

  .rail { position: static; min-width: 0; }
  .steps { display: flex; margin-top: 20px; border-top: 0; border-bottom: 1px solid var(--rule-soft); overflow-x: auto; scroll-snap-type: x mandatory; }
  .step { flex: none; width: auto; grid-template-columns: auto auto; min-height: 48px; padding: 10px 14px; border-bottom: 0; scroll-snap-align: start; }
  .step::before { left: 0; right: 0; top: auto; bottom: 0; width: auto; height: 2px; transform: scaleX(0); }

<body>
<main class="pr">
  <aside class="rail" aria-label="Lesson">
    <p class="eyebrow"><b>Practice</b> · Phase <span data-phase></span> · Lesson <span data-number></span></p>
    <h1 class="title" data-title></h1>
    <p class="hook is-clamped" data-hook></p>
    <button type="button" class="more" data-more hidden>More</button>
    <div class="steps" role="tablist" aria-label="Practice steps" aria-orientation="vertical">
      <button type="button" class="step" role="tab" id="tab-brief" aria-controls="panel-brief" data-tab="brief"><span class="step-n">01</span><span class="step-name">Brief</span><span class="step-meta" data-meta="brief"></span></button>
      <button type="button" class="step" role="tab" id="tab-drill" aria-controls="panel-drill" data-tab="drill"><span class="step-n">02</span><span class="step-name">Drill</span><span class="step-meta" data-meta="drill"></span></button>
      <button type="button" class="step" role="tab" id="tab-review" aria-controls="panel-review" data-tab="review"><span class="step-n">03</span><span class="step-name">Review</span><span class="step-meta" data-meta="review"></span></button>
      <button type="button" class="step" role="tab" id="tab-deeper" aria-controls="panel-deeper" data-tab="deeper"><span class="step-n">04</span><span class="step-name">Go deeper</span><span class="step-meta" data-meta="deeper"></span></button>
    </div>
    <p class="note">Practice only. Your tutor does not see these answers. Progress stays in this browser.</p>
  </aside>
  <div class="main">
    <section class="panel" role="tabpanel" id="panel-brief" aria-labelledby="tab-brief" data-panel="brief"></section>
    <section class="panel" role="tabpanel" id="panel-drill" aria-labelledby="tab-drill" data-panel="drill"></section>
    <section class="panel" role="tabpanel" id="panel-review" aria-labelledby="tab-review" data-panel="review"></section>
    <section class="panel" role="tabpanel" id="panel-deeper" aria-labelledby="tab-deeper" data-panel="deeper"></section>
    <p class="sr" aria-live="polite" data-live></p>
  </div>
</main>
<script id="practice-data" type="application/json">__PRACTICE_DATA__</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('practice-data').textContent);
  var STORE = 'aiefs-practice-v1';
  var INTERVALS = [1, 3, 7, 16];
  var TIMERS = [0, 10, 20, 30];
  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  function el(tag, attrs, kids) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') node.textContent = attrs[k];
      else if (k === 'on') Object.keys(attrs.on).forEach(function (ev) { node.addEventListener(ev, attrs.on[ev]); });
      else node.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (kid) { if (kid) node.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid); });
    return node;
  }
  function keyOf(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function today() { return keyOf(new Date()); }
  function addDays(key, n) { var p = key.split('-').map(Number); return keyOf(new Date(p[0], p[1] - 1, p[2] + n)); }
  function niceDate(key) {
    var p = key.split('-').map(Number);
    var label = new Date(p[0], p[1] - 1, p[2]).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
    return key === addDays(today(), 1) ? 'tomorrow, ' + label : label;
  }
  function validEntry(r) {
    return r && typeof r === 'object' && typeof r.id === 'string' && typeof r.q === 'string' && Array.isArray(r.options) && r.options.length >= 2
      && r.options.every(function (o) { return typeof o === 'string'; }) && Number.isInteger(r.correct) && r.correct >= 0 && r.correct < r.options.length
      && Number.isInteger(r.box) && r.box >= 0 && typeof r.due === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(r.due);
  }
  var CURRENT = {};
  D.questions.forEach(function (q) { CURRENT[q.id] = q; });
  function reconcile(review) {
    return review.filter(function (r) {
      if (r.lesson !== D.lesson) return true;
      var q = CURRENT[r.id];
      if (!q) return false;
      r.ask = q.ask || ''; r.q = q.q; r.options = q.options; r.correct = q.correct; r.explain = q.explain; r.title = D.title;
      return true;
    });
  }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(STORE) || '{}');
      return { review: reconcile((Array.isArray(s.review) ? s.review : []).filter(validEntry)), secs: TIMERS.indexOf(s.secs) >= 0 ? s.secs : 0 };
    } catch (e) {
      return { review: [], secs: 0 };
    }
  }
  var state = load();
  function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }
  function update(change) {
    var secs = state.secs;
    state = load();
    state.secs = secs;
    change(state);
    save();
  }
  window.addEventListener('storage', function (e) {
    if (e.key !== STORE && e.key !== null) return;
    state = load();
    meta();
  });
  function due() { var now = today(); return state.review.filter(function (r) { return r.due <= now; }); }
  function upcoming() { var now = today(); return state.review.filter(function (r) { return r.due > now; }).sort(function (a, b) { return a.due < b.due ? -1 : 1; }); }
  function itemId(q, i) { return q.id || D.lesson + '#q' + i; }
  function say(text) { $('[data-live]').textContent = text; }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

  $('[data-phase]').textContent = D.phase;
  $('[data-number]').textContent = D.number;
  $('[data-title]').textContent = D.title || D.lesson;
  var hook = $('[data-hook]');
  var more = $('[data-more]');
  hook.textContent = D.hook || '';
  requestAnimationFrame(function () {
    if (hook.scrollHeight > hook.clientHeight + 2) {
      more.hidden = false;
      more.addEventListener('click', function () {
        var open = hook.classList.toggle('is-clamped');
        more.textContent = open ? 'More' : 'Less';
      });
    } else {
      hook.classList.remove('is-clamped');
    }
  });

  var current = 'brief';
  var drillProgress = '';
  function meta() {
    $('[data-meta="brief"]').textContent = plural(D.terms.length, 'key term', 'key terms');
    $('[data-meta="drill"]').textContent = drillProgress || plural(D.questions.length, 'question', 'questions');
    var n = due().length;
    $('[data-meta="review"]').textContent = n ? plural(n, 'question due', 'questions due') : 'nothing due';
    $('[data-meta="deeper"]').textContent = plural(2 + D.reading.length, 'link', 'links');
  }
  function select(tab, fromKey) {
    current = tab;
    document.querySelectorAll('[data-tab]').forEach(function (b) {
      var on = b.getAttribute('data-tab') === tab;
      b.setAttribute('aria-selected', String(on));
      b.tabIndex = on ? 0 : -1;
      if (on && fromKey) b.focus();
    });
    document.querySelectorAll('[data-panel]').forEach(function (p) {
      p.hidden = p.getAttribute('data-panel') !== tab;
      if (p.hidden && p._stop) p._stop();
    });
    if (tab === 'review') startReview();
    var shown = $('[data-panel="' + tab + '"]');
    if (shown && shown._arm) shown._arm();
  }
  document.querySelectorAll('[data-tab]').forEach(function (b) {
    b.addEventListener('click', function () { select(b.getAttribute('data-tab')); });
  });
  $('[role="tablist"]').addEventListener('keydown', function (e) {
    var tabs = Array.prototype.slice.call(document.querySelectorAll('[data-tab]'));
    var i = tabs.indexOf(document.activeElement);
    if (i < 0) return;
    var step = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];
    if (!step) return;
    select(tabs[(i + step + tabs.length) % tabs.length].getAttribute('data-tab'), true);
    e.preventDefault();
  });

  function head(panel, title, sub, extra) {
    panel.appendChild(el('div', { class: 'panel-head' }, [
      el('div', {}, [el('h2', { class: 'panel-title', text: title }), sub ? el('p', { class: 'panel-sub', text: sub }) : null]),
      extra || null,
    ]));
  }

  function renderBrief() {
    var panel = $('[data-panel="brief"]');
    head(panel, 'Brief', 'Read what this lesson teaches, then test the key terms.');
    if (D.objectives.length) {
      panel.appendChild(el('p', { class: 'label', text: 'You will be able to' }));
      panel.appendChild(el('ol', { class: 'objectives' }, D.objectives.map(function (o) { return el('li', {}, [el('span', { text: o })]); })));
    }
    if (D.terms.length) {
      panel.appendChild(el('p', { class: 'label', text: 'Key terms. Press a card to check yourself' }));
      panel.appendChild(el('div', { class: 'terms' }, D.terms.map(function (t) {
        var card = el('button', { type: 'button', class: 'term', 'aria-expanded': 'false' }, [
          el('span', { class: 'term-name', text: t.term }),
          el('span', { class: 'term-body' }, [el('span', { class: 'term-hint', text: 'Say it, then press' }), el('span', { class: 'term-means', text: t.means, 'aria-hidden': 'true' })]),
        ]);
        card.addEventListener('click', function () {
          var open = card.getAttribute('aria-expanded') !== 'true';
          card.setAttribute('aria-expanded', String(open));
          $('.term-means', card).setAttribute('aria-hidden', String(!open));
          $('.term-hint', card).setAttribute('aria-hidden', String(open));
        });
        return card;
      })));
    }
    panel.appendChild(el('div', { class: 'actions' }, [el('button', { type: 'button', class: 'btn primary', text: 'Start the drill', on: { click: function () { select('drill', true); } } })]));
  }

  function timerControl(onChange) {
    var group = el('div', { class: 'seg', role: 'group', 'aria-label': 'Time per question' }, [el('span', { text: 'Timer' })]);
    TIMERS.forEach(function (secs) {
      group.appendChild(el('button', { type: 'button', 'data-timer': '', 'aria-pressed': String(state.secs === secs), text: secs ? secs + ' s' : 'Off', on: { click: function () { if (onChange()) { state.secs = secs; save(); onChange(true); } } } }));
    });
    return group;
  }

  function quiz(panelName, title, sub, items, onAnswer, onDone) {
    var panel = $('[data-panel="' + panelName + '"]');
    var i = 0;
    var results = [];
    var answered = false;
    var timer = 0;
    var bar = null;
    function stop() { clearInterval(timer); timer = 0; }
    function arm() {
      stop();
      if (answered || !state.secs || panel.hidden || i >= items.length || !bar) return;
      var started = Date.now();
      timer = setInterval(function () {
        var rest = Math.max(0, state.secs - (Date.now() - started) / 1000);
        bar.style.transform = 'scaleX(' + (rest / state.secs).toFixed(3) + ')';
        if (rest <= 0 && panel._pick) panel._pick(-1);
      }, 50);
    }
    panel._stop = stop;
    panel._arm = arm;
    function show() {
      stop();
      panel.textContent = '';
      if (i >= items.length) {
        head(panel, title, sub);
        return onDone(panel, results);
      }
      answered = false;
      var item = items[i];
      head(panel, title, sub);
      panel.appendChild(el('div', { class: 'drill-head' }, [el('span', { class: 'count', text: 'Question ' + (i + 1) + ' of ' + items.length }), timerControl(function (apply) { if (answered) return false; if (apply) show(); return true; })]));
      panel.appendChild(el('div', { class: 'track', 'aria-hidden': 'true' }, items.map(function (_, n) {
        return el('i', { class: n < results.length ? (results[n].ok ? 'is-right' : 'is-wrong') : n === i ? 'is-now' : '' });
      })));
      bar = el('i', {});
      if (state.secs) panel.appendChild(el('div', { class: 'clock', 'aria-hidden': 'true' }, [bar]));
      if (item.ask) panel.appendChild(el('p', { class: 'ask', text: item.ask }));
      panel.appendChild(el('p', { class: 'prompt' + (item.ask ? ' is-quote' : ''), text: item.q }));
      if (item.title && item.lesson !== D.lesson) panel.appendChild(el('p', { class: 'from', text: 'From ' + item.title }));
      var buttons = item.options.map(function (o, k) {
        return el('button', { type: 'button', class: 'opt', 'data-k': String(k), on: { click: function () { pick(k); } } }, [el('span', { class: 'key', text: String(k + 1) }), el('span', { text: o })]);
      });
      panel.appendChild(el('div', { class: 'options', role: 'group', 'aria-label': 'Options. Press 1 to ' + buttons.length }, buttons));
      panel._pick = pick;
      arm();
      function pick(k) {
        if (answered) return;
        answered = true;
        stop();
        panel.querySelectorAll('[data-timer]').forEach(function (b) { b.disabled = true; });
        var ok = k === item.correct;
        results.push({ ok: ok, q: item.q });
        buttons.forEach(function (b, n) {
          b.disabled = true;
          if (n === item.correct) { b.classList.add('is-right'); b.firstChild.textContent = '\u2713'; }
          else if (n === k) { b.classList.add('is-wrong'); b.firstChild.textContent = '\u2715'; }
          else b.classList.add('is-dim');
        });
        var track = panel.querySelectorAll('.track i');
        if (track[i]) track[i].className = ok ? 'is-right' : 'is-wrong';
        onAnswer(item, ok);
        drillProgress = panelName === 'drill' ? (i + 1) + ' of ' + items.length + ' answered' : drillProgress;
        meta();
        panel.appendChild(el('div', { class: 'verdict' + (ok ? '' : ' is-wrong') }, [
          el('b', { text: ok ? 'Right' : k < 0 ? 'Time is up' : 'Not this one' }),
          item.explain ? el('p', { text: item.explain }) : null,
        ]));
        var last = i + 1 >= items.length;
        var next = el('button', { type: 'button', class: 'btn primary', on: { click: function () { i++; show(); } } }, [last ? 'See the result' : 'Next question', el('kbd', { text: 'Enter' })]);
        panel.appendChild(el('div', { class: 'actions' }, [next]));
        next.focus({ preventScroll: true });
        say(ok ? 'Right.' : 'Not right. The right option is marked.');
      }
      panel._pick = pick;
    }
    panel._next = function () { if (answered) { i++; show(); } };
    panel._isAnswered = function () { return answered; };
    show();
  }

  function resultList(results) {
    return el('ol', { class: 'results' }, results.map(function (r) { return el('li', { class: r.ok ? '' : 'is-wrong' }, [el('span', { text: r.q })]); }));
  }

  function scheduleMiss(item) {
    update(function (st) {
      st.review = st.review.filter(function (r) { return r.id !== item.id; });
      st.review.push({ id: item.id, lesson: D.lesson, title: D.title, ask: item.ask || '', q: item.q, options: item.options, correct: item.correct, explain: item.explain, box: 0, due: addDays(today(), INTERVALS[0]) });
    });
  }
  function promote(item) {
    update(function (st) {
      var r = st.review.find(function (x) { return x.id === item.id; });
      if (!r) return;
      r.box += 1;
      if (r.box >= INTERVALS.length) st.review = st.review.filter(function (x) { return x !== r; });
      else r.due = addDays(today(), INTERVALS[r.box]);
    });
  }

  function startDrill() {
    drillProgress = '';
    meta();
    var items = D.questions.map(function (q, n) { return { id: itemId(q, n), lesson: D.lesson, ask: q.ask || '', q: q.q, options: q.options, correct: q.correct, explain: q.explain }; });
    var panel = $('[data-panel="drill"]');
    if (!items.length) {
      panel.textContent = '';
      head(panel, 'Drill');
      panel.appendChild(el('div', { class: 'empty' }, [el('b', { text: '0' }), el('p', { text: 'This lesson has no quiz and too few key terms for a drill. Read it on the lesson page.' })]));
      return;
    }
    var sub = D.source === 'terms' ? 'This lesson has no quiz yet, so the drill asks about its key terms.' : 'Questions from the lesson quiz. Press 1 to 4 to answer.';
    quiz('drill', 'Drill', sub, items, function (item, ok) { if (ok) promote(item); else scheduleMiss(item); }, function (panelNode, results) {
      var right = results.filter(function (r) { return r.ok; }).length;
      var missed = results.length - right;
      panelNode.appendChild(el('div', { class: 'score' }, [el('b', { text: right + '/' + results.length }), el('span', { text: 'right' })]));
      panelNode.appendChild(el('p', { class: 'result-text', text: missed ? plural(missed, 'question returns', 'questions return') + ' ' + niceDate(addDays(today(), 1)) + ', then after 3, 7, and 16 days.' : 'Every answer was right, so nothing goes to review.' }));
      panelNode.appendChild(resultList(results));
      panelNode.appendChild(el('div', { class: 'actions' }, [
        el('button', { type: 'button', class: 'btn primary', text: 'Go deeper', on: { click: function () { select('deeper'); } } }),
        el('button', { type: 'button', class: 'btn', text: 'Drill again', on: { click: startDrill } }),
      ]));
      say('Drill finished. ' + right + ' of ' + results.length + ' right.');
    });
  }

  function startReview() {
    var items = due().slice(0, 8);
    var panel = $('[data-panel="review"]');
    if (!items.length) {
      panel.textContent = '';
      head(panel, 'Review', 'Missed questions return on a growing schedule.');
      var next = upcoming();
      panel.appendChild(el('div', { class: 'empty' }, [
        el('b', { text: '0 due' }),
        el('p', { text: next.length ? 'Nothing to review today. Next: ' + plural(next.filter(function (r) { return r.due === next[0].due; }).length, 'question', 'questions') + ' on ' + niceDate(next[0].due) + '.' : 'Nothing to review. Questions you miss in a drill come back here.' }),
        el('div', { class: 'ladder', 'aria-label': 'Review schedule' }, INTERVALS.map(function (d) { return el('span', { text: plural(d, 'day', 'days') }); })),
      ]));
      return;
    }
    quiz('review', 'Review', 'Right answers move to a longer gap. Missed ones return tomorrow.', items, function (item, ok) {
      if (ok) promote(item);
      else update(function (st) {
        var r = st.review.find(function (x) { return x.id === item.id; });
        if (r) { r.box = 0; r.due = addDays(today(), INTERVALS[0]); }
      });
    }, function (panelNode, results) {
      var right = results.filter(function (r) { return r.ok; }).length;
      panelNode.appendChild(el('div', { class: 'score' }, [el('b', { text: right + '/' + results.length }), el('span', { text: 'right' })]));
      panelNode.appendChild(resultList(results));
    });
  }

  function linkRow(href, text, host) {
    return el('li', {}, [el('a', { href: href, target: '_blank', rel: 'noopener' }, [el('span', {}, [text, el('small', { text: host })])])]);
  }
  function hostOf(url) { try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }

  function renderDeeper() {
    var panel = $('[data-panel="deeper"]');
    head(panel, 'Go deeper', 'Read the full lesson, run its code, and follow the sources.');
    panel.appendChild(el('ul', { class: 'links' }, [
      linkRow(D.web, 'Read the full lesson', 'aiengineeringfromscratch.com'),
      linkRow(D.github, 'Open the lesson folder', 'github.com'),
    ]));
    if (D.run) {
      var copy = el('button', { type: 'button', class: 'btn', text: 'Copy' });
      var resetAt = 0;
      copy.addEventListener('click', function () {
        var done = function (text) { copy.textContent = text; clearTimeout(resetAt); resetAt = setTimeout(function () { copy.textContent = 'Copy'; }, 1600); };
        (navigator.clipboard ? navigator.clipboard.writeText(D.run) : Promise.reject()).then(function () { done('Copied'); say('Command copied.'); }, function () { done('Select it'); });
      });
      panel.appendChild(el('p', { class: 'label', text: D.runFrom === 'clone' ? 'Run the code' : 'Run the code from a clone of the course' }));
      panel.appendChild(el('div', { class: 'cmd' }, [el('code', { text: D.run }), copy]));
    }
    if (D.exercise) {
      panel.appendChild(el('p', { class: 'label', text: 'Try one exercise' }));
      panel.appendChild(el('p', { class: 'exercise', text: D.exercise }));
    }
    if (D.reading.length) {
      panel.appendChild(el('p', { class: 'label', text: 'Further reading' }));
      panel.appendChild(el('ul', { class: 'links' }, D.reading.map(function (r) { return linkRow(r.url, r.text, hostOf(r.url)); })));
    }
  }

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && /^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    var panel = $('[data-panel="' + current + '"]');
    if (!panel || !panel._pick) return;
    if (/^[1-9]$/.test(e.key) && !panel._isAnswered()) {
      if ($('[data-k="' + (Number(e.key) - 1) + '"]', panel)) { panel._pick(Number(e.key) - 1); e.preventDefault(); }
    } else if (e.key === 'Enter' && panel._isAnswered() && !(e.target && e.target.tagName === 'BUTTON')) {
      panel._next();
      e.preventDefault();
    }
  });

  var narrow = window.matchMedia ? window.matchMedia('(max-width: 980px)') : null;
  function orient() { $('[role="tablist"]').setAttribute('aria-orientation', narrow && narrow.matches ? 'horizontal' : 'vertical'); }
  if (narrow) {
    if (narrow.addEventListener) narrow.addEventListener('change', orient);
    else if (narrow.addListener) narrow.addListener(orient);
  }
  orient();
  var day = today();
  function dayCheck() {
    if (today() === day) return;
    day = today();
    state = load();
    meta();
    if (current === 'review') startReview();
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) dayCheck(); });
  setInterval(dayCheck, 60000);

  renderBrief();
  startDrill();
  renderDeeper();
  meta();
  var start = new URLSearchParams(location.search).get('step');
  select(['brief', 'drill', 'review', 'deeper'].indexOf(start) >= 0 ? start : 'brief');
})();
</script>
</body>
</html>
