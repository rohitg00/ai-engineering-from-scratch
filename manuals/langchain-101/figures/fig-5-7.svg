  <text x="66" y="245.95" font-size="11.5" text-anchor="middle" font-weight="700">operator.add</text>
  <text x="66" y="263.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">parent update</text>
  <line x1="66" y1="272" x2="66" y2="295" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-7-head-ink)"/>
  <rect x="128" y="240" width="94" height="24" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="132" y="256" font-size="11">outer.prepare</text>
  <text x="231" y="256" font-size="13" font-weight="700" fill="var(--m-ink-soft, #4a4a4a)">+</text>
  <rect x="244" y="240" width="94" height="24" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="248" y="256" font-size="11" fill="var(--m-rose-ink, #b0344d)">outer.prepare</text>
  <rect x="344" y="240" width="81" height="24" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="348" y="256" font-size="11">inner.shout</text>
  <rect x="431" y="240" width="114" height="24" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="435" y="256" font-size="11">inner.ask_ok=yes</text>
  <rect x="16" y="296" width="100" height="42" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="66" y="311.95" font-size="11.5" text-anchor="middle" font-weight="700">finish</text>
  <text x="66" y="329.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">outer</text>
  <rect x="128" y="306" width="94" height="24" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="132" y="322" font-size="11">outer.prepare</text>
  <rect x="228" y="306" width="94" height="24" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="232" y="322" font-size="11" fill="var(--m-rose-ink, #b0344d)">outer.prepare</text>
  <rect x="328" y="306" width="81" height="24" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="332" y="322" font-size="11">inner.shout</text>
  <rect x="415" y="306" width="114" height="24" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="419" y="322" font-size="11">inner.ask_ok=yes</text>
  <rect x="535" y="306" width="88" height="24" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="539" y="322" font-size="11">outer.finish</text>
  <text x="20" y="372" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">The rose entry is the copy that operator.add in the parent added to its own list.</text>
</svg>
