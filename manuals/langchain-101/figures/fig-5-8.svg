<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="fig-5-8-title fig-5-8-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-8-title">The path of a failed node attempt</title>
  <desc id="fig-5-8-desc">A decision figure. A node attempt raises, or runs past its timeout and fails with NodeTimeoutError. The first check is retry_on with attempts left: yes runs the node again, as flaky did for tries 1 to 3 with retry_on ValueError. With no attempt left, or an exception that retry_on refuses, the next check is an error_handler. With a handler, the node __error_handler__flaky runs and its Command goes to report. With no handler, invoke raises, as ValueError upstream failed on try 1 did with the default retry_on.</desc>
  <defs><marker id="fig-5-8-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker><marker id="fig-5-8-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <rect x="170" y="14" width="300" height="44" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="320" y="31.25" font-size="12.5" text-anchor="middle" font-weight="700">a node attempt fails</text>
  <text x="320" y="48.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">an exception, or NodeTimeoutError</text>
  <rect x="500" y="14" width="126" height="44" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="563" y="31.1" font-size="12" text-anchor="middle" font-weight="700">timeout</text>
  <text x="563" y="48.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">slow, 0.05 s</text>
  <line x1="499" y1="36" x2="471" y2="36" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-5-8-head-rose)"/>
  <rect x="170" y="100" width="300" height="44" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="320" y="117.25" font-size="12.5" text-anchor="middle" font-weight="700">retry_on matches, attempts left?</text>
  <text x="320" y="134.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">RetryPolicy of the node</text>
  <line x1="320" y1="58" x2="320" y2="99" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-5-8-head-rose)"/>
  <path d="M170 122 H150 V36 H169" fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#fig-5-8-head-ink)"/>
  <text x="20" y="74" font-size="11.5" font-weight="700">yes: run again</text>
  <text x="20" y="90" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">flaky, tries 1 to 3</text>
  <rect x="170" y="196" width="300" height="44" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="320" y="213.25" font-size="12.5" text-anchor="middle" font-weight="700">error_handler set?</text>
  <text x="320" y="230.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">on the node or by set_node_defaults</text>
  <line x1="320" y1="144" x2="320" y2="195" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-8-head-ink)"/>
  <rect class="m-knock" x="325" y="158.53" width="19.8" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="328" y="169.5" font-size="11.5">no</text>
  <rect class="m-knock" x="325" y="173.92" width="219.84" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="328" y="184.5" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ValueError with the default retry_on</text>
  <rect x="20" y="296" width="280" height="44" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="160" y="313.25" font-size="12.5" text-anchor="middle" font-weight="700">__error_handler__flaky</text>
  <text x="160" y="330.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Command(goto=&#39;report&#39;)</text>
  <path d="M260 240 V268 H160 V295" fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#fig-5-8-head-ink)"/>
  <text x="150" y="262" font-size="11.5" text-anchor="end" font-weight="700">yes</text>
  <rect x="340" y="296" width="280" height="44" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="480" y="313.25" font-size="12.5" text-anchor="middle" font-weight="700">invoke raises</text>
  <text x="480" y="330.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ValueError: upstream failed on try 1</text>
  <path d="M380 240 V268 H480 V295" fill="none" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-5-8-head-rose)"/>
  <text x="490" y="262" font-size="11.5" font-weight="700">no</text>
  <rect x="20" y="364" width="280" height="44" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="160" y="381.25" font-size="12.5" text-anchor="middle" font-weight="700">report</text>
  <text x="160" y="398.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">status: recovered from flaky</text>
  <line x1="160" y1="340" x2="160" y2="363" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-8-head-ink)"/>
  <text x="340" y="392" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">The run goes on only on the left path.</text>
  <text x="340" y="408" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">The right path ends the run.</text>
</svg>
