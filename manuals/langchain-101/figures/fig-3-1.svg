<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="fig-3-1-title fig-3-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-1-title">What each argument of create_agent builds</title>
  <desc id="fig-3-1-desc">Six rows map an argument of create_agent to the part of the compiled graph it builds. model builds the model node. tools builds the tools node, with one Send for each tool call. system_prompt and response_format change each model call and add no node. middleware builds hook nodes such as A.before_model, with wrap hooks inside the model and tools nodes. checkpointer saves one checkpoint after each step. A band at the bottom shows the config create_agent sets on every agent: recursion_limit 9999, stream_mode updates, and the ls_integration metadata.</desc>
  <defs><marker id="fig-3-1-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-3-1-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-teal-ink, #18696a)"/></marker></defs>
  <text x="20" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">ARGUMENT OF CREATE_AGENT</text>
  <text x="360" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">WHAT THE COMPILED GRAPH GETS</text>
  <rect x="20" y="34" width="230" height="50" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="32" y="54.25" font-size="12.5" font-weight="700">model</text>
  <text x="32" y="71.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">a string or a chat model</text>
  <rect x="360" y="34" width="260" height="50" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="372" y="54.25" font-size="12.5" font-weight="700">model node</text>
  <text x="372" y="71.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">calls the chat model</text>
  <line x1="250" y1="59" x2="359" y2="59" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-1-head-ink)"/>
  <rect x="20" y="98" width="230" height="50" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="32" y="118.25" font-size="12.5" font-weight="700">tools</text>
  <text x="32" y="135.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">functions and BaseTool</text>
  <rect x="360" y="98" width="260" height="50" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="372" y="118.25" font-size="12.5" font-weight="700">tools node</text>
  <text x="372" y="135.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">one Send for each tool call</text>
  <line x1="250" y1="123" x2="359" y2="123" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-1-head-ink)"/>
  <rect x="20" y="162" width="230" height="50" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="32" y="182.25" font-size="12.5" font-weight="700">system_prompt</text>
  <text x="32" y="199.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">a string or SystemMessage</text>
  <rect x="360" y="162" width="260" height="50" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="372" y="182.25" font-size="12.5" font-weight="700">each model call</text>
  <text x="372" y="199.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">first message, not in state</text>
  <line x1="250" y1="187" x2="359" y2="187" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-1-head-ink)"/>
  <rect x="20" y="226" width="230" height="50" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="32" y="246.25" font-size="12.5" font-weight="700">middleware</text>
  <text x="32" y="263.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">[A, B, C]</text>
  <rect x="360" y="226" width="260" height="50" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="372" y="246.25" font-size="12.5" font-weight="700">A.before_model and more</text>
  <text x="372" y="263.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">a node per hook, wraps run inside</text>
  <line x1="250" y1="251" x2="359" y2="251" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-1-head-ink)"/>
  <rect x="20" y="290" width="230" height="50" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="32" y="310.25" font-size="12.5" font-weight="700">response_format</text>
  <text x="32" y="327.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">a schema or a strategy</text>
  <rect x="360" y="290" width="260" height="50" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="372" y="310.25" font-size="12.5" font-weight="700">each model call</text>
  <text x="372" y="327.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">a structured tool or a format</text>
  <line x1="250" y1="315" x2="359" y2="315" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-1-head-ink)"/>
  <rect x="20" y="354" width="230" height="50" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="32" y="374.25" font-size="12.5" font-weight="700">checkpointer</text>
  <text x="32" y="391.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">InMemorySaver</text>
  <rect x="360" y="354" width="260" height="50" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="372" y="374.25" font-size="12.5" font-weight="700">checkpoints</text>
  <text x="372" y="391.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">one after each step</text>
  <line x1="250" y1="379" x2="359" y2="379" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.2" marker-end="url(#fig-3-1-head-teal)"/>
  <rect x="20" y="432" width="600" height="50" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="32" y="452.25" font-size="12.5" font-weight="700">with_config on every agent</text>
  <text x="32" y="469.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">recursion_limit 9999, stream_mode updates, ls_integration langchain_create_agent</text>
</svg>
