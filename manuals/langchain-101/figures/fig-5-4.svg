<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-labelledby="fig-5-4-title fig-5-4-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-4-title">One interrupt and one resume</title>
  <desc id="fig-5-4-desc">Five lifelines: your code, the graph loop, the write node, the review node, and the checkpointer. The first invoke runs write, then review up to its interrupt, saves the pause with next review, and returns the interrupt Approve this draft. The resume with Command resume yes runs review again from its first line, so the line before the interrupt runs a second time, then the line after it, and the verdict approved is saved. write does not run again.</desc>
