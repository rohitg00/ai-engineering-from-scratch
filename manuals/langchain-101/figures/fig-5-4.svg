<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-labelledby="fig-5-4-title fig-5-4-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-4-title">One interrupt and one resume</title>
  <desc id="fig-5-4-desc">Five lifelines: your code, the graph loop, the write node, the review node, and the checkpointer. A sixth column is the log of node bodies that ran, in order, from the capture. The first invoke runs write, then review up to its interrupt, saves the pause with next review, and returns the interrupt &quot;Approve this draft?&quot;. The resume with Command resume yes runs review again from its first line. The log shows &quot;review before interrupt&quot; 2 times, then &quot;review after interrupt: yes&quot;, and the verdict approved is saved. write does not run again.</desc>
