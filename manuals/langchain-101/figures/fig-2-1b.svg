<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="fig-2-1b-title fig-2-1b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-1b-title">The order tasks finish against the order their writes apply</title>
  <desc id="fig-2-1b-desc">Seven supersteps with two parallel tasks each, recorded with Qwen3 4B on the x86 server guest. On the left, the tasks in the order they returned, with the seconds of their model call. On the right, the order in which apply_writes applied their writes. In six runs, nodes a and b each ask the model for an answer and append to one list with operator.add. b returned first in 5 of 6 runs, and the list was a, b in 6 of 6. In the last superstep, node b was started by Command(goto) as a PULL task and node c by a Send as a PUSH task. c finished first, and b still applied first, because PULL paths sort before PUSH paths.</desc>
