<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 418" role="img" aria-labelledby="fig-8-3-title fig-8-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-8-3-title">Seven processes of the assistant, and what each one left behind</title>
  <desc id="fig-8-3-desc">A table with one row for each of the seven processes of the assistant run on the Mac, and one column for each count read when the process ended. Process 3 approved the email, sent it, and was killed with exit code 137. Process 4 resumed and found the same approval waiting again. Process 5 approved again, send_email ran a second time, and the key check skipped the send. At the end send_email had run 2 times and the outbox held 1 email. Process 7 on a new thread still found 2 memories in the store.</desc>
