<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" role="img" aria-labelledby="fig-6-2b-title fig-6-2b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-2b-title">The joke graph as LangGraph draws it</title>
  <desc id="fig-6-2b-desc">The compiled joke graph drawn from its draw_mermaid output, top to bottom. It has 7 nodes and 7 edges. The 3 conditional edges are pick to publish, pick to retry, plan to write_joke. The edge from plan comes from add_conditional_edges with Send. The two edges from pick come from the Command return type of pick, with no add_edge call.</desc>
  <defs><marker id="fig-6-2b-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-6-2b-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker></defs>
  <text x="20" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">GET_GRAPH().DRAW_MERMAID()</text>
  <text x="620" y="20" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">4 plain edges, 3 conditional</text>
  <line x1="320" y1="68" x2="320" y2="85" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-2b-head-ink)"/>
  <line x1="312" y1="194" x2="265" y2="211" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-2b-head-amber)"/>
  <line x1="328" y1="194" x2="375" y2="211" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-2b-head-amber)"/>
  <line x1="320" y1="110" x2="320" y2="127" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-2b-head-amber)"/>
  <line x1="320" y1="152" x2="320" y2="169" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-2b-head-ink)"/>
  <line x1="265" y1="236" x2="312" y2="253" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-2b-head-ink)"/>
  <line x1="375" y1="236" x2="328" y2="253" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-2b-head-ink)"/>
  <rect x="274" y="44" width="92" height="24" rx="12" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #6f6f6a)"/>
  <text x="320" y="60" font-size="11.5" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">__start__</text>
  <rect x="278" y="86" width="84" height="24" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="320" y="101.45" font-size="11.5" text-anchor="middle" font-weight="700">plan</text>
  <rect x="274" y="128" width="92" height="24" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="320" y="143.45" font-size="11.5" text-anchor="middle" font-weight="700">write_joke</text>
  <rect x="278" y="170" width="84" height="24" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="320" y="185.45" font-size="11.5" text-anchor="middle" font-weight="700">pick</text>
  <rect x="223" y="212" width="84" height="24" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="265" y="227.45" font-size="11.5" text-anchor="middle" font-weight="700">publish</text>
  <rect x="333" y="212" width="84" height="24" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="375" y="227.45" font-size="11.5" text-anchor="middle" font-weight="700">retry</text>
  <rect x="281" y="254" width="78" height="24" rx="12" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #6f6f6a)"/>
  <text x="320" y="270" font-size="11.5" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">__end__</text>
  <text x="334" y="123" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Send: one write_joke task for each subject</text>
  <text x="378" y="186" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">pick returns a Command</text>
  <line x1="20" y1="304" x2="54" y2="304" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-2b-head-ink)"/>
  <text x="62" y="308" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">plain edge</text>
  <line x1="145.4" y1="304" x2="179.4" y2="304" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-2b-head-amber)"/>
  <text x="187.4" y="308" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">conditional edge, chosen at run time</text>
</svg>
