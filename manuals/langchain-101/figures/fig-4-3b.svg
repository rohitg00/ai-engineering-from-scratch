<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="fig-4-3b-title fig-4-3b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-3b-title">The five kill points in the step of the effect node</title>
  <desc id="fig-4-3b-desc">Four lifelines: the graph loop, the nodes, the sink file outside the graph, and the checkpointer. Six rows: the loop runs the effect node, the node appends a line to the sink file with fsync, the node returns its writes, the loop saves them with put_writes, the loop saves the checkpoint of the step with put, and the loop runs the finish node. The kill points sit after rows 1, 2, 3, 4, and 6.</desc>
