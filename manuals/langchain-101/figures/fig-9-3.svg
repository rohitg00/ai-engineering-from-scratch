  <title id="fig-9-3-title">A worker killed after the refund row, and the restart</title>
  <desc id="fig-9-3-desc">Top: one trial on the Mac with Qwen3 4B. The approve was sent at 0 s, the refund row was in Postgres at 0.2 s, and SIGKILL came at 0.3 s. A new process read the thread at 3.1 s and found next [&quot;tools&quot;] with the approval asked again. Bottom: map resume value, 10 of 10 trials with one refund row, approval asked again in 10. plain resume value, 10 of 10 trials with one refund row, approval asked again in 10.</desc>
