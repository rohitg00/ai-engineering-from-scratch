<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="fig-3-3-title fig-3-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-3-title">The order of hooks from three middlewares</title>
  <desc id="fig-3-3-desc">Two panels for middleware=[A, B, C]. The left panel is the chain of graph nodes for one model call: A.before_model, B.before_model, C.before_model, model, C.after_model, B.after_model, A.after_model, then tools or the end. The right panel is the model node with three nested wrap_model_call layers: A outside, then B, then C, then the model call. The request enters A, B, C in that order and the response leaves C, B, A.</desc>
  <defs><marker id="fig-3-3-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <text x="20" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">GRAPH NODES, ONE MODEL CALL</text>
  <rect x="40" y="34" width="200" height="34" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="140" y="54.6" font-size="12" text-anchor="middle" font-weight="700">A.before_model</text>
  <line x1="140" y1="68" x2="140" y2="87" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-3-head-ink)"/>
  <rect x="40" y="88" width="200" height="34" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="140" y="108.6" font-size="12" text-anchor="middle" font-weight="700">B.before_model</text>
  <line x1="140" y1="122" x2="140" y2="141" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-3-head-ink)"/>
  <rect x="40" y="142" width="200" height="34" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="140" y="162.6" font-size="12" text-anchor="middle" font-weight="700">C.before_model</text>
  <line x1="140" y1="176" x2="140" y2="195" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-3-head-ink)"/>
  <rect x="40" y="196" width="200" height="34" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="140" y="216.6" font-size="12" text-anchor="middle" font-weight="700">model</text>
  <line x1="140" y1="230" x2="140" y2="249" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-3-head-ink)"/>
  <rect x="40" y="250" width="200" height="34" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="140" y="270.6" font-size="12" text-anchor="middle" font-weight="700">C.after_model</text>
  <line x1="140" y1="284" x2="140" y2="303" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-3-head-ink)"/>
  <rect x="40" y="304" width="200" height="34" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="140" y="324.6" font-size="12" text-anchor="middle" font-weight="700">B.after_model</text>
  <line x1="140" y1="338" x2="140" y2="357" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-3-head-ink)"/>
  <rect x="40" y="358" width="200" height="34" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="140" y="378.6" font-size="12" text-anchor="middle" font-weight="700">A.after_model</text>
  <line x1="140" y1="392" x2="140" y2="418" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-3-head-ink)"/>
  <text x="140" y="434" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">tools, the end, or a jump</text>
  <text x="256" y="110" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">list order</text>
  <text x="256" y="326" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">reverse order</text>
  <text x="340" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">INSIDE THE MODEL NODE</text>
  <rect x="340" y="34" width="280" height="300" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="350" y="52" font-size="11.5" font-weight="700" fill="var(--m-blue-ink, #2f5d9a)">A.wrap_model_call</text>
  <rect x="360" y="70" width="240" height="228" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="370" y="88" font-size="11.5" font-weight="700" fill="var(--m-blue-ink, #2f5d9a)">B.wrap_model_call</text>
  <rect x="380" y="106" width="200" height="156" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="390" y="124" font-size="11.5" font-weight="700" fill="var(--m-blue-ink, #2f5d9a)">C.wrap_model_call</text>
  <rect x="410" y="150" width="140" height="70" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="480" y="180.25" font-size="12.5" text-anchor="middle" font-weight="700">model called</text>
  <text x="480" y="197.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the chat model</text>
  <text x="350" y="368" font-size="11.5" fill="var(--m-ink, #1a1a1a)">enters A, B, C, exits C, B, A</text>
  <text x="350" y="388" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">A sees the request first</text>
  <text x="350" y="406" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">and the response last.</text>
</svg>
