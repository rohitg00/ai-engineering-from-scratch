<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" role="img" aria-labelledby="fig-3-3-title fig-3-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-3-title">The order of hooks from three middlewares</title>
  <desc id="fig-3-3-desc">A trace of the 38 hook calls that middleware=[A, B, C] logged in one tool round trip, read from left to right. Three lanes, A, B and C, and a fourth lane for the model and the tool. Each dot is one node hook. Each bar is one wrap hook, from its enter to its exit. 9 numbered phases run along the top: before_agent A B C, before_model A B C, wrap_model_call entered A B C with the model inside and left C B A, after_model C B A, wrap_tool_call entered A B C around the add tool and left C B A, the same model pass again, and after_agent C B A. The bars of A are the longest, so A is the outer layer. Under the trace, the graph edges read from the compiled agent: C.before_model to model to C.after_model to B.after_model to A.after_model.</desc>
