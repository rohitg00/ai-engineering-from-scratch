<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 468" role="img" aria-labelledby="fig-3-6-title fig-3-6-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-6-title">Four PII strategies on one input</title>
  <desc id="fig-3-6-desc">One human message holds an email address, a card number, an IP address, and a URL, each underlined in the hue of the row that matched it. Five rows each ran one PIIMiddleware. email with redact replaced &quot;ada@example.com&quot; with &quot;[REDACTED_EMAIL]&quot;. credit_card with mask replaced &quot;4111 1111 1111&quot; with &quot;**** **** ****&quot;. ip with hash replaced &quot;192.168.1.20&quot; with &quot;&lt;ip_hash:55235459&gt;&quot;. url with redact replaced &quot;https://example.com/x&quot; with &quot;[REDACTED_URL]&quot;. email with block raised PIIDetectionError, &quot;Detected 1 instance(s) of email in text content&quot;, and the model got 0 calls. Each other run made 1 model call, and only the matched span of the newest human message changed.</desc>
  <defs><marker id="fig-3-6-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-3-6-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker></defs>
