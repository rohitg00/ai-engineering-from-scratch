  <text x="122" y="46" font-size="11" text-anchor="middle" font-weight="700" fill="var(--m-rose-ink, #b0344d)">1</text>
  <line x1="226.4" y1="65" x2="327.2" y2="65" stroke="var(--m-rose-ink, #b0344d)" stroke-width="2"/>
  <text x="276.8" y="46" font-size="11" text-anchor="middle" font-weight="700" fill="var(--m-rose-ink, #b0344d)">2</text>
  <text x="32" y="60" font-size="12">Mail ada@example.com, card 4111 1111 1111 1111,</text>
  <line x1="68" y1="97" x2="154.4" y2="97" stroke="var(--m-rose-ink, #b0344d)" stroke-width="2"/>
  <text x="111.2" y="78" font-size="11" text-anchor="middle" font-weight="700" fill="var(--m-rose-ink, #b0344d)">3</text>
  <line x1="197.6" y1="97" x2="348.8" y2="97" stroke="var(--m-rose-ink, #b0344d)" stroke-width="2"/>
  <text x="273.2" y="78" font-size="11" text-anchor="middle" font-weight="700" fill="var(--m-rose-ink, #b0344d)">4</text>
  <text x="32" y="92" font-size="12">from 192.168.1.20, see https://example.com/x</text>
  <text x="32" y="128" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">PIIMIDDLEWARE</text>
  <text x="250" y="128" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">THE MATCHED SPAN BECOMES</text>
