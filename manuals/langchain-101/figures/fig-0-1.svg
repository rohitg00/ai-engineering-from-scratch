<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="fig-0-1-title fig-0-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-0-1-title">Reading a sequence figure in this manual</title>
  <desc id="fig-0-1-desc">Six lifelines: your code, the agent graph from create_agent, the chat model, a tool, the checkpointer, and LangSmith outside the process. Eight numbered rows use the eight arrow styles: invoke with What is 2 + 3? as a solid ink call, the system prompt You add numbers. as a solid plum model call, the tool call add with a=2 and b=3 as a dashed ink reply, checkpoint step 1 as a solid teal durable write, next tools as a dashed amber state change, the custom stream value lookup A-17 as a dotted indigo stream, seven POST /runs requests as a dashed olive outside effect, and RuntimeError disk on fire as a dashed rose failure.</desc>
