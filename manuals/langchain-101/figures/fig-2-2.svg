<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="fig-2-2-title fig-2-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-2-title">How init_chat_model resolves a model string</title>
  <desc id="fig-2-2-desc">A decision figure with three tests in order. First, is the part before the first colon a known provider? openai:gpt-4.1 and ollama:qwen3:4b say yes and build ChatOpenAI and ChatOllama. Second, does the name start with a known prefix such as gpt-, o3, or claude? gpt-4.1-mini and claude-haiku-4-5 say yes and build ChatOpenAI and ChatAnthropic. Third, any other string such as qwen3:4b raises ValueError: Unable to infer model provider, before any request.</desc>
  <defs><marker id="fig-2-2-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-2-2-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker></defs>
  <rect x="20" y="20" width="260" height="56" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="32" y="43.25" font-size="12.5" font-weight="700">known provider prefix?</text>
  <text x="32" y="60.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the part before the first colon</text>
  <rect x="360" y="20" width="260" height="56" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="372" y="43.25" font-size="12.5" font-weight="700">ollama:qwen3:4b</text>
  <text x="372" y="60.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ChatOllama, model qwen3:4b</text>
  <rect x="20" y="120" width="260" height="56" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="32" y="143.25" font-size="12.5" font-weight="700">known name start?</text>
  <text x="32" y="160.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">gpt-, o1, o3, claude, gemini</text>
  <rect x="360" y="120" width="260" height="56" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="372" y="143.25" font-size="12.5" font-weight="700">claude-haiku-4-5</text>
  <text x="372" y="160.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ChatAnthropic</text>
  <rect x="360" y="220" width="260" height="56" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="372" y="243.25" font-size="12.5" font-weight="700">qwen3:4b</text>
  <text x="372" y="260.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ValueError: Unable to infer</text>
  <line x1="280" y1="48" x2="359" y2="48" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-2-2-head-ink)"/>
  <rect class="m-knock" x="306.15" y="31.03" width="26.7" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="319.5" y="42" font-size="11.5" text-anchor="middle">yes</text>
  <line x1="280" y1="148" x2="359" y2="148" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-2-2-head-ink)"/>
  <rect class="m-knock" x="306.15" y="131.03" width="26.7" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="319.5" y="142" font-size="11.5" text-anchor="middle">yes</text>
  <line x1="150" y1="76" x2="150" y2="119" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-2-2-head-ink)"/>
  <rect class="m-knock" x="155" y="86.53" width="19.8" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="158" y="97.5" font-size="11.5">no</text>
  <path d="M150 176 L150 248 L359 248" fill="none" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-2-2-head-rose)"/>
  <text x="158" y="196" font-size="11.5">no</text>
  <text x="20" y="300" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">qwen3 is not a known provider, so only the first colon of ollama:qwen3:4b splits.</text>
  <text x="20" y="320" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">The error comes before any request reaches a provider.</text>
</svg>
