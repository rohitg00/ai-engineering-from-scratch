<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 342" role="img" aria-labelledby="fig-6-7b-title fig-6-7b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-7b-title">One parent graph, drawn with and without xray</title>
  <desc id="fig-6-7b-desc">The parent graph of the subgraph example, drawn twice from draw_mermaid output. get_graph() has 5 nodes and shows the subgraph as one node named inner. get_graph(xray=True) has 6 nodes. It draws the subgraph as a box named inner around its nodes inner:shout and inner:ask_ok, and the parent edges go to inner:shout and leave from inner:ask_ok.</desc>
  <defs><marker id="fig-6-7b-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-6-7b-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker></defs>
  <text x="20" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">GET_GRAPH()</text>
  <text x="300" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">GET_GRAPH(XRAY=TRUE)</text>
  <text x="20" y="40" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">5 nodes, inner is one node</text>
  <text x="300" y="40" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">6 nodes, the subgraph opened</text>
