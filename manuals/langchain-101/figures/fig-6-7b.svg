  <text x="62" y="328" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">plain edge</text>
  <line x1="145.4" y1="324" x2="179.4" y2="324" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-7b-head-amber)"/>
  <text x="187.4" y="328" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">conditional edge, chosen at run time</text>
