  <rect x="118" y="106" width="84" height="24" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="160" y="121.45" font-size="11.5" text-anchor="middle" font-weight="700">prepare</text>
  <rect x="118" y="148" width="84" height="24" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
