<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 409" role="img" aria-labelledby="fig-9-1b-title fig-9-1b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-9-1b-title">The graph of the service agent</title>
  <desc id="fig-9-1b-desc">The compiled graph of build_agent in the reference service, drawn from its draw_mermaid output. It has 8 nodes, 4 of them hook nodes: SummarizationMiddleware.before_model, ModelCallLimitMiddleware.before_model, ModelCallLimitMiddleware.after_model, HumanInTheLoopMiddleware.after_model. The other middleware have only wrap hooks and add no node. ModelCallLimitMiddleware can end the run before model or after it. The tools node holds 6 tools: read_order, refund_order, search_faq, create_ticket, save_note, recall_notes.</desc>
  <defs><marker id="fig-9-1b-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-9-1b-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker></defs>
  <text x="20" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">GET_GRAPH() OF BUILD_AGENT</text>
  <text x="620" y="20" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">8 nodes, 4 of them hooks</text>
  <line x1="320" y1="236" x2="320" y2="253" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-9-1b-head-ink)"/>
  <line x1="328" y1="278" x2="413" y2="317.5" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-9-1b-head-amber)"/>
  <line x1="312" y1="278" x2="227" y2="295" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-9-1b-head-amber)"/>
  <line x1="320" y1="152" x2="320" y2="169" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-9-1b-head-amber)"/>
  <line x1="320" y1="110" x2="320" y2="127" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-9-1b-head-ink)"/>
  <line x1="320" y1="68" x2="320" y2="85" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-9-1b-head-ink)"/>
  <line x1="320" y1="194" x2="320" y2="211" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-9-1b-head-ink)"/>
  <path d="M456 266 H475 V98 H457" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-9-1b-head-amber)"/>
  <path d="M459 140 H487 V330.5 H453" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-9-1b-head-amber)"/>
  <path d="M106 330.5 H90 V98 H183" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-9-1b-head-amber)"/>
  <rect x="274" y="44" width="92" height="24" rx="12" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #6f6f6a)"/>
  <text x="320" y="60" font-size="11.5" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">__start__</text>
  <rect x="278" y="170" width="84" height="24" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="320" y="185.45" font-size="11.5" text-anchor="middle" font-weight="700">model</text>
  <rect x="106" y="296" width="242" height="69" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="227" y="310.45" font-size="11.5" text-anchor="middle" font-weight="700">tools</text>
  <text x="227" y="327.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">__tools = read_order, refund_order,</text>
  <text x="227" y="342.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">search_faq, create_ticket, save_note,</text>
  <text x="227" y="357.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">recall_notes</text>
  <rect x="184" y="86" width="272" height="24" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="320" y="101.45" font-size="11.5" text-anchor="middle" font-weight="400">SummarizationMiddleware.before_model</text>
  <rect x="181" y="128" width="278" height="24" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="320" y="143.45" font-size="11.5" text-anchor="middle" font-weight="400">ModelCallLimitMiddleware.before_model</text>
  <rect x="184" y="254" width="272" height="24" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="320" y="269.45" font-size="11.5" text-anchor="middle" font-weight="400">ModelCallLimitMiddleware.after_model</text>
  <rect x="184" y="212" width="272" height="24" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="320" y="227.45" font-size="11.5" text-anchor="middle" font-weight="400">HumanInTheLoopMiddleware.after_model</text>
  <rect x="374" y="318.5" width="78" height="24" rx="12" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #6f6f6a)"/>
  <text x="413" y="334.5" font-size="11.5" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">__end__</text>
  <line x1="20" y1="391" x2="54" y2="391" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-9-1b-head-ink)"/>
  <text x="62" y="395" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">plain edge</text>
  <line x1="145.4" y1="391" x2="179.4" y2="391" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-9-1b-head-amber)"/>
  <text x="187.4" y="395" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">conditional edge, chosen at run time</text>
</svg>
