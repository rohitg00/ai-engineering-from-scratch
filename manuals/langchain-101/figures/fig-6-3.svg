  <title id="fig-6-3-title">Prompt tokens of each model call, three harnesses</title>
  <desc id="fig-6-3-desc">A dot chart of the prompt tokens of each model call on the Mac with Qwen3 8B, three runs of each task and harness. For the trivial task the plain loop and create_agent sent 28 tokens and Deep Agents sent 2279. For the tools task the calls were 205 and 275 against 2374 and 2444. For the files task they were 214, 262, 297 against 2293, 2337, 2383. create_agent sent the same count as the plain loop on every call.</desc>
