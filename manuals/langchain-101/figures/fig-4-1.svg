<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" role="img" aria-labelledby="fig-4-1-title fig-4-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-1-title">The chunks of one agent run in each stream mode</title>
  <desc id="fig-4-1-desc">Eight rows, one for each stream of the same agent run, over four columns: the input, the model node at step 1, the tools node at step 2, and the model node at step 3. Each mark is one chunk read from the capture, coloured by what it carries: indigo a whole state, plum model output, green tool output, amber a task that starts or ends. updates has 3, values 4, messages 9, tasks 6, debug 6, custom 0, the tools mode 4 on the slow_sum agent, and stream_events v3 has 21 events. The v3 stream closes each step with a values event.</desc>
