<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-labelledby="fig-5-2-title fig-5-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-2-title">The joke graph and one run</title>
  <desc id="fig-5-2-desc">A flow from __start__ to plan, then three Send arrows from plan to three write_joke tasks for cats, dogs, and owls in one step, then plain edges to pick. pick returns a Command with best set to a joke about cats and goto publish, so publish runs and then __end__. The retry node, the other target of pick, did not run.</desc>
