<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="fig-5-2-title fig-5-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-2-title">The joke graph and one run</title>
  <desc id="fig-5-2-desc">The top is the graph from the capture: __start__ to plan, then three Send arrows from plan to three write_joke tasks for cats, dogs, owls in one step, then plain edges to pick. pick returns a Command with best set to &quot;a joke about cats&quot; and goto publish, so publish runs and then __end__. The retry node, the other target of pick, did not run. The bottom is a table of what each node wrote to the state in each of the 4 steps, read from the updates stream: plan wrote subjects, each write_joke wrote one joke, operator.add joined the three into a list of 3, and pick wrote best. The log key ends with 6 entries.</desc>
