<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" role="img" aria-labelledby="fig-4-5-title fig-4-5-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-5-title">Turn time over 2,000 turns, with and without summarization</title>
  <desc id="fig-4-5-desc">A dot chart of the median turn time of each block of 100 turns, on a log scale from 10 to 1,000 ms, over 2,000 turns on the x86 server guest. Without summarization the median grows from 36.917 ms to 662.9 ms. With a trigger of 60 messages it stays between 35.5 and 41.4 ms, with 20 messages near 32 ms, and with 6,000 tokens it falls from 63.246 ms to about 43 ms. A shaded band behind each line spans the 10th to the 90th percentile of the 100 turns in each block, read from the per-turn log. After turn 100, 90 percent of the turns of every variant with a trigger took at most 83 ms.</desc>
