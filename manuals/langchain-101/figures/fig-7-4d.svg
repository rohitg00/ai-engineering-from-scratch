  <title id="fig-7-4d-title">Dollars per task, plain loop and deep agent, with and without prompt caching</title>
  <desc id="fig-7-4d-desc">Dot strips of the dollars of each task on a log scale, for Claude Haiku 5.5 on 99 tasks and Claude Sonnet 5.5 on 30. List price is the input and output tokens at the base price. Billed is the cost with the prompt cache reads that the API reported. Over all tasks the deep agent cost 3.10 times the plain loop at list price and 1.16 times billed on Haiku, and 3.14 and 1.24 times on Sonnet.</desc>
