  <rect class="m-knock" x="398.55" y="255.03" width="150.9" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="474" y="266" font-size="11.5" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">POST /runs 7, PATCH 7</text>
