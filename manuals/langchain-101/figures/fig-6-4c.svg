<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="fig-6-4c-title fig-6-4c-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-4c-title">What tracing_context(enabled=&quot;local&quot;) keeps and sends</title>
  <desc id="fig-6-4c-desc">Four lifelines: your code, the traceable wrapper of langsmith, the LangChain callback manager, and the LangSmith client. A traceable function inside tracing_context with enabled set to local builds a run tree and gives it to on_end, and the client gets no request. An agent.invoke inside the same context turns tracing on, because the callback manager treats the string local as true and adds a LangChainTracer, which sends POST /runs 7 times and PATCH 7 times. The same invoke inside tracing_context with enabled set to False and inside collect_runs keeps four top runs in memory and sends nothing.</desc>
