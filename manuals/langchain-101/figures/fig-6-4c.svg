  <rect x="174" y="10" width="116" height="30" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="232" y="28.6" font-size="12" text-anchor="middle" font-weight="700">traceable</text>
  <line x1="232" y1="40" x2="232" y2="408" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="334" y="10" width="116" height="30" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="392" y="28.6" font-size="12" text-anchor="middle" font-weight="700">callbacks</text>
  <line x1="392" y1="40" x2="392" y2="408" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="498" y="10" width="116" height="30" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
