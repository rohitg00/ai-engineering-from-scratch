<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="fig-2-6b-title fig-2-6b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-6b-title">Framework time per superstep, by saver and durability mode</title>
  <desc id="fig-2-6b-desc">Seven horizontal bars, one per saver and durability mode, for one create_agent run of 10 tool round trips with Qwen3 4B on the x86 server guest, 22 supersteps, 30 runs per row, medians. The guest was loaded, so read the share and the order of the bars, not the milliseconds. The framework time is the wall time minus the time inside the Ollama call and the tool function. Each bar gives milliseconds per superstep: no saver async 1.70, InMemorySaver async 2.33, InMemorySaver sync 2.51, InMemorySaver exit 1.79, SqliteSaver async 2.89, SqliteSaver sync 5.31, SqliteSaver exit 2.24. The indigo part is the loop functions: planning, applying, building the checkpoint, and recording task writes. The grey part is the rest: node wrappers and the saver work that the loop waits for. The right column is the framework share of the wall time, 0.144 to 0.449 percent, in runs of about 25.9 s that the model filled.</desc>
