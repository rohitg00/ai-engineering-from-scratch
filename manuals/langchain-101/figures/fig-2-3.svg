<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="fig-2-3-title fig-2-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-3-title">How long each finished task waits for its put_writes, in one sync run</title>
  <desc id="fig-2-3-desc">Four panels, one per superstep of one create_agent run with Qwen3 4B, durability sync, on SqliteSaver on the x86 server guest. Each panel spans 7 ms after the first task of the step returned. The upper lane is the loop: a dot for each task that returned and an amber line where the next superstep starts. The lower lane is the background saver: filled blocks are put calls that store a checkpoint, and outlined blocks are put_writes calls that store the writes of one task. A rose band runs from each task&#39;s return to the end of its put_writes. Those spans were 3.0 to 4.4 ms, in one run on a loaded guest. In step 3, the checkpoint put ended before the put_writes of the task 7f67758b. Between the panels the model ran for seconds.</desc>
