<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="fig-2-3-title fig-2-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-3-title">The fields of an AIMessage and its ToolMessage</title>
  <desc id="fig-2-3-desc">Two cards side by side. The left card is the AIMessage that asks for a tool: type AIMessage, content an empty string, id lc_run--&lt;uuid&gt;-0, and tool_calls with name add, args a 2 and b 3, and id call_1. The right card is the ToolMessage that answers it: content 5, name add, tool_call_id call_1, and status success. A line joins the id call_1 in the tool call to tool_call_id call_1 in the ToolMessage.</desc>
  <defs><marker id="fig-2-3-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <rect x="20" y="20" width="280" height="230" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="34" y="44" font-size="13" font-weight="700" fill="var(--m-plum-ink, #8a3d72)">AIMessage</text>
  <text x="34" y="76" font-size="11.5" fill="var(--m-ink-soft, #4a4a4a)">content</text>
  <text x="150" y="76" font-size="11.5">&quot;&quot;</text>
  <text x="34" y="102" font-size="11.5" fill="var(--m-ink-soft, #4a4a4a)">id</text>
  <text x="150" y="102" font-size="11.5">lc_run--&lt;uuid&gt;-0</text>
  <text x="34" y="128" font-size="11.5" fill="var(--m-ink-soft, #4a4a4a)">tool_calls</text>
  <text x="150" y="128" font-size="11.5"></text>
  <text x="34" y="154" font-size="11.5" fill="var(--m-ink-soft, #4a4a4a)">  .name</text>
  <text x="150" y="154" font-size="11.5">add</text>
  <text x="34" y="180" font-size="11.5" fill="var(--m-ink-soft, #4a4a4a)">  .args</text>
  <text x="150" y="180" font-size="11.5">{a: 2, b: 3}</text>
  <text x="34" y="206" font-size="11.5" fill="var(--m-ink-soft, #4a4a4a)">  .id</text>
  <text x="150" y="206" font-size="11.5" font-weight="700" fill="var(--m-plum-ink, #8a3d72)">call_1</text>
  <text x="34" y="232" font-size="11.5" fill="var(--m-ink-soft, #4a4a4a)">usage</text>
  <text x="150" y="232" font-size="11.5">when reported</text>
  <rect x="340" y="20" width="280" height="230" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="354" y="44" font-size="13" font-weight="700" fill="var(--m-green-ink, #336b40)">ToolMessage</text>
  <text x="354" y="76" font-size="11.5" fill="var(--m-ink-soft, #4a4a4a)">content</text>
  <text x="470" y="76" font-size="11.5">&quot;5&quot;</text>
  <text x="354" y="102" font-size="11.5" fill="var(--m-ink-soft, #4a4a4a)">name</text>
  <text x="470" y="102" font-size="11.5">add</text>
  <text x="354" y="128" font-size="11.5" fill="var(--m-ink-soft, #4a4a4a)">id</text>
  <text x="470" y="128" font-size="11.5">&lt;uuid&gt;</text>
  <text x="354" y="154" font-size="11.5" fill="var(--m-ink-soft, #4a4a4a)">tool_call_id</text>
  <text x="470" y="154" font-size="11.5" font-weight="700" fill="var(--m-green-ink, #336b40)">call_1</text>
  <text x="354" y="180" font-size="11.5" fill="var(--m-ink-soft, #4a4a4a)">status</text>
  <text x="470" y="180" font-size="11.5">success</text>
  <path d="M198 202 L270 202 L270 150 L339 150" fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-2-3-head-ink)"/>
  <text x="20" y="276" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">The request for a tool is in tool_calls, already parsed. The content is empty.</text>
  <text x="20" y="294" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">The ToolMessage repeats the id of the call it answers.</text>
</svg>
