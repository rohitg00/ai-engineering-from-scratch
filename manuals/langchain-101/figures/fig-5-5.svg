<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="fig-5-5-title fig-5-5-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-5-title">Turn time over 200 turns on Qwen3 4B, with and without summarization</title>
  <desc id="fig-5-5-desc">A dot chart of the median turn time of each block of 25 turns, on a log scale from 1 to 1,000 seconds, for one run per variant on the x86 server guest. Without summarization the median grows from 4.7 s to 18.6 s, and the run stops after turn 94. Open rings mark its turns 88 to 94, after the prompt reached 8,191 tokens, which took 308 to 621 s each. With a trigger, every block median stays between 4.4 and 9.2 s over 200 turns. A shaded band behind each line spans the 10th to the 90th percentile of the turns in each block, and its top holds the turns with a summary call.</desc>
