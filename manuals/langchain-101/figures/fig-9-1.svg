<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 474" role="img" aria-labelledby="fig-9-1-title fig-9-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-9-1-title">Three requests to the service, the spans of each run, and the SSE events</title>
  <desc id="fig-9-1-desc">One conversation with Qwen3 4B on the Mac. Request 1 took 1527 ms, with 2 model calls and events tool_call, tool_result, done. Request 2 took 2125 ms, with 1 model calls and events tool_call, interrupt, done. Request 3 took 2158 ms, with 1 model calls and events tool_result, done.</desc>
  <rect x="16" y="12" width="14" height="10" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="36" y="21" font-size="11">model.call</text>
  <rect x="126" y="12" width="14" height="10" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="146" y="21" font-size="11">tool span</text>
  <circle cx="236" cy="17" r="3.5" fill="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="246" y="21" font-size="11">SSE event at the client</text>
  <rect x="420" y="12" width="14" height="10" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="440" y="21" font-size="11">token events</text>
  <text x="16" y="56" font-size="11.5" font-weight="700">1. POST /runs: where is my order</text>
  <line x1="150" y1="122" x2="620" y2="122" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="150" y1="66" x2="150" y2="122" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="16" y="84" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">server task</text>
  <text x="16" y="112" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">client stream</text>
  <rect x="154.53" y="71" width="123.2" height="18" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="216.13" y="84" font-size="11" text-anchor="middle">556 in, 24 out</text>
  <rect x="280.4" y="71" width="2" height="18" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <rect x="283.12" y="71" width="152.71" height="18" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="359.48" y="84" font-size="11" text-anchor="middle">635 in, 31 out</text>
  <rect x="340.99" y="103" width="91.31" height="10" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <circle cx="278.2" cy="108" r="3.5" fill="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="276.2" y="130" font-size="11" fill="var(--m-indigo-ink, #4b4f9e)">tool_call read_order</text>
  <circle cx="281.19" cy="108" r="3.5" fill="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="279.19" y="144" font-size="11" fill="var(--m-indigo-ink, #4b4f9e)">tool_result</text>
  <circle cx="437.06" cy="108" r="3.5" fill="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="435.06" y="130" font-size="11" fill="var(--m-indigo-ink, #4b4f9e)">done</text>
  <text x="16" y="180" font-size="11.5" font-weight="700">2. POST /runs: refund 8900 cents</text>
  <line x1="150" y1="246" x2="620" y2="246" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="150" y1="190" x2="150" y2="246" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="16" y="208" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">server task</text>
  <text x="16" y="236" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">client stream</text>
  <rect x="153.14" y="195" width="388.15" height="18" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="347.22" y="208" font-size="11" text-anchor="middle">699 in, 44 out</text>
  <circle cx="542.83" cy="232" r="3.5" fill="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="474.8" y="254" font-size="11" fill="var(--m-indigo-ink, #4b4f9e)">tool_call refund_order</text>
  <circle cx="548.86" cy="232" r="3.5" fill="var(--m-amber-ink, #85590c)"/>
  <text x="546.86" y="268" font-size="11" fill="var(--m-amber-ink, #85590c)">interrupt</text>
  <circle cx="549.46" cy="232" r="3.5" fill="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="507.8" y="282" font-size="11" fill="var(--m-indigo-ink, #4b4f9e)">done, interrupted</text>
  <text x="16" y="304" font-size="11.5" font-weight="700">3. POST /approve: approve</text>
  <line x1="150" y1="370" x2="620" y2="370" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="150" y1="314" x2="150" y2="370" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="150" y1="400" x2="150" y2="404" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="150" y="417" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">0</text>
  <line x1="244" y1="400" x2="244" y2="404" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="244" y="417" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">500</text>
  <line x1="338" y1="400" x2="338" y2="404" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="338" y="417" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">1000</text>
  <line x1="432" y1="400" x2="432" y2="404" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="432" y="417" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">1500</text>
  <line x1="526" y1="400" x2="526" y2="404" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="526" y="417" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">2000</text>
  <line x1="620" y1="400" x2="620" y2="404" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="620" y="417" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">2500</text>
  <line x1="150" y1="400" x2="620" y2="400" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="16" y="332" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">server task</text>
  <text x="16" y="360" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">client stream</text>
  <rect x="153.41" y="319" width="2" height="18" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <rect x="158.78" y="319" width="395.64" height="18" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="356.6" y="332" font-size="11" text-anchor="middle">790 in, 39 out</text>
  <rect x="293.78" y="351" width="253.89" height="10" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <circle cx="156.03" cy="356" r="3.5" fill="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="154.03" y="378" font-size="11" fill="var(--m-indigo-ink, #4b4f9e)">tool_result</text>
  <circle cx="555.65" cy="356" r="3.5" fill="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="553.65" y="378" font-size="11" fill="var(--m-indigo-ink, #4b4f9e)">done</text>
  <text x="385" y="464" font-size="11.5" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">milliseconds after the request was sent</text>
</svg>
