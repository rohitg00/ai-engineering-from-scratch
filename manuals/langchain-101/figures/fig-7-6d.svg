<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" role="img" aria-labelledby="fig-7-6d-title fig-7-6d-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-6d-title">One traced agent run in the LangSmith trace view</title>
  <desc id="fig-7-6d-desc">A redrawing of the LangSmith trace view for one create_agent run of Qwen3 4B on Ollama, in the project aiefs-lc101-trace on the hosted free plan. The left pane is the run tree: the LangGraph root of 6.13 s with 6 child runs, a model node of 3.33 s holding a ChatOllama call of 282 tokens, a tools node holding the add tool at 0.00 s, and a second model node of 2.79 s holding a ChatOllama call of 302 tokens. A bar beside each run shows when it ran inside the 6.13 s. The right pane is the root run: the input is the user question What is 305 + 18?, and the output is the user message, an AI message that calls add with a 305 and b 18, the tool result 323, and the final AI answer 323.</desc>
