  <rect class="m-knock" x="474.79" y="61.81" width="39" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="494.29" y="72.39" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">0/350</text>
