  <text x="70" y="344" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Each dot is one process of 50 agent runs, 350 traced runs in all.</text>
  <text x="70" y="362" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">The fraction over a dot is the traced runs that reached the endpoint.</text>
  <text x="70" y="380" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">flush: wait_for_all_tracers() after the last run. bg off:</text>
  <text x="70" y="398" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">LANGCHAIN_CALLBACKS_BACKGROUND=false. All 50 runs answered in each process.</text>
