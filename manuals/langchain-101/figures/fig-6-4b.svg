  <rect class="m-knock" x="323.8" y="220.02" width="32.4" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="340" y="230.6" font-size="11" text-anchor="middle" fill="var(--m-olive-ink, #515f26)">18 s</text>
