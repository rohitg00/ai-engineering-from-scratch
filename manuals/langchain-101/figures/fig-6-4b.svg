  <text x="417.14" y="91.94" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">350/350</text>
  <text x="417.14" y="300" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">returns</text>
  <text x="417.14" y="314" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">500</text>
  <circle cx="494.29" cy="96.39" r="3.4" fill="var(--m-rose-ink, #b0344d)"/>
  <rect class="m-knock" x="471.49" y="75.81" width="45.6" height="15" fill="var(--m-panel, #f3f1e8)"/>
