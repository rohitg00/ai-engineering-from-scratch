<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 414" role="img" aria-labelledby="fig-6-4b-title fig-6-4b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-4b-title">Seconds from the last run to process exit, by endpoint</title>
  <desc id="fig-6-4b-desc">A dot chart of the time from the last agent run to process exit on the Mac, one process of 50 agent runs per endpoint condition. With wait_for_all_tracers at the end: 0.4 s against a working endpoint and 0.4 s against a slow one. Without it: slow 18 s, slow with background callbacks off 15.7 s, an endpoint that returns 500 72.2 s, an endpoint that is down 80.7 s with 0 of 350 runs received, and an endpoint that hangs never exited and was killed at 900 s with 300 of 350 runs received. Every agent run returned its answer in every condition.</desc>
  <defs><marker id="fig-6-4b-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker></defs>
  <line x1="70" y1="282" x2="610" y2="282" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="286" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">0</text>
  <line x1="70" y1="236" x2="610" y2="236" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="240" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">20</text>
  <line x1="70" y1="190" x2="610" y2="190" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="194" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">40</text>
  <line x1="70" y1="144" x2="610" y2="144" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="148" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">60</text>
  <line x1="70" y1="98" x2="610" y2="98" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="102" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">80</text>
  <line x1="70" y1="52" x2="610" y2="52" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="56" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">100</text>
  <line x1="70" y1="282" x2="610" y2="282" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="70" y1="52" x2="70" y2="282" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="70" y="40" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">seconds from the last run to exit</text>
  <circle cx="108.57" cy="281.08" r="3.4" fill="var(--m-olive-ink, #515f26)"/>
  <rect class="m-knock" x="89.07" y="260.5" width="39" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="108.57" y="271.08" font-size="11" text-anchor="middle" fill="var(--m-olive-ink, #515f26)">0.4 s</text>
