<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="fig-7-1-title fig-7-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-1-title">Runs per second under langgraph dev, by concurrent clients</title>
  <desc id="fig-7-1-desc">A dot chart of runs per second against concurrent clients, 1 to 100, on a log scale, for langgraph dev on the x86 server guest, one load run per point. Default of one job per worker: 0.9, 7.1, 8, 7.7 runs per second. Ten jobs per worker: 1, 8.8, 50.6, 56.3. One hundred jobs per worker: 1, 9.8, 41.7, 52.8. No run failed.</desc>
