<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 524" role="img" aria-labelledby="plate-langchain-run-title plate-langchain-run-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="plate-langchain-run-title">One invoke, two model calls, one tool call</title>
  <desc id="plate-langchain-run-desc">An isometric drawing of one agent run inside one Python process, drawn as a grey slab. Your code, a violet terminal, calls invoke with What is 2 + 3? on the agent graph from create_agent, an indigo unit. The graph calls the chat model, a plum tower, twice, and runs the add tool, a small green unit, once, which returns 5. After the input and after each of the four steps, the graph writes a checkpoint to InMemorySaver, a teal cylinder, five checkpoints in all, steps -1 to 3. Off the slab, LangSmith is a dashed olive tower that gets runs only when tracing is on. The reply is The sum is 5.</desc>
