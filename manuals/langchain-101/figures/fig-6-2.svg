<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="fig-6-2-title fig-6-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-2-title">What each MCP failure does to a run</title>
  <desc id="fig-6-2-desc">Seven rows, each from a case on the left to its result on the right. A string target that is not an http or https URL raises ValueError and launches nothing. A tool that reports isError and a tool that raises a Python exception both become a ToolMessage with status error, and the run goes on. A slow tool with the default client returns after 2.0 seconds, because the adapter has no timeout. A FastMCP Client with timeout 1 raises MCPError timed out after 1.0 seconds. A server crash over stdio raises MCPError Connection closed and aborts the run, and the next call starts the server again. A server crash over HTTP raises RemoteProtocolError, aborts the run, and later calls fail to connect.</desc>
  <defs><marker id="fig-6-2-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker><marker id="fig-6-2-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <text x="20" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">THE CASE</text>
  <text x="360" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">WHAT THE RUN GETS</text>
  <rect x="20" y="32" width="270" height="48" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="32" y="51.25" font-size="12.5" font-weight="700">MCPAdapter(&#39;server.py&#39;)</text>
  <text x="32" y="68.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">a string that is not a URL</text>
  <rect x="360" y="32" width="260" height="48" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="372" y="51.25" font-size="12.5" font-weight="700">ValueError, no launch</text>
  <text x="372" y="68.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">refused at construction</text>
  <line x1="290" y1="56" x2="359" y2="56" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-2-head-rose)"/>
  <rect x="20" y="92" width="270" height="48" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="32" y="111.25" font-size="12.5" font-weight="700">tool reports isError</text>
  <text x="32" y="128.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ToolError in the server</text>
  <rect x="360" y="92" width="260" height="48" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="372" y="111.25" font-size="12.5" font-weight="700">ToolMessage, status error</text>
  <text x="372" y="128.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the run goes on</text>
  <line x1="290" y1="116" x2="359" y2="116" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-2-head-ink)"/>
  <rect x="20" y="152" width="270" height="48" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="32" y="171.25" font-size="12.5" font-weight="700">exception in the tool</text>
  <text x="32" y="188.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">RuntimeError in the server</text>
  <rect x="360" y="152" width="260" height="48" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="372" y="171.25" font-size="12.5" font-weight="700">ToolMessage, status error</text>
  <text x="372" y="188.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the run goes on</text>
  <line x1="290" y1="176" x2="359" y2="176" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-2-head-ink)"/>
  <rect x="20" y="212" width="270" height="48" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="32" y="231.25" font-size="12.5" font-weight="700">slow tool, default client</text>
  <text x="32" y="248.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">slow(2) waits 2.0 s</text>
  <rect x="360" y="212" width="260" height="48" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="372" y="231.25" font-size="12.5" font-weight="700">ToolMessage, status success</text>
  <text x="372" y="248.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the adapter has no timeout</text>
  <line x1="290" y1="236" x2="359" y2="236" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-2-head-ink)"/>
  <rect x="20" y="272" width="270" height="48" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="32" y="291.25" font-size="12.5" font-weight="700">slow tool, Client(timeout=1)</text>
  <text x="32" y="308.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">slow(5) over stdio or HTTP</text>
  <rect x="360" y="272" width="260" height="48" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="372" y="291.25" font-size="12.5" font-weight="700">MCPError: timed out</text>
  <text x="372" y="308.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">raised after 1.0 s</text>
  <line x1="290" y1="296" x2="359" y2="296" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-2-head-rose)"/>
  <rect x="20" y="332" width="270" height="48" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="32" y="351.25" font-size="12.5" font-weight="700">server crash, stdio</text>
  <text x="32" y="368.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">os._exit(3) mid-call</text>
  <rect x="360" y="332" width="260" height="48" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="372" y="351.25" font-size="12.5" font-weight="700">MCPError: Connection closed</text>
  <text x="372" y="368.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">run aborts, next call relaunches</text>
  <line x1="290" y1="356" x2="359" y2="356" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-2-head-rose)"/>
  <rect x="20" y="392" width="270" height="48" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="32" y="411.25" font-size="12.5" font-weight="700">server crash, HTTP</text>
  <text x="32" y="428.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">os._exit(3) mid-call</text>
  <rect x="360" y="392" width="260" height="48" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="372" y="411.25" font-size="12.5" font-weight="700">RemoteProtocolError</text>
  <text x="372" y="428.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">run aborts, later calls fail</text>
  <line x1="290" y1="416" x2="359" y2="416" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-2-head-rose)"/>
  <text x="20" y="462" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">From the Mac, one run of each case, langchain 1.5.0 with fastmcp 4.2.0.</text>
</svg>
