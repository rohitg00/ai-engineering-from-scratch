  <text x="320" y="31.1" font-size="12" text-anchor="middle" font-weight="700">agent_turn</text>
  <text x="320" y="48.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">chain run</text>
