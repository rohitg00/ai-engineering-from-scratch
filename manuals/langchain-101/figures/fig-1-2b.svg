<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="fig-1-2b-title fig-1-2b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-1-2b-title">The runs of one traced agent turn</title>
  <desc id="fig-1-2b-desc">A tree of eight runs. The root is the chain run agent_turn, the traceable function of the kit. Under it is the chain run LangGraph. Under that are three chain runs in order: model, tools, and model. The first model run has one llm leaf ScriptedChatModel, the tools run has one tool leaf add, and the second model run has one llm leaf ScriptedChatModel. The client got one POST /runs and one PATCH for each of the seven runs below agent_turn, which stayed in memory.</desc>
