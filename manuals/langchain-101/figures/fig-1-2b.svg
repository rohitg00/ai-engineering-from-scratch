<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="fig-1-2b-title fig-1-2b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-1-2b-title">The runs of one traced agent turn</title>
  <desc id="fig-1-2b-desc">An indented tree of 8 runs in the order they started, one row each: chain agent_turn, chain LangGraph, chain model, llm ScriptedChatModel, chain tools, tool add, chain model, llm ScriptedChatModel. The root agent_turn is the traceable function of the kit, inside tracing_context with enabled local, and it stayed in memory. Each of the 7 runs below it has a dashed olive arrow to a client lane on the right, because the client got one POST /runs when the run started and one PATCH when it ended: 7 POST and 7 PATCH in all. Each graph node is a chain run, the two model calls are llm leaves, and the tool call is a tool leaf.</desc>
