<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" role="img" aria-labelledby="fig-7-3-title fig-7-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-3-title">Where input crosses into code, by default and with the setting</title>
  <desc id="fig-7-3-desc">Four rows, each from an input on the left to two results on the right: the default result in rose and the result with a setting in violet. An edited SqliteSaver checkpoint row that names a class makes get_state build the class, and LANGGRAPH_STRICT_MSGPACK=true gives back the raw fields. A user id of star makes list_namespaces list every user, while search on the same prefix returns one user. A batched review lets an edit of send_email into delete_file run delete_file, and per-call review raises ValidationError. An agent inside tracing_context with enabled local sends requests to api.smith.langchain.com, and enabled False sends nothing.</desc>
  <defs><marker id="fig-7-3-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker><marker id="fig-7-3-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <text x="20" y="22" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">THE INPUT</text>
  <text x="300" y="22" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">THE DEFAULT, THEN THE CHANGE</text>
  <rect x="20" y="34" width="252" height="76" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="32" y="59.75" font-size="12.5" font-weight="700">a checkpoint row names a class</text>
  <text x="32" y="77.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">an edited SqliteSaver row,</text>
  <text x="32" y="92.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">read with get_state</text>
  <rect x="300" y="34" width="320" height="34" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="312" y="54.45" font-size="11.5" font-weight="700">default: get_state built the lab class</text>
  <rect x="300" y="76" width="320" height="34" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="312" y="96.45" font-size="11.5" font-weight="700">LANGGRAPH_STRICT_MSGPACK=true: raw fields</text>
  <path d="M272 51 H299" fill="none" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-7-3-head-rose)"/>
  <path d="M272 93 H299" fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#fig-7-3-head-ink)"/>
  <rect x="20" y="130" width="252" height="76" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="32" y="155.75" font-size="12.5" font-weight="700">a user id of *</text>
  <text x="32" y="173.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">a store prefix built</text>
  <text x="32" y="188.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">from that id</text>
  <rect x="300" y="130" width="320" height="34" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="312" y="150.45" font-size="11.5" font-weight="700">list_namespaces listed every user</text>
  <rect x="300" y="172" width="320" height="34" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="312" y="192.45" font-size="11.5" font-weight="700">search on the same prefix: one user only</text>
  <path d="M272 147 H299" fill="none" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-7-3-head-rose)"/>
  <path d="M272 189 H299" fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#fig-7-3-head-ink)"/>
  <rect x="20" y="226" width="252" height="76" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="32" y="251.75" font-size="12.5" font-weight="700">an edit switches the tool</text>
  <text x="32" y="269.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">send_email edited into</text>
  <text x="32" y="284.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">a call of delete_file</text>
  <rect x="300" y="226" width="320" height="34" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="312" y="246.45" font-size="11.5" font-weight="700">batched: delete_file ran in 3 of 3 runs</text>
  <rect x="300" y="268" width="320" height="34" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="312" y="288.45" font-size="11.5" font-weight="700">per_call: ValidationError, nothing ran</text>
  <path d="M272 243 H299" fill="none" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-7-3-head-rose)"/>
  <path d="M272 285 H299" fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#fig-7-3-head-ink)"/>
  <rect x="20" y="322" width="252" height="76" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="32" y="347.75" font-size="12.5" font-weight="700">an agent inside a local trace</text>
  <text x="32" y="365.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">tracing_context with</text>
  <text x="32" y="380.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">enabled=&quot;local&quot;</text>
  <rect x="300" y="322" width="320" height="34" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="312" y="342.45" font-size="11.5" font-weight="700">requests to api.smith.langchain.com</text>
  <rect x="300" y="364" width="320" height="34" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="312" y="384.45" font-size="11.5" font-weight="700">enabled=False: no request at all</text>
  <path d="M272 339 H299" fill="none" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-7-3-head-rose)"/>
  <path d="M272 381 H299" fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#fig-7-3-head-ink)"/>
  <text x="20" y="428" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Rose: the result with the default. Violet: the result after the change.</text>
  <text x="20" y="444" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Each result is a recorded run on the Mac or a capture of the kit.</text>
</svg>
