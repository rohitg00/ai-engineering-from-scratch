  <rect x="170" y="8" width="140" height="40" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="240" y="22.95" font-size="11.5" text-anchor="middle" font-weight="700">ToolRetry</text>
  <text x="240" y="40.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Middleware()</text>
  <line x1="240" y1="48" x2="240" y2="490" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="330" y="8" width="140" height="40" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
