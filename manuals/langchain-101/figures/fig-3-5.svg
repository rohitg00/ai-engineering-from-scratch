  <rect x="490" y="8" width="140" height="40" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="560" y="22.95" font-size="11.5" text-anchor="middle" font-weight="700">stub service</text>
