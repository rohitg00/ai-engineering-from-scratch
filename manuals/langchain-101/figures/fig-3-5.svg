<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="fig-3-5-title fig-3-5-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-5-title">A tool call that times out three times</title>
  <desc id="fig-3-5-desc">A sequence with four lifelines: the tools node, ToolRetryMiddleware, the remote_action tool, and a stub service. The tool posts to the service with a client timeout of 1 s, and the service sleeps 3 s. Each of 3 attempts reaches the service, and each ends with a ReadTimeout. The middleware waits 1 s, then 2 s, between attempts. After the last attempt it returns an error ToolMessage, and the service has received the request 3 times, in each of 3 runs on the Mac.</desc>
