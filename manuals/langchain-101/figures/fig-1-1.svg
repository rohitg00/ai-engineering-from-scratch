<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" role="img" aria-labelledby="fig-1-1-title fig-1-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-1-1-title">The four projects and their packages at the pin</title>
  <desc id="fig-1-1-desc">Six bands stacked from top to bottom, each one project with its package and version from the pin: Deep Agents in deepagents 0.7.38 drawn dashed because it is optional, LangChain in langchain 1.5.0, LangGraph in langgraph 1.2.22, the provider packages such as langchain-openai 1.8.0, LangChain core in langchain-core 1.8.0, and Python 3.13 with pydantic 2.14.3. Inside the LangGraph band is the graph that create_agent returned, a CompiledStateGraph with the nodes __start__, model, tools, __end__. Four numbered arrows: create_deep_agent calls create_agent, create_agent returns that graph, the model node calls a chat model class from a provider package, and that class subclasses BaseChatModel in core. At the side, LangSmith 0.14.17 is olive. A dashed olive arrow from core says that a traced agent turn sent 7 POST /runs and 7 PATCH requests, and that tracing stays off until you turn it on.</desc>
  <defs><marker id="fig-1-1-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-1-1-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker><marker id="fig-1-1-head-plum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-plum-ink, #8a3d72)"/></marker><marker id="fig-1-1-head-olive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-olive-ink, #515f26)"/></marker></defs>
