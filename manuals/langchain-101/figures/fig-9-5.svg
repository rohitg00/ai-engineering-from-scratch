<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="fig-9-5-title fig-9-5-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-9-5-title">Five faults, the attempts in the spans, and what each model told the customer</title>
  <desc id="fig-9-5-desc">For each injected fault, the tool and model spans of the first suite run on the Mac, and the reply of Qwen3 4B, Qwen3 14B, Claude Haiku 5.5. search_faq fails once: Qwen3 4B no tool call, said no data bad, Qwen3 14B answered after the retry ok, Claude Haiku 5.5 answered after the retry ok. read_order hangs every attempt: Qwen3 4B said order not found bad, Qwen3 14B said it cannot look it up now ok, Claude Haiku 5.5 said lookup timed out ok. create_ticket fails once: Qwen3 4B said it could not open one ok, Qwen3 14B said it could not open one ok, Claude Haiku 5.5 said it could not open one ok. primary model raises: Qwen3 4B answered from backup ok, Qwen3 14B answered from backup ok, Claude Haiku 5.5 answered from backup ok. model asks for search_faq forever: Qwen3 4B answered after 8 calls ok, Qwen3 14B answered after 8 calls ok, Claude Haiku 5.5 answered after 8 calls ok.</desc>
