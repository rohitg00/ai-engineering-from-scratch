  <text x="466" y="258" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">config 101</text>
  <text x="466" y="274" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">51 calls</text>
  <circle cx="538" cy="160.4" r="3.5" fill="var(--m-rose-ink, #b0344d)"/>
  <rect class="m-knock" x="525.1" y="139.82" width="25.8" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="538" y="150.4" font-size="11" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">242</text>
  <text x="538" y="258" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">default</text>
  <text x="538" y="274" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">121 calls</text>
  <text x="214" y="296" font-size="11.5" text-anchor="middle" font-weight="700" fill="var(--m-indigo-ink, #4b4f9e)">StateGraph loop, the Mac</text>
  <text x="466" y="296" font-size="11.5" text-anchor="middle" font-weight="700" fill="var(--m-blue-ink, #2f5d9a)">create_agent, Qwen3 4B</text>
  <text x="70" y="326" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Calls under an agent case are its model calls. The agent ran on the x86 server guest.</text>
  <text x="70" y="344" font-size="11" class="m-serif" fill="var(--m-rose-ink, #b0344d)">The rose default run did not reach the limit: the lab script stopped it after 1260 s.</text>
