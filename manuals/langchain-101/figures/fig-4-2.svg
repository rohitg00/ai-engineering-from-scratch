<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="fig-4-2-title fig-4-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-2-title">Three turns of one thread in the SQLite file</title>
  <desc id="fig-4-2-desc">11 rows of the checkpoints table of SqliteSaver for the thread sqlite-thread, on one step axis from -1 to 9. Turn 1, &quot;What is 2 + 3?&quot;, has an input checkpoint at step -1 and loop checkpoints at steps 0, 1, 2, 3, and leaves 4 messages in the state. Turn 2, &quot;What did I ask you?&quot;, has an input checkpoint at step 4 and loop checkpoints at steps 5, 6, and leaves 6 messages in the state. Turn 3, &quot;Remind me again.&quot;, has an input checkpoint at step 7 and loop checkpoints at steps 8, 9, and leaves 8 messages in the state. Between turn 2 and turn 3 the connection was closed and a new process opened the same file. The file holds 11 checkpoint rows and 13 rows of pending writes.</desc>
