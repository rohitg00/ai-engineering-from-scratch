<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" role="img" aria-labelledby="fig-4-2-title fig-4-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-2-title">Three turns of one thread in the SQLite file</title>
  <desc id="fig-4-2-desc">Eleven rows of the checkpoints table of SqliteSaver on one step axis from -1 to 9. Turn 1 has an input checkpoint at step -1 and loop checkpoints at steps 0 to 3. Turn 2 has an input checkpoint at step 4 and loop checkpoints at 5 and 6. The connection was closed and the file opened again. Turn 3 has an input checkpoint at step 7 and loop checkpoints at 8 and 9.</desc>
