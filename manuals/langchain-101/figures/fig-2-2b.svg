<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="fig-2-2b-title fig-2-2b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-2b-title">Model attempts at the stub for one failing model call</title>
  <desc id="fig-2-2b-desc">A dot chart of model attempts at a local stub on the Mac, 3 runs for each cell. Three groups for a 429, a 500, and a timeout on every call. In each group the client default of ChatOpenAI made 3 attempts, ModelRetryMiddleware with client retries off made 3, and both layers together made 9. All three runs of every cell gave the same count.</desc>
