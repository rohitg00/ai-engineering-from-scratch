  <title id="fig-4-5b-title">Storage of one thread by steps, plain and DeltaChannel</title>
  <desc id="fig-4-5b-desc">A log-log dot chart of the storage of one thread in MB against steps, 10 to 5,000, on PostgresSaver on the x86 server guest. The plain channel stores 0.05, 3.08, 292.58, and 7289.37 MB. DeltaChannel with a snapshot every 100 steps stores 81.2 MB at 5,000 steps, and every 1,000 steps stores 15.7 MB.</desc>
