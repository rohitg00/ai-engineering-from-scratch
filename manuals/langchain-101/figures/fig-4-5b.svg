<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 707" role="img" aria-labelledby="fig-4-5b-title fig-4-5b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-5b-title">The graph of middleware A, B, and C</title>
  <desc id="fig-4-5b-desc">The compiled graph of create_agent with tools=[add] and middleware=[A, B, C], drawn from its draw_mermaid output. It has 16 nodes, 12 of them hook nodes, and 17 edges, 4 of them conditional. The before hooks run A, B, C from the top. The after_model hooks run C, B, A under model. A.after_model has three conditional edges: to tools, to C.after_agent, and back to A.before_model. tools goes back to A.before_model.</desc>
  <defs><marker id="fig-4-5b-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker><marker id="fig-4-5b-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
