<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" role="img" aria-labelledby="fig-2-5b-title fig-2-5b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-5b-title">Text deltas sent and received under three v3 consumer loops</title>
  <desc id="fig-2-5b-desc">Three pairs of rows on a time axis in seconds, run 0 of five per consumer loop over stream_events version v3 of one create_agent run. The model is Qwen3 8B with reasoning on, on Ollama on the x86 server guest. It sent about 211 reasoning deltas from the first second to about 31.3 s, then 60 text deltas over about 8.6 s. The upper row of each pair marks when each text delta was sent, and the lower row when the loop got it. The text-only and raw-events loops got each delta within a few milliseconds; over all five runs their largest lags were 4.9 and 0.9 ms. The loop that reads message.reasoning first got all 60 text deltas at 40.5 s, up to 8786.6 ms after the send. Over five runs its first text delta was 8786.6 to 9036.1 ms late.</desc>
