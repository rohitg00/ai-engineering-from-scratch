<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="fig-2-5-title fig-2-5-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-5-title">How the model node builds each request</title>
  <desc id="fig-2-5-desc">Two rows, one for each model call of the run in 06-agent-run.txt. On the left of each row is state.messages before the call, in teal: 1 message before call 1 and 3 before call 2. In the middle is the request the chat model received: the violet system prompt &quot;You add numbers.&quot; first, dashed because it is not in the state, then the same messages from the state. A plum arrow carries the request to the chat model. A teal arrow carries the reply back, and the model node appends it to state.messages: a tool call to add after call 1, and &quot;The sum is 5.&quot; after call 2. Between the rows the tools node appends the ToolMessage. The state ends with 4 messages and no system message.</desc>
