<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="fig-2-5-title fig-2-5-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-5-title">How the model node builds each request</title>
  <desc id="fig-2-5-desc">A flow from left to right. The system prompt You add numbers., set when the agent is built, and the messages channel of the state, human, ai, and tool 5, both go into the model node. The model node sends system first and then the messages to the chat model as a plum model call. The reply The sum is 5. goes back into the state as a teal write. The system prompt never goes into the state.</desc>
  <defs><marker id="fig-2-5-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-2-5-head-plum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-plum-ink, #8a3d72)"/></marker><marker id="fig-2-5-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-teal-ink, #18696a)"/></marker></defs>
  <rect x="20" y="30" width="200" height="60" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="120" y="55.25" font-size="12.5" text-anchor="middle" font-weight="700">system_prompt</text>
  <text x="120" y="72.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">You add numbers.</text>
  <rect x="20" y="150" width="200" height="92" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="120" y="176.25" font-size="12.5" text-anchor="middle" font-weight="700">state: messages</text>
  <text x="120" y="193.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">human: What is 2 + 3?</text>
  <text x="120" y="208.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ai: tool call add</text>
  <text x="120" y="223.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">tool: 5</text>
  <rect x="270" y="90" width="140" height="76" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="340" y="115.75" font-size="12.5" text-anchor="middle" font-weight="700">model node</text>
  <text x="340" y="133.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">system first,</text>
  <text x="340" y="148.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">then messages</text>
  <rect x="470" y="98" width="150" height="60" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="545" y="123.25" font-size="12.5" text-anchor="middle" font-weight="700">chat model</text>
  <text x="545" y="140.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">call 2</text>
  <path d="M220 60 L245 60 L245 112 L269 112" fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#fig-2-5-head-ink)"/>
  <path d="M220 180 L245 180 L245 144 L269 144" fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#fig-2-5-head-ink)"/>
  <line x1="410" y1="128" x2="469" y2="128" stroke="var(--m-plum-ink, #8a3d72)" stroke-width="1.2" marker-end="url(#fig-2-5-head-plum)"/>
  <path d="M545 158 L545 272 L120 272 L120 243" fill="none" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#fig-2-5-head-teal)"/>
  <rect class="m-knock" x="258" y="255.03" width="144" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="330" y="266" font-size="11.5" text-anchor="middle" fill="var(--m-teal-ink, #18696a)">reply: The sum is 5.</text>
  <text x="120" y="112" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-mute, #6f6f6a)">never written</text>
  <text x="120" y="128" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-mute, #6f6f6a)">to the state</text>
</svg>
