<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="fig-2-5-title fig-2-5-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-5-title">Where each stream mode is produced in one agent run</title>
  <desc id="fig-2-5-desc">Seven rows, one per stream mode, on a time axis in milliseconds for one create_agent run with Qwen3 4B on the x86 server guest, all modes on and version v2. The axis has three zoomed spans with breaks: the start, the end of the first model step and the tools step around 1.9 s, and the answer from 2.6 s. The supersteps are model from 5 to 1895.5 ms, tools from 1895.5 to 1900 ms, model from 1900 to 3335.9 ms. Each tick is one item: tasks 6, messages 13, custom 1, updates 3, values 4, checkpoints 5, debug 11. messages, custom, and updates items appear while a task runs or as it finishes. A values item comes after the update phase. The checkpoints and debug items of a step appear at the start of the next superstep, together with the tasks start item. The answer tokens arrived from 2658.7 ms, about one every 67 ms.</desc>
