<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 466" role="img" aria-labelledby="fig-5-4b-title fig-5-4b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-4b-title">Two users, one deep agent, and where the memory file is kept</title>
  <desc id="fig-5-4b-desc">Four namespace setups of StoreBackend under /memories/, each run for 10 sessions on InMemoryStore and on PostgresStore with Qwen3 8B. In each session alice asks the agent to save a locker code, then bob in a new thread asks for a locker code: under /memories/ in the first three rows, and through the recall tool in the last. One square per session. docs example: InMemoryStore 10 of 10 saved codes told to bob, PostgresStore 10 of 10 saved codes told to bob. per user: InMemoryStore 0 of 10 saved codes told to bob, PostgresStore 0 of 10 saved codes told to bob. per user + recall tool: InMemoryStore 0 of 10 saved codes told to bob, PostgresStore 0 of 10 saved codes told to bob. the same, bob asks for recall: InMemoryStore 10 of 10 saved codes told to bob, PostgresStore 10 of 10 saved codes told to bob.</desc>
