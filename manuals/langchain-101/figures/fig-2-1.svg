<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="fig-2-1-title fig-2-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-1-title">Six supersteps of one create_agent run, with channel versions</title>
  <desc id="fig-2-1-desc">A grid of the 6 planned supersteps of one create_agent run with two tool calls, from the input step -1 to step 4, which finds no task. The top row names the tasks planned in each step: __start__, model, two PUSH tasks of tools, model again, and none. Four rows below give the version of __start__, messages, branch:to:model, and __pregel_tasks after each step. A filled cell is a channel written in that step, a dashed cell is a channel cleared by its reader with a new version, and a plain grey number is a version carried over. Every channel that changes in one step gets the same number. Amber arrows run from the channel version that triggers a task to that task in the next step. The bottom row is the version of branch:to:model that model had seen. At step 4 the channel is at version 5 and model saw 4, but the channel is empty, so no task runs.</desc>
