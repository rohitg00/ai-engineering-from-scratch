  <title id="fig-4-2b-title">Steps per second on one AsyncPostgresSaver, by threads</title>
  <desc id="fig-4-2b-desc">A dot chart of steps per second against threads at once, 1 to 500 on a log scale, two runs per point, on the x86 server guest. One connection rises to about 260 at 10 threads and falls to 206.8 and 213.8 at 500. A pool of 20 reaches 339.3 and 331.5 at 50 threads and gives 341.5 and 325.5 at 500. A pool of 90 gives 326.5 and 312.7 at 500.</desc>
