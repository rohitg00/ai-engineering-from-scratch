<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 414" role="img" aria-labelledby="fig-7-6b-title fig-7-6b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-6b-title">Seconds from the last run to process exit, by endpoint</title>
  <desc id="fig-7-6b-desc">A dot chart of the time from the last agent run to process exit on the Mac, one process of 50 agent runs of Qwen3 4B per endpoint condition. With wait_for_all_tracers at the end: 0.4 s against a working endpoint and 0.4 s against a slow one. Without it: slow 3.7 s, slow with background callbacks off 3.7 s, an endpoint that returns 500 17.1 s, an endpoint that is down 9.9 s with 0 of 350 runs received, and an endpoint that hangs was still alive 208 s after its last run and was killed at 300 s with 50 of 350 runs received. Every agent run returned its answer in every condition.</desc>
  <defs><marker id="fig-7-6b-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker></defs>
