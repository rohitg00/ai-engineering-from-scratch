<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" role="img" aria-labelledby="fig-7-1b-title fig-7-1b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-1b-title">The nodes of run A and run B under each multitask strategy</title>
  <desc id="fig-7-1b-desc">Four tracks on a time axis of 0 to 7 seconds, one thread each under langgraph dev on the x86 server guest. Run A runs two nodes of 2 s each, and run B, sent about 1 s later on the same thread, runs two nodes of 1 s each. Under reject, B is refused with HTTP 409 and A finishes. Under enqueue, B starts when A ends at 4.8 s. Under interrupt, B starts at 1.0 s, and the first node of A never finishes. Under rollback, the first node of A starts just before B is sent, B starts at 1.0 s, and A is deleted.</desc>
  <line x1="214" y1="30" x2="214" y2="318" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="214" y="22" font-size="11" text-anchor="middle" font-weight="700" fill="var(--m-rose-ink, #b0344d)">run B sent</text>
  <g data-beat="1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/>
  <text x="20" y="46" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">REJECT</text>
  <text x="20" y="62" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">B refused, HTTP 409</text>
  <text x="136" y="80" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-amber-ink, #85590c)">A</text>
  <text x="136" y="100" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-amber-ink, #85590c)">B</text>
  <line x1="150" y1="76" x2="598" y2="76" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="150" y1="96" x2="598" y2="96" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <rect x="205.04" y="68" width="126" height="16" fill="var(--m-amber-ink, #85590c)"/>
  <text x="269.04" y="80" font-size="11" text-anchor="middle" fill="var(--m-paper, #fafaf5)">first</text>
  <rect x="333.04" y="68" width="126" height="16" fill="var(--m-amber-ink, #85590c)"/>
  <text x="397.04" y="80" font-size="11" text-anchor="middle" fill="var(--m-paper, #fafaf5)">second</text>
  <rect class="m-knock" x="217" y="89.42" width="111.6" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="220" y="100" font-size="11" fill="var(--m-rose-ink, #b0344d)">409, nothing ran</text>
  </g>
  <g data-beat="2"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.571;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.05s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.571;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.05s" begin="indefinite" fill="freeze"/>
  <text x="20" y="116" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">ENQUEUE</text>
  <text x="20" y="132" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">B waits for A, then runs</text>
  <text x="136" y="150" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-amber-ink, #85590c)">A</text>
  <text x="136" y="170" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-amber-ink, #85590c)">B</text>
  <line x1="150" y1="146" x2="598" y2="146" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="150" y1="166" x2="598" y2="166" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <rect x="200.56" y="138" width="126" height="16" fill="var(--m-amber-ink, #85590c)"/>
  <text x="264.56" y="150" font-size="11" text-anchor="middle" fill="var(--m-paper, #fafaf5)">first</text>
  <rect x="328.56" y="138" width="126" height="16" fill="var(--m-amber-ink, #85590c)"/>
  <text x="392.56" y="150" font-size="11" text-anchor="middle" fill="var(--m-paper, #fafaf5)">second</text>
