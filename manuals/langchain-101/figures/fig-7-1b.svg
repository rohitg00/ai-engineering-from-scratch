  <text x="489.2" y="170" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">first</text>
  <rect x="521.2" y="158" width="62" height="16" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="553.2" y="170" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">second</text>
  </g>
  <g data-beat="3"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.727;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.65s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.727;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.65s" begin="indefinite" fill="freeze"/>
  <text x="20" y="186" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">INTERRUPT</text>
  <text x="20" y="202" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">A interrupted, its node lost</text>
  <text x="136" y="220" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-amber-ink, #85590c)">A</text>
  <text x="136" y="240" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-amber-ink, #85590c)">B</text>
  <line x1="150" y1="216" x2="598" y2="216" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="150" y1="236" x2="598" y2="236" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <rect x="196.08" y="208" width="17.92" height="16" fill="none" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <rect class="m-knock" x="221" y="209.42" width="184.2" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="224" y="220" font-size="11" fill="var(--m-rose-ink, #b0344d)">first node of A never wrote</text>
  <rect x="215.28" y="228" width="62" height="16" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="247.28" y="240" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">first</text>
  <rect x="279.28" y="228" width="62" height="16" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="311.28" y="240" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">second</text>
  </g>
  <g data-beat="4"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.8;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.25s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.8;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.25s" begin="indefinite" fill="freeze"/>
  <text x="20" y="256" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">ROLLBACK</text>
  <text x="20" y="272" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">A deleted, B runs alone</text>
  <text x="136" y="290" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-amber-ink, #85590c)">A</text>
  <text x="136" y="310" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-amber-ink, #85590c)">B</text>
  <line x1="150" y1="286" x2="598" y2="286" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="150" y1="306" x2="598" y2="306" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <rect x="212.72" y="278" width="8" height="16" fill="none" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
