  <line x1="278" y1="322" x2="278" y2="330" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="278" y="344" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">2 s</text>
  <line x1="342" y1="322" x2="342" y2="330" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="342" y="344" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">3 s</text>
  <line x1="406" y1="322" x2="406" y2="330" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="406" y="344" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">4 s</text>
  <line x1="470" y1="322" x2="470" y2="330" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="470" y="344" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">5 s</text>
  <line x1="534" y1="322" x2="534" y2="330" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="534" y="344" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">6 s</text>
  <line x1="598" y1="322" x2="598" y2="330" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="598" y="344" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">7 s</text>
  <text x="20" y="370" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Lane A: the nodes of run A, filled. Lane B: the nodes of run B, outlined. Dashed rose: a node</text>
  <text x="20" y="386" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">of A that started and never wrote. Times are from the node events, one run each.</text>
