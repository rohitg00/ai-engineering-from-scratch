  <text x="247.28" y="310" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">first</text>
  <rect x="279.28" y="298" width="62" height="16" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
