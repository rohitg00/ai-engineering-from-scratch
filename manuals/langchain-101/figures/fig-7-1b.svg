  <text x="150" y="344" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">0 s</text>
  <line x1="214" y1="322" x2="214" y2="330" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
