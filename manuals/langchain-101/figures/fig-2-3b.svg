<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="fig-2-3b-title fig-2-3b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-3b-title">What the resume ran after a crash in the middle of a superstep</title>
  <desc id="fig-2-3b-desc">Dot rows for a crash test on SqliteSaver with Qwen3 4B on the x86 server guest. Nodes a, b, and c run in parallel: a asks the model for a fruit, b calls a weather tool, and c exits the process after a and b returned and a wait of 0 or 0.2 seconds. A new process resumes the thread. Each dot is one trial, 50 per cell, two runs. With no wait, sync reran the model node a in 49 and 48 trials, 97 of 100, and async in 45 and 50, 95 of 100. The tool node b never ran again. With a 0.2 second wait every trial reran only c. In exit mode no checkpoint existed in all 100 trials of run 1. Run 2 did not include exit.</desc>
  <text x="112" y="24" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">RUN 1</text>
  <text x="372" y="24" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">RUN 2</text>
  <text x="20" y="24" font-size="11" fill="var(--m-ink-mute, #6f6f6a)">mode, wait</text>
