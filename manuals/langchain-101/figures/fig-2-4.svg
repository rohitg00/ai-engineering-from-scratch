  <text x="20" y="40" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">resume value</text>
  <text x="181" y="22" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #6f6f6a)">run 1</text>
  <text x="181" y="40" font-size="11.5" text-anchor="middle" font-weight="700" fill="var(--m-violet-ink, #5b4fa3)">invoke(input)</text>
