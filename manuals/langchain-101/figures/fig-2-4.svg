<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="fig-2-4-title fig-2-4-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-4-title">Three calls that answer three questions in two parallel nodes</title>
  <desc id="fig-2-4-desc">A grid of four nodes against four calls on one thread with InMemorySaver and Qwen3 4B on the x86 server guest. ask, approve, and other run in parallel after START, and after runs last. ask and approve each ask the model for a question before they call interrupt. Call 1 starts the run: ask stops at its first interrupt with id 462dc352, approve stops with id 11314d20, and other finishes. Call 2a resumes with one plain value and raises RuntimeError, because two interrupts wait, and makes no model call. Call 2b resumes with a map from id to answer: approve asks the model again, gets OK, and finishes. ask asks the model again, replays its first answer, asks for its second question, and stops with id 177b6fc6. other does not run, because its saved writes are reapplied. Call 3 resumes with A2: ask runs a third time with two model calls and finishes, and after runs. The calls made 3, 0, 3, and 3 model calls, 9 for five prompts. The thread holds 4 checkpoints, steps -1, 0, 1, 2.</desc>
