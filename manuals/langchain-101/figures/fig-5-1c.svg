  <title id="fig-5-1c-title">First-token delivery delay of each run, by stream API</title>
  <desc id="fig-5-1c-desc">A dot chart on a log scale of the time between the proxy passing on the first token of Qwen3 4B and the consumer seeing it, on the Mac, 24 runs per API. Medians: plain openai 1.28 ms, ChatOpenAI 1.74 ms, messages mode 1.69 ms, v3 docs loop 1.55 ms, and the async v3 consumer that reads reasoning first 2662.92 ms.</desc>
