<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="fig-8-1-title fig-8-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-8-1-title">Runs per second under langgraph dev with Qwen3 4B, by concurrent clients</title>
