<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="fig-3-6b-title fig-3-6b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-6b-title">What AutoModeMiddleware does with one tool call</title>
  <desc id="fig-3-6b-desc">The model asks for two tool calls, delete_branch with name main and add with 2 and 3. For each listed tool, AutoModeMiddleware asks the decision model the noul question is_risky, with the instructions, the tool call, the tool description, up to 30 messages, and criteria null. delete_branch scored 0.93, at or above 0.5, so it got an error ToolMessage and did not run. add scored 0.05, so it ran and returned 5. A tool that is not listed runs with no question.</desc>
  <defs><marker id="fig-3-6b-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-3-6b-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker></defs>
  <rect x="170" y="12" width="300" height="48" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="320" y="31.25" font-size="12.5" text-anchor="middle" font-weight="700">AIMessage tool_calls</text>
  <text x="320" y="48.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">delete_branch(main), add(2, 3)</text>
  <rect x="120" y="100" width="400" height="84" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="320" y="129.75" font-size="12.5" text-anchor="middle" font-weight="700">question is_risky, type noul</text>
  <text x="320" y="147.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">instructions, tool_call, tool_description,</text>
  <text x="320" y="162.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">up to 30 messages, criteria: null</text>
  <line x1="320" y1="60" x2="320" y2="99" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-6b-head-ink)"/>
  <rect class="m-knock" x="325" y="68.53" width="116.4" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="328" y="79.5" font-size="11.5">each listed tool</text>
  <rect x="20" y="250" width="280" height="64" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="32" y="269.75" font-size="12.5" font-weight="700">delete_branch: 0.93</text>
  <text x="32" y="287.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">at or above 0.5: error ToolMessage,</text>
  <text x="32" y="302.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the tool does not run</text>
  <rect x="340" y="250" width="280" height="64" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="352" y="269.75" font-size="12.5" font-weight="700">add: 0.05</text>
  <text x="352" y="287.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">below 0.5: the tool runs,</text>
  <text x="352" y="302.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ToolMessage 5</text>
  <path d="M220 184 V249" fill="none" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-3-6b-head-rose)"/>
  <path d="M420 184 V249" fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-3-6b-head-ink)"/>
  <rect class="m-knock" x="225" y="211.42" width="39" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="228" y="222" font-size="11" fill="var(--m-rose-ink, #b0344d)">risky</text>
  <rect class="m-knock" x="425" y="211.42" width="52.2" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="428" y="222" font-size="11">allowed</text>
  <rect x="20" y="344" width="600" height="48" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="32" y="363.25" font-size="12.5" font-weight="700">a tool missing from tools=</text>
  <text x="32" y="380.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">runs with no question to the decision model</text>
  <text x="20" y="418" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">The probabilities are the answers of a scripted decision model in the kit.</text>
</svg>
