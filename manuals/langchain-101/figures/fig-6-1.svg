<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="fig-6-1-title fig-6-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-1-title">Index time and query time of the retrieval capture</title>
  <desc id="fig-6-1-desc">Two rows. At index time, three Markdown files go to RecursiveCharacterTextSplitter from langchain-text-splitters, which makes 7 chunks of at most 80 characters. DeterministicFakeEmbedding from langchain-core turns each chunk into 16 numbers, and InMemoryVectorStore from langchain-core keeps them as doc-0 to doc-6. At query time, create_agent asks the model, the model calls the tool search_docs, the tool calls a retriever from as_retriever with k equal to 1, the retriever searches the store, and the ToolMessage carries the chunk doc-0 back to the model.</desc>
  <defs><marker id="fig-6-1-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <text x="20" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">INDEX TIME: ONCE</text>
  <rect x="20" y="32" width="128" height="58" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="84" y="48.75" font-size="12.5" text-anchor="middle" font-weight="700">3 files</text>
  <text x="84" y="66.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">checkpoints.md</text>
  <text x="84" y="81.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">and two more</text>
  <rect x="176" y="32" width="136" height="58" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="244" y="48.75" font-size="12.5" text-anchor="middle" font-weight="700">TextSplitter</text>
  <text x="244" y="66.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Recursive, size 80</text>
  <text x="244" y="81.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">7 chunks</text>
  <rect x="340" y="32" width="130" height="58" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="405" y="48.75" font-size="12.5" text-anchor="middle" font-weight="700">embedding</text>
  <text x="405" y="66.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">DeterministicFake</text>
  <text x="405" y="81.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">16 numbers each</text>
  <rect x="498" y="32" width="122" height="58" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="559" y="48.75" font-size="12.5" text-anchor="middle" font-weight="700">vector store</text>
  <text x="559" y="66.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">InMemory</text>
  <text x="559" y="81.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">doc-0 to doc-6</text>
  <line x1="148" y1="61" x2="175" y2="61" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-1-head-ink)"/>
  <line x1="312" y1="61" x2="339" y2="61" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-1-head-ink)"/>
  <line x1="470" y1="61" x2="497" y2="61" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-1-head-ink)"/>
  <text x="176" y="108" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">langchain-text-splitters</text>
  <text x="372" y="108" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">langchain-core, these two</text>
  <text x="20" y="146" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">QUERY TIME: EACH TOOL CALL</text>
  <rect x="20" y="160" width="128" height="58" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="84" y="176.75" font-size="12.5" text-anchor="middle" font-weight="700">create_agent</text>
  <text x="84" y="194.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">model node</text>
  <text x="84" y="209.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">tools node</text>
  <rect x="176" y="160" width="136" height="58" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="244" y="176.75" font-size="12.5" text-anchor="middle" font-weight="700">search_docs</text>
  <text x="244" y="194.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">@tool, one</text>
  <text x="244" y="209.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">argument: query</text>
  <rect x="340" y="160" width="130" height="58" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="405" y="176.75" font-size="12.5" text-anchor="middle" font-weight="700">retriever</text>
  <text x="405" y="194.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">as_retriever</text>
  <text x="405" y="209.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">k=1</text>
  <line x1="148" y1="177" x2="175" y2="177" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-1-head-ink)"/>
  <line x1="175" y1="203" x2="149" y2="203" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-1-head-ink)"/>
  <line x1="312" y1="189" x2="339" y2="189" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-1-head-ink)"/>
  <path d="M470 189 H559 V91" fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#fig-6-1-head-ink)"/>
  <text x="568" y="160" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">search</text>
  <text x="20" y="246" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">The start of the ToolMessage back to the model:</text>
  <rect x="20" y="256" width="600" height="34" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="32" y="276.45" font-size="11.5" font-weight="400">[checkpoints.md] A checkpointer saves graph state after each step.</text>
  <text x="20" y="316" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">The kit embeds with a fake: only an exact text match scores 1.0.</text>
</svg>
