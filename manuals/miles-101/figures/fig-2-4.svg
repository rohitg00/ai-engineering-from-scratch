  <text x="293.33" y="192.96" font-size="11" text-anchor="middle" fill="var(--m-blue-ink, #2f5d9a)">1.14 s</text>
  <text x="293.33" y="273" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">offload 0.6B</text>
