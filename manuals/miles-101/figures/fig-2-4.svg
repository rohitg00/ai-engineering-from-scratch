  <line x1="60" y1="156" x2="620" y2="156" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="54" y="160" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">2</text>
  <line x1="60" y1="56" x2="620" y2="56" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="54" y="60" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">4</text>
  <line x1="60" y1="256" x2="620" y2="256" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="60" y1="56" x2="60" y2="256" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="60" y="44" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">seconds, mean of steps 2 and 3</text>
  <rect x="80.67" y="223.77" width="52" height="32.23" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="106.67" y="217.77" font-size="11" text-anchor="middle" fill="var(--m-blue-ink, #2f5d9a)">0.64 s</text>
  <text x="106.67" y="273" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">update 0.6B</text>
