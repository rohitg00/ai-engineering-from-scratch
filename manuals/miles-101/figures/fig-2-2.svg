  <text x="225" y="22" font-size="11" fill="var(--m-violet-ink, #5b4fa3)">engine kept loaded</text>
  <text x="60" y="314" font-size="12" class="m-serif">Same step, same answer length: the difference is 0.6 to 1.8 s.</text>
