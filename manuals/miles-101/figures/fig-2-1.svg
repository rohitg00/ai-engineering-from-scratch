  <text x="228" y="216.06" font-size="11" text-anchor="middle" fill="var(--m-blue-ink, #2f5d9a)">about 27 GB</text>
  <text x="228" y="283" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">1.7B</text>
