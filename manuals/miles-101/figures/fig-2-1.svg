  <text x="277.8" y="22" font-size="11" fill="var(--m-rose-ink, #b0344d)">node memory at the Ray kill</text>
  <text x="60" y="324" font-size="12" class="m-serif">Lowering the engine memory did not save 4B. All runs used 256-token answers.</text>
