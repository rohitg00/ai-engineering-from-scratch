  <text x="54" y="124.62" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">90</text>
  <line x1="60" y1="72.15" x2="620" y2="72.15" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="54" y="76.15" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">120</text>
  <line x1="60" y1="266" x2="620" y2="266" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="60" y1="56" x2="60" y2="266" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="60" y="44" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">GB</text>
