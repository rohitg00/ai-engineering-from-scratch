  <text x="64" y="64.42" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">node, 121.7 GB</text>
  <line x1="60" y1="79.25" x2="620" y2="79.25" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect class="m-knock" x="61" y="82.67" width="237" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="64" y="93.25" font-size="11" fill="var(--m-rose-ink, #b0344d)">Ray stops a worker above 95 percent</text>
  <rect x="86" y="250.49" width="60" height="15.51" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="116" y="244.49" font-size="11" text-anchor="middle" fill="var(--m-blue-ink, #2f5d9a)">about 10 GB</text>
