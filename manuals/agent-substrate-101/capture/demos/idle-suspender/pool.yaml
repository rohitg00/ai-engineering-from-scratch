apiVersion: v1
kind: Namespace
metadata:
  name: demo-idle
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: idle
  namespace: demo-idle
  labels:
    workload: idle
spec:
  replicas: 1
  workerImage: ghcr.io/agent-substrate/substrate/ateworker-gvisor:v1.0.0
  sandboxClasses:
  - name: gvisor
  template:
    resources:
      limits:
        cpu: "2"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 1Gi
