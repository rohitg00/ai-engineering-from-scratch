metadata:
  atespace: demo-drill
  name: drill
workerSelector:
  matchLabels:
    workload: drill
containers:
- name: drill
  image: IMAGE
  wakeupProbe:
    httpGet:
      path: /readyz
      port: 80
resources:
  limits:
    cpuMillicores: 1000
    memoryBytes: 268435456
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
