apiVersion: v1
kind: Namespace
metadata:
  name: demo-drill
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: drill
  namespace: demo-drill
  labels:
    workload: drill
spec:
  replicas: 2
  workerImage: ghcr.io/agent-substrate/substrate/ateworker-gvisor:v1.0.0
  sandboxClasses:
  - name: gvisor
  template:
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 1Gi
