apiVersion: v1
kind: Namespace
metadata:
  name: demo-tools
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pkg-mirror
  namespace: demo-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pkg-mirror
  template:
    metadata:
      labels:
        app: pkg-mirror
    spec:
      containers:
      - name: mirror
        image: IMAGE
        command: ["sh", "-c", "mkdir -p /srv && echo 'hello package 1.0' > /srv/hello-1.0.txt && cd /srv && exec python3 -m http.server 8080"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: pkg-mirror
  namespace: demo-tools
spec:
  selector:
    app: pkg-mirror
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: tools
  namespace: demo-tools
  labels:
    workload: tools
spec:
  replicas: 1
  workerImage: ghcr.io/agent-substrate/substrate/ateworker-gvisor:v1.0.0
  sandboxClasses:
  - name: gvisor
  template:
    resources:
      limits:
        cpu: "2"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 1Gi
