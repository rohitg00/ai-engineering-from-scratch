apiVersion: v1
data:
  config.yaml: |-
    frontendPolicies:
      connect:
        mode: tunnel
      accessLog:
        add:
          substrate.connect.authority: 'destination.address + ":" + string(destination.port)'
      substrateEgressActorResolution:
        host: api.ate-system.svc:443
        policies:
          backendTLS:
            cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
            key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
            root: /run/servicedns-ca/trust-bundle.pem

    # Keep the outer egress gateway on 8443, but bind it to this pod's
    # address. Numeric CONNECT re-entry must select the wildcard
    # internal bind instead of selecting this front door again.
    gateways:
      egress:
        port: 8443
        bindAddress: $POD_IP
        protocol: HTTPS
        tls:
          cert: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          key: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          root: /run/actor-id-ca-certs/ca.crt

    binds:
    - mode: internal
      protocol: AUTO
      listeners:
      - protocol: HTTPS
        tls:
          mode: dynamicCa
          cert: /run/egress-mitm/tls.crt
          key: /run/egress-mitm/tls.key
        routes:
        - name: reject-websocket-upgrade
          matches:
          - headers:
            - name: Connection
              value:
                regex: '(?i)(^|,)\s*upgrade\s*(,|$)'
            - name: Upgrade
              value:
                regex: '(?i)(^|,)\s*websocket\s*(,|$)'
          policies:
            directResponse:
              status: 403
              body: WebSocket egress is not supported
        - backends:
          - dynamic: {}
            policies:
              backendTLS:
                root: /etc/ssl/certs/ca-certificates.crt
          policies:
            substrateEgress: &egressPolicy
              credentialProviders:
              - uriAuthority: "k8s.io"
                target:
                  host: "k8s-credential-provider.ate-system.svc:50051"
                  policies:
                    backendTLS:
                      hostname: "k8s-credential-provider.ate-system.svc"
                      cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                      key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                      root: /run/servicedns-ca/trust-bundle.pem
              host: api.ate-system.svc:443
              policies:
                backendTLS:
                  cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                  key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                  root: /run/servicedns-ca/trust-bundle.pem
      - protocol: HTTP
        routes:
        - name: reject-websocket-upgrade
          matches:
          - headers:
            - name: Connection
              value:
                regex: '(?i)(^|,)\s*upgrade\s*(,|$)'
            - name: Upgrade
              value:
                regex: '(?i)(^|,)\s*websocket\s*(,|$)'
          policies:
            directResponse:
              status: 403
              body: WebSocket egress is not supported
        - backends:
          - dynamic:
              target: 'destination.address + ":" + string(destination.port)'
          policies:
            substrateEgress: *egressPolicy
      - protocol: TLS
        tcpRoutes:
        - backends:
          - dynamic: {}
kind: ConfigMap
metadata:
  creationTimestamp: "2026-11-12T11:11:24Z"
