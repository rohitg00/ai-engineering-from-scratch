apiVersion: v1
kind: Namespace
metadata: {name: sc-lab}
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata: {name: sc-pool, namespace: sc-lab, labels: {workload: sc-pool}}
spec:
  replicas: 520
  workerImage: ghcr.io/agent-substrate/substrate/ateworker-gvisor:v1.0.0
  sandboxClasses:
  - name: gvisor
  template:
    resources:
      limits: {cpu: "1", memory: 256Mi}
      requests: {cpu: 20m, memory: 32Mi}
