apiVersion: apps/v1
kind: Deployment
metadata:
  name: ax-server
  namespace: ax031-system
  labels:
    app.kubernetes.io/name: ax-server
    app.kubernetes.io/part-of: ax
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ax-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ax-server
    spec:
      containers:
        - name: ax-server
          image: localhost:5002/ax031-ax-server:v0.3.1
          imagePullPolicy: IfNotPresent
          args:
            - "--addr=:8080"
            - "--redis-addr=ax-redis.ax031-system.svc.cluster.local:6379"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ax-server
  namespace: ax031-system
  labels:
    app.kubernetes.io/name: ax-server
    app.kubernetes.io/part-of: ax
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: ax-server
