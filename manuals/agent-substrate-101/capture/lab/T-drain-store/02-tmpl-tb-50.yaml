metadata:
  atespace: lab-n
  name: tb-50
workerSelector:
  matchLabels:
    workload: ballast
containers:
- name: ballast
  image: localhost:5001/ballast@sha256:348fb7c4d2b13643e63c1b1d364de8e8c84aeb953b4df33be6753686c69d64e6
  command:
  - /ballast
  - --mb=50
  wakeupProbe:
    httpGet:
      path: /readyz
