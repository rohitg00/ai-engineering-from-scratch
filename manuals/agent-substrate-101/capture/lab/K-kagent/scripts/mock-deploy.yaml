apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm
  namespace: kagent
spec:
  replicas: 1
  selector:
    matchLabels: {app: mock-llm}
  template:
    metadata:
      labels: {app: mock-llm}
    spec:
      containers:
        - name: mock
          image: python:3.12-alpine
          command: ["python", "-u", "/app/mock_llm.py", "8080"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - {name: app, mountPath: /app}
      volumes:
        - name: app
          configMap: {name: mock-llm}
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm
  namespace: kagent
spec:
  selector: {app: mock-llm}
  ports:
    - {port: 8080, targetPort: 8080}
