- apiVersion: v1
  data:
    controller.yaml: |
      database:
        owner:
          role: kagent_owner
          urlFile: /etc/kagent/secrets/database-owner-url
        readWrite:
          role: kagent_readwrite
          urlFile: /etc/kagent/secrets/database-readwrite-url
        schema: kagent
        skipMigrations: false
        vectorEnabled: false
        vectorSchema: extensions
      gateway:
        publicUrl: http://kagent-controller.kagent.svc.cluster.local:8083
      harnessImages:
        claude: ghcr.io/kagent-dev/kagent/claude-harness@sha256:54629b4e47ad08ab931ae815492d2533f4a3dd6ce007eda06863675afb4f99d2
        codex: ghcr.io/kagent-dev/kagent/codex-harness@sha256:7da600c1bc342b31bccb281dd9a48c6bdbf33d80a20f89e69128f052858fe9f3
        kagent: ghcr.io/kagent-dev/kagent/golang-adk@sha256:f62e9f2820d3325ca147a5d39802dc3e9c914bee97b3e021bd38f6f5df10e3bf
        release: 1.0.0
      kubernetes:
        namespace: kagent
        watchNamespaces: []
      logging:
        level: info
      metrics:
        bindAddress: "0"
        secure: true
      push:
        allowHttp: false
        allowPrivateNetworks: false
        issuer: http://kagent-controller.kagent.svc.cluster.local:8083
        maxConcurrency: 10
        recoveryInterval: 60s
        sendTimeout: 5s
      runtimeDefaults:
        builtinTools:
          bashVenvPath: ""
          disableAskUser: false
          disableBash: false
          disableFileSearch: false
        controlPlaneUrl: http://kagent-controller.kagent.svc.cluster.local:8083
        cpu: "1"
        gatewayUrl: http://kagent-controller.kagent.svc.cluster.local:8083
        logging:
          level: info
        memory: 1Gi
        telemetry: {}
      sandboxes:
        cpu: "1"
        defaultTtl: 3600s
        guestImage: ""
        maxTtl: 86400s
        memory: 1Gi
      server:
        auth:
          mode: insecure
        bindAddress: :8083
        grpcReflection: true
      sessions:
        idleTtl: 604800s
        shareMaxTtl: 0s
      substrate:
        actorJwtIssuer: https://idp.ate-system.svc
        apiEndpoint: dns:///api.ate-system.svc:443
        caFile: /run/substrate-servicedns/trust-bundle.pem
        clientCertFile: /run/substrate-podidentity/credential-bundle.pem
        routerUrl: https://atenet-router.ate-system.svc:443
      telemetry: {}
