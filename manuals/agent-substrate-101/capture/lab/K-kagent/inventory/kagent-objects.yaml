    - description: Wait for a condition on Kubernetes resources (kubectl wait). Blocks
        until the condition is met or the timeout elapses.
      name: k8s_wait
    - description: Check if Kubescape operator is installed and operational. Verifies
        namespace, operator pods, storage pods, CRDs, and scan data availability.
      name: kubescape_check_health
    - description: Get detailed runtime behavior profile for a specific workload.
        Shows what processes run, what files are accessed, what system calls are made,
        and what capabilities are used per container. Compare with CVE findings to
        prioritize remediation - focus on vulnerabilities affecting actively used
        components.
      name: kubescape_get_application_profile
    - description: Get detailed configuration security scan results for a specific
        workload, including failed controls and remediation guidance.
      name: kubescape_get_configuration_scan
    - description: Get detailed network connections for a specific workload. Shows
        all observed ingress and egress traffic with DNS names, IPs, ports, and protocols.
        Use this to verify if a workload with a vulnerability is actually exposed
        to the network.
      name: kubescape_get_network_neighborhood
    - description: Get detailed information about a specific CVE in a vulnerability
        manifest, including affected packages and fix information.
      name: kubescape_get_vulnerability_details
    - description: 'List ApplicationProfiles showing runtime behavior of workloads.
        These profiles capture: executed processes (Execs), file access patterns (Opens),
        system calls (Syscalls), Linux capabilities used, and HTTP endpoints. Use
        this data to prioritize vulnerability findings - a CVE in an unused package
        is lower priority than one in an actively running process. Requires ''capabilities.runtimeObservability=enable''
        in Kubescape Helm chart.'
      name: kubescape_list_application_profiles
    - description: List configuration security scan results from Kubescape operator.
        Shows workloads that have been scanned for security misconfigurations.
      name: kubescape_list_configuration_scans
    - description: 'List NetworkNeighborhoods showing actual network communication
        patterns of workloads. These capture: ingress connections (who talks TO the
        workload), egress connections (who the workload talks TO), including DNS names,
        IP addresses, ports, and protocols. Use this to understand attack surface
        and prioritize network-related security findings. Requires ''capabilities.runtimeObservability=enable''
        in Kubescape Helm chart.'
      name: kubescape_list_network_neighborhoods
    - description: List all CVEs/vulnerabilities found in a specific vulnerability
        manifest. Returns severity summary and vulnerability details.
      name: kubescape_list_vulnerabilities
    - description: 'List vulnerability manifests from Kubescape operator, at image
        or workload level. This is an index only: it does NOT report how many vulnerabilities
        each manifest contains, and an entry appearing here says nothing about whether
        that image is clean. To get vulnerability counts and severities for a manifest,
        call kubescape_list_vulnerabilities with its manifest_name.'
      name: kubescape_list_vulnerability_manifests
    - description: Echo input and return all HTTP headers received with the MCP request
        for debugging.
      name: mcp_inspect
    - description: Get all available labels from Prometheus
      name: prometheus_label_names_tool
    - description: Generate a PromQL query
      name: prometheus_promql_tool
    - description: Execute a PromQL range query against Prometheus
      name: prometheus_query_range_tool
    - description: Execute a PromQL query against Prometheus
      name: prometheus_query_tool
    - description: Get all Prometheus targets and their status
      name: prometheus_targets_tool
    - description: Execute shell commands
      name: shell
    observedGeneration: 1
kind: List
