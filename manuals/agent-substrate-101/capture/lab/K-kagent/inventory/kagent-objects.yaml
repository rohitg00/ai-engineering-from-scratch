- apiVersion: api.kagent.dev/v1alpha3
  kind: RemoteMCPServer
  metadata:
    annotations:
      meta.helm.sh/release-name: kagent
      meta.helm.sh/release-namespace: kagent
    creationTimestamp: "2026-11-12T10:13:34Z"
    generation: 1
    labels:
      app.kubernetes.io/instance: kagent
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/name: kagent
      app.kubernetes.io/part-of: kagent
      app.kubernetes.io/version: 1.0.0
      helm.sh/chart: kagent-1.0.0
    name: kagent-api
    namespace: kagent
    resourceVersion: "1605"
    uid: 3ca082e0-27d3-4616-afee-754a7a40ccff
  spec:
    description: Kagent API tools for Sessions, checkpoints, and sandboxes
    protocol: STREAMABLE_HTTP
    sseReadTimeout: 5m0s
    terminateOnClose: true
    timeout: 30s
    url: http://kagent-controller.kagent.svc.cluster.local:8083/mcp
  status:
    conditions:
    - lastTransitionTime: "2026-11-12T10:14:36Z"
      message: Discovered 27 MCP tools
      observedGeneration: 1
      reason: DiscoverySucceeded
      status: "True"
      type: Accepted
    discoveredTools:
    - description: Create a temporary workspace from a prepared SandboxTemplate. Retain
        request_id and identical inputs for lifecycle retries. Check state, operation,
        and expires_at before guest calls. No network egress is currently allowed;
        files belong under /data/workspace.
      name: create_sandbox
    - description: Start a Session with an Agent, optionally sending its first message.
        With message it returns once the turn is accepted; read the reply with get_session.
        A retry with the same request_id returns the same Session and turn.
      name: create_session
    - description: Create a checkpoint at a Session turn boundary
      name: create_session_checkpoint
    - description: Delete a workspace and its files after retrieving needed artifacts.
        Retry the same deletion on transient failure; inspect state and operation
        to confirm completion.
      name: delete_sandbox
    - description: Delete a Session and its runtime state. Fails while the Session
        has active turns, or with a conflict while another operation on the Session
        is in flight; retry it.
      name: delete_session
    - description: Delete a checkpoint
      name: delete_session_checkpoint
    - description: Create a Session from a checkpoint
      name: fork_session
    - description: Inspect state, operation, failure, and expiration. This only observes;
        repeat a pending lifecycle mutation to advance it.
      name: get_sandbox
    - description: Inspect process state. exit_code is present only for EXITED. Read
        outputs and retrieve artifacts after completion.
      name: get_sandbox_process
    - description: Read a Session's state, failure and turns, oldest first, within
        a byte budget.
      name: get_session
    - description: Read one checkpoint's state and failure
      name: get_session_checkpoint
    - description: Read one task of a Session as its A2A messages and artifacts in
        timeline order, paged by item, or the A2A parts of one of its tool calls.
      name: get_task
    - description: Send a message to an existing Session with session_id, or start
        a new Session by providing agent instead. Returns the Session and task IDs.
        Reuse message_id with identical inputs when retrying creation.
      name: invoke_agent
    - description: Send SIGKILL to a sandbox process; use get_sandbox_process for
        its exit
      name: kill_sandbox_process
    - description: List Agents visible to the caller, optionally filtered by namespace.
        Pass an entry from agents as the agent argument to invoke_agent to start a
        Session. Listing does not imply readiness or permission to invoke.
      name: list_agents
    - description: Discover SandboxTemplate namespace/name references visible to you.
        Does not report readiness or installed programs; inspect the template or verify
        programs after creation.
      name: list_sandbox_templates
    - description: List your temporary workspaces
      name: list_sandboxes
    - description: List checkpoints for a Session
      name: list_session_checkpoints
    - description: List Sessions visible to the caller, ready ones unless all_states
        is set
      name: list_sessions
    - description: 'Page through a Session''s tasks, oldest first, each as a summary:
        user message, reply and tool call stubs.'
      name: list_tasks
    - description: Read a file. Text comes back as numbered lines from offset, up
        to limit lines or 32 KiB, with the offset to continue from. PNG, JPEG and
        GIF images up to 10 MiB come back as images you can see. Other files are described
        rather than returned. Paths are absolute or relative to /data/workspace.
      name: read_sandbox_file
    - description: Read currently available stdout/stderr as base64, up to 1 MiB combined.
        Pass both returned byte offsets to continue. This does not wait for completion;
        check get_sandbox_process and read again after it finishes.
      name: read_sandbox_outputs
    - description: Set or clear a Session's display name
      name: rename_session
    - description: Resume a workspace; previous guest process handles are no longer
        valid
      name: resume_sandbox
    - description: Start once and retain process_id. This returns before completion;
        use get_sandbox_process and read_sandbox_outputs next. cwd defaults to /data/workspace;
        command is argv, not shell text. Retrying an uncertain start may execute the
        command twice.
      name: start_sandbox_process
    - description: Suspend a workspace; running commands and transfers may be interrupted
      name: suspend_sandbox
    - description: Replace a file with decoded base64 data, up to 1 MiB. Paths are
        absolute or relative to /data/workspace. Verify bytes_written; interrupted
        writes may leave partial files. There is no append or offset input.
      name: write_sandbox_file
    observedGeneration: 1
