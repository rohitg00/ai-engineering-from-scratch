metadata:
  atespace: lab-v
  name: mv-a
workerSelector:
  matchLabels:
    workload: vpool
containers:
- name: ballast
  image: localhost:5001/ballast@sha256:3c297fb8f6ce7067ac8180af0fc52cd422b5ee46135aa937368a731925e173b7
  command:
  - /ballast
  - --mb=20
  - --tag=A
  - --rootfs-file=/rootfs.txt
  - --data-file=/data/a.txt
  wakeupProbe:
    httpGet:
      path: /readyz
      port: 80
  volumeMounts:
  - name: data
    mountPath: /data
resources:
  limits:
    cpuMillicores: 1000
    memoryBytes: 289406976
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
volumes:
- name: data
  durableDir: {}
