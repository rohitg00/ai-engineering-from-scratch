rules:
- http:
    effects:
      replaceHeaders:
      - credentialUri: ate-secret://k8s.io/default/cred-ns/api-token/token
        header: Authorization
        prefix: 'Bearer '
      - credentialUri: ate-secret://k8s.io/default/cred-ns-not-granted/api-token/token
