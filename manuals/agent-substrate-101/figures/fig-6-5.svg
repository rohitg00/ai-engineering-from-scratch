<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 366" role="img" aria-labelledby="fig-6-5-title fig-6-5-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-5-title">One request with a placeholder header</title>
  <desc id="fig-6-5-desc">Five lifelines: the actor f-main, atenet-egress, the credential provider k8s.io, the Kubernetes Secret cred-ns/api-token, and the upstream host whoami. Six numbered exchanges: the actor sends a request with the header Authorization set to a placeholder, atenet-egress calls FetchSecret with the reference and the actor identity, the provider reads the key token of the Secret, and it returns the secret. atenet-egress sends the request upstream with Authorization set to Bearer and the secret. The upstream answers 200 with a body that repeats the request headers, so the actor reads the secret.</desc>
  <defs><marker id="fig-6-5-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-6-5-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker></defs>
