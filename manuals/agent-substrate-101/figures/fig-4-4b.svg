<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" role="img" aria-labelledby="fig-4-4b-title fig-4-4b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-4b-title">Resume time against the number of resumes at the same instant</title>
  <desc id="fig-4-4b-desc">Seconds for one request to a suspended 50 MiB actor against the number of such requests sent at the same instant, on the x86 server guest with gVisor and a pool with room for 16 actors. Every one of the 155 requests is a small dot, five rounds for each level, and a line joins the medians. 155 of 155 requests returned 200. The median is 0.23 s at 1, 0.23 s at 2, 0.26 s at 4, 0.29 s at 8, 0.37 s at 16. The slowest of the 80 requests at 16 at once took 0.45 s. A dashed line marks 0.5 s.</desc>
