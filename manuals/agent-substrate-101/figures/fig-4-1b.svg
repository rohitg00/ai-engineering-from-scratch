  <text x="466" y="80.82" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">2.00 cores at 2000</text>
  <text x="466" y="161.82" font-size="11.5" font-weight="700" fill="var(--m-violet-ink, #5b4fa3)">1 thread</text>
  <text x="466" y="176.82" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">1.12 cores at 2000,</text>
  <text x="466" y="190.82" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">one thread fills one core</text>
