  <text x="64" y="77.82" font-size="11" class="m-serif" fill="var(--m-violet-ink, #5b4fa3)">0.25, 0.50 and 1.01 cores at 250, 500 and 1000,</text>
  <text x="64" y="91.82" font-size="11" class="m-serif" fill="var(--m-violet-ink, #5b4fa3)">with 1 thread and with 4 threads</text>
