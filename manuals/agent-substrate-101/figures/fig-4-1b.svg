  <text x="252" y="314" font-size="11.5" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">resources.limits.cpuMillicores of the template</text>
  <text x="52" y="28" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">host cores used, from the cgroup of the actor</text>
