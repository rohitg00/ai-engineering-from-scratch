<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="fig-4-1b-title fig-4-1b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-1b-title">Host cores an actor used at four CPU limits</title>
  <desc id="fig-4-1b-desc">A chart of host cores used against the cpuMillicores limit of the template, for a fixed amount of work on 1 thread and on 4 threads, three runs for each point and 24 runs in all. With 1 thread the median was 0.25 at 250, 0.50 at 500, 1.01 at 1000, 1.12 at 2000 millicores. With 4 threads it was 0.25 at 250, 0.50 at 500, 1.00 at 1000, 2.00 at 2000 millicores. A dashed line marks the limit itself. The points follow that line, and 4 threads got no more CPU than 1 thread below 2000 millicores. The same work took 27.4 seconds at 250 millicores and 5.1 seconds at 1000. The program saw 2 CPUs at every limit.</desc>
