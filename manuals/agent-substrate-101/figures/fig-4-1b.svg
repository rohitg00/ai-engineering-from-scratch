  <text x="252" y="297" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">1000</text>
  <line x1="452" y1="280" x2="452" y2="284" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
