  <title id="fig-8-2-title">Three outages, second by second</title>
  <desc id="fig-8-2-desc">Three panels, one for each dependency that was taken away: Postgres for 61 seconds, ate-api-server for 60 seconds, and the Kubernetes API server for 86 seconds. Requests to a running actor and new resumes fail in the first two panels and all succeed in the third, where only requests through kubectl ate proxy fail.</desc>
