<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" role="img" aria-labelledby="fig-4-2b-title fig-4-2b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-2b-title">Resume time against memory held, for both sandbox classes</title>
  <desc id="fig-4-2b-desc">Seconds for one request to a suspended actor against the MiB of random memory it holds, on the x86 server guest, from the snapshot on the node. Every one of the 60 resumes is a small dot, ten for each size and class, and a line joins the medians. The microvm class has a median of 0.33 s at 0 MiB, 0.49 s at 200 MiB, 0.80 s at 500 MiB. The gvisor class has a median of 0.22 s at 0 MiB, 0.47 s at 200 MiB, 1.07 s at 500 MiB. The microvm line starts 0.10 s higher and rises about half as fast, so the two lines cross a little above 200 MiB.</desc>
