<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="fig-5-1-title fig-5-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-1-title">Three clients at the router, on both dataplanes</title>
  <desc id="fig-5-1-desc">Three columns show three clients that call atenet-router on port 443: one with no certificate, one with a certificate for spiffe://cluster.local/ns/probe/sa/default, and one with a certificate for the allowed identity spiffe://cluster.local/ns/ate-system/sa/atenet-client. Two rows show the answer of each dataplane. Envoy closes the connection, sends the TLS alert certificate unknown, and returns 200. agentgateway sends the TLS alert certificate required, resets the connection, and returns 200.</desc>
  <defs><marker id="fig-5-1-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker><marker id="fig-5-1-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">CLIENT</text>
  <rect x="130" y="28" width="150" height="62" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="205" y="54.25" font-size="12.5" text-anchor="middle" font-weight="700">no certificate</text>
  <text x="205" y="71.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">a plain pod</text>
  <rect x="300" y="28" width="150" height="62" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="375" y="54.25" font-size="12.5" text-anchor="middle" font-weight="700">wrong identity</text>
  <text x="375" y="71.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ns/probe/sa/default</text>
  <rect x="470" y="28" width="150" height="62" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="545" y="46.75" font-size="12.5" text-anchor="middle" font-weight="700">allowed identity</text>
  <text x="545" y="64.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ns/ate-system</text>
  <text x="545" y="79.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">sa/atenet-client</text>
  <text x="20" y="154" font-size="12" font-weight="700" fill="var(--m-indigo-ink, #4b4f9e)">Envoy</text>
  <text x="20" y="170" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">atenet-router</text>
  <rect x="130" y="130" width="150" height="56" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <text x="205" y="153.25" font-size="12.5" text-anchor="middle" font-weight="700">connection closed</text>
  <text x="205" y="170.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">curl: Broken pipe</text>
  <rect x="300" y="130" width="150" height="56" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <text x="375" y="153.25" font-size="12.5" text-anchor="middle" font-weight="700">TLS alert</text>
  <text x="375" y="170.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">certificate unknown</text>
  <rect x="470" y="130" width="150" height="56" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="545" y="153.25" font-size="12.5" text-anchor="middle" font-weight="700">200</text>
  <text x="545" y="170.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">on 443 and on 8444</text>
  <text x="20" y="238" font-size="12" font-weight="700" fill="var(--m-indigo-ink, #4b4f9e)">agentgateway</text>
  <text x="20" y="254" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">atenet-router</text>
  <rect x="130" y="214" width="150" height="56" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <text x="205" y="237.25" font-size="12.5" text-anchor="middle" font-weight="700">TLS alert</text>
  <text x="205" y="254.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">certificate required</text>
  <rect x="300" y="214" width="150" height="56" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <text x="375" y="237.25" font-size="12.5" text-anchor="middle" font-weight="700">connection reset</text>
  <text x="375" y="254.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">by peer</text>
  <rect x="470" y="214" width="150" height="56" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="545" y="237.25" font-size="12.5" text-anchor="middle" font-weight="700">200</text>
  <text x="545" y="254.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">on 443 and on 8444</text>
  <line x1="205" y1="90" x2="205" y2="129" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-5-1-head-rose)"/>
  <line x1="375" y1="90" x2="375" y2="129" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-5-1-head-rose)"/>
  <line x1="545" y1="90" x2="545" y2="129" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-1-head-ink)"/>
  <text x="20" y="290" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">target in every probe: ate-demo-counter/my-counter-1</text>
</svg>
