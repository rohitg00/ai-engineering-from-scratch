<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" role="img" aria-labelledby="fig-5-1-title fig-5-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-1-title">The two places that check a client, and what each one decides</title>
  <desc id="fig-5-1-desc">Two bands. In the upper band, kubectl ate with no token file presents the shared identity ate-client to ate-api-server, which accepts a certificate or a bearer JWT and then applies access policies. That identity is a bootstrap owner, so it can manage every actor. In the lower band, three pods call atenet-router, which demands a client certificate whose SPIFFE ID is on one list. The identity atenet-client is on the list and gets 200 from my-counter-1, in an atespace where it holds no role. The identity ns/probe/sa/default gets the TLS alert certificate unknown. A pod with no certificate gets a closed connection.</desc>
  <defs><marker id="fig-5-1-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-5-1-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">THE API: WHO CAN MANAGE ACTORS</text>
  <rect x="20" y="28" width="200" height="64" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="120" y="47.75" font-size="12.5" text-anchor="middle" font-weight="700">kubectl ate</text>
  <text x="120" y="65.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">no --token-file, so it acts as</text>
  <text x="120" y="80.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ate-system:ate-client</text>
  <rect x="250" y="28" width="180" height="64" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="340" y="47.75" font-size="12.5" text-anchor="middle" font-weight="700">ate-api-server</text>
  <text x="340" y="65.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">certificate or bearer JWT</text>
  <text x="340" y="80.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">then the access policies</text>
  <rect x="460" y="28" width="160" height="64" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="540" y="47.75" font-size="12.5" text-anchor="middle" font-weight="700">every actor</text>
  <text x="540" y="65.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">a bootstrap owner</text>
  <text x="540" y="80.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">of all atespaces</text>
  <line x1="220" y1="60" x2="249" y2="60" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-1-head-ink)"/>
  <line x1="430" y1="60" x2="459" y2="60" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-1-head-ink)"/>
  <text x="20" y="130" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">THE ROUTER: WHO CAN CALL AN ACTOR</text>
  <rect x="250" y="140" width="180" height="180" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="340" y="210.25" font-size="12.5" text-anchor="middle" font-weight="700">atenet-router</text>
  <text x="340" y="227.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">client certificate, and</text>
  <text x="340" y="242.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">its SPIFFE ID on one list:</text>
  <text x="340" y="257.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">--ingress-allowed-spiffe-ids</text>
  <rect x="20" y="140" width="200" height="52" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="120" y="160.95" font-size="11.5" text-anchor="middle" font-weight="700">allowed identity</text>
  <text x="120" y="178.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ns/ate-system/sa/atenet-client</text>
  <rect x="460" y="140" width="160" height="52" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="540" y="160.95" font-size="11.5" text-anchor="middle" font-weight="700">200 from my-counter-1</text>
  <text x="540" y="178.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">any actor in any atespace</text>
  <line x1="220" y1="166" x2="249" y2="166" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-1-head-ink)"/>
  <line x1="430" y1="166" x2="459" y2="166" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-1-head-ink)"/>
  <rect x="20" y="204" width="200" height="52" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="120" y="224.95" font-size="11.5" text-anchor="middle" font-weight="700">identity not on the list</text>
  <text x="120" y="242.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ns/probe/sa/default</text>
  <rect x="460" y="204" width="160" height="52" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <text x="540" y="224.95" font-size="11.5" text-anchor="middle" font-weight="700">TLS alert</text>
  <text x="540" y="242.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">certificate unknown</text>
  <line x1="220" y1="230" x2="249" y2="230" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-1-head-ink)"/>
  <line x1="430" y1="230" x2="459" y2="230" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-5-1-head-rose)"/>
  <rect x="20" y="268" width="200" height="52" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="120" y="288.95" font-size="11.5" text-anchor="middle" font-weight="700">no client certificate</text>
  <text x="120" y="306.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">a plain pod</text>
  <rect x="460" y="268" width="160" height="52" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <text x="540" y="288.95" font-size="11.5" text-anchor="middle" font-weight="700">connection closed</text>
  <text x="540" y="306.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">curl: Broken pipe</text>
  <line x1="220" y1="294" x2="249" y2="294" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-1-head-ink)"/>
  <line x1="430" y1="294" x2="459" y2="294" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-5-1-head-rose)"/>
  <text x="20" y="344" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">The refusals are those of the Envoy dataplane. The list names identities and no atespaces.</text>
</svg>
