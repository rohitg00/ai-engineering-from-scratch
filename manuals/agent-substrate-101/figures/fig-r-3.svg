<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 558" role="img" aria-labelledby="fig-r-3-title fig-r-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-r-3-title">The seven states of an actor</title>
  <desc id="fig-r-3-desc">An actor is created SUSPENDED. ResumeActor moves it through RESUMING to RUNNING, and SuspendActor moves it through SUSPENDING back to SUSPENDED. A sandbox death or a failed resume moves it to CRASHED, and RevertActor moves it through REVERTING to SUSPENDED. DeleteActor moves an actor in any state to DELETING.</desc>
  <defs><marker id="fig-r-3-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-r-3-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker><marker id="fig-r-3-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker></defs>
  <rect x="20" y="46" width="130" height="46" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="85" y="64.25" font-size="12.5" text-anchor="middle" font-weight="700">SUSPENDED</text>
  <text x="85" y="81.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">holds no worker</text>
  <rect x="205" y="46" width="120" height="46" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)" stroke-dasharray="5 4"/>
  <text x="265" y="64.25" font-size="12.5" text-anchor="middle" font-weight="700">RESUMING</text>
  <text x="265" y="81.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">worker bound</text>
  <rect x="380" y="46" width="120" height="46" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="440" y="64.25" font-size="12.5" text-anchor="middle" font-weight="700">RUNNING</text>
  <text x="440" y="81.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">serves requests</text>
  <rect x="205" y="140" width="120" height="46" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)" stroke-dasharray="5 4"/>
  <text x="265" y="158.25" font-size="12.5" text-anchor="middle" font-weight="700">SUSPENDING</text>
  <text x="265" y="175.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">checkpoint</text>
  <rect x="530" y="140" width="90" height="46" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="575" y="158.25" font-size="12.5" text-anchor="middle" font-weight="700">CRASHED</text>
  <text x="575" y="175.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">503</text>
  <rect x="205" y="234" width="120" height="46" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)" stroke-dasharray="5 4"/>
  <text x="265" y="252.25" font-size="12.5" text-anchor="middle" font-weight="700">REVERTING</text>
  <text x="265" y="269.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">to durable</text>
  <rect x="500" y="296" width="120" height="46" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <rect x="503" y="299" width="114" height="40" fill="none" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="560" y="314.25" font-size="12.5" text-anchor="middle" font-weight="700">DELETING</text>
  <text x="560" y="331.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">from any state</text>
  <line x1="85" y1="14" x2="85" y2="45" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-r-3-head-ink)"/>
  <line x1="150" y1="69" x2="204" y2="69" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-r-3-head-amber)"/>
  <line x1="325" y1="69" x2="379" y2="69" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-r-3-head-amber)"/>
  <path d="M440 92 V163 H326" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-r-3-head-amber)"/>
  <path d="M205 163 H110 V93" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-r-3-head-amber)"/>
  <path d="M500 69 H560 V139" fill="none" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-r-3-head-rose)"/>
  <path d="M265 46 V26 H600 V139" fill="none" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-r-3-head-rose)"/>
  <path d="M575 186 V267 H326" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-r-3-head-amber)"/>
  <path d="M470 92 V247 H326" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-r-3-head-amber)"/>
  <path d="M205 257 H50 V93" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-r-3-head-amber)"/>
  <circle cx="101" cy="28" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="101" y="32" font-size="11" text-anchor="middle">1</text>
  <circle cx="177" cy="53" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-amber-ink, #85590c)" stroke-width="1"/>
  <text x="177" y="57" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">2</text>
  <circle cx="352" cy="53" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-amber-ink, #85590c)" stroke-width="1"/>
  <text x="352" y="57" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">3</text>
  <circle cx="383" cy="149" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-amber-ink, #85590c)" stroke-width="1"/>
  <text x="383" y="153" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">4</text>
  <circle cx="160" cy="149" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-amber-ink, #85590c)" stroke-width="1"/>
  <text x="160" y="153" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">5</text>
  <circle cx="530" cy="53" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1"/>
  <text x="530" y="57" font-size="11" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">6</text>
  <circle cx="430" cy="13" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1"/>
  <text x="430" y="17" font-size="11" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">7</text>
  <circle cx="400" cy="233" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-amber-ink, #85590c)" stroke-width="1"/>
  <text x="400" y="237" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">8</text>
  <circle cx="128" cy="243" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-amber-ink, #85590c)" stroke-width="1"/>
  <text x="128" y="247" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">9</text>
  <circle cx="30" cy="370" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="30" y="374" font-size="11" text-anchor="middle">1</text>
  <text x="48" y="374" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">CreateActor: a new actor starts SUSPENDED, with the golden snapshot</text>
  <circle cx="30" cy="387" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-amber-ink, #85590c)" stroke-width="1"/>
  <text x="30" y="391" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">2</text>
  <text x="48" y="391" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ResumeActor, from the router on each request or from a caller</text>
  <circle cx="30" cy="404" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-amber-ink, #85590c)" stroke-width="1"/>
  <text x="30" y="408" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">3</text>
  <text x="48" y="408" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the sandbox is restored and the wakeup probe passed</text>
  <circle cx="30" cy="421" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-amber-ink, #85590c)" stroke-width="1"/>
  <text x="30" y="425" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">4</text>
  <text x="48" y="425" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">SuspendActor: the worker writes a checkpoint</text>
  <circle cx="30" cy="438" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-amber-ink, #85590c)" stroke-width="1"/>
  <text x="30" y="442" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">5</text>
  <text x="48" y="442" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the snapshot is on the node (async) or in the bucket (sync)</text>
  <circle cx="30" cy="455" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1"/>
  <text x="30" y="459" font-size="11" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">6</text>
  <text x="48" y="459" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the sandbox died, the worker pod went away, or the kernel killed it</text>
  <circle cx="30" cy="472" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1"/>
  <text x="30" y="476" font-size="11" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">7</text>
  <text x="48" y="476" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the resume failed, for example with no snapshot on the node</text>
  <circle cx="30" cy="489" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-amber-ink, #85590c)" stroke-width="1"/>
  <text x="30" y="493" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">8</text>
  <text x="48" y="493" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">RevertActor, from CRASHED or from RUNNING</text>
  <circle cx="30" cy="506" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-amber-ink, #85590c)" stroke-width="1"/>
  <text x="30" y="510" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">9</text>
  <text x="48" y="510" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the actor is back at its last durable snapshot</text>
  <text x="20" y="532" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">dashed border: a state that a workflow passes through</text>
  <text x="20" y="548" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">double border: the record is removed next</text>
</svg>
