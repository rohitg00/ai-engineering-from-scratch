<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" role="img" aria-labelledby="fig-7-1d-title fig-7-1d-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-1d-title">Every kagent turn with a small real model on CPU</title>
  <desc id="fig-7-1d-desc">All 50 turns of the kagent run with a small open model on CPU, one bar each, in the order of the run. The plum part of a bar is the time of the model requests and the amber part is the rest of the turn, which holds the resume and the suspend. With the 3b model, a turn in one session took a median of 17.1 s and the model was 93 percent of it. With the 1.5b model the median was 11.0 s. 48 turns were clean. One turn with the 1.5b model did not end: the client gave up after 300 seconds, and the next turn waited 190 seconds behind it.</desc>
