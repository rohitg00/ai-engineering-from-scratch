  <title id="fig-8-1b-title">A bucket outside the cluster, and 20 or 100 ms of added round trip</title>
  <desc id="fig-8-1b-desc">Two panels plot every one of 49 cycles on one guest. With the bucket outside the cluster and no added delay, a resume of 1,000 MiB from the bucket took a median of 4.79 s. With 20 ms of added round trip it took 10.24 s, and the synchronous suspend took 8.39 s against 7.09 s. At 100 ms only actors with no data in memory were measured.</desc>
