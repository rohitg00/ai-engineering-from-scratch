<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="fig-8-1b-title fig-8-1b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-8-1b-title">Disk use with 25 suspended actors, and after their deletion</title>
  <desc id="fig-8-1b-desc">Horizontal bars for three places, each with 25 suspended actors and after the actors were deleted. The bucket held 10,824 MiB and then 2,064 MiB. The node snapshot directory held 8,801 MiB and then 1 MiB. The node snapshot cache held 1,765 MiB both times. A line marks the 8,750 MiB of memory that the actors held.</desc>
  <rect x="20" y="14" width="12" height="9" fill="var(--m-ink-soft, #4a4a4a)"/>
  <text x="38" y="23" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">with 25 suspended actors</text>
  <rect x="250" y="14" width="12" height="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-soft, #4a4a4a)"/>
  <text x="268" y="23" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">after the actors were deleted</text>
  <line x1="186" y1="54" x2="186" y2="248" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="1"/>
  <text x="186" y="264" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">0</text>
  <line x1="286" y1="54" x2="286" y2="248" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="286" y="264" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">3,000</text>
  <line x1="386" y1="54" x2="386" y2="248" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="386" y="264" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">6,000</text>
  <line x1="486" y1="54" x2="486" y2="248" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="486" y="264" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">9,000</text>
  <line x1="586" y1="54" x2="586" y2="248" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="586" y="264" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">12,000</text>
  <line x1="186" y1="248" x2="586" y2="248" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="386" y="282" font-size="11.5" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">MiB on disk, as du reports it</text>
  <line x1="477.67" y1="54" x2="477.67" y2="248" stroke="var(--m-green-ink, #336b40)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="471.67" y="50" font-size="11" text-anchor="end" class="m-serif" fill="var(--m-green-ink, #336b40)">memory that the actors held: 8,750 MiB</text>
  <text x="20" y="80" font-size="11" font-weight="700" fill="var(--m-teal-ink, #18696a)">bucket ate-snapshots</text>
  <text x="20" y="96" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">golden snapshots stay</text>
  <rect x="186" y="66" width="360.8" height="16" fill="var(--m-teal-ink, #18696a)"/>
  <rect class="m-knock" x="549.8" y="67.42" width="72" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="552.8" y="78" font-size="11" font-weight="700" fill="var(--m-teal-ink, #18696a)">10,824 MiB</text>
  <rect x="186" y="88" width="68.8" height="16" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <rect class="m-knock" x="257.8" y="89.42" width="65.4" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="260.8" y="100" font-size="11" fill="var(--m-teal-ink, #18696a)">2,064 MiB</text>
  <text x="20" y="142" font-size="11" font-weight="700" fill="var(--m-violet-ink, #5b4fa3)">node snapshots/</text>
  <text x="20" y="158" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">removed with the actors</text>
  <rect x="186" y="128" width="293.37" height="16" fill="var(--m-violet-ink, #5b4fa3)"/>
  <rect class="m-knock" x="482.37" y="129.42" width="65.4" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="485.37" y="140" font-size="11" font-weight="700" fill="var(--m-violet-ink, #5b4fa3)">8,801 MiB</text>
  <rect x="186" y="150" width="1" height="16" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <rect class="m-knock" x="189.03" y="151.42" width="39" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="192.03" y="162" font-size="11" fill="var(--m-violet-ink, #5b4fa3)">1 MiB</text>
  <text x="20" y="204" font-size="11" font-weight="700" fill="var(--m-violet-ink, #5b4fa3)">node snapshot-cache/</text>
  <text x="20" y="220" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">atelet trims it later</text>
  <rect x="186" y="190" width="58.83" height="16" fill="var(--m-violet-ink, #5b4fa3)"/>
  <rect class="m-knock" x="247.83" y="191.42" width="65.4" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="250.83" y="202" font-size="11" font-weight="700" fill="var(--m-violet-ink, #5b4fa3)">1,765 MiB</text>
  <rect x="186" y="212" width="58.83" height="16" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <rect class="m-knock" x="247.83" y="213.42" width="65.4" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="250.83" y="224" font-size="11" fill="var(--m-violet-ink, #5b4fa3)">1,765 MiB</text>
</svg>
