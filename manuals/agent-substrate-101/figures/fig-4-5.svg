  <rect x="379" y="96" width="28" height="28" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <rect x="413" y="96" width="28" height="28" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <rect x="447" y="96" width="28" height="28" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <rect x="481" y="96" width="28" height="28" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <rect x="515" y="96" width="28" height="28" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <rect x="549" y="96" width="28" height="28" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <rect x="583" y="96" width="28" height="28" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="478" y="146" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">CPU 16000/16000, 16 turns run</text>
  <rect x="345" y="162" width="28" height="28" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-dasharray="5 4"/>
  <rect x="379" y="162" width="28" height="28" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-dasharray="5 4"/>
  <rect x="413" y="162" width="28" height="28" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-dasharray="5 4"/>
  <rect x="447" y="162" width="28" height="28" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-dasharray="5 4"/>
  <rect x="481" y="162" width="28" height="28" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-dasharray="5 4"/>
  <rect x="515" y="162" width="28" height="28" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-dasharray="5 4"/>
  <rect x="549" y="162" width="28" height="28" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-dasharray="5 4"/>
  <rect x="583" y="162" width="28" height="28" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-dasharray="5 4"/>
  <text x="478" y="210" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">8 more turns wait for a free CPU</text>
  <text x="336" y="252" font-size="11.5">24 turns at once, all completed</text>
  <text x="336" y="270" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">in 4.3 to 7.8 s on the kagent guest</text>
  <rect x="20" y="298" width="14" height="12" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="40" y="308" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">running actor, 1 CPU</text>
  <rect x="180" y="298" width="14" height="12" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-dasharray="5 4"/>
  <text x="200" y="308" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">waits</text>
  <rect x="244" y="298" width="14" height="12" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <text x="264" y="308" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">refused</text>
</svg>
