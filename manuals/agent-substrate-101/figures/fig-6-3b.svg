<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" role="img" aria-labelledby="fig-6-3b-title fig-6-3b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-3b-title">DNS answers for example.com after a rule for it is added</title>
  <desc id="fig-6-3b-desc">Three tracks over a time axis in seconds, where zero is the moment the policy update returned. In the polled run on Envoy and in the polled run on agentgateway, the samples up to 2 seconds before zero are NXDOMAIN and every later sample is an answer. In a third run on Envoy, with no earlier lookup of the name, requests at 14 and 16 seconds did not resolve the host, and a request at 18 seconds did.</desc>
