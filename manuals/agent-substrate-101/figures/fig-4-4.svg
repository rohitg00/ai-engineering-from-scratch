<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="fig-4-4-title fig-4-4-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-4-title">Requests to a full pool against the 5 second parking budget</title>
  <desc id="fig-4-4-desc">Four rows on a time axis from 0 to 6 seconds, with a dashed line at the 5 second parking budget. Two requests to a pool with a free worker return 200 in 0.32 and 0.36 seconds. 9 requests to a full pool each wait 5.05 to 5.06 seconds and return 503. One parked request returns 200 in 2.65 seconds, because a worker became free 2.37 seconds into its wait. In a 30 second load run, 90 of 92 requests were served, in 0.85 seconds on average and 4.27 seconds at the slowest.</desc>
  <line x1="244" y1="34" x2="244" y2="252" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="318" y1="34" x2="318" y2="252" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="392" y1="34" x2="392" y2="252" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="466" y1="34" x2="466" y2="252" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="540" y1="34" x2="540" y2="252" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="614" y1="34" x2="614" y2="252" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="540" y1="26" x2="540" y2="252" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="534" y="22" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-amber-ink, #85590c)">parking budget 5 s</text>
  <text x="20" y="56" font-size="12" font-weight="700">free worker</text>
  <text x="20" y="72" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">p1 and p2, no wait</text>
  <rect x="170" y="48" width="26.49" height="16" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <circle cx="196.49" cy="56" r="3.2" fill="var(--m-green-ink, #336b40)"/>
  <circle cx="193.93" cy="56" r="3.2" fill="var(--m-green-ink, #336b40)"/>
  <rect class="m-knock" x="203.49" y="49.03" width="157.8" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="206.49" y="60" font-size="11.5" font-weight="700" fill="var(--m-green-ink, #336b40)">200 in 0.32 and 0.36 s</text>
  <text x="20" y="108" font-size="12" font-weight="700">full pool</text>
  <text x="20" y="124" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">9 requests, no worker</text>
  <rect x="170" y="100" width="374.63" height="16" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <circle cx="544.46" cy="108" r="3.2" fill="var(--m-rose-ink, #b0344d)"/>
  <circle cx="544.14" cy="108" r="3.2" fill="var(--m-rose-ink, #b0344d)"/>
  <circle cx="544.37" cy="108" r="3.2" fill="var(--m-rose-ink, #b0344d)"/>
  <circle cx="544.39" cy="108" r="3.2" fill="var(--m-rose-ink, #b0344d)"/>
  <circle cx="544.24" cy="108" r="3.2" fill="var(--m-rose-ink, #b0344d)"/>
  <circle cx="544.43" cy="108" r="3.2" fill="var(--m-rose-ink, #b0344d)"/>
  <circle cx="544.63" cy="108" r="3.2" fill="var(--m-rose-ink, #b0344d)"/>
  <circle cx="543.91" cy="108" r="3.2" fill="var(--m-rose-ink, #b0344d)"/>
  <circle cx="544.41" cy="108" r="3.2" fill="var(--m-rose-ink, #b0344d)"/>
  <rect class="m-knock" x="384.1" y="83.03" width="150.9" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="532" y="94" font-size="11.5" text-anchor="end" font-weight="700" fill="var(--m-rose-ink, #b0344d)">503 in 5.05 to 5.06 s</text>
  <text x="20" y="160" font-size="12" font-weight="700">full pool</text>
  <text x="20" y="176" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">p3, then p1 suspends</text>
  <rect x="170" y="152" width="195.91" height="16" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <circle cx="365.91" cy="160" r="3.2" fill="var(--m-green-ink, #336b40)"/>
  <rect class="m-knock" x="372.91" y="153.03" width="95.7" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="375.91" y="164" font-size="11.5" font-weight="700" fill="var(--m-green-ink, #336b40)">200 in 2.65 s</text>
  <line x1="345.38" y1="147" x2="345.38" y2="173" stroke="var(--m-violet-ink, #5b4fa3)" stroke-width="1.6"/>
  <rect class="m-knock" x="203.78" y="175.42" width="283.2" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="345.38" y="186" font-size="11" text-anchor="middle" fill="var(--m-violet-ink, #5b4fa3)">worker free at 2.37 s, answer 0.28 s later</text>
  <text x="20" y="212" font-size="12" font-weight="700">load run, 30 s</text>
  <text x="20" y="228" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">90 of 92 served</text>
  <rect x="170" y="204" width="315.91" height="16" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)" stroke-dasharray="5 4"/>
  <circle cx="485.91" cy="212" r="3.2" fill="var(--m-green-ink, #336b40)"/>
  <rect class="m-knock" x="492.91" y="205.03" width="102.6" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="495.91" y="216" font-size="11.5" font-weight="700" fill="var(--m-green-ink, #336b40)">slowest 4.27 s</text>
  <line x1="232.68" y1="199" x2="232.68" y2="225" stroke="var(--m-green-ink, #336b40)" stroke-width="1.6"/>
  <rect class="m-knock" x="235.68" y="227.42" width="98.4" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="238.68" y="238" font-size="11" fill="var(--m-green-ink, #336b40)">average 0.85 s</text>
