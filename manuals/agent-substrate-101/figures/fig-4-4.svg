  <line x1="170" y1="252" x2="614" y2="252" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="170" y1="252" x2="170" y2="257" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="170" y="270" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">0</text>
  <line x1="244" y1="252" x2="244" y2="257" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="244" y="270" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">1</text>
  <line x1="318" y1="252" x2="318" y2="257" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="318" y="270" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">2</text>
  <line x1="392" y1="252" x2="392" y2="257" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="392" y="270" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">3</text>
  <line x1="466" y1="252" x2="466" y2="257" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="466" y="270" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">4</text>
  <line x1="540" y1="252" x2="540" y2="257" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="540" y="270" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">5</text>
  <line x1="614" y1="252" x2="614" y2="257" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="614" y="270" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">6</text>
  <text x="392" y="290" font-size="11.5" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">seconds from the start of the request to its answer</text>
</svg>
