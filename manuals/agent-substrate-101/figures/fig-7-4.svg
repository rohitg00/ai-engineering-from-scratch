<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 366" role="img" aria-labelledby="fig-7-4-title fig-7-4-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-4-title">Five questions that decide if Agent Substrate fits</title>
  <desc id="fig-7-4-desc">Five questions in a column. A no on any question leads right to a simpler choice: a pod on a GPU node, a plain pod per agent, a new sandbox per session, a hosted sandbox, or a harness that must come first. Five yes answers lead to Agent Substrate.</desc>
  <defs><marker id="fig-7-4-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker><marker id="fig-7-4-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <rect x="20" y="20" width="310" height="34" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="175" y="40.45" font-size="11.5" text-anchor="middle" font-weight="700">1 · the agent runs on CPU only?</text>
  <line x1="330" y1="37" x2="382" y2="37" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-4-head-rose)"/>
  <rect class="m-knock" x="346.1" y="20.03" width="19.8" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="356" y="31" font-size="11.5" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">no</text>
  <text x="390" y="41" font-size="11" class="m-serif" fill="var(--m-rose-ink, #b0344d)">a pod per agent, on a GPU node</text>
  <line x1="175" y1="54" x2="175" y2="77" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-4-head-ink)"/>
  <rect x="20" y="78" width="310" height="34" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="175" y="98.45" font-size="11.5" text-anchor="middle" font-weight="700">2 · the agent is idle most of the time?</text>
  <line x1="330" y1="95" x2="382" y2="95" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-4-head-rose)"/>
  <rect class="m-knock" x="346.1" y="78.03" width="19.8" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="356" y="89" font-size="11.5" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">no</text>
  <text x="390" y="99" font-size="11" class="m-serif" fill="var(--m-rose-ink, #b0344d)">a plain pod per agent</text>
  <line x1="175" y1="112" x2="175" y2="135" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-4-head-ink)"/>
  <rect x="20" y="136" width="310" height="34" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="175" y="156.45" font-size="11.5" text-anchor="middle" font-weight="700">3 · state must outlive the idle time?</text>
  <line x1="330" y1="153" x2="382" y2="153" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-4-head-rose)"/>
  <rect class="m-knock" x="346.1" y="136.03" width="19.8" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="356" y="147" font-size="11.5" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">no</text>
  <text x="390" y="157" font-size="11" class="m-serif" fill="var(--m-rose-ink, #b0344d)">a new sandbox for each session</text>
  <line x1="175" y1="170" x2="175" y2="193" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-4-head-ink)"/>
  <rect x="20" y="194" width="310" height="34" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="175" y="214.45" font-size="11.5" text-anchor="middle" font-weight="700">4 · you can operate Postgres?</text>
  <line x1="330" y1="211" x2="382" y2="211" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-4-head-rose)"/>
  <rect class="m-knock" x="346.1" y="194.03" width="19.8" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="356" y="205" font-size="11.5" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">no</text>
  <text x="390" y="215" font-size="11" class="m-serif" fill="var(--m-rose-ink, #b0344d)">a hosted sandbox</text>
  <line x1="175" y1="228" x2="175" y2="251" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-4-head-ink)"/>
  <rect x="20" y="252" width="310" height="34" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="175" y="272.45" font-size="11.5" text-anchor="middle" font-weight="700">5 · something calls SuspendActor?</text>
  <line x1="330" y1="269" x2="382" y2="269" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-4-head-rose)"/>
  <rect class="m-knock" x="346.1" y="252.03" width="19.8" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="356" y="263" font-size="11.5" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">no</text>
  <text x="390" y="273" font-size="11" class="m-serif" fill="var(--m-rose-ink, #b0344d)">add a harness first, such as kagent</text>
  <line x1="175" y1="286" x2="175" y2="311" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-4-head-ink)"/>
  <rect class="m-knock" x="180" y="287.53" width="26.7" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="183" y="298.5" font-size="11.5">yes</text>
  <rect x="20" y="312" width="310" height="40" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="175" y="327.1" font-size="12" text-anchor="middle" font-weight="700">Agent Substrate</text>
  <text x="175" y="344.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">many stateful actors on few worker pods</text>
</svg>
