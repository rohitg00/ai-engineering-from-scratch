  <title id="fig-8-2f-title">Five drains of one worker node, request by request</title>
  <desc id="fig-8-2f-desc">Five rows, one for each actor state at the moment of a kubectl drain. The two actors that were RUNNING failed every request after the drain until a revert that we sent, 46 of 62 and 16 of 30 requests. The three suspended actors returned 200 on their first request after the drain with no command, on the other node.</desc>
