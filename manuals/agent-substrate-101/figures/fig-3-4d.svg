  <circle cx="357" cy="307.74" r="2" fill="var(--m-teal-ink, #18696a)"/>
  <text x="396" y="268" font-size="11.5" font-weight="700" fill="var(--m-teal-ink, #18696a)">all zero bytes</text>
  <text x="396" y="283" font-size="11" fill="var(--m-teal-ink, #18696a)">4.0 and 4.6 MiB</text>
  <text x="396" y="298" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">about 4 MiB at both sizes</text>
  <text x="396" y="313" font-size="11" class="m-serif" fill="var(--m-violet-ink, #5b4fa3)">resume 0.24 and 0.23 s</text>
  <circle cx="62.8" cy="54.73" r="3.2" fill="var(--m-teal-ink, #18696a)"/>
  <text x="71.8" y="58.73" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">one actor, one du reading</text>
  <text x="396" y="342" font-size="11" class="m-serif" fill="var(--m-violet-ink, #5b4fa3)">resume: median of 10, from the node</text>
</svg>
