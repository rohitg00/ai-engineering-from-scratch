<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 362" role="img" aria-labelledby="fig-3-4d-title fig-3-4d-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-4d-title">Snapshot size on the node against memory held, for three kinds of memory</title>
  <desc id="fig-3-4d-desc">MiB of the snapshot on the node against the MiB of memory that the actor holds, on the x86 server guest with gVisor, one actor for each of six templates. All random bytes: 203.8 MiB at 200 MiB held and 504.1 MiB at 500 MiB held. Half zero and half random: 103.8 MiB at 200 MiB held and 254.4 MiB at 500 MiB held. All zero bytes: 4.0 MiB at 200 MiB held and 4.6 MiB at 500 MiB held. A dashed line marks a snapshot as large as the memory held. The median resume from the node, of ten for each actor, is 0.42 s and 1.07 s for random, 0.28 s and 0.57 s for half and half, and 0.24 s and 0.23 s for zero.</desc>
  <line x1="52" y1="310" x2="382" y2="310" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="46" y="314" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">0</text>
  <line x1="52" y1="260.91" x2="382" y2="260.91" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="46" y="264.91" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">100</text>
  <line x1="52" y1="211.82" x2="382" y2="211.82" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="46" y="215.82" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">200</text>
  <line x1="52" y1="162.73" x2="382" y2="162.73" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="46" y="166.73" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">300</text>
  <line x1="52" y1="113.64" x2="382" y2="113.64" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="46" y="117.64" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">400</text>
  <line x1="52" y1="64.55" x2="382" y2="64.55" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="46" y="68.55" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">500</text>
  <line x1="52" y1="310" x2="382" y2="310" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="52" y1="40" x2="52" y2="310" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="52" y1="310" x2="52" y2="314" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="52" y="327" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">0</text>
  <line x1="172" y1="310" x2="172" y2="314" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="172" y="327" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">200</text>
  <line x1="352" y1="310" x2="352" y2="314" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="352" y="327" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">500</text>
  <text x="217" y="344" font-size="11.5" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">memory the actor holds, MiB</text>
  <text x="52" y="28" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">snapshot on the node, MiB</text>
  <line x1="52" y1="310" x2="382" y2="40" stroke="var(--m-ink-soft, #4a4a4a)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="232" y="103.82" font-size="11" text-anchor="end" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">size equals memory held</text>
  <path d="M172.0 210.0 L352.0 62.5" fill="none" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.4" stroke-linejoin="round"/>
