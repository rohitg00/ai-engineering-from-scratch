  <text x="396" y="168" font-size="11.5" font-weight="700" fill="var(--m-teal-ink, #18696a)">half zero, half random</text>
  <text x="396" y="183" font-size="11" fill="var(--m-teal-ink, #18696a)">103.8 and 254.4 MiB</text>
  <text x="396" y="198" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">half of the memory</text>
  <text x="396" y="213" font-size="11" class="m-serif" fill="var(--m-violet-ink, #5b4fa3)">resume 0.28 and 0.57 s</text>
