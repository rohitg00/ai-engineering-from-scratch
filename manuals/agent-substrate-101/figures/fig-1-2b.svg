<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" role="img" aria-labelledby="fig-1-2b-title fig-1-2b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-1-2b-title">Six requests to my-counter-1, and its state in the 900 seconds between the last two</title>
  <desc id="fig-1-2b-desc">The upper part has six horizontal bars with the client time of each request through kubectl ate proxy on the x86 server guest: request 1 0.358 s, request 2 0.091 s, request 3 0.067 s, request 4 0.062 s, request 5 0.068 s, request 6 0.080 s. The first bar is amber because it includes the resume from the golden snapshot, which adds about 0.29 s. The other bars are green because the actor was already running. The lower part is a time axis of the 913 seconds with no request between request 5 and request 6. It has one dot for each of the 60 state samples, and all 60 are in the row ACTOR_STATE_RUNNING. The row ACTOR_STATE_SUSPENDED is empty.</desc>
