<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" role="img" aria-labelledby="fig-6-6-title fig-6-6-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-6-title">Idle memory of each dataplane, container by container</title>
  <desc id="fig-6-6-desc">Two stacked bars on an axis from 0 to 100 MB. The Envoy dataplane has 5 containers that hold 91 MB in total: atenet-router and envoy in the pod atenet-router, and envoy, ext-proc, and sdsmint in the pod atenet-egress. Only sdsmint holds the CA key. The agentgateway dataplane has 2 containers that hold 38 MB in total: one agentgateway container in each pod. The agentgateway container in atenet-egress holds the CA key.</desc>
