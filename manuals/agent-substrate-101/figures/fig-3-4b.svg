<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" role="img" aria-labelledby="fig-3-4b-title fig-3-4b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-4b-title">What each snapshot fidelity keeps</title>
  <desc id="fig-3-4b-desc">Three columns for the three snapshot fidelity levels. SNAPSHOT_FIDELITY_VOLUMES keeps only durable volumes and resumes with new processes. SNAPSHOT_FIDELITY_ROOTFS keeps durable volumes and root filesystem writes and also resumes with new processes. SNAPSHOT_FIDELITY_MEMORY keeps volumes, root filesystem writes and process memory, so the same processes continue. Rows under the columns give what one actor for each level showed on the x86 server guest after 25 calls with suspends between them: its three counts, its median resume from the node, and its snapshot size. VOLUMES: counts memory 1, rootfs 1, volume 25, 0.52 s median of 10, snapshot 44 KiB. ROOTFS: counts memory 1, rootfs 25, volume 25, 0.50 s median of 10, snapshot 72 KiB. MEMORY: counts memory 25, rootfs 25, volume 25, 0.25 s median of 10, snapshot 56.9 MiB.</desc>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">LAYER</text>
  <text x="225" y="18" font-size="12" text-anchor="middle" font-weight="700">VOLUMES</text>
  <text x="385" y="18" font-size="12" text-anchor="middle" font-weight="700">ROOTFS</text>
  <text x="545" y="18" font-size="12" text-anchor="middle" font-weight="700">MEMORY</text>
  <text x="20" y="52" font-size="12" font-weight="700">durable volumes</text>
  <text x="20" y="68" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">durableDir mounts</text>
  <rect x="150" y="30" width="150" height="48" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="225" y="57.75" font-size="12.5" text-anchor="middle" font-weight="700">kept</text>
  <rect x="310" y="30" width="150" height="48" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="385" y="57.75" font-size="12.5" text-anchor="middle" font-weight="700">kept</text>
  <rect x="470" y="30" width="150" height="48" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="545" y="57.75" font-size="12.5" text-anchor="middle" font-weight="700">kept</text>
  <text x="20" y="110" font-size="12" font-weight="700">root filesystem</text>
  <text x="20" y="126" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">writes since boot</text>
  <rect x="150" y="88" width="150" height="48" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)" stroke-dasharray="5 4"/>
  <text x="225" y="115.75" font-size="12.5" text-anchor="middle" font-weight="400">gone</text>
  <rect x="310" y="88" width="150" height="48" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="385" y="115.75" font-size="12.5" text-anchor="middle" font-weight="700">kept</text>
  <rect x="470" y="88" width="150" height="48" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="545" y="115.75" font-size="12.5" text-anchor="middle" font-weight="700">kept</text>
  <text x="20" y="168" font-size="12" font-weight="700">process memory</text>
  <text x="20" y="184" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">processes and RAM</text>
  <rect x="150" y="146" width="150" height="48" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)" stroke-dasharray="5 4"/>
  <text x="225" y="173.75" font-size="12.5" text-anchor="middle" font-weight="400">gone</text>
  <rect x="310" y="146" width="150" height="48" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)" stroke-dasharray="5 4"/>
  <text x="385" y="173.75" font-size="12.5" text-anchor="middle" font-weight="400">gone</text>
  <rect x="470" y="146" width="150" height="48" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="545" y="173.75" font-size="12.5" text-anchor="middle" font-weight="700">kept</text>
  <text x="20" y="222" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">ON RESUME</text>
  <text x="20" y="280" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">COUNTS</text>
  <text x="20" y="296" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">after 25 calls</text>
  <text x="225" y="222" font-size="11.5" text-anchor="middle" font-weight="700" fill="var(--m-ink, #1a1a1a)">new processes</text>
  <text x="225" y="238" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-violet-ink, #5b4fa3)">0.52 s median of 10</text>
  <text x="225" y="254" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-teal-ink, #18696a)">snapshot 44 KiB</text>
  <text x="225" y="280" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">memory 1, rootfs 1,</text>
  <text x="225" y="296" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">volume 25</text>
  <text x="385" y="222" font-size="11.5" text-anchor="middle" font-weight="700" fill="var(--m-ink, #1a1a1a)">new processes</text>
  <text x="385" y="238" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-violet-ink, #5b4fa3)">0.50 s median of 10</text>
  <text x="385" y="254" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-teal-ink, #18696a)">snapshot 72 KiB</text>
  <text x="385" y="280" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">memory 1, rootfs 25,</text>
  <text x="385" y="296" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">volume 25</text>
  <text x="545" y="222" font-size="11.5" text-anchor="middle" font-weight="700" fill="var(--m-ink, #1a1a1a)">same processes</text>
  <text x="545" y="238" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-violet-ink, #5b4fa3)">0.25 s median of 10</text>
  <text x="545" y="254" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-teal-ink, #18696a)">snapshot 56.9 MiB</text>
  <text x="545" y="280" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">memory 25, rootfs 25,</text>
  <text x="545" y="296" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">volume 25</text>
  <line x1="20" y1="264" x2="620" y2="264" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.4"/>
  <text x="20" y="326" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">The enum names carry the prefix SNAPSHOT_FIDELITY_.</text>
  <text x="20" y="342" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Each level includes the levels to its left.</text>
  <text x="20" y="358" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">A count of 1 means that the count started again at the last resume.</text>
</svg>
