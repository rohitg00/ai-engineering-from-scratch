  <title id="fig-7-1c-title">Parallel kagent turns on one worker that holds 16 actors</title>
  <desc id="fig-7-1c-desc">Seconds at the client for every turn of two tests on one worker pod, sorted from the fastest to the slowest. Eight turns that started together took 2.47 to 3.57 seconds. Of 24 turns that started together, the first 16 took 4.25 to 5.45 seconds and the last 8 took 6.45 to 7.85 seconds, because the worker ran at most 16 actors. One turn alone took 1.22 seconds.</desc>
