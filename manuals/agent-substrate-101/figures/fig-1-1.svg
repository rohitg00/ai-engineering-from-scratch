<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" role="img" aria-labelledby="fig-1-1-title fig-1-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-1-1-title">What Substrate does and what it leaves to you</title>
  <desc id="fig-1-1-desc">Three worker pods of the WorkerPool counter sit in a row. The middle pod, counter-7cc7dcd596-ffxwt, runs the actor my-counter-1, and the other two run no actor. Below them the object store holds one snapshot for each suspended actor, and ate-api-server with Postgres holds the state of every actor. A dashed amber arrow from the object store to the actor says that a request resumes the actor, which Substrate does, in 0.36 s in our run. A thick teal arrow from the actor to the object store is SuspendActor, which you must call: after 900 s with no request the actor was RUNNING in 60 of 60 samples. Two lists at the bottom divide the work. Substrate resumes on a request, writes the snapshot at a suspend, routes each request, and limits what an actor can reach. You call SuspendActor, change the number of workers, call RevertActor after a crash, and run GPU work elsewhere.</desc>
  <defs><marker id="fig-1-1-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker><marker id="fig-1-1-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-teal-ink, #18696a)"/></marker><marker id="fig-1-1-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">WORKERPOOL COUNTER · 3 WORKER PODS, EACH HAS ROOM FOR 1 ACTOR OF THIS SIZE</text>
  <rect x="20" y="28" width="190" height="44" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)" stroke-dasharray="5 4"/>
  <text x="115" y="44.8" font-size="11" text-anchor="middle" font-weight="700">counter-7cc7dcd596-5tj9h</text>
  <text x="115" y="61.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">no actor</text>
  <rect x="225" y="28" width="190" height="44" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="320" y="44.8" font-size="11" text-anchor="middle" font-weight="700">counter-7cc7dcd596-ffxwt</text>
  <text x="320" y="61.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">CPU 1000 of 1000 millicores</text>
  <rect x="430" y="28" width="190" height="44" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)" stroke-dasharray="5 4"/>
  <text x="525" y="44.8" font-size="11" text-anchor="middle" font-weight="700">counter-7cc7dcd596-p6g2q</text>
  <text x="525" y="61.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">no actor</text>
  <rect x="235" y="92" width="170" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)" stroke-width="1.6"/>
  <text x="320" y="109.25" font-size="12.5" text-anchor="middle" font-weight="700">my-counter-1</text>
  <text x="320" y="126.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ACTOR_STATE_RUNNING</text>
  <line x1="320" y1="72" x2="320" y2="92" stroke="var(--m-green-ink, #336b40)" stroke-width="1.6"/>
  <rect x="20" y="192" width="300" height="46" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="170" y="210.25" font-size="12.5" text-anchor="middle" font-weight="700">object store</text>
  <text x="170" y="227.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">one snapshot for each suspended actor</text>
  <rect x="350" y="192" width="270" height="46" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="485" y="210.25" font-size="12.5" text-anchor="middle" font-weight="700">ate-api-server and Postgres</text>
  <text x="485" y="227.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the state of every actor and worker</text>
  <g data-beat="1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/>
  <path d="M60 192 V114 H234" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-1-1-head-amber)"/>
  <circle class="m-packet" r="3.5" fill="var(--m-amber-ink, #85590c)" opacity="0"><animateMotion path="M60 192 V114 H234" keyPoints="0;0;1;1" keyTimes="0;0;0.688;1" calcMode="linear" dur="0.8s" begin="indefinite" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0;0.1;0.688;1" dur="0.8s" begin="indefinite" fill="freeze"/></circle>
  <text x="72" y="108" font-size="11.5" fill="var(--m-amber-ink, #85590c)">a request resumes it</text>
  <text x="72" y="132" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Substrate does this: 0.36 s</text>
  </g>
  <g data-beat="2"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.571;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.05s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.571;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.05s" begin="indefinite" fill="freeze"/>
  <path d="M290 136 V191" fill="none" stroke="var(--m-teal-ink, #18696a)" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#fig-1-1-head-teal)"/>
  <circle class="m-packet" r="3.5" fill="var(--m-teal-ink, #18696a)" opacity="0"><animateMotion path="M290 136 V191" keyPoints="0;0;1;1" keyTimes="0;0.429;0.821;1" calcMode="linear" dur="1.4s" begin="indefinite" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.429;0.486;0.821;1" dur="1.4s" begin="indefinite" fill="freeze"/></circle>
  <text x="300" y="160" font-size="11.5" font-weight="700" fill="var(--m-teal-ink, #18696a)">SuspendActor</text>
  <text x="300" y="176" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">you must call it</text>
  </g>
  <g data-beat="3"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.727;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.65s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.727;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.65s" begin="indefinite" fill="freeze"/>
  <path d="M525 192 V114 H406" fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#fig-1-1-head-ink)"/>
  <circle class="m-packet" r="3.5" fill="var(--m-ink, #1a1a1a)" opacity="0"><animateMotion path="M525 192 V114 H406" keyPoints="0;0;1;1" keyTimes="0;0.6;0.875;1" calcMode="linear" dur="2s" begin="indefinite" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.64;0.875;1" dur="2s" begin="indefinite" fill="freeze"/></circle>
  <text x="533" y="160" font-size="11.5">chooses</text>
  <text x="533" y="176" font-size="11.5">the worker</text>
  </g>
  <text x="20" y="268" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">SUBSTRATE DOES</text>
  <text x="328" y="268" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">YOU DO</text>
  <rect x="20" y="276" width="292" height="96" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="32" y="302.2" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">resumes an actor on a request: 0.36 s</text>
  <text x="32" y="317.7" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">writes the snapshot at a suspend: 0.40 s</text>
  <text x="32" y="333.2" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">routes each request to the right worker</text>
  <text x="32" y="348.7" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">limits what an actor can reach</text>
  <rect x="328" y="276" width="292" height="96" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="340" y="302.2" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">call SuspendActor: RUNNING after 900 s idle</text>
  <text x="340" y="317.7" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">change spec.replicas: no autoscaler</text>
  <text x="340" y="333.2" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">call RevertActor after a crash</text>
  <text x="340" y="348.7" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">run GPU work elsewhere: no device support</text>
</svg>
