<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" role="img" aria-labelledby="fig-4-5b-title fig-4-5b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-5b-title">Resumes at one time on one node: the time of each request, and the rate</title>
  <desc id="fig-4-5b-desc">Two panels for bursts of 1 to 300 resumes at one time on one node with 24 vCPU, in two runs. The first run had 200 workers and three bursts of each size from 1 to 150. The second run had 300 workers and bursts of 150, 200 and 300. The slowest of 10 took 0.43 s. At 300 at one time the median was 7.3 to 7.4 s. From 50 upward the node finished 32 to 39 resumes each second. 4 requests of the second run got no answer in 90 s and are not drawn.</desc>
