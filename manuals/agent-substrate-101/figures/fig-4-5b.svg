<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 326" role="img" aria-labelledby="fig-4-5b-title fig-4-5b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-5b-title">Disk that 25 suspended actors hold, and what is left after their deletion</title>
  <desc id="fig-4-5b-desc">Six bars in GiB, three for each of two samples. With 25 suspended actors, the node holds 8801 MiB of snapshots and a cache of 1765 MiB, and the object store holds 10824 MiB. After the actors are deleted, the node holds 1 MiB of snapshots and the same cache of 1765 MiB, and the object store still holds 2064 MiB of golden snapshots.</desc>
  <line x1="64" y1="236" x2="616" y2="236" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="58" y="240" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">0</text>
  <line x1="64" y1="170.67" x2="616" y2="170.67" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="58" y="174.67" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">4</text>
  <line x1="64" y1="105.33" x2="616" y2="105.33" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="58" y="109.33" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">8</text>
  <line x1="64" y1="40" x2="616" y2="40" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="58" y="44" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">12</text>
  <line x1="64" y1="236" x2="616" y2="236" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="64" y1="40" x2="64" y2="236" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="64" y="28" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">GiB on disk, x86 server guest, one sample of each</text>
  <rect x="84.7" y="95.62" width="50.6" height="140.38" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="110" y="89.62" font-size="11" text-anchor="middle" fill="var(--m-violet-ink, #5b4fa3)">8.6 GiB</text>
  <text x="110" y="253" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">snapshots</text>
  <rect x="176.7" y="207.85" width="50.6" height="28.15" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="202" y="201.85" font-size="11" text-anchor="middle" fill="var(--m-violet-ink, #5b4fa3)">1.7 GiB</text>
  <text x="202" y="253" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">cache</text>
  <rect x="268.7" y="63.35" width="50.6" height="172.65" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="294" y="57.35" font-size="11" text-anchor="middle" fill="var(--m-teal-ink, #18696a)">10.6 GiB</text>
  <text x="294" y="253" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">object store</text>
  <rect x="360.7" y="235.98" width="50.6" height="0.02" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="386" y="229.98" font-size="11" text-anchor="middle" fill="var(--m-violet-ink, #5b4fa3)">1 MiB</text>
  <text x="386" y="253" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">snapshots</text>
  <rect x="452.7" y="207.85" width="50.6" height="28.15" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="478" y="201.85" font-size="11" text-anchor="middle" fill="var(--m-violet-ink, #5b4fa3)">1.7 GiB</text>
  <text x="478" y="253" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">cache</text>
  <rect x="544.7" y="203.08" width="50.6" height="32.92" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
