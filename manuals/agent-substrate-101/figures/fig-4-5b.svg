  <line x1="78" y1="264" x2="234" y2="264" stroke="var(--m-violet-ink, #5b4fa3)" stroke-width="1"/>
  <text x="156" y="279" font-size="11" text-anchor="middle" fill="var(--m-violet-ink, #5b4fa3)">on the node</text>
  <line x1="354" y1="264" x2="510" y2="264" stroke="var(--m-violet-ink, #5b4fa3)" stroke-width="1"/>
  <text x="432" y="279" font-size="11" text-anchor="middle" fill="var(--m-violet-ink, #5b4fa3)">on the node</text>
  <text x="202" y="308" font-size="12" text-anchor="middle" font-weight="700">25 actors suspended</text>
  <text x="478" y="308" font-size="12" text-anchor="middle" font-weight="700">after the actors are deleted</text>
  <text x="570" y="179.08" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-teal-ink, #18696a)">golden snapshots stay</text>
</svg>
