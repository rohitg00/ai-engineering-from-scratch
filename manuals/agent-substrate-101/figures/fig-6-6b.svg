<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" role="img" aria-labelledby="fig-6-6b-title fig-6-6b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-6b-title">New work and open connections after a rule is removed</title>
  <desc id="fig-6-6b-desc">Two groups of five tracks over a time axis from -6 to 40 seconds, where zero is the removal of the rule. Each dot is one sample, about every 2 seconds. On the Envoy dataplane, the first sample after the removal is a refusal for a new DNS lookup and for a new pass-through connection. New HTTP requests are served until 3 seconds and refused from 6 seconds. An HTTP response that was open ran until the server ended it at 39 seconds, and an open pass-through connection served a second request at 20 seconds. On the agentgateway dataplane, the first sample after the removal is a refusal for all three kinds of new work. An open HTTP response ran until the server ended it at 18 seconds, and an open pass-through connection served a second request at 20 seconds.</desc>
