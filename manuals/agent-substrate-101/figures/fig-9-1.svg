<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" role="img" aria-labelledby="fig-9-1-title fig-9-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-9-1-title">The idle suspender in the request path</title>
  <desc id="fig-9-1-desc">A client sends a request to the idle suspender, which forwards it through kubectl ate proxy to atenet-router and the actor. The suspender keeps the time of the last request for each actor. In the recorded run it called SuspendActor for the actor bursty after 31 quiet seconds, and the call took 0.386 seconds. A later request found the actor rare suspended, and the router resumed it in 0.242 seconds.</desc>
  <defs><marker id="fig-9-1-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-9-1-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-teal-ink, #18696a)"/></marker><marker id="fig-9-1-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker></defs>
  <text x="16" y="24" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">ONE REQUEST</text>
  <rect x="16" y="36" width="80" height="46" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="56" y="54.25" font-size="12.5" text-anchor="middle" font-weight="700">client</text>
  <text x="56" y="71.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">curl</text>
  <rect x="124" y="36" width="156" height="46" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="202" y="54.25" font-size="12.5" text-anchor="middle" font-weight="700">idle suspender</text>
  <text x="202" y="71.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">one Python file</text>
  <rect x="308" y="36" width="156" height="46" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="386" y="54.25" font-size="12.5" text-anchor="middle" font-weight="700">kubectl ate proxy</text>
  <text x="386" y="71.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">one for each actor</text>
  <rect x="492" y="36" width="132" height="46" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="558" y="54.25" font-size="12.5" text-anchor="middle" font-weight="700">atenet-router</text>
  <text x="558" y="71.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">calls ResumeActor</text>
  <line x1="96" y1="59" x2="124" y2="59" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-9-1-head-ink)"/>
  <line x1="280" y1="59" x2="308" y2="59" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-9-1-head-ink)"/>
  <line x1="464" y1="59" x2="492" y2="59" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-9-1-head-ink)"/>
  <text x="16" y="128" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">THE DECISION</text>
  <rect x="124" y="140" width="156" height="92" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="202" y="166.25" font-size="12.5" text-anchor="middle" font-weight="700">last request</text>
  <text x="202" y="183.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">busy: 2 s ago</text>
  <text x="202" y="198.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">bursty: 31 s ago</text>
  <text x="202" y="213.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">rare: suspended</text>
  <line x1="202" y1="82" x2="202" y2="140" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.2" marker-end="url(#fig-9-1-head-teal)"/>
  <text x="210" y="116" font-size="11" fill="var(--m-teal-ink, #18696a)">writes on each request</text>
  <rect x="308" y="163" width="156" height="46" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="386" y="181.25" font-size="12.5" text-anchor="middle" font-weight="700">ate-api-server</text>
  <text x="386" y="198.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">SuspendActor</text>
  <rect x="492" y="163" width="132" height="46" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="558" y="181.25" font-size="12.5" text-anchor="middle" font-weight="700">actor bursty</text>
  <text x="558" y="198.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">one of two places</text>
  <line x1="280" y1="186" x2="308" y2="186" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-9-1-head-amber)"/>
  <line x1="464" y1="186" x2="492" y2="186" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-9-1-head-amber)"/>
  <text x="386" y="254" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">quiet for 31 s, so suspend: 0.386 s</text>
  <line x1="558" y1="82" x2="558" y2="163" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-9-1-head-ink)"/>
  <rect class="m-knock" x="446" y="115.42" width="105" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="548" y="126" font-size="11" text-anchor="end">resume, 0.242 s</text>
</svg>
