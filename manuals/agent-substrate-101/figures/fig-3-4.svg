<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" role="img" aria-labelledby="fig-3-4-title fig-3-4-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-4-title">Where a snapshot lives after an asynchronous suspend</title>
  <desc id="fig-3-4-desc">A timeline of four actors, d0, d50, d200 and d500, over 43 minutes after an asynchronous suspend with default atelet timers on the x86 server guest. For the first 5 minutes each snapshot is only on the node and its state is PENDING. From about 5 minutes to about 30 minutes the snapshot is on the node and in the object store. After about 30 minutes the node copy is removed and only the object store copy remains. The first three uploads completed after 5 min 1 s to 5 min 2 s, and the 500 MiB one after 5 min 11 s.</desc>
  <rect x="20" y="14" width="14" height="10" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <text x="40" y="23" font-size="11" fill="var(--m-rose-ink, #b0344d)">node only, PENDING</text>
  <rect x="196" y="14" width="14" height="10" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="216" y="23" font-size="11" fill="var(--m-violet-ink, #5b4fa3)">node and object store</text>
  <rect x="390" y="14" width="14" height="10" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="410" y="23" font-size="11" fill="var(--m-teal-ink, #18696a)">object store only</text>
  <text x="20" y="80" font-size="12" font-weight="700">d0</text>
  <text x="56" y="80" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">0</text>
  <rect x="96" y="66" width="60.42" height="20" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <rect x="156.42" y="66" width="300.26" height="20" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <rect x="456.68" y="66" width="143.32" height="20" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <circle cx="600" cy="76" r="3.5" fill="var(--m-amber-ink, #85590c)"/>
  <text x="20" y="118" font-size="12" font-weight="700">d50</text>
  <text x="56" y="118" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">50</text>
  <rect x="96" y="104" width="60.32" height="20" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <rect x="156.32" y="104" width="300.26" height="20" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <rect x="456.58" y="104" width="143.42" height="20" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <circle cx="600" cy="114" r="3.5" fill="var(--m-amber-ink, #85590c)"/>
  <text x="20" y="156" font-size="12" font-weight="700">d200</text>
  <text x="56" y="156" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">200</text>
  <rect x="96" y="142" width="60.18" height="20" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <rect x="156.18" y="142" width="300.24" height="20" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <rect x="456.42" y="142" width="143.58" height="20" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <circle cx="600" cy="152" r="3.5" fill="var(--m-amber-ink, #85590c)"/>
  <text x="20" y="194" font-size="12" font-weight="700">d500</text>
  <text x="56" y="194" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">500</text>
  <rect x="96" y="180" width="62.12" height="20" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <rect x="158.12" y="180" width="298.04" height="20" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <rect x="456.16" y="180" width="143.84" height="20" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <circle cx="600" cy="190" r="3.5" fill="var(--m-amber-ink, #85590c)"/>
  <text x="56" y="56" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">MiB</text>
  <line x1="156.18" y1="30" x2="156.18" y2="226" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="162.18" y="40" font-size="11" fill="var(--m-teal-ink, #18696a)">upload done after 5 min 1 s</text>
  <line x1="456.68" y1="46" x2="456.68" y2="226" stroke="var(--m-violet-ink, #5b4fa3)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="450.68" y="56" font-size="11" text-anchor="end" fill="var(--m-violet-ink, #5b4fa3)">node copy removed after 30 min 3 s</text>
  <line x1="96" y1="232" x2="612" y2="232" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="96" y1="228" x2="96" y2="236" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="96" y="250" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">0</text>
  <line x1="156" y1="228" x2="156" y2="236" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="156" y="250" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">5</text>
  <line x1="216" y1="228" x2="216" y2="236" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="216" y="250" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">10</text>
  <line x1="276" y1="228" x2="276" y2="236" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="276" y="250" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">15</text>
  <line x1="336" y1="228" x2="336" y2="236" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="336" y="250" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">20</text>
  <line x1="396" y1="228" x2="396" y2="236" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="396" y="250" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">25</text>
  <line x1="456" y1="228" x2="456" y2="236" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="456" y="250" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">30</text>
  <line x1="516" y1="228" x2="516" y2="236" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="516" y="250" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">35</text>
  <line x1="576" y1="228" x2="576" y2="236" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="576" y="250" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">40</text>
  <text x="20" y="250" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">MINUTES</text>
  <circle cx="26" cy="272" r="3.5" fill="var(--m-amber-ink, #85590c)"/>
  <text x="36" y="276" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">one request 42 minutes after the suspend: every actor resumed from the object store</text>
  <text x="20" y="296" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">In the rose part, losing the node copy leaves the actor CRASHED. Each time is at most 10 s late.</text>
</svg>
