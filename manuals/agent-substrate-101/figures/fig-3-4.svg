<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" role="img" aria-labelledby="fig-3-4-title fig-3-4-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-4-title">Where a snapshot lives after an asynchronous suspend</title>
  <desc id="fig-3-4-desc">A timeline of four actors, d0, d50, d200 and d500, over 43 minutes after an asynchronous suspend with default atelet timers on the x86 server guest. For the first 5 minutes each snapshot is only on the node and its state is PENDING. From about 5 minutes to about 30 minutes the snapshot is on the node and in the object store. After about 30 minutes the node copy is removed and only the object store copy remains. The first three uploads completed after 5 min 1 s to 5 min 2 s, and the 500 MiB one after 5 min 11 s. A request 42 minutes after the suspend resumed each actor from the object store in 0.25 s, 0.52 s, 1.19 s, 2.44 s. A row of dots under the bars shows the size of the snapshots on the node disk in each of 38 samples: 758 MiB until the node copies were removed and 1 MiB after that.</desc>
