<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" role="img" aria-labelledby="fig-3-1-title fig-3-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-1-title">From ActorTemplate to the first call of a new actor</title>
  <desc id="fig-3-1-desc">Two rows. The top row happens once per template: the template lab-c/ballast-200 leads to a temporary golden actor, which is suspended and copied to a golden tag. The bottom row happens for each new actor: kubectl ate create actor b200-1 makes an actor in ACTOR_STATE_SUSPENDED that points at the tag snapshot, and the first request restores it to ACTOR_STATE_RUNNING in 0.62 s at 200 MiB.</desc>
  <defs><marker id="fig-3-1-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-3-1-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-teal-ink, #18696a)"/></marker><marker id="fig-3-1-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">ONCE FOR EACH TEMPLATE</text>
  <rect x="20" y="28" width="150" height="52" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="95" y="49.25" font-size="12.5" text-anchor="middle" font-weight="700">ActorTemplate</text>
  <text x="95" y="66.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">lab-c/ballast-200</text>
  <rect x="215" y="28" width="180" height="52" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)" stroke-dasharray="5 4"/>
  <text x="305" y="49.25" font-size="12.5" text-anchor="middle" font-weight="700">golden actor</text>
  <text x="305" y="66.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">temporary, same atespace</text>
  <rect x="440" y="28" width="180" height="52" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="530" y="49.25" font-size="12.5" text-anchor="middle" font-weight="700">golden tag</text>
  <text x="530" y="66.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">SNAPSHOT_OWNER_TAG</text>
  <line x1="170" y1="54" x2="214" y2="54" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-1-head-ink)"/>
  <line x1="395" y1="54" x2="439" y2="54" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.2" marker-end="url(#fig-3-1-head-teal)"/>
  <circle cx="192" cy="40" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="192" y="44" font-size="11" text-anchor="middle">1</text>
  <circle cx="417" cy="40" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="417" y="44" font-size="11" text-anchor="middle">2</text>
  <circle cx="305" cy="96" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="305" y="100" font-size="11" text-anchor="middle">3</text>
  <text x="20" y="128" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">FOR EACH NEW ACTOR</text>
  <rect x="20" y="138" width="150" height="52" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="95" y="159.25" font-size="12.5" text-anchor="middle" font-weight="700">create actor</text>
  <text x="95" y="176.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">kubectl ate, b200-1</text>
  <rect x="215" y="138" width="180" height="52" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="305" y="158.95" font-size="11.5" text-anchor="middle" font-weight="700">ACTOR_STATE_SUSPENDED</text>
  <text x="305" y="176.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">gen 1 is the tag snapshot</text>
  <rect x="440" y="138" width="180" height="52" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="530" y="158.95" font-size="11.5" text-anchor="middle" font-weight="700">ACTOR_STATE_RUNNING</text>
  <text x="530" y="176.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">count=1 in the reply</text>
  <line x1="170" y1="164" x2="214" y2="164" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-1-head-ink)"/>
  <line x1="395" y1="164" x2="439" y2="164" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-1-head-amber)"/>
  <circle cx="192" cy="150" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="192" y="154" font-size="11" text-anchor="middle">4</text>
  <circle cx="417" cy="150" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="417" y="154" font-size="11" text-anchor="middle">5</text>
  <line x1="500" y1="80" x2="500" y2="137" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-1-head-ink)"/>
  <rect class="m-knock" x="505" y="97.53" width="116.4" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="508" y="108.5" font-size="11.5">restore reads it</text>
  <text x="20" y="222" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">1  ate-api-server creates a temporary golden actor from the template and resumes it.</text>
  <text x="20" y="240" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">2  It suspends that actor at preferredFidelity and copies the snapshot to a published tag.</text>
  <text x="20" y="258" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">3  It deletes the golden actor. In our run the tag was listed 21 s after the template.</text>
  <text x="20" y="276" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">4  A new actor records the tag snapshot as generation 1 and starts SUSPENDED.</text>
  <text x="20" y="294" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">5  The first request restores the tag snapshot on a worker: 0.62 s at 200 MiB.</text>
</svg>
