  <rect x="248.63" y="56" width="3" height="14" fill="var(--m-green-ink, #336b40)"/>
  <rect x="270.21" y="56" width="3" height="14" fill="var(--m-green-ink, #336b40)"/>
  <rect x="291.8" y="56" width="3" height="14" fill="var(--m-green-ink, #336b40)"/>
  <rect x="313.38" y="56" width="3" height="14" fill="var(--m-green-ink, #336b40)"/>
  <rect x="334.96" y="56" width="3" height="14" fill="var(--m-green-ink, #336b40)"/>
  <rect x="337.68" y="52" width="3" height="22" fill="var(--m-rose-ink, #b0344d)"/>
  <line x1="375.43" y1="48" x2="375.43" y2="84" stroke="var(--m-ink, #1a1a1a)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="402" y="62" font-size="11" font-weight="700" fill="var(--m-rose-ink, #b0344d)">error after 0.17 s, no retry</text>
  <text x="402" y="77" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">PENDING: note lost, new file lost</text>
  <text x="20" y="120" font-size="11.5" class="m-serif" fill="var(--m-ink, #1a1a1a)">Run 4,</text>
  <text x="20" y="135" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">last suspend 329 s before</text>
  <line x1="168" y1="138" x2="388" y2="138" stroke="var(--m-ink-soft, #4a4a4a)" stroke-width="1"/>
  <rect x="183.05" y="114" width="3" height="14" fill="var(--m-green-ink, #336b40)"/>
