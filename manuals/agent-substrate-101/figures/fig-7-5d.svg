<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-labelledby="fig-7-5d-title fig-7-5d-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-5d-title">An open ax ssh command when the worker pod is deleted</title>
  <desc id="fig-7-5d-desc">Two runs, one row each. In each run an ax ssh command printed one line each second, and the worker pod of the task was deleted after 8 lines. The command ended with an error 0.17 seconds after the delete in the first run and 0.16 seconds after it in the second. The actor was seen as CRASHED after 1.9 and 0.6 seconds. Nothing started the command again. After ax resume task, the file that the command had written was gone in both runs. The note from before the last suspend was gone in the first run, where the snapshot was PENDING, and kept in the second, where it was COMPLETED.</desc>
  <rect x="20" y="14" width="4" height="10" fill="var(--m-green-ink, #336b40)"/>
  <text x="30" y="23" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">one line from the command</text>
  <rect x="214" y="14" width="4" height="10" fill="var(--m-rose-ink, #b0344d)"/>
  <text x="224" y="23" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">the command ends with an error</text>
  <line x1="440" y1="12" x2="440" y2="26" stroke="var(--m-ink, #1a1a1a)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="448" y="23" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">actor seen as CRASHED</text>
  <text x="20" y="62" font-size="11.5" class="m-serif" fill="var(--m-ink, #1a1a1a)">Run 3,</text>
  <text x="20" y="77" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">last suspend 12 s before</text>
  <line x1="168" y1="80" x2="388" y2="80" stroke="var(--m-ink-soft, #4a4a4a)" stroke-width="1"/>
  <rect x="183.89" y="56" width="3" height="14" fill="var(--m-green-ink, #336b40)"/>
  <rect x="205.47" y="56" width="3" height="14" fill="var(--m-green-ink, #336b40)"/>
