<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="fig-3-1b-title fig-3-1b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-1b-title">The first call of a new actor against the memory in its template</title>
  <desc id="fig-3-1b-desc">Seconds for the first request to a new actor, which restores the golden snapshot, against the MiB of memory the template holds, on the x86 server guest. The median is 0.23 s at 0 MiB, 0.25 s at 50 MiB, 0.62 s at 200 MiB, 5.76 s at 500 MiB and 6.60 s at 1000 MiB, with a band from the fastest to the slowest of five actors. A second line shows a later resume of the same actor from its own node-local snapshot, which reaches 2.16 s at 1000 MiB.</desc>
