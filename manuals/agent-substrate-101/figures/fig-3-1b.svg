<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" role="img" aria-labelledby="fig-3-1b-title fig-3-1b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-1b-title">The first call of a new actor against the memory in its template</title>
  <desc id="fig-3-1b-desc">Seconds for the first request to a new actor, which restores the golden snapshot, against the MiB of memory the template holds, on the x86 server guest. Each of the 25 new actors is one dot, five for each size, and a line joins the medians: 0.23 s at 0 MiB, 0.25 s at 50 MiB, 0.62 s at 200 MiB, 5.76 s at 500 MiB, 6.60 s at 1000 MiB. The five first calls at 500 MiB took 1.86, 3.03, 5.76, 6.24, 6.76 seconds, and the five at 1000 MiB took 3.46, 3.56, 6.60, 11.85, 12.75 seconds. A second line shows the median of ten later resumes of one actor from its own snapshot on the node, which reaches 2.16 s at 1000 MiB.</desc>
