<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" role="img" aria-labelledby="fig-7-2-title fig-7-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-2-title">Three places where agentgateway can sit next to Substrate</title>
  <desc id="fig-7-2-desc">Three rows. Row A: agentgateway is the proxy in atenet-router and atenet-egress when you install Substrate with the agentgateway dataplane. Row B: the kagent distribution installs the same two proxies and has no Envoy option. Row C: a separate agentgateway is a model gateway that the actor reaches through one egress rule, and that gateway selects models and tools.</desc>
  <defs><marker id="fig-7-2-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <text x="20" y="24" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">A · THE DATAPLANE OF SUBSTRATE, BY YOUR CHOICE</text>
  <rect x="20" y="34" width="104" height="46" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="72" y="51.95" font-size="11.5" text-anchor="middle" font-weight="700">client</text>
  <text x="72" y="69.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">mTLS client</text>
  <line x1="124" y1="57" x2="143" y2="57" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-2-head-ink)"/>
  <rect x="144" y="34" width="104" height="46" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="196" y="51.95" font-size="11.5" text-anchor="middle" font-weight="700">atenet-router</text>
  <text x="196" y="69.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">agentgateway</text>
  <line x1="248" y1="57" x2="267" y2="57" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-2-head-ink)"/>
  <rect x="268" y="34" width="104" height="46" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="320" y="51.95" font-size="11.5" text-anchor="middle" font-weight="700">actor</text>
  <text x="320" y="69.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">my-counter-1</text>
  <line x1="372" y1="57" x2="391" y2="57" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-2-head-ink)"/>
  <rect x="392" y="34" width="104" height="46" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="444" y="51.95" font-size="11.5" text-anchor="middle" font-weight="700">atenet-egress</text>
  <text x="444" y="69.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">agentgateway</text>
  <line x1="496" y1="57" x2="515" y2="57" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-2-head-ink)"/>
  <rect x="516" y="34" width="104" height="46" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="568" y="51.95" font-size="11.5" text-anchor="middle" font-weight="700">host</text>
  <text x="568" y="69.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">in the policy</text>
  <text x="20" y="102" font-size="11.5" font-weight="700" fill="var(--m-indigo-ink, #4b4f9e)">decides: who gets in, which hosts an actor reaches, one injected header</text>
  <text x="20" y="120" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ate-setup --atenet-dataplane=agentgateway. Idle: 38 MB in 2 containers. Envoy: 91 MB in 5.</text>
  <text x="20" y="168" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">B · THE DATAPLANE INSIDE THE KAGENT DISTRIBUTION</text>
  <rect x="20" y="178" width="104" height="46" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="72" y="195.95" font-size="11.5" text-anchor="middle" font-weight="700">kagent</text>
  <text x="72" y="213.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">controller</text>
  <line x1="124" y1="201" x2="143" y2="201" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-2-head-ink)"/>
  <rect x="144" y="178" width="104" height="46" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="196" y="195.95" font-size="11.5" text-anchor="middle" font-weight="700">atenet-router</text>
  <text x="196" y="213.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">agentgateway</text>
  <line x1="248" y1="201" x2="267" y2="201" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-2-head-ink)"/>
  <rect x="268" y="178" width="104" height="46" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="320" y="195.95" font-size="11.5" text-anchor="middle" font-weight="700">actor</text>
  <text x="320" y="213.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">session-&lt;uuid&gt;</text>
  <line x1="372" y1="201" x2="391" y2="201" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-2-head-ink)"/>
  <rect x="392" y="178" width="104" height="46" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="444" y="195.95" font-size="11.5" text-anchor="middle" font-weight="700">atenet-egress</text>
  <text x="444" y="213.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">agentgateway</text>
  <line x1="496" y1="201" x2="515" y2="201" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-2-head-ink)"/>
  <rect x="516" y="178" width="104" height="46" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="568" y="195.95" font-size="11.5" text-anchor="middle" font-weight="700">model host</text>
  <text x="568" y="213.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">in the policy</text>
  <text x="20" y="246" font-size="11.5" font-weight="700" fill="var(--m-indigo-ink, #4b4f9e)">decides: the same three things</text>
  <text x="20" y="264" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">The kagent charts install agentgateway v1.7.0 and have no Envoy option. 98 turns ran through it.</text>
  <text x="20" y="312" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">C · A GATEWAY THAT THE ACTOR CALLS THROUGH AN EGRESS RULE</text>
  <rect x="20" y="322" width="104" height="46" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="72" y="339.95" font-size="11.5" text-anchor="middle" font-weight="700">actor</text>
  <text x="72" y="357.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">session-&lt;uuid&gt;</text>
  <line x1="124" y1="345" x2="143" y2="345" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-2-head-ink)"/>
  <rect x="144" y="322" width="104" height="46" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="196" y="339.95" font-size="11.5" text-anchor="middle" font-weight="700">atenet-egress</text>
  <text x="196" y="357.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">one allow rule</text>
  <line x1="248" y1="345" x2="267" y2="345" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-2-head-ink)"/>
  <rect x="268" y="322" width="104" height="46" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="320" y="339.95" font-size="11.5" text-anchor="middle" font-weight="700">agentgateway</text>
  <text x="320" y="357.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">model gateway</text>
  <line x1="372" y1="345" x2="391" y2="345" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-2-head-ink)"/>
  <rect x="392" y="322" width="104" height="46" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="444" y="339.95" font-size="11.5" text-anchor="middle" font-weight="700">model</text>
  <text x="444" y="357.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the provider</text>
  <text x="20" y="390" font-size="11.5" font-weight="700" fill="var(--m-plum-ink, #8a3d72)">decides: models, tools, budgets</text>
  <text x="20" y="408" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">dashed: your own workload, behind one egress allow rule. We did not run it.</text>
  <line x1="20" y1="142" x2="620" y2="142" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-dasharray="5 4" stroke-opacity="0.5"/>
  <line x1="20" y1="286" x2="620" y2="286" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-dasharray="5 4" stroke-opacity="0.5"/>
</svg>
