  <rect x="20" y="298" width="400" height="40" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="220" y="312.95" font-size="11.5" text-anchor="middle" font-weight="700">podcertificate-controller</text>
  <text x="220" y="330.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">signs pod certificates, 1 pod</text>
  <text x="436" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">ATE-DEMO-COUNTER</text>
  <rect x="436" y="26" width="184" height="58" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
