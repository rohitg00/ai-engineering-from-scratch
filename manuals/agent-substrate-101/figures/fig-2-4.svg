  <text x="528" y="136.45" font-size="11.5" text-anchor="middle" font-weight="400">jaeger</text>
  <rect x="436" y="154" width="184" height="30" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="528" y="172.45" font-size="11.5" text-anchor="middle" font-weight="400">opentelemetry-collector</text>
  <rect x="436" y="190" width="184" height="30" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="528" y="208.45" font-size="11.5" text-anchor="middle" font-weight="400">prometheus</text>
  <text x="436" y="242" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">KUBE-SYSTEM</text>
  <rect x="436" y="250" width="184" height="40" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="528" y="264.95" font-size="11.5" text-anchor="middle" font-weight="700">Kubernetes v1.37.0</text>
  <text x="528" y="282.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">8 pods, not from Substrate</text>
  <text x="20" y="360" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">WHERE THE OBJECTS LIVE</text>
  <rect x="20" y="368" width="290" height="40" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="165" y="383.1" font-size="12" text-anchor="middle" font-weight="700">etcd: 3 custom resources</text>
  <text x="165" y="400.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">WorkerPool, SandboxConfig, CSIDriverConfig</text>
