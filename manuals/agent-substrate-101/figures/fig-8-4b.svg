  <text x="38" y="22" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">returned 200</text>
  <rect x="140" y="14" width="12" height="8" fill="var(--m-rose-ink, #b0344d)"/>
  <text x="158" y="22" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">failed</text>
