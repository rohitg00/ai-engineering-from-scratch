<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="fig-8-4b-title fig-8-4b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-8-4b-title">One upgrade from v1.0.0-rc.3 to v1.0.0, against two request streams</title>
  <desc id="fig-8-4b-desc">A timeline of one upgrade on one kind node, 343 seconds from the start of step 1 to the end of step 4e. An actor that was suspended and resumed in a loop failed 7 of 110 cycles, all during step 2, the atelet step. An actor that was RUNNING answered 503 from 69.8 seconds, about one second after the worker image changed in step 3, and stayed crashed.</desc>
  <rect x="20" y="14" width="12" height="8" fill="var(--m-green-ink, #336b40)"/>
  <text x="38" y="22" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">returned 200</text>
  <rect x="150" y="14" width="12" height="8" fill="var(--m-rose-ink, #b0344d)"/>
  <text x="168" y="22" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">failed</text>
  <rect x="236" y="12" width="12" height="12" fill="var(--m-blue-ink, #2f5d9a)"/>
  <text x="254" y="22" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">a control plane step runs</text>
  <rect x="446" y="12" width="12" height="12" fill="var(--m-violet-ink, #5b4fa3)"/>
  <text x="464" y="22" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">a worker step runs</text>
  <text x="20" y="72" font-size="11.5" class="m-serif" fill="var(--m-ink, #1a1a1a)">upgrade step</text>
  <rect x="170" y="58" width="43.59" height="22" fill="var(--m-blue-ink, #2f5d9a)" stroke="var(--m-panel, #f3f1e8)"/>
  <text x="191.79" y="96" font-size="11" text-anchor="middle" font-weight="700" fill="var(--m-blue-ink, #2f5d9a)">1</text>
  <rect x="213.59" y="58" width="39.86" height="22" fill="var(--m-violet-ink, #5b4fa3)" stroke="var(--m-panel, #f3f1e8)"/>
  <text x="233.51" y="50" font-size="11" text-anchor="middle" font-weight="700" fill="var(--m-violet-ink, #5b4fa3)">2</text>
  <rect x="258.2" y="58" width="3" height="22" fill="var(--m-violet-ink, #5b4fa3)" stroke="var(--m-panel, #f3f1e8)"/>
  <text x="268.7" y="50" font-size="11" text-anchor="middle" font-weight="700" fill="var(--m-violet-ink, #5b4fa3)">3</text>
  <rect x="467.26" y="58" width="36.51" height="22" fill="var(--m-blue-ink, #2f5d9a)" stroke="var(--m-panel, #f3f1e8)"/>
  <text x="485.51" y="50" font-size="11" text-anchor="middle" font-weight="700" fill="var(--m-blue-ink, #2f5d9a)">4a</text>
  <rect x="504.41" y="58" width="15.94" height="22" fill="var(--m-blue-ink, #2f5d9a)" stroke="var(--m-panel, #f3f1e8)"/>
  <text x="512.39" y="96" font-size="11" text-anchor="middle" font-weight="700" fill="var(--m-blue-ink, #2f5d9a)">4b</text>
  <rect x="520.49" y="58" width="28.03" height="22" fill="var(--m-blue-ink, #2f5d9a)" stroke="var(--m-panel, #f3f1e8)"/>
  <text x="534.5" y="50" font-size="11" text-anchor="middle" font-weight="700" fill="var(--m-blue-ink, #2f5d9a)">4c</text>
  <rect x="549.03" y="58" width="24.04" height="22" fill="var(--m-blue-ink, #2f5d9a)" stroke="var(--m-panel, #f3f1e8)"/>
  <text x="561.05" y="96" font-size="11" text-anchor="middle" font-weight="700" fill="var(--m-blue-ink, #2f5d9a)">4d</text>
  <rect x="573.07" y="58" width="37.93" height="22" fill="var(--m-blue-ink, #2f5d9a)" stroke="var(--m-panel, #f3f1e8)"/>
  <text x="592.04" y="50" font-size="11" text-anchor="middle" font-weight="700" fill="var(--m-blue-ink, #2f5d9a)">4e</text>
  <text x="363.05" y="73" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">we watched the pool for 160 s</text>
  <text x="20" y="136" font-size="11.5" class="m-serif" fill="var(--m-ink, #1a1a1a)">suspend and resume,</text>
  <text x="20" y="151" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">one actor in a loop</text>
  <rect x="170" y="132" width="48.6" height="12" fill="var(--m-green-ink, #336b40)"/>
  <rect x="218.6" y="132" width="30.86" height="12" fill="var(--m-rose-ink, #b0344d)"/>
  <rect x="249.46" y="132" width="370.54" height="12" fill="var(--m-green-ink, #336b40)"/>
  <text x="218.6" y="124" font-size="11" class="m-serif" fill="var(--m-rose-ink, #b0344d)">7 of 110 cycles failed, in 24 s of step 2</text>
  <text x="20" y="196" font-size="11.5" class="m-serif" fill="var(--m-ink, #1a1a1a)">one request each second</text>
  <text x="20" y="211" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">to a RUNNING actor</text>
  <rect x="170" y="192" width="89.74" height="12" fill="var(--m-green-ink, #336b40)"/>
  <rect x="259.74" y="192" width="360.26" height="12" fill="var(--m-rose-ink, #b0344d)"/>
  <text x="263.74" y="184" font-size="11" class="m-serif" fill="var(--m-rose-ink, #b0344d)">CRASHED after the image change, 503 until a revert</text>
  <line x1="170" y1="244" x2="620" y2="244" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="170" y1="240" x2="170" y2="248" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="170" y="262" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">0 s</text>
  <line x1="247.14" y1="240" x2="247.14" y2="248" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="247.14" y="262" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">60 s</text>
  <line x1="324.29" y1="240" x2="324.29" y2="248" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="324.29" y="262" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">120 s</text>
  <line x1="401.43" y1="240" x2="401.43" y2="248" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="401.43" y="262" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">180 s</text>
  <line x1="478.57" y1="240" x2="478.57" y2="248" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="478.57" y="262" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">240 s</text>
  <line x1="555.71" y1="240" x2="555.71" y2="248" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="555.71" y="262" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">300 s</text>
  <text x="395" y="284" font-size="11.5" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">seconds since the start of step 1</text>
</svg>
