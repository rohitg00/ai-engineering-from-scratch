  <rect x="251.64" y="250" width="176.14" height="16" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="339.71" y="279" font-size="11" text-anchor="middle" font-weight="700" fill="var(--m-violet-ink, #5b4fa3)">3, the pool rolls</text>
