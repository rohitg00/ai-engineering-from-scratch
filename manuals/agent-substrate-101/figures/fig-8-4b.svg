<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 488" role="img" aria-labelledby="fig-8-4b-title fig-8-4b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-8-4b-title">Two upgrades from v1.0.0-rc.3 to v1.0.0, against the request streams</title>
  <desc id="fig-8-4b-desc">Two timelines of the same upgrade on one kind node, run once each. In the first run the loop actor failed 7 of 110 suspend and resume cycles, all in the atelet step, and the RUNNING actor crashed when the worker image changed. In the second run the loop actor failed 10 cycles in a row in the atelet step, then crashed in the worker step and stayed crashed. The RUNNING actor that exits on SIGTERM crashed again, and the one that handles SIGTERM failed 0 of 441 requests.</desc>
