<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" role="img" aria-labelledby="fig-4-5c-title fig-4-5c-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-5c-title">Time of each turn with 8 and with 24 turns at the same time on one worker</title>
  <desc id="fig-4-5c-desc">A chart of seconds for each turn against the order in which the turns completed. With 8 turns at the same time, every turn took 2.5 to 3.6 seconds. With 24 turns at the same time on a worker that reports 16 CPUs, the first 16 turns took 4.3 to 5.5 seconds and the last 8 took 6.4 to 7.8 seconds.</desc>
