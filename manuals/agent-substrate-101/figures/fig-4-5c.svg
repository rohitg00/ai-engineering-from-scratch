  <title id="fig-4-5c-title">The worker restore of each actor, alone and inside a burst</title>
  <desc id="fig-4-5c-desc">One dot for each of 1192 restores that atelet logged on one node with 24 vCPU. Alone, the restore inside the worker took a median of 0.27 s in 20 restores. Inside 8 bursts of 134 to 150 restores, a median of 75 to 116 ran at the same time, and the median restore took 2.1 to 2.9 s. Each burst finished 35 to 41 restores each second.</desc>
