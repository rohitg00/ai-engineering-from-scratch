<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" role="img" aria-labelledby="fig-3-2-title fig-3-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-2-title">The seven actor states and the transitions between them</title>
  <desc id="fig-3-2-desc">A state figure with the seven states of the ActorState enum at v1.0.0. CreateActor makes an actor in ACTOR_STATE_SUSPENDED. ResumeActor moves it through ACTOR_STATE_RESUMING to ACTOR_STATE_RUNNING. SuspendActor moves it through ACTOR_STATE_SUSPENDING and returns it to ACTOR_STATE_SUSPENDED. A failed restore, a lost worker pod, a memory kill or a failed suspend moves it to ACTOR_STATE_CRASHED. RevertActor moves it through ACTOR_STATE_REVERTING to ACTOR_STATE_SUSPENDED. DeleteActor moves an actor in every state to ACTOR_STATE_DELETING. Dotted grey arrows are transitions we read in the code and did not run.</desc>
  <defs><marker id="fig-3-2-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-3-2-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker><marker id="fig-3-2-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker><marker id="fig-3-2-head-ink-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink-mute, #6f6f6a)"/></marker></defs>
  <rect x="20" y="44" width="180" height="40" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="110" y="67.45" font-size="11.5" text-anchor="middle" font-weight="700">ACTOR_STATE_SUSPENDED</text>
  <rect x="230" y="44" width="180" height="40" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="320" y="67.45" font-size="11.5" text-anchor="middle" font-weight="700">ACTOR_STATE_RESUMING</text>
  <rect x="440" y="44" width="180" height="40" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="530" y="67.45" font-size="11.5" text-anchor="middle" font-weight="700">ACTOR_STATE_RUNNING</text>
  <rect x="20" y="144" width="180" height="40" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="110" y="167.45" font-size="11.5" text-anchor="middle" font-weight="700">ACTOR_STATE_REVERTING</text>
  <rect x="230" y="144" width="180" height="40" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="320" y="167.45" font-size="11.5" text-anchor="middle" font-weight="700">ACTOR_STATE_CRASHED</text>
  <rect x="440" y="144" width="180" height="40" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="530" y="167.45" font-size="11.5" text-anchor="middle" font-weight="700">ACTOR_STATE_SUSPENDING</text>
  <rect x="440" y="240" width="180" height="40" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <rect x="443" y="243" width="174" height="34" fill="none" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="530" y="263.45" font-size="11.5" text-anchor="middle" font-weight="700">ACTOR_STATE_DELETING</text>
  <text x="110" y="16" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">CreateActor</text>
  <line x1="110" y1="22" x2="110" y2="43" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-2-head-ink)"/>
  <line x1="200" y1="64" x2="229" y2="64" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-amber)"/>
  <text x="215" y="36" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ResumeActor</text>
  <line x1="410" y1="64" x2="439" y2="64" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-amber)"/>
  <text x="425" y="36" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">restored and ready</text>
  <line x1="590" y1="84" x2="590" y2="143" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-amber)"/>
  <text x="582" y="128" font-size="11" text-anchor="end" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">SuspendActor</text>
  <path d="M530 184 V214 H10 V64 H19" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-3-2-head-amber)"/>
  <text x="40" y="208" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">snapshot on the node</text>
  <line x1="290" y1="84" x2="290" y2="143" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-rose)"/>
  <text x="282" y="118" font-size="11" text-anchor="end" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">restore failed</text>
  <path d="M470 84 V114 H380 V143" fill="none" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-3-2-head-rose)"/>
  <text x="478" y="104" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">worker pod gone</text>
  <line x1="440" y1="164" x2="411" y2="164" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-rose)"/>
  <text x="425" y="198" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">suspend failed</text>
  <line x1="230" y1="164" x2="201" y2="164" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-amber)"/>
  <text x="215" y="138" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">RevertActor</text>
  <line x1="60" y1="144" x2="60" y2="85" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-amber)"/>
  <text x="68" y="118" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">durable snapshot</text>
  <line x1="170" y1="84" x2="170" y2="143" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#fig-3-2-head-ink-mute)"/>
  <text x="400" y="264" font-size="11" text-anchor="end" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">DeleteActor, accepted in every state</text>
  <line x1="406" y1="260" x2="439" y2="260" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-2-head-ink)"/>
  <path d="M20 292 H44" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round"/>
  <path d="M52 292 H76" fill="none" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round"/>
  <text x="84" y="296" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">seen in our traces: amber is a state change, rose is a failure</text>
  <path d="M20 312 H76" fill="none" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="84" y="316" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">read in the code, not run: RevertActor on a SUSPENDED actor</text>
  <text x="84" y="334" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Not drawn, also code only: RevertActor on a RUNNING actor.</text>
  <text x="84" y="350" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">A process that exits leaves the actor RUNNING. Section 3.5 has that case.</text>
</svg>
