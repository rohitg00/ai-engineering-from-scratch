<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 366" role="img" aria-labelledby="fig-3-2-title fig-3-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-2-title">The seven actor states and the transitions between them</title>
  <desc id="fig-3-2-desc">A state figure with the seven states of the ActorState enum at v1.0.0. CreateActor makes an actor in ACTOR_STATE_SUSPENDED. ResumeActor moves it through ACTOR_STATE_RESUMING to ACTOR_STATE_RUNNING. SuspendActor moves it through ACTOR_STATE_SUSPENDING and returns it to ACTOR_STATE_SUSPENDED. A failed restore, a lost worker pod, a memory kill or a failed suspend moves it to ACTOR_STATE_CRASHED, where a request gets 503. The only arrow that leaves ACTOR_STATE_CRASHED is RevertActor, which moves the actor through ACTOR_STATE_REVERTING to ACTOR_STATE_SUSPENDED. DeleteActor moves an actor in every state to ACTOR_STATE_DELETING. In the kagent run, on a second x86 server guest with 16 vCPU and 31 GB, an actor spent a median of 0.38 s in ACTOR_STATE_RESUMING over 98 turns and 0.14 s in ACTOR_STATE_SUSPENDING over 99 suspends. A dotted grey arrow is a transition we read in the code and did not run.</desc>
  <defs><marker id="fig-3-2-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-3-2-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker><marker id="fig-3-2-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker><marker id="fig-3-2-head-ink-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink-mute, #6f6f6a)"/></marker></defs>
  <rect x="14" y="44" width="150" height="50" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="89" y="63.8" font-size="11" text-anchor="middle" font-weight="700">ACTOR_STATE_SUSPENDED</text>
  <text x="89" y="80.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">no sandbox, no worker</text>
  <rect x="245" y="44" width="150" height="50" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="320" y="63.8" font-size="11" text-anchor="middle" font-weight="700">ACTOR_STATE_RESUMING</text>
  <text x="320" y="80.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">0.38 s median of 98</text>
  <rect x="476" y="44" width="150" height="50" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="551" y="63.8" font-size="11" text-anchor="middle" font-weight="700">ACTOR_STATE_RUNNING</text>
  <text x="551" y="80.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">a sandbox on a worker</text>
  <rect x="14" y="176" width="150" height="50" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="89" y="195.8" font-size="11" text-anchor="middle" font-weight="700">ACTOR_STATE_REVERTING</text>
  <text x="89" y="212.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">later calls are lost</text>
  <rect x="245" y="176" width="150" height="50" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-width="2"/>
  <text x="320" y="195.8" font-size="11" text-anchor="middle" font-weight="700">ACTOR_STATE_CRASHED</text>
  <text x="320" y="212.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">a request gets 503</text>
  <rect x="476" y="176" width="150" height="50" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="551" y="195.8" font-size="11" text-anchor="middle" font-weight="700">ACTOR_STATE_SUSPENDING</text>
  <text x="551" y="212.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">0.14 s median of 99</text>
  <text x="89" y="16" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">CreateActor</text>
  <line x1="89" y1="22" x2="89" y2="43" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-2-head-ink)"/>
  <line x1="164" y1="69" x2="244" y2="69" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-amber)"/>
  <text x="204.5" y="61" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ResumeActor</text>
  <line x1="395" y1="69" x2="475" y2="69" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-amber)"/>
  <text x="435.5" y="61" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">restored</text>
  <line x1="596" y1="94" x2="596" y2="175" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-amber)"/>
  <text x="588" y="154" font-size="11" text-anchor="end" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">SuspendActor</text>
  <path d="M554 226 V250 H5 V69 H13" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-3-2-head-amber)"/>
  <text x="300" y="244" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the snapshot is on the node</text>
  <line x1="293" y1="94" x2="293" y2="175" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-rose)"/>
  <text x="285" y="154" font-size="11" text-anchor="end" class="m-serif" fill="var(--m-rose-ink, #b0344d)">restore failed</text>
  <path d="M512 94 V124 H363 V175" fill="none" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-3-2-head-rose)"/>
  <text x="504" y="118" font-size="11" text-anchor="end" class="m-serif" fill="var(--m-rose-ink, #b0344d)">worker pod gone, memory kill</text>
  <line x1="476" y1="201" x2="396" y2="201" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-rose)"/>
  <text x="435.5" y="193" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-rose-ink, #b0344d)">suspend</text>
  <text x="435.5" y="217" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-rose-ink, #b0344d)">failed</text>
  <line x1="245" y1="201" x2="165" y2="201" stroke="var(--m-amber-ink, #85590c)" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-amber)"/>
  <text x="204.5" y="193" font-size="11" text-anchor="middle" font-weight="700" class="m-serif" fill="var(--m-ink, #1a1a1a)">RevertActor</text>
  <text x="204.5" y="217" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the only</text>
  <text x="204.5" y="231" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">way out</text>
  <line x1="70" y1="176" x2="70" y2="95" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-amber)"/>
  <text x="78" y="138" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">last durable snapshot</text>
  <line x1="34" y1="94" x2="34" y2="175" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#fig-3-2-head-ink-mute)"/>
  <rect x="476" y="298" width="150" height="50" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <rect x="479" y="301" width="144" height="44" fill="none" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="551" y="317.8" font-size="11" text-anchor="middle" font-weight="700">ACTOR_STATE_DELETING</text>
  <text x="551" y="334.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">then the actor is gone</text>
  <text x="551" y="278" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">DeleteActor, from every state</text>
  <line x1="551" y1="283" x2="551" y2="297" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-2-head-ink)"/>
  <path d="M14 286 H40" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round"/>
  <path d="M48 286 H76" fill="none" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round"/>
  <text x="84" y="290" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">in our traces: amber is a state change, rose is a failure</text>
  <path d="M14 304 H76" fill="none" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="84" y="308" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">read in the code, not run: RevertActor on a SUSPENDED actor</text>
  <text x="14" y="326" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Not drawn, also code only: RevertActor on a RUNNING actor.</text>
  <text x="14" y="342" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Times in RESUMING and SUSPENDING: the kagent run, files-only actors.</text>
  <text x="14" y="358" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">A process that exits leaves the actor RUNNING. Section 3.5 has that case.</text>
</svg>
