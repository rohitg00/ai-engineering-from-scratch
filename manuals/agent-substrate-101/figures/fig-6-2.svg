<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" role="img" aria-labelledby="fig-6-2-title fig-6-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-2-title">Where an outgoing connection from an actor is decided</title>
  <desc id="fig-6-2-desc">The actor f-main at 169.254.17.2/30 sends DNS queries to the DNS relay at 169.254.17.1 and every TCP connection to atunnel. Both are in the worker pod. The relay forwards names that the policy lists to the cluster DNS and answers NXDOMAIN for other names. atunnel opens a mutual TLS CONNECT to atenet-egress, which checks the request and connects to the upstream host whoami. The upstream sees 10.244.0.22. A request outside the policy gets 403 or a reset. Both checks read the EgressPolicy of f-main from ate-api-server, and the relay keeps it in a cache for 5 seconds.</desc>
  <defs><marker id="fig-6-2-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-6-2-head-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-indigo-ink, #4b4f9e)"/></marker></defs>
  <rect x="240" y="20" width="200" height="46" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="340" y="38.25" font-size="12.5" text-anchor="middle" font-weight="700">ate-api-server</text>
  <text x="340" y="55.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">EgressPolicy default of f-main</text>
  <rect x="160" y="92" width="174" height="180" fill="none" stroke="var(--m-violet-ink, #5b4fa3)" stroke-dasharray="5 4"/>
  <text x="170" y="110" font-size="11" letter-spacing="1.2" fill="var(--m-violet-ink, #5b4fa3)">WORKER POD</text>
  <rect x="16" y="163" width="124" height="52" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="78" y="184.25" font-size="12.5" text-anchor="middle" font-weight="700">actor f-main</text>
  <text x="78" y="201.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">169.254.17.2/30</text>
  <rect x="172" y="120" width="150" height="46" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="247" y="138.25" font-size="12.5" text-anchor="middle" font-weight="700">DNS relay</text>
  <text x="247" y="155.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">169.254.17.1:53</text>
  <rect x="172" y="212" width="150" height="46" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="247" y="230.25" font-size="12.5" text-anchor="middle" font-weight="700">atunnel</text>
  <text x="247" y="247.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">actor certificate</text>
  <rect x="450" y="120" width="120" height="46" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="510" y="138.25" font-size="12.5" text-anchor="middle" font-weight="700">cluster DNS</text>
  <text x="510" y="155.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">CoreDNS</text>
  <rect x="400" y="212" width="120" height="46" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="460" y="230.25" font-size="12.5" text-anchor="middle" font-weight="700">atenet-egress</text>
  <text x="460" y="247.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">checks the request</text>
  <rect x="548" y="212" width="80" height="46" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="588" y="230.25" font-size="12.5" text-anchor="middle" font-weight="700">whoami</text>
  <text x="588" y="247.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">upstream</text>
  <path d="M78 163 V143 H171" fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#fig-6-2-head-ink)"/>
  <text x="84" y="136" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">DNS query</text>
