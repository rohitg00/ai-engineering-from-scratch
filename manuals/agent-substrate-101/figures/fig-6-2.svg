  <text x="16" y="253" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">every TCP connection</text>
  <line x1="322" y1="143" x2="449" y2="143" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-2-head-ink)"/>
  <rect class="m-knock" x="335.6" y="126.03" width="88.8" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="380" y="137" font-size="11.5" text-anchor="middle">listed names</text>
  <text x="172" y="183" font-size="11" fill="var(--m-rose-ink, #b0344d)">other names: NXDOMAIN</text>
  <line x1="322" y1="235" x2="399" y2="235" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#fig-6-2-head-indigo)"/>
  <rect class="m-knock" x="339.85" y="218.03" width="54.3" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="367" y="229" font-size="11.5" text-anchor="middle" fill="var(--m-indigo-ink, #4b4f9e)">CONNECT</text>
  <rect class="m-knock" x="334.3" y="239.42" width="65.4" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="367" y="250" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">mutual TLS</text>
  <line x1="520" y1="235" x2="547" y2="235" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-2-head-ink)"/>
  <text x="588" y="203" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">sees 10.244.0.22</text>
  <text x="400" y="276" font-size="11" fill="var(--m-rose-ink, #b0344d)">outside the policy: 403 or reset</text>
  <line x1="280" y1="66" x2="280" y2="119" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-2-head-ink)"/>
  <text x="288" y="84" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">policy, cached 5 s</text>
  <line x1="432" y1="66" x2="432" y2="211" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-2-head-ink)"/>
  <text x="440" y="192" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">policy</text>
</svg>
