  <text x="16" y="212" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">every TCP</text>
  <text x="16" y="226" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">connection</text>
  <line x1="320" y1="81" x2="383" y2="81" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-2-head-ink)"/>
  <rect class="m-knock" x="328.3" y="64.03" width="47.4" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="352" y="75" font-size="11.5" text-anchor="middle">listed</text>
  <text x="172" y="122" font-size="11" fill="var(--m-rose-ink, #b0344d)">other names: NXDOMAIN</text>
  <line x1="320" y1="193" x2="383" y2="193" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#fig-6-2-head-indigo)"/>
  <rect class="m-knock" x="335.2" y="176.03" width="33.6" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="352" y="187" font-size="11.5" text-anchor="middle" fill="var(--m-indigo-ink, #4b4f9e)">mTLS</text>
  <text x="352" y="212" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">CONNECT</text>
  <line x1="514" y1="193" x2="539" y2="193" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-2-head-ink)"/>
  <text x="584" y="232" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">sees 10.244.0.22</text>
  <line x1="420" y1="216" x2="420" y2="261" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-2-head-ink)"/>
  <rect class="m-knock" x="425" y="227.53" width="47.4" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="428" y="238.5" font-size="11.5">policy</text>
  <text x="528" y="274" font-size="11" fill="var(--m-rose-ink, #b0344d)">outside the</text>
  <text x="528" y="288" font-size="11" fill="var(--m-rose-ink, #b0344d)">policy: 403</text>
  <text x="528" y="302" font-size="11" fill="var(--m-rose-ink, #b0344d)">or reset</text>
  <path d="M384 284 H246 V217" fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-6-2-head-ink)"/>
  <text x="238" y="262" font-size="11" text-anchor="end" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">policy,</text>
  <text x="238" y="276" font-size="11" text-anchor="end" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">cached 5 s</text>
</svg>
