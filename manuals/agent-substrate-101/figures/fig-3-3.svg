<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" role="img" aria-labelledby="fig-3-3-title fig-3-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-3-title">Resume time against the memory an actor holds</title>
  <desc id="fig-3-3-desc">Seconds for one request to a suspended actor against the MiB of random memory it holds, on the x86 server guest with gVisor. Every one of the 75 resumes is a small dot, and a line joins the medians. From the snapshot on the node the median is 0.22 s at 0 MiB, 0.24 s at 50 MiB, 0.47 s at 200 MiB, 1.07 s at 500 MiB, 2.16 s at 1000 MiB, with ten resumes for each size. One resume at 1000 MiB took 5.09 s and the other nine took at most 2.45 s. From the object store in the same cluster the median is 0.24 s at 0 MiB, 0.41 s at 50 MiB, 0.96 s at 200 MiB, 2.26 s at 500 MiB, 4.68 s at 1000 MiB, with five resumes for each size. A dashed line marks 0.5 s, which the node path passes above 200 MiB and the object store path above 50 MiB.</desc>
