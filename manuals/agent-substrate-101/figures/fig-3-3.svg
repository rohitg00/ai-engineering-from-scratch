<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="fig-3-3-title fig-3-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-3-title">Resume time against the memory an actor holds</title>
  <desc id="fig-3-3-desc">Seconds for the first request to a suspended actor against the MiB of random memory it holds, on the x86 server guest with gVisor. From the node-local snapshot the median is 0.22 s at 0 MiB, 0.24 s at 50 MiB, 0.47 s at 200 MiB, 1.07 s at 500 MiB and 2.16 s at 1000 MiB. From the object store in the same cluster the median is 0.24 s, 0.41 s, 0.96 s, 2.26 s and 4.68 s. A dashed line marks 0.5 s.</desc>
