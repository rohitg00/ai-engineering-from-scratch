<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" role="img" aria-labelledby="fig-3-3b-title fig-3-3b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-3b-title">What a synchronous suspend costs the caller</title>
  <desc id="fig-3-3b-desc">Seconds for kubectl ate suspend actor to return against the MiB of random memory the actor holds, on the x86 server guest. Every one of the 75 suspends is a small dot, and a line joins the medians. The default asynchronous suspend returns when the snapshot is on the node, and its median is 0.34 s at 0 MiB, 0.50 s at 50 MiB, 0.79 s at 200 MiB, 1.17 s at 500 MiB, 1.95 s at 1000 MiB, with ten suspends for each size. With --mode sync the command returns after the upload to the object store, and its median is 0.40 s at 0 MiB, 1.03 s at 50 MiB, 2.02 s at 200 MiB, 3.59 s at 500 MiB, 6.41 s at 1000 MiB, with five suspends for each size. At 1000 MiB the synchronous suspend takes 4.5 s more.</desc>
