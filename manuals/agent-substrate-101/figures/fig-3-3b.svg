  <circle cx="169.6" cy="240.98" r="2.8" fill="var(--m-teal-ink, #18696a)"/>
  <circle cx="334" cy="198.15" r="2.8" fill="var(--m-teal-ink, #18696a)"/>
  <circle cx="608" cy="121.38" r="2.8" fill="var(--m-teal-ink, #18696a)"/>
  <text x="600" y="109.38" font-size="11" text-anchor="end" class="m-serif" fill="var(--m-teal-ink, #18696a)">6.41 s</text>
  <path d="M60 18 H78" fill="none" stroke="var(--m-violet-ink, #5b4fa3)" stroke-width="2" stroke-linejoin="round"/>
  <text x="84" y="22" font-size="11" fill="var(--m-violet-ink, #5b4fa3)">async: returns with the snapshot on the node, 10 per point</text>
