  <line x1="70" y1="219.33" x2="600" y2="219.33" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.2"/>
  <text x="60" y="223.33" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">1</text>
  <line x1="70" y1="182.67" x2="600" y2="182.67" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.2"/>
  <text x="60" y="186.67" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">2</text>
  <line x1="70" y1="146" x2="600" y2="146" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.2"/>
  <text x="60" y="150" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">3</text>
  <line x1="70" y1="109.33" x2="600" y2="109.33" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.2"/>
  <text x="60" y="113.33" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">4</text>
  <line x1="70" y1="72.67" x2="600" y2="72.67" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.2"/>
  <text x="60" y="76.67" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">5</text>
