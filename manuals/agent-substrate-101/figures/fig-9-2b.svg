<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" role="img" aria-labelledby="fig-9-2b-title fig-9-2b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-9-2b-title">The time of one agent turn, by fidelity and by the state of the actor</title>
  <desc id="fig-9-2b-desc">Seconds for one turn of the agent at the client, on the second x86 server guest with a mock model. On a running actor a turn took 0.09 to 0.11 s under memory fidelity and 0.09 to 0.10 s under volumes fidelity, with 4 turns each. After a suspend a turn took 0.30 to 0.32 s under memory fidelity and 4.50 to 5.06 s under volumes fidelity, with 3 turns each.</desc>
