<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" role="img" aria-labelledby="fig-6-1-title fig-6-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-1-title">One request through atenet-router to a running actor</title>
  <desc id="fig-6-1-desc">Five lifelines: a caller pod with the identity atenet-client, atenet-router, ate-api-server, Postgres, and the worker pod that runs my-counter-1. Seven numbered exchanges: the caller sends POST with a client certificate and the ate-target-actor header, the router calls ResumeActor, ate-api-server reads the actor row, and it returns ACTOR_STATE_RUNNING with the worker IP and SPIFFE ID. The router opens an mTLS CONNECT to the worker, the actor answers 200, and the caller has the 200 after 0.037 seconds.</desc>
