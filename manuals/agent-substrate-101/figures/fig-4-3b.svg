  <rect x="142.35" y="40" width="465.55" height="14" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <text x="148.35" y="34" font-size="11" fill="var(--m-rose-ink, #b0344d)">docker stop, the node is gone after 10 s</text>
  <text x="603.9" y="68" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">started again at 7 min 56 s</text>
  <text x="20" y="106" font-size="11.5" font-weight="700" fill="var(--m-ink, #1a1a1a)">its 2 workers</text>
  <text x="20" y="120" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">in the API list</text>
