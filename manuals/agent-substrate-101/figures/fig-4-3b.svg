<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" role="img" aria-labelledby="fig-4-3b-title fig-4-3b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-3b-title">A suspended actor after its node stops</title>
  <desc id="fig-4-3b-desc">A timeline of 476 seconds after the node multi-worker2 was stopped, on a cluster with two worker nodes. The actor u1 was suspended on that node with its snapshot complete in the object store. The two workers of the node stay listed as active for 43 seconds and are then marked unavailable. Their pods are evicted after 5 min 43 s. The actor is in the resuming state on the stopped node from the first request, and 43 requests fail in that time. At 5 min 44 s the actor is crashed, and the next 57 requests fail at once. The actor never moves to the other node.</desc>
  <text x="20" y="50" font-size="11.5" font-weight="700" fill="var(--m-ink, #1a1a1a)">node</text>
  <text x="20" y="64" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">multi-worker2</text>
