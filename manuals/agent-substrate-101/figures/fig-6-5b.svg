<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="fig-6-5b-title fig-6-5b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-5b-title">Seconds until the upstream saw a changed credential</title>
  <desc id="fig-6-5b-desc">A chart with a logarithmic time axis. The Kubernetes Secret behind one replaceHeaders rule was changed three times on each dataplane, with one request each second from one actor. On agentgateway the upstream saw the new value after 280.5, 200.9, 100.6 seconds, and 233, 168, 84 requests still carried the old value. On Envoy it took 1.0, 1.0, 1.6 seconds, and 0, 0, 1 requests carried the old value. The three first-seen times on agentgateway are 301 and 301 seconds apart. No request failed on either dataplane, in 759 and 275 requests.</desc>
