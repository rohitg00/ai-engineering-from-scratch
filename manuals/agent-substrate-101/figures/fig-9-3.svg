<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" role="img" aria-labelledby="fig-9-3-title fig-9-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-9-3-title">Six tasks in one sandbox actor, each followed by a revert</title>
  <desc id="fig-9-3-desc">Six rows for six commands sent to one sandbox actor on the second x86 server guest, with one egress rule for a package mirror, 500 millicores and 256 MiB. download from the mirror: file saved, exit 0, revert in 0.47 s, 0 files after it. outside host, by name: NXDOMAIN, revert in 0.48 s, 0 files after it. outside host, by IP: 403 from the gateway, revert in 0.50 s, 0 files after it. Kubernetes API, by name: name not resolved, revert in 0.51 s, 0 files after it. 2 s of CPU work: 2.38 s of wall time, revert in 0.48 s, 0 files after it. 640 MiB of memory: 503, actor CRASHED, revert in 0.43 s, 0 files after it.</desc>
