<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="fig-7-1-title fig-7-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-1-title">One kagent turn resumes the Session actor, runs, and suspends it again</title>
  <desc id="fig-7-1-desc">Five lifelines: the client, the kagent controller, atenet-router, ate-api-server, and the actor named session-uuid. Eight numbered exchanges show one turn. The router asks for ResumeActor and the actor is RUNNING after a median of 0.38 seconds. The turn runs. kagent calls SuspendActor and the actor is SUSPENDED after a median of 0.14 seconds. The client has its answer after 1.22 seconds.</desc>
