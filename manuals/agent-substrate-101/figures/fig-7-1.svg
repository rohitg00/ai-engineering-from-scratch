<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 508" role="img" aria-labelledby="fig-7-1-title fig-7-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-1-title">One recorded kagent turn resumes the Session actor, runs, and suspends it again</title>
  <desc id="fig-7-1-desc">Five lifelines: the client, the kagent controller, atenet-router, ate-api-server, and the actor named session-uuid. Nine numbered exchanges show one recorded turn, each with its time from the moment the client sent the message. The router asks for ResumeActor and the actor is RUNNING 0.41 s later. The turn runs. kagent calls SuspendActor, the client has its answer after 1.26 s, and the actor is SUSPENDED after 1.36 s.</desc>
