<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 346" role="img" aria-labelledby="fig-7-5b-title fig-7-5b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-5b-title">Agent Executor commands on a task with no workspace, and the resume of a task that clones</title>
  <desc id="fig-7-5b-desc">Two charts from our runs of one Agent Executor commit. On the left, every run of 10 cycles on one task with no workspace, one dot each: ax suspend task took a median of 0.18 s, ax resume task 0.24 s, and one command through ax ssh 0.74 s. On the right, the time of ax resume task when the runner prepares a workspace: 2.29 s with no workspace, 12.35 s when the clone has no egress rule, a median of 11.62 s over 14 resumes when an https rule lets the gateway intercept TLS and git refuses the certificate, 9.57 s when a tlsPassthrough rule lets the clone work, and a median of 0.27 s for the next resumes, which keep the checkout. The long resumes are five tries of the runner, and not the cost of a resume.</desc>
