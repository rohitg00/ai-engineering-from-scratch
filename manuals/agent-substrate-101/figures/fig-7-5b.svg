  <title id="fig-7-5b-title">Agent Executor commands on a task with no workspace, and the first resume</title>
  <desc id="fig-7-5b-desc">Two charts from one run with no model. On the left, every run of 10 cycles on one task with no workspace, one dot each: ax suspend task took a median of 0.18 s, ax resume task 0.24 s, and one command through ax ssh 0.74 s. On the right, one run each of the first ax resume task: 2.29 s for a task with no workspace, 12.35 s for a task whose Git clone was blocked, and 10.37 s for the next resume of that task, which tried the clone again.</desc>
