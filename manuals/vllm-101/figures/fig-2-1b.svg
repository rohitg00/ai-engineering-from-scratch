<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" role="img" aria-labelledby="fig-2-1b-title fig-2-1b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-1b-title">The pool in tokens decides how many users fit</title>
  <desc id="fig-2-1b-desc">On the L4 the pool held 24,096 tokens. The startup line reports 2.94 users because it assumes every user fills the full 8,192-token context. With 512 prompt tokens and 128 output tokens, each user holds 640 tokens, so 37 users fit.</desc>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">KV POOL ON THE L4, QWEN3-8B</text>
  <rect x="20" y="28" width="600" height="34" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="320" y="50" font-size="12" text-anchor="middle" font-weight="700" fill="var(--m-green-ink, #336b40)">24,096 tokens, 3.31 GiB at 144 KiB each</text>
  <text x="20" y="92" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">IF EVERY USER FILLS 8,192 TOKENS</text>
  <rect x="20" y="100" width="200.98" height="30" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <rect x="223.98" y="100" width="200.98" height="30" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <rect x="427.97" y="100" width="192.03" height="30" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)" stroke-dasharray="5 4"/>
  <text x="20" y="148" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Maximum concurrency 2.94x, the number the startup line prints</text>
