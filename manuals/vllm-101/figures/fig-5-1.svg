<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="fig-5-1-title fig-5-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-1-title">The sweep finds the knee: output peaks at 32 users on the L4</title>
  <desc id="fig-5-1-desc">Output tokens per second against users at the same time for vLLM 0.31.0 on an NVIDIA L4 with Qwen3-8B, three seeds per point. Output rises from 13.5 at one user to 275.1 at 32 users, then falls to 242.3 at 64 users, where requests queue for KV cache space.</desc>
