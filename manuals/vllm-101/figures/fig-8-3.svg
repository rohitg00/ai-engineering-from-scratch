  <text x="20" y="150" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">BLOCK TABLES</text>
  <rect x="20" y="160" width="190" height="44" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="115" y="177.25" font-size="12.5" text-anchor="middle" font-weight="700">request A</text>
  <text x="115" y="194.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">#2, #3, #7</text>
  <rect x="226" y="160" width="190" height="44" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="321" y="177.25" font-size="12.5" text-anchor="middle" font-weight="700">request B</text>
  <text x="321" y="194.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">#5, #6, #10</text>
  <rect x="432" y="160" width="188" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="526" y="177.25" font-size="12.5" text-anchor="middle" font-weight="700">cached prefix</text>
  <text x="526" y="194.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">#11, #12 by hash</text>
  <text x="20" y="236" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Dashed blocks are free and wait in a queue. A request takes one block each time it fills 16 tokens.</text>
  <text x="20" y="258" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">When the queue is empty, the least recently used cached block is evicted first.</text>
</svg>
