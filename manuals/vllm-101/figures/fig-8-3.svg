<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="fig-8-3-title fig-8-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-8-3-title">One pool of 16-token blocks serves every request</title>
  <desc id="fig-8-3-desc">The KV cache is a pool of 16-token blocks. Each request has a block table that maps its token positions to block numbers anywhere in the pool. Full blocks are listed in a hash map for prefix hits. Free blocks wait in a queue, and the least recently used cached block is evicted first.</desc>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">BLOCK POOL ON THE GPU</text>
  <rect x="20" y="30" width="68" height="38" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)" stroke-dasharray="5 4"/>
  <text x="54" y="52.45" font-size="11.5" text-anchor="middle" font-weight="700">#0</text>
  <rect x="96" y="30" width="68" height="38" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)" stroke-dasharray="5 4"/>
  <text x="130" y="52.45" font-size="11.5" text-anchor="middle" font-weight="700">#1</text>
  <rect x="172" y="30" width="68" height="38" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="206" y="52.45" font-size="11.5" text-anchor="middle" font-weight="700">#2</text>
  <rect x="248" y="30" width="68" height="38" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
