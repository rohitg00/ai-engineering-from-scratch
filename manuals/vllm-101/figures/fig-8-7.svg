<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="fig-8-7-title fig-8-7-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-8-7-title">One verify pass keeps the drafts up to the first rejection, plus one token</title>
  <desc id="fig-8-7-desc">Top: a proposer drafts three tokens, the target model checks them in one pass, keeps the first two, rejects the third, and adds its own token. Bottom: one real request with Qwen3-8B on our L4 and EAGLE3 with three drafts per step wrote 12 tokens. One came from prefill and 11 from 6 verify passes, which kept 5 of 18 drafts.</desc>
