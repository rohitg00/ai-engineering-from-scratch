  <line x1="338" y1="64" x2="338" y2="95" stroke="var(--m-plum-ink, #8a3d72)" stroke-width="1.2" marker-end="url(#fig-8-7-head-plum)"/>
  <rect x="280" y="96" width="116" height="36" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <text x="338" y="117.75" font-size="12.5" text-anchor="middle" font-weight="700">rejected</text>
  <rect x="410" y="96" width="140" height="36" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="480" y="117.75" font-size="12.5" text-anchor="middle" font-weight="700">target token</text>
  <line x1="396" y1="114" x2="409" y2="114" stroke="var(--m-plum-ink, #8a3d72)" stroke-width="1.2" marker-end="url(#fig-8-7-head-plum)"/>
  <text x="20" y="158" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">One target pass writes the kept drafts and one token of its own.</text>
