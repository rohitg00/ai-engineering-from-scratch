  <rect x="150" y="28" width="116" height="36" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="208" y="49.75" font-size="12.5" text-anchor="middle" font-weight="700">draft 2</text>
  <rect x="280" y="28" width="116" height="36" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="338" y="49.75" font-size="12.5" text-anchor="middle" font-weight="700">draft 3</text>
  <line x1="78" y1="64" x2="78" y2="95" stroke="var(--m-plum-ink, #8a3d72)" stroke-width="1.2" marker-end="url(#fig-8-7-head-plum)"/>
  <rect x="20" y="96" width="116" height="36" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="78" y="117.75" font-size="12.5" text-anchor="middle" font-weight="700">kept</text>
  <line x1="208" y1="64" x2="208" y2="95" stroke="var(--m-plum-ink, #8a3d72)" stroke-width="1.2" marker-end="url(#fig-8-7-head-plum)"/>
  <rect x="150" y="96" width="116" height="36" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
