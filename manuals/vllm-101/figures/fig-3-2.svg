<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-labelledby="fig-3-2-title fig-3-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-2-title">A prefix hit reuses whole 16-token blocks up to the first difference</title>
  <desc id="fig-3-2-desc">Two prompts share a system prompt. Each full 16-token block gets a hash that includes the hash of the block before it. The second prompt finds the first three block hashes in the map and reuses those blocks. Its fourth block differs, so the chain stops and the rest is computed.</desc>
  <defs><marker id="fig-3-2-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">REQUEST A, ALREADY SERVED</text>
  <text x="620" y="122" font-size="11" text-anchor="end" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">REQUEST B, ARRIVES LATER</text>
  <rect x="20" y="28" width="108" height="46" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="74" y="46.25" font-size="12.5" text-anchor="middle" font-weight="700">block 1</text>
  <text x="74" y="63.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">h1</text>
  <rect x="20" y="128" width="108" height="46" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="74" y="146.25" font-size="12.5" text-anchor="middle" font-weight="700">cache hit</text>
  <text x="74" y="163.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">h1</text>
  <rect x="140" y="28" width="108" height="46" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="194" y="46.25" font-size="12.5" text-anchor="middle" font-weight="700">block 2</text>
  <text x="194" y="63.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">h2</text>
  <rect x="140" y="128" width="108" height="46" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="194" y="146.25" font-size="12.5" text-anchor="middle" font-weight="700">cache hit</text>
  <text x="194" y="163.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">h2</text>
  <rect x="260" y="28" width="108" height="46" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="314" y="46.25" font-size="12.5" text-anchor="middle" font-weight="700">block 3</text>
  <text x="314" y="63.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">h3</text>
  <rect x="260" y="128" width="108" height="46" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="314" y="146.25" font-size="12.5" text-anchor="middle" font-weight="700">cache hit</text>
  <text x="314" y="163.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">h3</text>
  <rect x="380" y="28" width="108" height="46" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="434" y="46.25" font-size="12.5" text-anchor="middle" font-weight="700">block 4</text>
  <text x="434" y="63.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">h4a</text>
  <rect x="380" y="128" width="108" height="46" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)" stroke-dasharray="5 4"/>
  <text x="434" y="146.25" font-size="12.5" text-anchor="middle" font-weight="700">compute</text>
  <text x="434" y="163.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">h4b</text>
  <rect x="500" y="28" width="108" height="46" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="554" y="46.25" font-size="12.5" text-anchor="middle" font-weight="700">block 5</text>
  <text x="554" y="63.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">h5a</text>
  <rect x="500" y="128" width="108" height="46" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)" stroke-dasharray="5 4"/>
  <text x="554" y="146.25" font-size="12.5" text-anchor="middle" font-weight="700">compute</text>
  <text x="554" y="163.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">h5b</text>
  <line x1="74" y1="127" x2="74" y2="75" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-ink)"/>
  <line x1="194" y1="127" x2="194" y2="75" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-ink)"/>
  <line x1="314" y1="127" x2="314" y2="75" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-ink)"/>
  <text x="446" y="98" font-size="11.5" font-weight="700" fill="var(--m-rose-ink, #b0344d)">differs here, chain stops</text>
  <text x="20" y="206" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Each hash covers its 16 tokens and the hash before it, so h3 names the first 48 tokens.</text>
  <text x="20" y="228" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">A shared part of 20 tokens gives one cached block, and 4 tokens are always computed.</text>
  <text x="20" y="250" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Put the shared part first, in the same order, to keep the chain long.</text>
</svg>
