  <text x="500" y="404" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">3.3</text>
  <line x1="20" y1="411" x2="620" y2="411" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
