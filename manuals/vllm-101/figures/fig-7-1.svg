  <line x1="20" y1="347" x2="620" y2="347" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <rect x="20" y="350" width="600" height="16" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
