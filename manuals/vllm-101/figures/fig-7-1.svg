  <text x="300" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">CHECK FIRST</text>
  <text x="500" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">THEN</text>
  <rect x="20" y="33" width="600" height="16" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="28" y="45" font-size="11" font-weight="700">the server does not start</text>
  <text x="28" y="66" font-size="11">download hangs</text>
