<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 654" role="img" aria-labelledby="fig-7-1-title fig-7-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-1-title">Each troubleshooting entry: the symptom, the first check, and where the fix is</title>
  <desc id="fig-7-1-desc">Twenty-four symptoms in five groups: the server does not start, requests fail, the server is slow, the output is wrong, and the benchmark is wrong. Each row gives the first log line or metric to check and the section or action that fixes it.</desc>
