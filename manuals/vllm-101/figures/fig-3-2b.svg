  <title id="fig-3-2b-title">With the cache on, the first token stays near 400 ms at every shared length</title>
  <desc id="fig-3-2b-desc">Median time to first token against the shared system prompt length, on an NVIDIA L4 with Qwen3-8B, 8 users, three seeds, log scale. With the cache on, it stays between 375 and 488 ms. With it off, it grows to 1,213 ms at 1,024 tokens and 13,353 ms at 4,096 tokens, where the GPU clock also fell.</desc>
