<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" role="img" aria-labelledby="fig-6-3-title fig-6-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-3-title">Split prefill and decode: the KV cache moves between two servers</title>
  <desc id="fig-6-3-desc">A router sends a new request to a prefill server, which computes the prompt and writes its KV cache. The NixlConnector copies the cache to a decode server, which then streams the tokens back. Both servers set a kv_connector in --kv-transfer-config.</desc>
  <defs><marker id="fig-6-3-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-6-3-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-teal-ink, #18696a)"/></marker><marker id="fig-6-3-head-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-indigo-ink, #4b4f9e)"/></marker></defs>
  <rect x="20" y="60" width="120" height="54" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="80" y="82.25" font-size="12.5" text-anchor="middle" font-weight="700">router</text>
  <text x="80" y="99.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">picks a pair</text>
  <rect x="190" y="20" width="170" height="54" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="275" y="42.25" font-size="12.5" text-anchor="middle" font-weight="700">prefill server</text>
  <text x="275" y="59.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">computes the prompt</text>
  <rect x="190" y="130" width="170" height="54" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="275" y="152.25" font-size="12.5" text-anchor="middle" font-weight="700">decode server</text>
  <text x="275" y="169.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">writes the tokens</text>
  <rect x="440" y="76" width="180" height="54" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="530" y="98.25" font-size="12.5" text-anchor="middle" font-weight="700">NixlConnector</text>
  <text x="530" y="115.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">copies KV blocks</text>
  <line x1="140" y1="76" x2="189" y2="47" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-3-head-ink)"/>
  <line x1="360" y1="47" x2="439" y2="92" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.2" marker-end="url(#fig-6-3-head-teal)"/>
  <line x1="439" y1="116" x2="361" y2="157" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.2" marker-end="url(#fig-6-3-head-teal)"/>
  <line x1="189" y1="157" x2="141" y2="100" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#fig-6-3-head-indigo)"/>
  <text x="20" y="214" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Both servers: --kv-transfer-config with &quot;kv_connector&quot;: &quot;NixlConnector&quot;.</text>
</svg>
