  <text x="115" y="249.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ok true, healthy</text>
  <rect x="225" y="198" width="190" height="64" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="320" y="217.3" font-size="11" text-anchor="middle" font-weight="700">ghidra-native_decompiler</text>
  <text x="320" y="234.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">os/mac_arm_64/decompile</text>
  <text x="320" y="249.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">mach-o arm64 matches</text>
  <rect x="430" y="198" width="190" height="64" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="525" y="217.3" font-size="11" text-anchor="middle" font-weight="700">ghidra-java</text>
  <text x="525" y="234.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">21.0.12.1, 64-bit JDK</text>
  <text x="525" y="249.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ok true, healthy</text>
