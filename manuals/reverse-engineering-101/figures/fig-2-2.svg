  <line x1="210" y1="146" x2="224" y2="146" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-2-2-head-ink)"/>
  <line x1="415" y1="146" x2="429" y2="146" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-2-2-head-ink)"/>
  <path d="M525 178 V188 H115 V197" fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#fig-2-2-head-ink)"/>
  <line x1="210" y1="230" x2="224" y2="230" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-2-2-head-ink)"/>
  <line x1="415" y1="230" x2="429" y2="230" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-2-2-head-ink)"/>
  <path d="M525 262 V276 H165 V289" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-2-2-head-amber)"/>
  <path d="M525 262 V276 H475 V289" fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-2-2-head-ink)"/>
  <rect x="20" y="290" width="290" height="56" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="165" y="305.6" font-size="12" text-anchor="middle" font-weight="700">healthy: true</text>
  <text x="165" y="322.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">scope explicit, providers [ghidra]</text>
  <text x="165" y="337.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">exit 0, under one second</text>
