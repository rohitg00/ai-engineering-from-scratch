  <text x="150" y="331" font-size="11" font-weight="700">_fwrite</text>
  <text x="330" y="331" font-size="11">12 B</text>
  <text x="410" y="331" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">thunk to EXTERNAL:0x3 in __stubs</text>
  <rect x="20" y="340" width="600" height="26" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="28" y="357" font-size="11">0x100000764</text>
  <text x="150" y="357" font-size="11" font-weight="700">_printf</text>
  <text x="330" y="357" font-size="11">12 B</text>
  <text x="410" y="357" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">thunk to EXTERNAL:0x4 in __stubs</text>
  <text x="20" y="390" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">internal bodies 24 + 60 + 52 + 72 + 368 = 576 bytes, the size of __text · stubs 4 × 12 = 48 bytes</text>
