<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" role="img" aria-labelledby="fig-4-7-title fig-4-7-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-7-title">The 39 strings of ledger-arm64-O1 by load command</title>
  <desc id="fig-4-7-desc">Six rows sorted by address. Two load command strings in the header, the dyld and libSystem paths. Ten strings in __TEXT,__cstring from 0x100000770, the labels, the format strings and one empty pad. Six import names in the chained fixups from 0x100008069. Seven edge labels of the exports trie from 0x1000080b2. Thirteen names in the LC_SYMTAB string table from 0x10000821a. One code signature identifier, ledger-arm64-O1, at 0x10000831c. The total is 39, the string_count of the overview.</desc>
