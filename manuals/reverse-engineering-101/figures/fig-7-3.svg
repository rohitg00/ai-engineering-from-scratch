<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 412" role="img" aria-labelledby="fig-7-3-title fig-7-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-3-title">Where each of the eight candidates stops</title>
  <desc id="fig-7-3-desc">Four checks run top down on the left: size, masked bytes, relocation records, and referenced constants, then a pass box. To the right of the size check, three candidates stop: percent_change_wide with 16 against 26 bytes, percent_change_div_first with 16 against 18 bytes, and grade_thresholds with 46 against 39 bytes and 1 against 0 relocations. No candidate stops at masked bytes or at relocation records. At referenced constants, grade_case10_wrong stops with the tables 1, 2, 3, 4, 4 against 1, 2, 3, 4, 3. Four candidates pass: percent_change_mul_first and percent_change_split with 16 bytes and no relocation, and grade_switch and grade_table with 46 bytes and the table 1, 2, 3, 4, 4.</desc>
  <defs><marker id="fig-7-3-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-7-3-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker></defs>
  <rect x="20" y="30" width="170" height="40" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="105" y="53.6" font-size="12" text-anchor="middle" font-weight="700">size</text>
