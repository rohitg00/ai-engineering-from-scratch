  <line x1="190" y1="340" x2="209" y2="340" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-3-head-ink)"/>
  <rect x="210" y="320" width="200" height="36" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="310" y="332.8" font-size="11" text-anchor="middle" font-weight="700">percent_change_mul_first</text>
  <text x="310" y="349.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">16 bytes, no relocation</text>
