  <rect class="m-knock" x="110" y="78.92" width="39" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="113" y="89.5" font-size="11">equal</text>
  <rect x="210" y="30" width="200" height="36" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <text x="310" y="42.8" font-size="11" text-anchor="middle" font-weight="700">percent_change_wide</text>
  <text x="310" y="59.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">16 vs 26 bytes</text>
  <rect x="420" y="30" width="200" height="36" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <text x="520" y="42.8" font-size="11" text-anchor="middle" font-weight="700">percent_change_div_first</text>
  <text x="520" y="59.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">16 vs 18 bytes</text>
  <rect x="210" y="72" width="200" height="36" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <text x="310" y="84.8" font-size="11" text-anchor="middle" font-weight="700">grade_thresholds</text>
  <text x="310" y="101.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">46 vs 39 bytes, 0 relocations</text>
  <line x1="190" y1="50" x2="209" y2="50" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-3-head-rose)"/>
