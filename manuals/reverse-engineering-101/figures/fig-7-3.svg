  <rect x="20" y="250" width="170" height="40" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="105" y="273.6" font-size="12" text-anchor="middle" font-weight="700">referenced constants</text>
  <line x1="105" y1="290" x2="105" y2="319" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-3-head-ink)"/>
  <rect class="m-knock" x="110" y="293.92" width="39" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="113" y="304.5" font-size="11">equal</text>
  <rect x="210" y="250" width="200" height="36" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
