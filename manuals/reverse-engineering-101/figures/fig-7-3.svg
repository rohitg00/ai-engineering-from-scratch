  <text x="520" y="332.8" font-size="11" text-anchor="middle" font-weight="700">percent_change_split</text>
  <text x="520" y="349.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">16 bytes, no relocation</text>
