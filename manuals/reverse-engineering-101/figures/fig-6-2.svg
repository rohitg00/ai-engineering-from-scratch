<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 416" role="img" aria-labelledby="fig-6-2-title fig-6-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-2-title">inspect_wasm_artifact on ledger.wasm</title>
  <desc id="fig-6-2-desc">Top row: two entry points, the CLI command rea inspect-wasm-artifact and the MCP call tools/call inspect_wasm_artifact. Both reach the wabt-artifact provider, which reads REA_WABT_BIN_DIRECTORY=/opt/homebrew/bin and copies ledger.wasm, 290 bytes, SHA-256 699f6ff7, to a read-only module.wasm in a private workspace. Third row: three WABT 1.0.42 programs run on the copy, wasm-validate --enable-all, wasm-objdump -h -x, and wasm2wat --enable-all. Bottom: one Evidence record ev_3a09e4b0, observed, with validation valid, seven sections, an interface of one import and five exports, the decoded WAT with SHA-256 37eab56a, a tool profile, and five limitations. runtime_execution and network_fetch are not-performed. The CLI prints the record, and MCP returns the same record as structuredContent with the untrusted-content marker.</desc>
  <defs><marker id="fig-6-2-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <rect x="20" y="28" width="290" height="48" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="165" y="47.25" font-size="12.5" text-anchor="middle" font-weight="700">rea inspect-wasm-artifact</text>
  <text x="165" y="64.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">CLI, exit 0 after 1.5 s</text>
  <rect x="330" y="28" width="290" height="48" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="475" y="47.25" font-size="12.5" text-anchor="middle" font-weight="700">tools/call inspect_wasm_artifact</text>
  <text x="475" y="64.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">MCP step 24, ok after 404 ms</text>
  <rect x="20" y="104" width="600" height="56" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="320" y="127.1" font-size="12" text-anchor="middle" font-weight="700">wabt-artifact provider, REA_WABT_BIN_DIRECTORY=/opt/homebrew/bin</text>
  <text x="320" y="144.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">copies ledger.wasm, 290 bytes, sha256 699f6ff7, to a read-only module.wasm</text>
  <line x1="165" y1="76" x2="165" y2="103" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-2-head-ink)"/>
  <rect class="m-knock" x="170" y="78.53" width="33.6" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="173" y="89.5" font-size="11.5">path</text>
  <line x1="475" y1="76" x2="475" y2="103" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-2-head-ink)"/>
  <rect class="m-knock" x="480" y="78.53" width="33.6" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="483" y="89.5" font-size="11.5">path</text>
  <rect x="20" y="196" width="190" height="62" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="115" y="214.75" font-size="12.5" text-anchor="middle" font-weight="700">wasm-validate</text>
  <text x="115" y="232.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">--enable-all, banner 1.0.42</text>
  <text x="115" y="247.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">result: valid</text>
  <line x1="115" y1="160" x2="115" y2="195" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-2-head-ink)"/>
  <rect x="225" y="196" width="190" height="62" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="320" y="214.75" font-size="12.5" text-anchor="middle" font-weight="700">wasm-objdump</text>
  <text x="320" y="232.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">-h -x, banner 1.0.42</text>
  <text x="320" y="247.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">result: 7 sections</text>
  <line x1="320" y1="160" x2="320" y2="195" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-2-head-ink)"/>
  <rect x="430" y="196" width="190" height="62" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="525" y="214.75" font-size="12.5" text-anchor="middle" font-weight="700">wasm2wat</text>
  <text x="525" y="232.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">--enable-all, banner 1.0.42</text>
  <text x="525" y="247.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">result: decoded WAT</text>
  <line x1="525" y1="160" x2="525" y2="195" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-2-head-ink)"/>
  <rect x="20" y="294" width="600" height="92" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="30" y="312" font-size="12" font-weight="700" fill="var(--m-teal-ink, #18696a)">Evidence ev_3a09e4b0, confidence observed</text>
  <text x="30" y="330" font-size="11">sections: Type, Import, Function, Memory, Export, Code, Data</text>
  <text x="30" y="345" font-size="11">interface: 1 import env.log, 5 exports with typed signatures</text>
  <text x="30" y="360" font-size="11">wat: decoded-wat, sha256 37eab56a, tool_profile: 3 commands</text>
  <text x="30" y="375" font-size="11">limitations: 5, runtime_execution and network_fetch not-performed</text>
  <line x1="115" y1="258" x2="115" y2="293" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-2-head-ink)"/>
  <line x1="320" y1="258" x2="320" y2="293" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-2-head-ink)"/>
  <line x1="525" y1="258" x2="525" y2="293" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-2-head-ink)"/>
  <text x="20" y="406" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">The CLI prints this record. MCP returns the same id as structuredContent.</text>
</svg>
