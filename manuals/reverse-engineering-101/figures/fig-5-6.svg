  <text x="30" y="42.45" font-size="11.5" font-weight="700">status unknown: 7 unchanged, 1 unknown</text>
  <rect x="20" y="52" width="290" height="24" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="68" font-size="11">identity</text>
  <text x="140" y="68" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">digests equal</text>
  <text x="235" y="68" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">unchanged</text>
  <rect x="20" y="76" width="290" height="24" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
