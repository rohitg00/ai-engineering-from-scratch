<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 478" role="img" aria-labelledby="fig-1-3-title fig-1-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-1-3-title">The 16 fields of one Evidence record</title>
  <desc id="fig-1-3-desc">The Evidence record for analyze_function on _percent_change drawn as a table of its 16 fields with the value each one holds in the capture and a note on the right. evidence_id is ev_ and 64 hex digits, a SHA-256 of the semantic content. subject is ledger-arm64-O1, mach-o, arm64 with the sha256 01b5d08b08fb and a local_path. provider is ghidra, Ghidra, 12.1.4. analysis_profile has 25 parameters and the digest 3fc72c9b. predicate_type is rea.analysis. operation is analyze_function. parameters is the procedure _percent_change. raw_result holds value and limitations. normalized_result is the dossier with procedure, pseudocode, assembly, and blocks. confidence is observed, authority is the value for a static read of the file on disk, environment is null, limitations has 10 strings, relationship_coverage is complete with one diagnostic on call references, and locations and evidence_links are empty.</desc>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">ONE EVIDENCE RECORD</text>
  <text x="396" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">WHAT THE FIELD HOLDS</text>
  <rect x="20" y="26" width="360" height="28" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="30" y="43.3" font-size="11" font-weight="700">Evidence ev_b492c85e for analyze_function</text>
  <rect x="20" y="54" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="71" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">evidence_id</text>
  <text x="188" y="71" font-size="12">ev_ + 64 hex digits</text>
  <line x1="380" y1="67" x2="390" y2="67" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="396" y="71" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">SHA-256 of the semantic content</text>
  <rect x="20" y="80" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="97" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">subject</text>
  <text x="188" y="97" font-size="12">ledger-arm64-O1, arm64</text>
  <line x1="380" y1="93" x2="390" y2="93" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="396" y="97" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">mach-o, sha256 starts 01b5d08b</text>
  <rect x="20" y="106" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="123" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">provider</text>
  <text x="188" y="123" font-size="12">ghidra, Ghidra, 12.1.4</text>
  <line x1="380" y1="119" x2="390" y2="119" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="396" y="123" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the engine that answered</text>
  <rect x="20" y="132" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="149" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">analysis_profile</text>
  <text x="188" y="149" font-size="12">digest 3fc72c9b</text>
  <line x1="380" y1="145" x2="390" y2="145" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="396" y="149" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">25 contract parameters, hashed</text>
  <rect x="20" y="158" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="175" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">predicate_type</text>
  <text x="188" y="175" font-size="12">rea.analysis</text>
  <line x1="380" y1="171" x2="390" y2="171" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="396" y="175" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the default tag</text>
  <rect x="20" y="184" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="201" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">operation</text>
  <text x="188" y="201" font-size="12">analyze_function</text>
  <line x1="380" y1="197" x2="390" y2="197" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="396" y="201" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the MCP name behind rea function</text>
  <rect x="20" y="210" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="227" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">parameters</text>
  <text x="188" y="227" font-size="12">procedure _percent_change</text>
  <line x1="380" y1="223" x2="390" y2="223" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="396" y="227" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">part of the identity</text>
  <rect x="20" y="236" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="253" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">raw_result</text>
  <text x="188" y="253" font-size="12">value, limitations</text>
  <line x1="380" y1="249" x2="390" y2="249" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="396" y="253" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the provider-native dossier</text>
  <rect x="20" y="262" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="279" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">normalized_result</text>
  <text x="188" y="279" font-size="12">the dossier</text>
  <line x1="380" y1="275" x2="390" y2="275" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="396" y="279" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">procedure, pseudocode, assembly, blocks</text>
  <rect x="20" y="288" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="305" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">confidence</text>
  <text x="188" y="305" font-size="12">observed</text>
  <line x1="380" y1="301" x2="390" y2="301" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="396" y="305" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">or derived, or inferred</text>
  <rect x="20" y="314" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="331" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">authority</text>
  <text x="188" y="331" font-size="12">the file on disk</text>
  <line x1="380" y1="327" x2="390" y2="327" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="396" y="331" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">one of five authorities</text>
  <rect x="20" y="340" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="357" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">environment</text>
  <text x="188" y="357" font-size="12">null</text>
  <line x1="380" y1="353" x2="390" y2="353" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="396" y="357" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">nothing was run</text>
  <rect x="20" y="366" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="383" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">limitations</text>
  <text x="188" y="383" font-size="12">10 strings</text>
  <line x1="380" y1="379" x2="390" y2="379" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="396" y="383" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">4 session, 5 dossier, 1 macOS</text>
  <rect x="20" y="392" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="409" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">relationship_coverage</text>
  <text x="188" y="409" font-size="12">complete</text>
  <line x1="380" y1="405" x2="390" y2="405" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="396" y="409" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">one diagnostic on call references</text>
  <rect x="20" y="418" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="435" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">locations</text>
  <text x="188" y="435" font-size="12">[]</text>
  <line x1="380" y1="431" x2="390" y2="431" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="396" y="435" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">none for this operation</text>
  <rect x="20" y="444" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="461" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">evidence_links</text>
  <text x="188" y="461" font-size="12">[]</text>
  <line x1="380" y1="457" x2="390" y2="457" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="396" y="461" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">no parent records</text>
</svg>
