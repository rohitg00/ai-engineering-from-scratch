  <rect x="230" y="102" width="180" height="50" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="320" y="122.25" font-size="12.5" text-anchor="middle" font-weight="700">_grade</text>
  <text x="320" y="139.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">0x100000518 · 60 B</text>
