  <text x="180" y="199" font-size="11">ghidra, Ghidra, 12.1.4</text>
  <line x1="420" y1="195" x2="434" y2="195" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="440" y="199" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the engine, with its version</text>
  <rect x="20" y="206" width="400" height="22" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="221" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">analysis_profile</text>
  <text x="180" y="221" font-size="11">digest 3fc72c9b4b78498fb9</text>
  <line x1="420" y1="217" x2="434" y2="217" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="440" y="221" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the committed Ghidra settings</text>
  <rect x="20" y="228" width="400" height="22" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="243" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">predicate_type</text>
  <text x="180" y="243" font-size="11">rea.analysis</text>
  <rect x="20" y="250" width="400" height="22" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="265" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">operation</text>
  <text x="180" y="265" font-size="11">analyze_function</text>
  <rect x="20" y="272" width="400" height="22" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="287" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">parameters</text>
  <text x="180" y="287" font-size="11">{&quot;procedure&quot;: &quot;_percent_change&quot;}</text>
  <line x1="420" y1="283" x2="434" y2="283" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="440" y="287" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the caller input, in full</text>
  <rect x="20" y="294" width="400" height="22" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="309" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">raw_result</text>
  <text x="180" y="309" font-size="11">object: the Ghidra report</text>
  <line x1="420" y1="305" x2="434" y2="305" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="440" y="309" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">provider form, or null</text>
  <rect x="20" y="316" width="400" height="22" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="331" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">normalized_result</text>
  <text x="180" y="331" font-size="11">object: the dossier, 16 keys</text>
  <line x1="420" y1="327" x2="434" y2="327" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="440" y="331" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">what the agent reads</text>
  <rect x="20" y="338" width="400" height="22" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="353" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">confidence</text>
  <text x="180" y="353" font-size="11">observed</text>
  <line x1="420" y1="349" x2="434" y2="349" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="440" y="353" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">observed, derived, or inferred</text>
  <rect x="20" y="360" width="400" height="22" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="375" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">authority</text>
  <text x="180" y="375" font-size="11">the artifact bytes</text>
  <line x1="420" y1="371" x2="434" y2="371" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="440" y="375" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">one of five source kinds</text>
  <rect x="20" y="382" width="400" height="22" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="397" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">environment</text>
  <text x="180" y="397" font-size="11">null</text>
  <rect x="20" y="404" width="400" height="22" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="419" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">limitations</text>
  <text x="180" y="419" font-size="11">10 strings</text>
  <line x1="420" y1="415" x2="434" y2="415" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="440" y="419" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">kept with the claim, in full</text>
  <rect x="20" y="426" width="400" height="22" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="441" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">relationship_coverage</text>
  <text x="180" y="441" font-size="11">complete</text>
  <line x1="420" y1="437" x2="434" y2="437" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="440" y="441" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">in the hash also when null</text>
  <rect x="20" y="448" width="400" height="22" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="463" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">locations</text>
  <text x="180" y="463" font-size="11">[]</text>
  <rect x="20" y="470" width="400" height="22" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="485" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">evidence_links</text>
  <text x="180" y="485" font-size="11">[]</text>
  <line x1="420" y1="481" x2="434" y2="481" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="440" y="485" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ev_ ids this record derives from</text>
  <text x="20" y="516" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Solid rows enter the id hash. Dashed rows are display fields. Digests show their first hex digits.</text>
</svg>
