<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-labelledby="fig-3-4-title fig-3-4-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-4-title">From 0x100000518 to file offset 1304</title>
  <desc id="fig-3-4-desc">Three rows. The __TEXT segment has vmaddr 0x100000000 and fileoff 0, so address minus vmaddr plus fileoff is 0x518, which is 1304. The __text section has address 0x100000500 and file_offset 1280, so 1280 plus 24 is 1304. The rea tool address_to_file_offset asks Ghidra for its one source mapping and answers file_offset 1304, where the bytes e8 cc 8c 52 encode mov w8, #0x6667.</desc>
  <defs><marker id="fig-3-4-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">WHAT THE FILE SAYS</text>
  <text x="340" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">THE OFFSET</text>
  <rect x="20" y="30" width="280" height="50" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="160" y="50.25" font-size="12.5" text-anchor="middle" font-weight="700">__TEXT segment</text>
  <text x="160" y="67.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">vmaddr 0x100000000 · fileoff 0</text>
  <rect x="340" y="30" width="280" height="50" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="480" y="50.25" font-size="12.5" text-anchor="middle" font-weight="700">address - vmaddr + fileoff</text>
  <text x="480" y="67.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">0x100000518 - 0x100000000 + 0 = 0x518</text>
  <line x1="300" y1="55" x2="339" y2="55" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-4-head-ink)"/>
  <line x1="480" y1="80" x2="480" y2="97" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-4-head-ink)"/>
  <rect x="20" y="98" width="280" height="50" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="160" y="118.25" font-size="12.5" text-anchor="middle" font-weight="700">__text section</text>
  <text x="160" y="135.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">address 0x100000500 · file_offset 1280</text>
  <rect x="340" y="98" width="280" height="50" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="480" y="118.25" font-size="12.5" text-anchor="middle" font-weight="700">file_offset + (address - addr)</text>
  <text x="480" y="135.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">1280 + (0x518 - 0x500) = 1280 + 24</text>
  <line x1="300" y1="123" x2="339" y2="123" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-4-head-ink)"/>
  <line x1="480" y1="148" x2="480" y2="165" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-4-head-ink)"/>
  <rect x="20" y="166" width="280" height="50" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="160" y="186.25" font-size="12.5" text-anchor="middle" font-weight="700">address_to_file_offset</text>
  <text x="160" y="203.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Ghidra source mapping, exactly one</text>
  <rect x="340" y="166" width="280" height="50" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="480" y="186.25" font-size="12.5" text-anchor="middle" font-weight="700">file_offset 1304</text>
  <text x="480" y="203.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">bytes e8 cc 8c 52 · mov w8, #0x6667</text>
  <line x1="300" y1="191" x2="339" y2="191" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-4-head-ink)"/>
</svg>
