<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 378" role="img" aria-labelledby="fig-8-3-title fig-8-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-8-3-title">From one question to a ledger</title>
  <desc id="fig-8-3-desc">A flow read top down. The question in plum: what does ledger print for a score of 95, and where does the letter come from. Four MCP calls in indigo: list_procedures in 6,349 ms, list_strings in 6 ms, analyze_function on _grade in 16 ms, and analyze_function on _grade_label in 18 ms. Four Evidence records in teal: ev_3c6350b2 with 13 procedures, ev_ad37f574 with 39 strings from F to A, ev_41e8ca1c with 15 instructions and no caller, and ev_b201cfd0 naming _labels and DAT_1000007e8. One amber ledger with one row per claim: observed 5, derived 2, inferred 1, unknown 1, refused 1. The answer in grey stays unknown until read_bytes runs at 0x1000007d0 and 0x1000007e8.</desc>
  <defs><marker id="fig-8-3-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-8-3-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-teal-ink, #18696a)"/></marker></defs>
  <rect x="20" y="14" width="600" height="44" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
