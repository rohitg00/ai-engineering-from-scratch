  <text x="543" y="199.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">names _labels</text>
  <line x1="543" y1="210" x2="543" y2="243" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.2" marker-end="url(#fig-8-3-head-teal)"/>
  <rect x="20" y="244" width="600" height="44" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="320" y="261.25" font-size="12.5" text-anchor="middle" font-weight="700">the ledger, one row per claim</text>
