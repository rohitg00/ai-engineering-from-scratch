<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="fig-reading-a-sequence-title fig-reading-a-sequence-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-reading-a-sequence-title">Reading a sequence figure in this manual</title>
  <desc id="fig-reading-a-sequence-desc">Five lifelines: planner, test-runner, the task store of test-runner, a webhook receiver at /a2a-events, and an operator. Eight numbered rows show each arrow style once: SendMessage as a solid ink call, task saved as a solid teal write, TASK_STATE_WORKING as a dashed amber state change, a statusUpdate stream frame and a push POST as dotted indigo events, the planner asking an operator for approval as a dashed olive effect outside A2A, TaskNotFoundError as a dashed rose failure, and the SendMessage result as a dashed ink reply.</desc>
