  <rect class="m-knock" x="128.6" y="259.03" width="88.8" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="173" y="270" font-size="11.5" text-anchor="middle" fill="var(--m-olive-ink, #515f26)">bearer token</text>
  <rect class="m-knock" x="116.54" y="280.42" width="112.92" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="173" y="291" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">issued outside A2A</text>
  </g>
