<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="fig-extended-card-title fig-extended-card-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-extended-card-title">Earning the extended card</title>
  <desc id="fig-extended-card-desc">Three lifelines: the platform team outside A2A, the planner, and the deployer. Seven steps appear in order. The planner reads the public card, which declares extendedAgentCard true and a bearer scheme. It calls GetExtendedAgentCard without an Authorization header and gets HTTP 401 with WWW-Authenticate: Bearer realm=&quot;deployer&quot;. The platform team issues a bearer token outside A2A. The planner calls again with the token and receives the extended card, whose skills are deploy and rollback and which carries no signature.</desc>
