<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" role="img" aria-labelledby="fig-context-and-tasks-title fig-context-and-tasks-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-context-and-tasks-title">One context, two tasks</title>
  <desc id="fig-context-and-tasks-desc">A tree. The root is context 49c5a238. Its first child is the review task e5c95b09, completed, whose history holds four messages from two SendMessage calls: the planner request with the diff and the agent question, then the planner answer main carrying taskId and contextId and the agent reply, followed by the artifact review.json. Its second child, drawn dashed because the captures stop before it, is a follow-up task in the same context whose first message carries contextId 49c5a238 and referenceTaskIds naming e5c95b09 and no taskId.</desc>
  <defs><marker id="fig-context-and-tasks-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-violet-ink, #5b4fa3)"/></marker></defs>
  <rect x="190" y="12" width="260" height="46" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #6f6f6a)"/>
  <text x="320" y="31" font-size="12.5" text-anchor="middle" font-weight="700">context 49c5a238</text>
  <text x="320" y="48" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">created by code-reviewer, opaque to you</text>
  <path d="M320 58 V78 H170 V96" fill="none" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="20" y="96" width="300" height="50" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <rect x="23" y="99" width="294" height="44" fill="none" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="170" y="116.25" font-size="12.5" text-anchor="middle" font-weight="700">task e5c95b09 · review</text>
  <text x="170" y="133.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">TASK_STATE_COMPLETED, status: 2 findings</text>
  <path d="M36 146 V399" fill="none" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="20" y="444" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Violet: sent by the planner. Blue: sent by code-reviewer. Ids shortened to 8 characters.</text>
  <g data-beat="1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/>
  <text x="56" y="160" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">CALL 1 · REVIEW A DIFF</text>
