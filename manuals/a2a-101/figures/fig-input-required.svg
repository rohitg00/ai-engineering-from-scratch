<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 468" role="img" aria-labelledby="fig-input-required-title fig-input-required-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-input-required-title">The review question and its answer</title>
  <desc id="fig-input-required-desc">A sequence with three lifelines: the planner, the code-reviewer agent, and the stored task e5c95b09. The planner sends a diff with no task id. The reviewer moves the task to TASK_STATE_INPUT_REQUIRED with the question which base branch, and the blocking call returns the task. The planner sends main with the same task and context ids. The reviewer moves the question into history, works, adds the review.json artifact, completes the task, and returns it with four history messages.</desc>
