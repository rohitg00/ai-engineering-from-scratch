<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 414" role="img" aria-labelledby="fig-a2a-and-tools-title fig-a2a-and-tools-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-a2a-and-tools-title">A2A between agents, tools inside each one</title>
  <desc id="fig-a2a-and-tools-desc">The planner, the client agent, sends SendMessage over A2A to three remote agents: test-runner on port 41241 with skill run-tests, code-reviewer on port 41242 with skills review-diff and answer-question, and deployer on port 41243 with skill deploy. The planner sees only these cards and endpoints. Below a dashed line, hidden from the planner, each agent runs its own logic and calls its own systems as tools: Git and a CI runner for test-runner, Git for code-reviewer, and a deploy API for deployer.</desc>
  <defs><marker id="fig-a2a-and-tools-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">CLIENT AGENT</text>
  <rect x="170" y="26" width="300" height="44" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="320" y="43.25" font-size="12.5" text-anchor="middle" font-weight="700">planner</text>
  <text x="320" y="60.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">delivers payments-api: tests, review, deploy</text>
  <text x="20" y="96" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">A2A · WHAT THE PLANNER SEES</text>
