  <text x="20" y="230" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">HIDDEN FROM THE PLANNER</text>
  <line x1="20" y1="236" x2="620" y2="236" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="320" y="404" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">The kit simulates these systems in Python. A real agent calls them through MCP or any API.</text>
