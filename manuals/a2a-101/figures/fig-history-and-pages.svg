<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" role="img" aria-labelledby="fig-history-and-pages-title fig-history-and-pages-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-history-and-pages-title">History regimes and list pages</title>
  <desc id="fig-history-and-pages-desc">Top: the stored history of review task e5c95b09, four messages from history[0] to history[3], plus the status message 2 findings, which is never part of history. With historyLength unset GetTask returns all four messages, with historyLength 1 only history[3], and with historyLength 0 no history field. Bottom: the five tasks on test-runner sorted by status timestamp, newest first. ListTasks with pageSize 2 returns f22ed7af and 8ae21dcb, then 728ba084 and d0c28826, and each page ends with an opaque cursor token for the next one. The fifth task, 3d8f7801, was not requested. Neither page carries artifacts or history. A third call filters on TASK_STATE_CANCELED with no historyLength and gets f22ed7af with its full history.</desc>
  <text x="20" y="16" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">A · HISTORY</text>
  <text x="126" y="16" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">GetTask on the review task e5c95b09, held by code-reviewer</text>
  <text x="560" y="16" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #6f6f6a)">historyLength</text>
  <text x="530" y="36" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">unset</text>
  <text x="590" y="36" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">1</text>
  <line x1="20" y1="230" x2="620" y2="230" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="20" y="250" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">B · PAGES</text>
  <text x="112" y="250" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ListTasks on test-runner with pageSize 2 and historyLength 0</text>
  <text x="32" y="272" font-size="11" fill="var(--m-ink-mute, #6f6f6a)">id</text>
  <text x="118" y="272" font-size="11" fill="var(--m-ink-mute, #6f6f6a)">state</text>
  <text x="300" y="272" font-size="11" fill="var(--m-ink-mute, #6f6f6a)">status.timestamp</text>
  <g data-beat="1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/>
  <rect x="20" y="44" width="600" height="24" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
