  <text x="104" y="60" font-size="11" fill="var(--m-violet-ink, #5b4fa3)">ROLE_USER</text>
  <text x="184" y="60" font-size="11" class="m-serif">Review this diff of payments-api. + refunds.diff</text>
  <rect x="20" y="68" width="600" height="24" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="84" font-size="11" fill="var(--m-teal-ink, #18696a)">history[1]</text>
  <text x="104" y="84" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">ROLE_AGENT</text>
  <text x="184" y="84" font-size="11" class="m-serif">Which base branch should I compare this diff against?</text>
