  <text x="63" y="88" font-size="11" text-anchor="middle" fill="var(--m-violet-ink, #5b4fa3)">1</text>
  <text x="78" y="88" font-size="11" fill="var(--m-violet-ink, #5b4fa3)">one request, held open until the reply</text>
