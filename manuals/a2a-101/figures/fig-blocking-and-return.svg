  <circle cx="63" cy="184" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-violet-ink, #5b4fa3)" stroke-width="1"/>
  <text x="63" y="188" font-size="11" text-anchor="middle" fill="var(--m-violet-ink, #5b4fa3)">2</text>
  <text x="78" y="188" font-size="11" fill="var(--m-violet-ink, #5b4fa3)">SendMessage</text>
