  <rect x="516" y="60" width="8" height="8" fill="var(--m-amber-ink, #85590c)"/>
  <text x="520" y="50" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-amber-ink, #85590c)">09:00:00.750</text>
