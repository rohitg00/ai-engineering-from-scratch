  <rect x="196" y="60" width="8" height="8" fill="var(--m-paper, #fafaf5)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="200" y="50" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-mute, #6f6f6a)">not seen</text>
