  <rect x="275" y="8" width="150" height="38" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="350" y="22.25" font-size="12.5" text-anchor="middle" font-weight="700">deployer</text>
  <text x="350" y="39.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">remote agent</text>
