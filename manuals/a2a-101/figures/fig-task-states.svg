  <rect x="473" y="327" width="144" height="48" fill="none" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="545" y="338.75" font-size="12.5" text-anchor="middle" font-weight="700">REJECTED</text>
  <text x="545" y="356.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">value 7</text>
  <text x="545" y="371.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">in 08</text>
  <rect x="20" y="396" width="140" height="42" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="90" y="412.25" font-size="12.5" text-anchor="middle" font-weight="700">UNSPECIFIED</text>
  <text x="90" y="429.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">value 0, unused</text>
  <text x="176" y="414" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Prefix TASK_STATE_ dropped from every name.</text>
  <text x="176" y="430" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Dashed border: interrupted. Double border: terminal.</text>
