<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 448" role="img" aria-labelledby="fig-task-states-title fig-task-states-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-task-states-title">The nine task states and the transitions the kit makes</title>
  <desc id="fig-task-states-desc">Nine TaskState values without their TASK_STATE_ prefix, and the transitions the kit makes in capture order. SUBMITTED goes to WORKING in 05, and WORKING ends in COMPLETED in 03 and 05. SUBMITTED goes to INPUT_REQUIRED when the reviewer asks a question in 06, and INPUT_REQUIRED returns to WORKING when the client answers. WORKING goes to AUTH_REQUIRED and back when an operator approves in 07. SUBMITTED goes to REJECTED when the deployer refuses production in 08. WORKING ends in FAILED for a missing commit in 09, and in CANCELED after CancelTask in 10. The four terminal states have double borders and no outgoing arrows. UNSPECIFIED, value 0, stands apart and is never sent by the kit.</desc>
  <defs><marker id="fig-task-states-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker></defs>
  <rect x="20" y="56" width="140" height="42" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)" stroke-dasharray="5 4"/>
  <text x="90" y="72.25" font-size="12.5" text-anchor="middle" font-weight="700">AUTH_REQUIRED</text>
  <text x="90" y="89.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">value 8</text>
  <rect x="20" y="168" width="140" height="42" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="90" y="184.25" font-size="12.5" text-anchor="middle" font-weight="700">SUBMITTED</text>
  <text x="90" y="201.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">value 1</text>
  <rect x="250" y="168" width="140" height="42" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="320" y="184.25" font-size="12.5" text-anchor="middle" font-weight="700">WORKING</text>
  <text x="320" y="201.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">value 2</text>
  <rect x="250" y="290" width="140" height="42" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)" stroke-dasharray="5 4"/>
  <text x="320" y="306.25" font-size="12.5" text-anchor="middle" font-weight="700">INPUT_REQUIRED</text>
  <text x="320" y="323.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">value 6</text>
  <text x="470" y="12" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">TERMINAL</text>
  <rect x="470" y="20" width="150" height="54" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <rect x="473" y="23" width="144" height="48" fill="none" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="545" y="34.75" font-size="12.5" text-anchor="middle" font-weight="700">COMPLETED</text>
  <text x="545" y="52.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">value 3</text>
  <text x="545" y="67.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">in 03 05 06 07</text>
  <rect x="470" y="92" width="150" height="54" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <rect x="473" y="95" width="144" height="48" fill="none" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="545" y="106.75" font-size="12.5" text-anchor="middle" font-weight="700">FAILED</text>
  <text x="545" y="124.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">value 4</text>
  <text x="545" y="139.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">commit missing, in 09</text>
  <rect x="470" y="162" width="150" height="54" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <rect x="473" y="165" width="144" height="48" fill="none" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="545" y="176.75" font-size="12.5" text-anchor="middle" font-weight="700">CANCELED</text>
  <text x="545" y="194.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">value 5</text>
  <text x="545" y="209.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">CancelTask, in 10</text>
