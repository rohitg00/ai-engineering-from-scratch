<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 456" role="img" aria-labelledby="fig-credential-path-title fig-credential-path-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-credential-path-title">From the card to an enforced request and an in-task approval</title>
  <desc id="fig-credential-path-desc">Five steps for the deployer agent. Step one: the card declares a bearer scheme and requires it, and the platform team issues a token outside A2A. Step two: GetExtendedAgentCard without a token gets HTTP 401 with a WWW-Authenticate challenge. Step three: the same call with the token gets the extended card with a rollback skill. Step four: a streamed deploy with the token stops the task in TASK_STATE_AUTH_REQUIRED. Step five: an operator approves at the deployer outside A2A and the task works and completes on the same stream.</desc>
  <defs><marker id="fig-credential-path-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker><marker id="fig-credential-path-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-credential-path-head-olive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-olive-ink, #515f26)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">1 · THE CARD DECLARES, THE CLIENT OBTAINS</text>
  <text x="20" y="122" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">2 · HTTP CHECKS BEFORE ANY A2A METHOD RUNS</text>
  <text x="20" y="282" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">3 · THE TASK ASKS FOR MORE, OUTSIDE A2A</text>
  <g data-beat="1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/>
  <rect x="20" y="26" width="236" height="68" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="138" y="40.25" font-size="12.5" text-anchor="middle" font-weight="700">deployer card</text>
  <text x="138" y="57.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">securitySchemes: bearer</text>
  <text x="138" y="72.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">httpAuthSecurityScheme, Bearer</text>
  <text x="138" y="87.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">securityRequirements: bearer</text>
  <rect x="340" y="26" width="280" height="68" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="480" y="47.75" font-size="12.5" text-anchor="middle" font-weight="700">platform team</text>
  <text x="480" y="65.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">issues the token dpl_test_7c1e4b</text>
  <text x="480" y="80.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">outside A2A, before any request</text>
  </g>
  <g data-beat="2"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.571;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.05s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.571;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.05s" begin="indefinite" fill="freeze"/>
  <rect x="20" y="130" width="236" height="46" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="138" y="148.25" font-size="12.5" text-anchor="middle" font-weight="700">GetExtendedAgentCard</text>
  <text x="138" y="165.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">no Authorization header</text>
  <rect x="340" y="130" width="280" height="46" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="480" y="148.25" font-size="12.5" text-anchor="middle" font-weight="700">HTTP 401 Unauthorized</text>
  <text x="480" y="165.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">WWW-Authenticate: Bearer realm=&quot;deployer&quot;</text>
  <line x1="256" y1="153" x2="339" y2="153" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-credential-path-head-rose)"/>
  <circle class="m-packet" r="3.5" fill="var(--m-rose-ink, #b0344d)" opacity="0"><animateMotion path="M256 153 L339 153" keyPoints="0;0;1;1" keyTimes="0;0.429;0.821;1" calcMode="linear" dur="1.4s" begin="indefinite" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.429;0.486;0.821;1" dur="1.4s" begin="indefinite" fill="freeze"/></circle>
  <rect class="m-knock" x="270.85" y="136.03" width="54.3" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="298" y="147" font-size="11.5" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">refused</text>
  </g>
  <g data-beat="3"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.727;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.65s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.727;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.65s" begin="indefinite" fill="freeze"/>
  <rect x="20" y="196" width="236" height="58" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="138" y="212.75" font-size="12.5" text-anchor="middle" font-weight="700">GetExtendedAgentCard</text>
  <text x="138" y="230.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Authorization: Bearer</text>
  <text x="138" y="245.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">dpl_test_7c1e4b</text>
  <rect x="340" y="196" width="280" height="58" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="480" y="212.75" font-size="12.5" text-anchor="middle" font-weight="700">200 OK, extended card</text>
  <text x="480" y="230.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">one more skill: rollback</text>
  <text x="480" y="245.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">shown only to authenticated callers</text>
  <line x1="256" y1="225" x2="339" y2="225" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-credential-path-head-ink)"/>
  <circle class="m-packet" r="3.5" fill="var(--m-ink, #1a1a1a)" opacity="0"><animateMotion path="M256 225 L339 225" keyPoints="0;0;1;1" keyTimes="0;0.6;0.875;1" calcMode="linear" dur="2s" begin="indefinite" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.64;0.875;1" dur="2s" begin="indefinite" fill="freeze"/></circle>
  <rect class="m-knock" x="267.4" y="208.03" width="61.2" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="298" y="219" font-size="11.5" text-anchor="middle">accepted</text>
  </g>
  <g data-beat="4"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.8;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.25s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.8;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.25s" begin="indefinite" fill="freeze"/>
  <rect x="20" y="290" width="236" height="58" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="138" y="306.75" font-size="12.5" text-anchor="middle" font-weight="700">SendStreamingMessage</text>
  <text x="138" y="324.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Deploy build 2026.10.06-1</text>
  <text x="138" y="339.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">to staging, with the token</text>
  <rect x="340" y="290" width="280" height="58" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)" stroke-dasharray="5 4"/>
  <text x="480" y="306.75" font-size="12.5" text-anchor="middle" font-weight="700">TASK_STATE_AUTH_REQUIRED</text>
  <text x="480" y="324.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">task ecf2dcb6 waits, stream open</text>
  <text x="480" y="339.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">an operator must approve</text>
  <line x1="256" y1="319" x2="339" y2="319" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-credential-path-head-ink)"/>
  <circle class="m-packet" r="3.5" fill="var(--m-ink, #1a1a1a)" opacity="0"><animateMotion path="M256 319 L339 319" keyPoints="0;0;1;1" keyTimes="0;0.692;0.904;1" calcMode="linear" dur="2.6s" begin="indefinite" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.692;0.723;0.904;1" dur="2.6s" begin="indefinite" fill="freeze"/></circle>
  <rect class="m-knock" x="274.3" y="302.03" width="47.4" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="298" y="313" font-size="11.5" text-anchor="middle">deploy</text>
  </g>
  <g data-beat="5"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.842;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.85s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.842;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.85s" begin="indefinite" fill="freeze"/>
  <rect x="20" y="384" width="236" height="58" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="138" y="400.75" font-size="12.5" text-anchor="middle" font-weight="700">operator approves</text>
  <text x="138" y="418.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">POST /approve/ecf2dcb6</text>
  <text x="138" y="433.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">at the deployer, not in A2A</text>
  <rect x="340" y="384" width="280" height="58" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <rect x="343" y="387" width="274" height="52" fill="none" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="480" y="400.75" font-size="12.5" text-anchor="middle" font-weight="700">TASK_STATE_COMPLETED</text>
  <text x="480" y="418.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">after TASK_STATE_WORKING</text>
  <text x="480" y="433.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">on the same stream</text>
  <path d="M380 348 V366 H138 V383" fill="none" stroke="var(--m-olive-ink, #515f26)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-credential-path-head-olive)"/>
  <circle class="m-packet" r="3.5" fill="var(--m-olive-ink, #515f26)" opacity="0"><animateMotion path="M380 348 V366 H138 V383" keyPoints="0;0;1;1" keyTimes="0;0.75;0.922;1" calcMode="linear" dur="3.2s" begin="indefinite" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.775;0.922;1" dur="3.2s" begin="indefinite" fill="freeze"/></circle>
  <text x="298" y="360" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the approval link</text>
  <line x1="256" y1="413" x2="339" y2="413" stroke="var(--m-olive-ink, #515f26)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-credential-path-head-olive)"/>
  <circle class="m-packet" r="3.5" fill="var(--m-olive-ink, #515f26)" opacity="0"><animateMotion path="M256 413 L339 413" keyPoints="0;0;1;1" keyTimes="0;0.75;0.922;1" calcMode="linear" dur="3.2s" begin="indefinite" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.775;0.922;1" dur="3.2s" begin="indefinite" fill="freeze"/></circle>
  <rect class="m-knock" x="270.85" y="396.03" width="54.3" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="298" y="407" font-size="11.5" text-anchor="middle" fill="var(--m-olive-ink, #515f26)">resumes</text>
  </g>
</svg>
