<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="plate-planner-run-title plate-planner-run-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="plate-planner-run-title">One planner, three remote agents</title>
  <desc id="plate-planner-run-desc">The planner from capture/planner.py on the left and three lanes, one per delegation, in the order it ran them. In each lane the planner calls a remote agent, shown with its port and skills, and the agent runs a task shown with its states. test-runner completes with 13 passed. code-reviewer asks which base branch to use, the planner answers main, and the task completes with one finding. deployer waits in TASK_STATE_AUTH_REQUIRED until an operator approves, while the planner follows the task with SubscribeToTask, and then completes.</desc>
