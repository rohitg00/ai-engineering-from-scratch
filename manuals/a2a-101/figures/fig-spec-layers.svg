  <line x1="548" y1="126" x2="552" y2="126" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/>
  <line x1="548" y1="304" x2="552" y2="304" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/>
  <text x="560" y="212" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">A2A</text>
  <text x="560" y="226" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">defines it</text>
  <line x1="20" y1="320" x2="540" y2="320" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="20" y="344" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">TEST-RUNNER · LOCALHOST:41241</text>
