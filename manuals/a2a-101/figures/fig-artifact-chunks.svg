<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 474" role="img" aria-labelledby="fig-artifact-chunks-title fig-artifact-chunks-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-artifact-chunks-title">Five chunks become one stored artifact</title>
  <desc id="fig-artifact-chunks-desc">Top: the nine stream frames of the streamed run on the kit clock. Frames 1, 2 and 9 are status frames stamped 09:00:01.750Z, 09:00:02.000Z and 09:00:02.250Z, 250 ms apart. Frames 3 to 8 are artifact updates that carry no timestamp and fall between the second and third stamps. Middle: a table of the artifactId and flags each of frames 3 to 8 carries and what it does to the stored task: frame 3 creates artifact test-log with its first part, frames 4 to 7 append one part each, frame 7 sets lastChunk, and frame 8 creates the summary artifact. Bottom: the stored test-log.txt artifact with its five text parts, one per chunk.</desc>
