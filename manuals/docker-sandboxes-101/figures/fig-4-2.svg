<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 606" role="img" aria-labelledby="fig-4-2-title fig-4-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-2-title">Three kits resolve into one grant set</title>
  <desc id="fig-4-2-desc">Top: three kits, the captured hello-kit workload with one network-policy@2 allow for example.com, the gh mixin from the specification example with network-policy@1 allows and a GitHub credential, and a mixin that carries the network-policy@2 config example with a bounded allow and two deny entries. Middle: sbx resolves the closed set with exactly one workload. Below: the merged grant set stored in the lock, five rows of allow, deny, install, and credential entries. Bottom: two branches for the next version of a kit. A version whose grants stay inside the stored set applies silently. A version that removes the deny on DELETE widens the set and stops for approval.</desc>
  <defs><marker id="fig-4-2-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-teal-ink, #18696a)"/></marker><marker id="fig-4-2-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker><marker id="fig-4-2-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">THE DECLARED KITS</text>
  <rect x="20" y="26" width="200" height="118" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="120" y="65.1" font-size="12" text-anchor="middle" font-weight="700">hello-kit, workload</text>
  <text x="120" y="82.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">fixtures/kits/hello-kit</text>
  <text x="120" y="97.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">network-policy@2, runtime:</text>
  <text x="120" y="112.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">allow example.com</text>
  <rect x="220" y="26" width="200" height="118" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="320" y="42.6" font-size="12" text-anchor="middle" font-weight="700">gh, mixin</text>
  <text x="320" y="59.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">kitspec 2 example</text>
  <text x="320" y="74.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">network-policy@1 runtime allow</text>
  <text x="320" y="89.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">github.com, api.github.com,</text>
  <text x="320" y="104.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">uploads.github.com</text>
  <text x="320" y="119.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">credential@1: github, runtime,</text>
  <text x="320" y="134.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">GH_TOKEN proxyManaged</text>
  <rect x="420" y="26" width="200" height="118" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="520" y="42.6" font-size="12" text-anchor="middle" font-weight="700">bounds, mixin</text>
  <text x="520" y="59.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">kitcap network-policy@2 config</text>
  <text x="520" y="74.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">install: registry.npmjs.org</text>
  <text x="520" y="89.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">runtime: allow api.github.com</text>
  <text x="520" y="104.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">GET and HEAD on /repos/**</text>
  <text x="520" y="119.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">deny api.github.com DELETE</text>
  <text x="520" y="134.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">deny telemetry.example.com</text>
  <rect x="120" y="190" width="400" height="48" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="320" y="209.25" font-size="12.5" text-anchor="middle" font-weight="700">sbx resolves the set (kitspec 5.3)</text>
  <text x="320" y="226.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">closed set, one workload, one provider per name, deny wins</text>
  <path d="M120 144 V166 H320 V189" fill="none" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M320 144 V166 H320 V189" fill="none" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M520 144 V166 H320 V189" fill="none" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1.2" stroke-linejoin="round"/>
  <line x1="320" y1="238" x2="320" y2="269" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.2" marker-end="url(#fig-4-2-head-teal)"/>
  <rect class="m-knock" x="325" y="242.53" width="213" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="328" y="253.5" font-size="11.5" fill="var(--m-teal-ink, #18696a)">the lock records the grant set</text>
  <rect x="20" y="270" width="600" height="170" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <rect x="23" y="273" width="594" height="164" fill="none" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="32" y="292" font-size="12" font-weight="700" fill="var(--m-teal-ink, #18696a)">the merged grant set for the sandbox (kitspec 7.4)</text>
  <rect x="32" y="300" width="576" height="24" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="40" y="316" font-size="11" fill="var(--m-teal-ink, #18696a)">runtime allow</text>
  <text x="142" y="316" font-size="11" class="m-serif">example.com, github.com, uploads.github.com</text>
  <rect x="32" y="326" width="576" height="24" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="40" y="342" font-size="11" fill="var(--m-teal-ink, #18696a)">runtime allow</text>
  <text x="142" y="342" font-size="11" class="m-serif">api.github.com, every method and path (bounded entry dropped, kitspec 9.5)</text>
  <rect x="32" y="352" width="576" height="24" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="40" y="368" font-size="11" fill="var(--m-teal-ink, #18696a)">runtime deny</text>
  <text x="142" y="368" font-size="11" class="m-serif">api.github.com DELETE, telemetry.example.com (deny wins, kitcap)</text>
  <rect x="32" y="378" width="576" height="24" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="40" y="394" font-size="11" fill="var(--m-teal-ink, #18696a)">install allow</text>
  <text x="142" y="394" font-size="11" class="m-serif">registry.npmjs.org (closed again before the agent starts, kitspec 12)</text>
  <rect x="32" y="404" width="576" height="24" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="40" y="420" font-size="11" fill="var(--m-teal-ink, #18696a)">credential</text>
  <text x="142" y="420" font-size="11" class="m-serif">github at runtime, GH_TOKEN proxyManaged, inject on api.github.com</text>
  <text x="330" y="464" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the next version of a kit</text>
  <rect x="20" y="482" width="280" height="64" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="160" y="501.75" font-size="12.5" text-anchor="middle" font-weight="700">stays inside the set</text>
  <text x="160" y="519.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">a bounded allow on a host already granted</text>
  <text x="160" y="534.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">applies silently (kitspec 7.4)</text>
  <rect x="340" y="482" width="280" height="64" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="480" y="501.6" font-size="12" text-anchor="middle" font-weight="700">removes deny api.github.com DELETE</text>
  <text x="480" y="518.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">a removed deny entry is a widening</text>
  <text x="480" y="533.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">stops and asks before it applies</text>
  <line x1="160" y1="440" x2="160" y2="481" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-4-2-head-amber)"/>
  <rect class="m-knock" x="165" y="449.53" width="81.9" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="168" y="460.5" font-size="11.5" fill="var(--m-amber-ink, #85590c)">same grants</text>
  <line x1="480" y1="440" x2="480" y2="481" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-4-2-head-rose)"/>
  <rect class="m-knock" x="485" y="449.53" width="88.8" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="488" y="460.5" font-size="11.5" fill="var(--m-rose-ink, #b0344d)">wider grants</text>
  <text x="20" y="572" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">A kit grants itself nothing: each row is a request the host answered. The lock judges the next version.</text>
  <text x="20" y="590" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">From hello-kit/kit.yaml, kitspec 2, 5.3, 7.4 and 9.5, and kitcap network-policy@2 and credential@1.</text>
</svg>
