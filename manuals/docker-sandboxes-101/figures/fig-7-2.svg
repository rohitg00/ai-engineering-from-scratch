<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 436" role="img" aria-labelledby="fig-7-2-title fig-7-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-2-title">From Docker Home to a SIEM</title>
  <desc id="fig-7-2-desc">Top row: an organization policy written in Docker Home under AI Platform is pulled by sandboxd within five minutes and merged with the local policy, whose 194 allow rules become inactive while its deny rules stay active. Second row: the proxy decides one request, example.com:443 from m101-policy, with the reason no applicable policies for op(action=net:connect:tcp, resource=net:domain:example.com:443), and the decision AUDIT_DECISION_DENY. Third row: the daemon writes one record to an audit-&lt;utc&gt;-&lt;uuid&gt;-&lt;seq&gt;.jsonl file under the auditkit directory, and rotation finalizes the file every 5 minutes, 1000 events, or 50 MiB. Bottom row: Docker Cloud delivery keeps the record searchable for 90 days and forwards it to a SIEM destination. A note says this capture had no organization and wrote no record.</desc>
  <defs><marker id="fig-7-2-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-7-2-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-teal-ink, #18696a)"/></marker><marker id="fig-7-2-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker><marker id="fig-7-2-head-olive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-olive-ink, #515f26)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">WHERE THE RULES COME FROM</text>
  <rect x="20" y="30" width="200" height="58" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="120" y="46.75" font-size="12.5" text-anchor="middle" font-weight="700">Docker Home</text>
  <text x="120" y="64.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Network, Filesystem, MCP</text>
  <text x="120" y="79.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">policies, org or team scope</text>
  <rect x="250" y="30" width="180" height="58" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="340" y="46.75" font-size="12.5" text-anchor="middle" font-weight="700">sandboxd</text>
  <text x="340" y="64.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">pulls within 5 minutes</text>
  <text x="340" y="79.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">sbx policy reset forces it</text>
  <rect x="480" y="30" width="140" height="58" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="550" y="46.75" font-size="12.5" text-anchor="middle" font-weight="700">local-policy</text>
  <text x="550" y="64.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">194 allow: inactive</text>
  <text x="550" y="79.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">deny: still applied</text>
  <line x1="220" y1="59" x2="249" y2="59" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-2-head-ink)"/>
  <rect class="m-knock" x="217.7" y="42.03" width="33.6" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="234.5" y="53" font-size="11.5" text-anchor="middle">pull</text>
  <line x1="480" y1="59" x2="431" y2="59" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-2-head-ink)"/>
  <rect class="m-knock" x="435.25" y="42.03" width="40.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="455.5" y="53" font-size="11.5" text-anchor="middle">merge</text>
  <rect x="20" y="130" width="600" height="64" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="320" y="149.75" font-size="12.5" text-anchor="middle" font-weight="700">the proxy decides: example.com:443 from m101-policy</text>
  <text x="320" y="167.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">no applicable policies for op(action=net:connect:tcp,</text>
  <text x="320" y="182.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">resource=net:domain:example.com:443), decision AUDIT_DECISION_DENY</text>
  <line x1="340" y1="88" x2="340" y2="129" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-2-head-ink)"/>
  <rect class="m-knock" x="345" y="97.53" width="109.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="348" y="108.5" font-size="11.5">effective rules</text>
  <rect x="20" y="232" width="360" height="64" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="200" y="251.75" font-size="12.5" text-anchor="middle" font-weight="700">audit-&lt;utc&gt;-&lt;uuid&gt;-&lt;seq&gt;.jsonl</text>
  <text x="200" y="269.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">~/Library/Logs/com.docker.sandboxes/sandboxes/auditkit/</text>
  <text x="200" y="284.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">written by the daemon under an enforced org policy</text>
  <path d="M320 194 V214 H200 V231" fill="none" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#fig-7-2-head-teal)"/>
  <rect class="m-knock" x="327" y="208.03" width="164.7" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="330" y="219" font-size="11.5" fill="var(--m-teal-ink, #18696a)">one record per decision</text>
  <rect x="440" y="232" width="180" height="64" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="530" y="251.75" font-size="12.5" text-anchor="middle" font-weight="700">rotation</text>
  <text x="530" y="269.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">every 5 min, 1000 events,</text>
  <text x="530" y="284.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">or 50 MiB, .tmp to .jsonl</text>
  <line x1="380" y1="264" x2="439" y2="264" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-2-head-amber)"/>
  <rect x="20" y="334" width="290" height="58" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="165" y="350.75" font-size="12.5" text-anchor="middle" font-weight="700">Docker Cloud delivery (default on)</text>
  <text x="165" y="368.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">searchable 90 days, CSV up to 1 000 000 rows</text>
  <text x="165" y="383.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">app.docker.com, AI Platform, Audit logs</text>
  <rect x="330" y="334" width="290" height="58" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="475" y="350.75" font-size="12.5" text-anchor="middle" font-weight="700">SIEM destination</text>
  <text x="475" y="368.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Splunk Cloud, Dynatrace, Datadog, Sumo Logic</text>
  <text x="475" y="383.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">needs sbx 0.39.0 and cloud delivery</text>
  <path d="M200 296 V316 H165 V333" fill="none" stroke="var(--m-olive-ink, #515f26)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-7-2-head-olive)"/>
  <rect class="m-knock" x="207" y="310.03" width="47.4" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="210" y="321" font-size="11.5" fill="var(--m-olive-ink, #515f26)">upload</text>
  <line x1="310" y1="363" x2="329" y2="363" stroke="var(--m-olive-ink, #515f26)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-2-head-olive)"/>
  <text x="20" y="422" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">this capture: no organization, no license, no record written (03-policy-org.txt)</text>
</svg>
