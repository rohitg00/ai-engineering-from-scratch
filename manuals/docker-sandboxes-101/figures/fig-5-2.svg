<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" role="img" aria-labelledby="fig-5-2-title fig-5-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-2-title">Two ways a model reference reaches Model Runner</title>
  <desc id="fig-5-2-desc">Left column, capture/fixtures/agents/files.yaml: agents.root with model local resolves to models.local with provider dmr, model ai/qwen3:4b and temperature 0; with no base_url the endpoint is found by running docker model status --json. Right column, capture/fixtures/agents/dmr.yaml: agents.root with model qwen resolves to models.qwen with provider runner, which resolves to providers.runner with provider dmr and base_url http://localhost:12434/engines/llama.cpp/v1. Bottom row: the auto decision as doctor printed it. No cloud provider has a credential, so auto looks for a pulled Model Runner model: with the runner up it picks dmr/docker.io/ai/qwen3:4b, and with no runner it names dmr/ai/qwen3:latest and reports no usable model.</desc>
  <defs><marker id="fig-5-2-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-5-2-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker></defs>
  <rect x="20" y="28" width="285" height="26" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="28" y="44.45" font-size="11.5" font-weight="700">capture/fixtures/agents/files.yaml</text>
  <rect x="335" y="28" width="285" height="26" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="343" y="44.45" font-size="11.5" font-weight="700">capture/fixtures/agents/dmr.yaml</text>
  <rect x="20" y="66" width="285" height="77" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="30" y="84" font-size="12" font-weight="700" fill="var(--m-violet-ink, #5b4fa3)">agents.root</text>
  <text x="30" y="102" font-size="11">description, instruction</text>
  <text x="30" y="117" font-size="11">max_iterations: 8</text>
  <text x="30" y="132" font-size="11">toolsets: filesystem, shell</text>
  <rect x="20" y="178" width="285" height="77" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="30" y="196" font-size="12" font-weight="700" fill="var(--m-plum-ink, #8a3d72)">models.local</text>
  <text x="30" y="214" font-size="11">provider: dmr</text>
  <text x="30" y="229" font-size="11">model: ai/qwen3:4b</text>
  <text x="30" y="244" font-size="11">temperature: 0</text>
  <rect x="20" y="290" width="285" height="62" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)" stroke-dasharray="5 4"/>
  <text x="30" y="308" font-size="12" font-weight="700" fill="var(--m-grey-ink, #5e5e59)">endpoint discovery</text>
  <text x="30" y="326" font-size="11">docker model status --json</text>
  <text x="30" y="341" font-size="11">run by docker-agent itself</text>
  <line x1="162.5" y1="143" x2="162.5" y2="177" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-2-head-ink)"/>
  <rect class="m-knock" x="167.5" y="149.03" width="88.8" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="170.5" y="160" font-size="11.5">model: local</text>
  <line x1="162.5" y1="255" x2="162.5" y2="289" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-2-head-ink)"/>
  <rect class="m-knock" x="167.5" y="261.03" width="81.9" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="170.5" y="272" font-size="11.5">no base_url</text>
  <rect x="335" y="66" width="285" height="62" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="345" y="84" font-size="12" font-weight="700" fill="var(--m-violet-ink, #5b4fa3)">agents.root</text>
  <text x="345" y="102" font-size="11">description, instruction</text>
  <text x="345" y="117" font-size="11">no toolsets</text>
  <rect x="335" y="178" width="285" height="77" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="345" y="196" font-size="12" font-weight="700" fill="var(--m-plum-ink, #8a3d72)">models.qwen</text>
  <text x="345" y="214" font-size="11">provider: runner</text>
  <text x="345" y="229" font-size="11">model: ai/qwen3:4b</text>
  <text x="345" y="244" font-size="11">temperature: 0</text>
  <rect x="335" y="290" width="285" height="77" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="345" y="308" font-size="12" font-weight="700" fill="var(--m-plum-ink, #8a3d72)">providers.runner</text>
  <text x="345" y="326" font-size="11">provider: dmr</text>
  <text x="345" y="341" font-size="11">base_url: http://localhost:12434</text>
  <text x="345" y="356" font-size="11">  /engines/llama.cpp/v1</text>
  <line x1="477.5" y1="128" x2="477.5" y2="177" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-2-head-ink)"/>
  <rect class="m-knock" x="482.5" y="141.53" width="81.9" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="485.5" y="152.5" font-size="11.5">model: qwen</text>
  <line x1="477.5" y1="255" x2="477.5" y2="289" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-2-head-ink)"/>
  <rect class="m-knock" x="482.5" y="261.03" width="116.4" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="485.5" y="272" font-size="11.5">provider: runner</text>
  <text x="20" y="402" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">MODEL: AUTO, AS DOCTOR PRINTED IT</text>
  <rect x="20" y="418" width="165" height="60" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="102.5" y="443.25" font-size="12.5" text-anchor="middle" font-weight="700">cloud credential?</text>
  <text x="102.5" y="460.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">20 providers: not set</text>
  <rect x="212" y="418" width="170" height="60" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="297" y="443.25" font-size="12.5" text-anchor="middle" font-weight="700">pulled DMR model?</text>
  <text x="297" y="460.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">docker model status</text>
  <rect x="420" y="412" width="200" height="40" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="520" y="426.8" font-size="11" text-anchor="middle" font-weight="700">dmr/docker.io/ai/qwen3:4b</text>
  <text x="520" y="443.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">25-doctor.txt, exit 0</text>
  <rect x="420" y="462" width="200" height="40" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="520" y="476.8" font-size="11" text-anchor="middle" font-weight="700">dmr/ai/qwen3:latest</text>
  <text x="520" y="493.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">16-doctor.txt, exit 1</text>
  <line x1="185" y1="448" x2="211" y2="448" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-2-head-ink)"/>
  <rect class="m-knock" x="188.1" y="431.03" width="19.8" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="198" y="442" font-size="11.5" text-anchor="middle">no</text>
  <line x1="382" y1="438" x2="419" y2="432" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-5-2-head-ink)"/>
  <line x1="382" y1="458" x2="419" y2="482" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-5-2-head-rose)"/>
</svg>
