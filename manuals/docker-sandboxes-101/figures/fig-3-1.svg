  <text x="193" y="60.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">sandboxd.sock</text>
  <rect x="276" y="26" width="110" height="44" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="331" y="43.1" font-size="12" text-anchor="middle" font-weight="700">keychain</text>
  <text x="331" y="60.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">secret store</text>
  <rect x="394" y="26" width="226" height="44" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
