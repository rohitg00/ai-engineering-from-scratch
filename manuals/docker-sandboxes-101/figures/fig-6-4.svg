  <text x="30" y="212" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">mediaType</text>
  <text x="280" y="212" font-size="11">application/vnd.oci.image.manifest.v1+json</text>
  <rect x="20" y="220" width="600" height="24" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
