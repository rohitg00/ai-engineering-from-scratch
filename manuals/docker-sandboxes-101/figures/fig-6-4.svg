  <text x="280" y="236" font-size="11">application/vnd.docker.agent.config.v1+json</text>
  <rect x="20" y="244" width="600" height="24" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="260" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">config</text>
  <text x="280" y="260" font-size="11">application/vnd.docker.container.image.v1+json</text>
  <rect x="20" y="268" width="600" height="24" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="284" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">layers[0]</text>
  <text x="280" y="284" font-size="11">application/vnd.docker.image.rootfs.diff.tar.gzip</text>
  <rect x="20" y="300" width="600" height="26" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="32" y="316.6" font-size="12" font-weight="700">annotations</text>
  <rect x="20" y="326" width="600" height="24" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="342" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">io.docker.agent.version</text>
  <text x="280" y="342" font-size="11">v1.149.0</text>
  <rect x="20" y="350" width="600" height="24" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="366" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">io.docker.cagent.version</text>
  <text x="280" y="366" font-size="11">v1.149.0, the legacy key</text>
  <rect x="20" y="374" width="600" height="24" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="390" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">org.opencontainers.image.created</text>
  <text x="280" y="390" font-size="11">&lt;ts&gt;</text>
  <rect x="20" y="398" width="600" height="24" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="414" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">org.opencontainers.image.description</text>
  <text x="280" y="414" font-size="11">OCI artifact containing files.yaml</text>
  <rect x="20" y="434" width="600" height="40" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)" stroke-dasharray="5 4"/>
  <text x="320" y="457.45" font-size="11.5" text-anchor="middle" font-weight="400">with --key: a signature or MAC is added as annotations, not in this capture</text>
