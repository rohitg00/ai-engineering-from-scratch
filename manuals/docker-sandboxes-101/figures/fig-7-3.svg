<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 516" role="img" aria-labelledby="fig-7-3-title fig-7-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-3-title">Two product tracks from 2025-09 to 2026-10</title>
  <desc id="fig-7-3-desc">Two tracks over one date axis from 2025-09 to 2026-10. The sandboxes track shows the docker sandbox plugin as a grey bar from 2025-11-06 to its removal in Desktop 4.80.0 on 2026-06-29, and sbx as a blue bar from v0.21.0 on 2026-03-31 to v0.47.0 on 2026-10-05. The agent track shows cagent as a grey bar from the 2025-09-18 launch blog to its removal in Desktop 4.81.0 on 2026-07-06, and docker-agent as a violet bar from the v1.23.3 plugin on 2026-02-16 to v1.149.0 on 2026-10-07. Rose lines mark three removals: the socket mount with Desktop 4.58.0, the plugin with 4.80.0, and the cagent binary with 4.81.0. A numbered key lists all twelve events.</desc>
