<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 456" role="img" aria-labelledby="fig-5-4-title fig-5-4-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-4-title">A delegation that returns, then a move that stays</title>
  <desc id="fig-5-4-desc">Four lifelines: you running docker-agent run with exec, root, writer, and reviewer from capture/fixtures/agents/team.yaml. Message 1 asks root for one sentence from the writer. Root calls transfer_task with agent writer, a task and an expected output, the writer runs in its own sub-session that holds only the task, and its sentence, MicroVMs are lightweight virtual machines, returns to root as the tool response. Root then calls the session-moving tool with agent reviewer, and reviewer answers APPROVED with the sentence. Message 2 goes straight to reviewer, which answers the same way, and root is not asked again.</desc>
