  <text x="215" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">WHAT RUNS</text>
  <text x="400" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">TOOL NAMES THE MODEL GETS</text>
  <rect x="20" y="30" width="170" height="104" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="105" y="77.25" font-size="12.5" text-anchor="middle" font-weight="700">type: filesystem</text>
  <text x="105" y="94.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">files.yaml</text>
  <rect x="215" y="30" width="160" height="104" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="295" y="69.75" font-size="12.5" text-anchor="middle" font-weight="700">built-in toolset</text>
  <text x="295" y="87.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">inside the</text>
  <text x="295" y="102.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">docker-agent process</text>
  <rect x="400" y="30" width="220" height="104" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="410" y="50" font-size="11">directory_tree, edit_file,</text>
  <text x="410" y="65" font-size="11">list_directory, read_file,</text>
  <text x="410" y="80" font-size="11">read_multiple_files,</text>
  <text x="410" y="95" font-size="11">search_files_content,</text>
  <text x="410" y="110" font-size="11">write_file, create_directory,</text>
  <text x="410" y="125" font-size="11">remove_directory</text>
