  <text x="485" y="46.25" font-size="12.5" text-anchor="middle" font-weight="700">mcp.deepwiki.com/mcp</text>
  <text x="485" y="63.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">remote endpoint, outside the VM</text>
  <rect x="20" y="26" width="270" height="84" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="155" y="48.25" font-size="12.5" text-anchor="middle" font-weight="700">sbx mcp add m101-deepwiki</text>
  <text x="155" y="65.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">--url https://mcp.deepwiki.com/mcp</text>
  <text x="155" y="80.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">remote · streamable-http</text>
