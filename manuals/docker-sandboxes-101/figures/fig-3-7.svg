  <text x="500" y="213.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">no mcp-find, mcp-add, mcp-config-set</text>
  <rect x="380" y="250" width="240" height="124" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
