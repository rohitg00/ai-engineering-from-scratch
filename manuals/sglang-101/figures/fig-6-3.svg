  <line x1="242" y1="40" x2="242" y2="370" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="334" y="10" width="132" height="44" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="400" y="27.25" font-size="12.5" text-anchor="middle" font-weight="700">prefill</text>
