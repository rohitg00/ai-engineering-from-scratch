<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="fig-7-1-title fig-7-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-1-title">Three ways an SGLang server stops</title>
  <desc id="fig-7-1-desc">A serving SGLang server that receives SIGTERM on its main process drains, sends ShutdownReq, and exits with code 0. The same server forced to exit skips the drain, and a SIGTERM sent to the whole process group kills the scheduler child first, so the parent takes the crash path and kills the process tree.</desc>
  <defs><marker id="fig-7-1-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker><marker id="fig-7-1-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker></defs>
  <text x="20" y="22" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">GRACEFUL PATH</text>
  <rect x="20" y="36" width="110" height="56" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="75" y="59.25" font-size="12.5" text-anchor="middle" font-weight="700">serving</text>
  <text x="75" y="76.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">/health 200</text>
  <rect x="170" y="36" width="120" height="56" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="230" y="51.75" font-size="12.5" text-anchor="middle" font-weight="700">draining</text>
  <text x="230" y="69.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">/health 503</text>
  <text x="230" y="84.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">drain every 5 s</text>
  <rect x="330" y="36" width="120" height="56" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="390" y="59.25" font-size="12.5" text-anchor="middle" font-weight="700">ShutdownReq</text>
  <text x="390" y="76.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">15 s to exit</text>
  <rect x="490" y="36" width="130" height="56" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <rect x="493" y="39" width="124" height="50" fill="none" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="555" y="59.25" font-size="12.5" text-anchor="middle" font-weight="700">exit code 0</text>
  <text x="555" y="76.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">drained in 13 s</text>
  <line x1="130" y1="64" x2="169" y2="64" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-1-head-amber)"/>
  <line x1="290" y1="64" x2="329" y2="64" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-1-head-amber)"/>
  <line x1="450" y1="64" x2="489" y2="64" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-1-head-amber)"/>
  <circle cx="150" cy="46" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-amber-ink, #85590c)" stroke-width="1"/>
  <text x="150" y="50" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">1</text>
  <circle cx="310" cy="46" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-amber-ink, #85590c)" stroke-width="1"/>
  <text x="310" y="50" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">2</text>
  <circle cx="470" cy="46" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-amber-ink, #85590c)" stroke-width="1"/>
  <text x="470" y="50" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">3</text>
  <text x="170" y="132" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">FORCED</text>
  <rect x="150" y="146" width="180" height="50" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <rect x="153" y="149" width="174" height="44" fill="none" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="240" y="166.25" font-size="12.5" text-anchor="middle" font-weight="700">force_exit_handler</text>
  <text x="240" y="183.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">drops running work</text>
  <line x1="230" y1="92" x2="230" y2="145" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-1-head-rose)"/>
  <circle cx="246" cy="118" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1"/>
  <text x="246" y="122" font-size="11" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">4</text>
  <text x="100" y="228" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">SIGNAL SENT TO THE GROUP</text>
  <rect x="20" y="242" width="180" height="50" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="110" y="262.25" font-size="12.5" text-anchor="middle" font-weight="700">scheduler_0 exit -15</text>
  <text x="110" y="279.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the child dies first</text>
  <rect x="260" y="242" width="180" height="50" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <rect x="263" y="245" width="174" height="44" fill="none" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="350" y="262.25" font-size="12.5" text-anchor="middle" font-weight="700">SIGQUIT</text>
  <text x="350" y="279.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">kill_process_tree</text>
  <line x1="75" y1="92" x2="75" y2="241" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-1-head-rose)"/>
  <line x1="200" y1="267" x2="259" y2="267" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-1-head-rose)"/>
  <circle cx="91" cy="170" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1"/>
  <text x="91" y="174" font-size="11" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">5</text>
  <circle cx="230" cy="252" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1"/>
  <text x="230" y="256" font-size="11" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">6</text>
  <circle cx="30" cy="322" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-amber-ink, #85590c)" stroke-width="1"/>
  <text x="30" y="326" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">1</text>
  <text x="48" y="326" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">SIGTERM to the main process: /health returns 503 and the drain loop starts</text>
  <circle cx="30" cy="339" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-amber-ink, #85590c)" stroke-width="1"/>
  <text x="30" y="343" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">2</text>
  <text x="48" y="343" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">remaining requests reach 0, logged every 5 s while the drain runs</text>
  <circle cx="30" cy="356" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-amber-ink, #85590c)" stroke-width="1"/>
  <text x="30" y="360" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">3</text>
  <text x="48" y="360" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ShutdownReq goes to the schedulers, which get 15 s to exit</text>
  <circle cx="30" cy="373" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1"/>
  <text x="30" y="377" font-size="11" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">4</text>
  <text x="48" y="377" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">force exit when the server is UnHealthy or SGL_FORCE_SHUTDOWN is set</text>
  <circle cx="30" cy="390" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1"/>
  <text x="30" y="394" font-size="11" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">5</text>
  <text x="48" y="394" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">SIGTERM to the whole process group: scheduler_0 exits first with -15</text>
  <circle cx="30" cy="407" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1"/>
  <text x="30" y="411" font-size="11" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">6</text>
  <text x="48" y="411" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the parent reads a crashed child and kills the tree with no drain</text>
</svg>
