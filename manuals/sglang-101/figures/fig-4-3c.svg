  <title id="fig-4-3c-title">On a 24 GB card the BF16 pool fills and throughput stops climbing</title>
  <desc id="fig-4-3c-desc">Output throughput against concurrency from 1 to 64 on one NVIDIA L4 with Qwen3-8B, three seeds per point with a band from the lowest to the highest run. The BF16 line climbs to 270 tokens per second at 32 and falls to 251 at 64. The FP8 line keeps climbing to 736 at 64.</desc>
