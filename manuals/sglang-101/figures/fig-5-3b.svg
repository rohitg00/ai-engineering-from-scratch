<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" role="img" aria-labelledby="fig-5-3b-title fig-5-3b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-3b-title">Six findings and the mechanism behind each</title>
  <desc id="fig-5-3b-desc">Six rows from the independent field reports. Each row names a workload, the result that was reported, and the SGLang mechanism that explains it: kernels, the radix cache, chunked prefill, the decode graph limit, attention data and expert parallelism, and the cost of draft tokens.</desc>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">WORKLOAD</text>
  <text x="222" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">REPORTED RESULT</text>
  <text x="440" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">MECHANISM</text>
  <rect x="20" y="30" width="190" height="34" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="115" y="50.45" font-size="11.5" text-anchor="middle" font-weight="700">unique prompts, dense</text>
  <text x="222" y="52" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">tie within a few percent</text>
  <rect x="440" y="30" width="180" height="34" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="530" y="50.45" font-size="11.5" text-anchor="middle" font-weight="700">same kernel families</text>
  <rect x="20" y="74" width="190" height="34" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="115" y="94.45" font-size="11.5" text-anchor="middle" font-weight="700">repeated prefixes</text>
  <text x="222" y="96" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">first token 583 vs 2,141 ms</text>
  <rect x="440" y="74" width="180" height="34" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="530" y="94.45" font-size="11.5" text-anchor="middle" font-weight="700">radix cache</text>
  <rect x="20" y="118" width="190" height="34" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="115" y="138.45" font-size="11.5" text-anchor="middle" font-weight="700">16k-token prompts</text>
  <text x="222" y="140" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">slower first token, faster TPOT</text>
  <rect x="440" y="118" width="180" height="34" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="530" y="138.45" font-size="11.5" text-anchor="middle" font-weight="700">chunked prefill 8,192</text>
  <rect x="20" y="162" width="190" height="34" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="115" y="182.45" font-size="11.5" text-anchor="middle" font-weight="700">no concurrency cap</text>
  <text x="222" y="184" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ITL 100.92 vs 28.84 ms</text>
  <rect x="440" y="162" width="180" height="34" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)" stroke-dasharray="5 4"/>
  <text x="530" y="182.45" font-size="11.5" text-anchor="middle" font-weight="700">graph limit, a guess</text>
  <rect x="20" y="206" width="190" height="34" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="115" y="226.45" font-size="11.5" text-anchor="middle" font-weight="700">DeepSeek MoE, many GPUs</text>
  <text x="222" y="228" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">reference engine, audited MLPerf</text>
  <rect x="440" y="206" width="180" height="34" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="530" y="226.45" font-size="11.5" text-anchor="middle" font-weight="700">attention DP and EP</text>
  <rect x="20" y="250" width="190" height="34" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="115" y="270.45" font-size="11.5" text-anchor="middle" font-weight="700">MTP on a B200</text>
  <text x="222" y="272" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">TPOT 18.43 to 9.92 ms</text>
  <rect x="440" y="250" width="180" height="34" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="530" y="270.45" font-size="11.5" text-anchor="middle" font-weight="700">draft cost, acceptance</text>
  <text x="20" y="300" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">A dashed border marks our hypothesis, not a finding of the report.</text>
</svg>
