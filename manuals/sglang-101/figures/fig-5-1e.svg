<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="fig-5-1e-title fig-5-1e-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-1e-title">TTFT quantiles of three runs at a cap of 16</title>
  <desc id="fig-5-1e-desc">Quantile curve of time to first token for the pooled requests of three seeds at a cap of 16 on a GB10, drawn from 51 quantiles between 0 and 100 percent. BF16 and FP8 rise steeply near 140 to 240 milliseconds, then flatten and finish near 1.2 and 1.7 seconds. EAGLE-3 starts later, near 580 milliseconds at the median, and has the shortest tail.</desc>
