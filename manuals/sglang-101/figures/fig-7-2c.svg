  <text x="444" y="287" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">weights</text>
  <rect x="522.3" y="266.09" width="59.4" height="3.91" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
