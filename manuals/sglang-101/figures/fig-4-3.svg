<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 456" role="img" aria-labelledby="fig-4-3-title fig-4-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-3-title">The default attention backend at v0.5.22</title>
  <desc id="fig-4-3-desc">A decision tree. The model attention type splits into MHA on the left and MLA on the right. For MHA: Hopper with CUDA 12.3 gives fa3 because of issue 17411, Blackwell SM100 gives trtllm_mha or fa4 for unequal K and V widths, AMD gives aiter, Apple MPS gives torch_native, and any other GPU gives flashinfer, or triton when the model has attention sinks. For MLA: Hopper gives fa3, Blackwell gives flashinfer, which DeepSeek V3 overrides to trtllm_mla, AMD gives aiter for 16 or 128 KV heads, and others give triton.</desc>
  <defs><marker id="fig-4-3-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <rect x="180" y="20" width="280" height="46" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="320" y="38.25" font-size="12.5" text-anchor="middle" font-weight="700">get_default_attn_backend</text>
  <text x="320" y="55.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">no --attention-backend given</text>
  <rect x="20" y="100" width="280" height="46" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="160" y="118.25" font-size="12.5" text-anchor="middle" font-weight="700">MHA model</text>
  <text x="160" y="135.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Llama, Qwen, Gemma</text>
  <rect x="340" y="100" width="280" height="46" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="480" y="118.25" font-size="12.5" text-anchor="middle" font-weight="700">MLA model</text>
  <text x="480" y="135.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">DeepSeek V3, GLM MoE</text>
  <line x1="240" y1="66" x2="240" y2="100" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-4-3-head-ink)"/>
  <line x1="400" y1="66" x2="400" y2="100" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-4-3-head-ink)"/>
  <line x1="28" y1="146" x2="28" y2="418" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/>
  <line x1="28" y1="194" x2="36" y2="194" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/>
  <text x="40" y="198" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">Hopper</text>
  <rect x="148" y="170" width="152" height="48" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="224" y="189.1" font-size="12" text-anchor="middle" font-weight="700">fa3</text>
  <text x="224" y="206.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">issue 17411</text>
  <line x1="28" y1="250" x2="36" y2="250" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/>
  <text x="40" y="254" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">Blackwell SM100</text>
  <rect x="148" y="226" width="152" height="48" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="224" y="245.1" font-size="12" text-anchor="middle" font-weight="700">trtllm_mha</text>
  <text x="224" y="262.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">fa4 for unequal K, V</text>
  <line x1="28" y1="306" x2="36" y2="306" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/>
  <text x="40" y="310" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">AMD ROCm</text>
  <rect x="148" y="282" width="152" height="48" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="224" y="301.1" font-size="12" text-anchor="middle" font-weight="700">aiter</text>
  <text x="224" y="318.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">all MHA models</text>
  <line x1="28" y1="362" x2="36" y2="362" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/>
  <text x="40" y="366" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">Apple MPS</text>
  <rect x="148" y="338" width="152" height="48" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="224" y="357.1" font-size="12" text-anchor="middle" font-weight="700">torch_native</text>
  <text x="224" y="374.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">PyTorch SDPA</text>
  <line x1="28" y1="418" x2="36" y2="418" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/>
  <text x="40" y="422" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">other GPUs</text>
  <rect x="148" y="394" width="152" height="48" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="224" y="413.1" font-size="12" text-anchor="middle" font-weight="700">flashinfer</text>
  <text x="224" y="430.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">triton with sinks</text>
  <line x1="348" y1="146" x2="348" y2="418" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/>
  <line x1="348" y1="194" x2="356" y2="194" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/>
  <text x="360" y="198" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">Hopper</text>
  <rect x="468" y="170" width="152" height="48" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="544" y="189.1" font-size="12" text-anchor="middle" font-weight="700">fa3</text>
  <text x="544" y="206.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">same as MHA</text>
  <line x1="348" y1="250" x2="356" y2="250" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/>
  <text x="360" y="254" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">Blackwell SM100</text>
  <rect x="468" y="226" width="152" height="48" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="544" y="245.1" font-size="12" text-anchor="middle" font-weight="700">flashinfer</text>
  <text x="544" y="262.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">DeepSeek V3 override</text>
  <line x1="348" y1="306" x2="356" y2="306" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/>
  <text x="360" y="310" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">AMD ROCm</text>
  <rect x="468" y="282" width="152" height="48" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="544" y="301.1" font-size="12" text-anchor="middle" font-weight="700">aiter</text>
  <text x="544" y="318.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">if 16 or 128 KV heads</text>
  <line x1="348" y1="362" x2="356" y2="362" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/>
  <text x="360" y="366" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">Apple MPS</text>
  <rect x="468" y="338" width="152" height="48" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="544" y="357.1" font-size="12" text-anchor="middle" font-weight="700">torch_native</text>
  <text x="544" y="374.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">PyTorch SDPA</text>
  <line x1="348" y1="418" x2="356" y2="418" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/>
  <text x="360" y="422" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">other GPUs</text>
  <rect x="468" y="394" width="152" height="48" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="544" y="413.1" font-size="12" text-anchor="middle" font-weight="700">triton</text>
  <text x="544" y="430.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">portable kernels</text>
