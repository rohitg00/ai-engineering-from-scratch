<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" role="img" aria-labelledby="fig-5-3d-title fig-5-3d-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-3d-title">Two prefix caches, one result</title>
  <desc id="fig-5-3d-desc">Median time to first token against shared prompt length from 0 to 4,096 tokens for SGLang 0.5.22 with its radix cache, vLLM 0.31.0 with prefix caching, and SGLang with the cache off, serving Qwen3-8B on one NVIDIA L4 at 8 users, three seeds per point, on a log scale. The two cached lines stay between 354 and 488 ms at every length. Without the cache the median rises to 14,706 ms at 4,096 shared tokens.</desc>
