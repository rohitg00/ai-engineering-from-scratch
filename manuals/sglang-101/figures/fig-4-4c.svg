<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="fig-4-4c-title fig-4-4c-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-4c-title">On a 24 GB card each token got faster, but the server did not</title>
  <desc id="fig-4-4c-desc">Two ratios for Qwen3-8B with EAGLE-3 against the BF16 default on one NVIDIA L4, three seeds per point. Time per output token stays about two times shorter at every concurrency. Output throughput is 2.37 times higher at concurrency 1 and falls to 1.00 at 32 and 0.98 at 64, because the KV pool shrank from 24,094 to 9,951 tokens.</desc>
