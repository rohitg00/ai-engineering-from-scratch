<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="fig-5-1f-title fig-5-1f-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-1f-title">The same server on the same L4, measured hot and measured with a cool-down</title>
  <desc id="fig-5-1f-desc">Output throughput of Qwen3-8B on one NVIDIA L4 against concurrency, in two sweeps with the same command. The first sweep ran with the card near 87 C and no telemetry. The second waited for 72 C before each run and recorded the clock. The cooled sweep is higher at every point, by up to 39 percent at concurrency 32, and it falls at 64 when the KV pool is full.</desc>
