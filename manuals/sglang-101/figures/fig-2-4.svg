<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" role="img" aria-labelledby="fig-2-4-title fig-2-4-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-4-title">The same three decode steps without and with overlap</title>
  <desc id="fig-2-4-desc">Two timelines with a GPU lane and a CPU lane. Without overlap, each GPU step is followed by a hatched gap while the CPU processes its results, and three steps end at 500. With overlap, the GPU runs steps back to back while the CPU processes the previous step under the next one, and both lanes finish three steps at 420.</desc>
  <defs><marker id="fig-2-4-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><pattern id="fig-2-4-hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.4"/></pattern></defs>
  <text x="80" y="22" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">WITHOUT OVERLAP: EVENT_LOOP_NORMAL</text>
  <text x="20" y="47" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">GPU</text>
  <text x="20" y="79" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">CPU</text>
  <text x="80" y="140" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">WITH OVERLAP: EVENT_LOOP_OVERLAP</text>
  <text x="20" y="165" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">GPU</text>
  <text x="20" y="197" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">CPU</text>
  <line x1="80" y1="246" x2="600" y2="246" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-2-4-head-ink)"/>
  <text x="608" y="250" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">t</text>
  <g data-beat="1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/>
  <rect x="80" y="32" width="100" height="22" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="130" y="47" font-size="11" text-anchor="middle">step 1</text>
  <rect x="180" y="64" width="40" height="22" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <rect x="180" y="32" width="40" height="22" fill="url(#fig-2-4-hatch)" stroke="var(--m-ink-mute, #6f6f6a)" stroke-opacity="0.35"/>
  </g>
  <g data-beat="2"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.571;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.05s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.571;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.05s" begin="indefinite" fill="freeze"/>
  <rect x="220" y="32" width="100" height="22" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="270" y="47" font-size="11" text-anchor="middle">step 2</text>
  <rect x="320" y="64" width="40" height="22" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <rect x="320" y="32" width="40" height="22" fill="url(#fig-2-4-hatch)" stroke="var(--m-ink-mute, #6f6f6a)" stroke-opacity="0.35"/>
  </g>
  <g data-beat="3"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.727;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.65s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.727;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.65s" begin="indefinite" fill="freeze"/>
  <rect x="360" y="32" width="100" height="22" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="410" y="47" font-size="11" text-anchor="middle">step 3</text>
  <rect x="460" y="64" width="40" height="22" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  </g>
  <g data-beat="4"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.8;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.25s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.8;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.25s" begin="indefinite" fill="freeze"/>
  <text x="510" y="48" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">three steps by 500</text>
  <text x="200" y="112" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the GPU waits for the CPU</text>
  </g>
  <g data-beat="5"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.842;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.85s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.842;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.85s" begin="indefinite" fill="freeze"/>
  <rect x="80" y="150" width="100" height="22" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="130" y="165" font-size="11" text-anchor="middle">step 1</text>
  <rect x="180" y="182" width="40" height="22" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  </g>
  <g data-beat="6"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.87;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="3.45s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.87;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="3.45s" begin="indefinite" fill="freeze"/>
  <rect x="180" y="150" width="100" height="22" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="230" y="165" font-size="11" text-anchor="middle">step 2</text>
  <rect x="280" y="182" width="40" height="22" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  </g>
  <g data-beat="7"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.889;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="4.05s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.889;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="4.05s" begin="indefinite" fill="freeze"/>
  <rect x="280" y="150" width="100" height="22" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="330" y="165" font-size="11" text-anchor="middle">step 3</text>
  <rect x="380" y="182" width="40" height="22" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  </g>
  <g data-beat="8"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.903;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="4.65s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.903;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="4.65s" begin="indefinite" fill="freeze"/>
  <text x="430" y="166" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">three steps by 420</text>
  <text x="200" y="222" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the CPU processes step N under step N+1</text>
  </g>
</svg>
