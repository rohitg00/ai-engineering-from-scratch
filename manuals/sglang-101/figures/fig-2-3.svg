<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="fig-2-3-title fig-2-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-3-title">Why five requests fit in 4,096 tokens and six do not</title>
  <desc id="fig-2-3-desc">Two bars show a KV pool of 4,096 tokens. In the first, five requests each reserve 256 prompt tokens and 512 output tokens, 3,840 tokens in all, with 256 tokens free. In the second, a sixth request would need 768 more tokens and runs 512 tokens past the end of the pool, so the scheduler keeps it waiting.</desc>
  <line x1="561.52" y1="30" x2="561.52" y2="176" stroke="var(--m-ink, #1a1a1a)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="565.52" y="26" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">pool end</text>
  <text x="70" y="26" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">ADMITTED: FIVE REQUESTS</text>
  <rect x="70" y="36" width="30.72" height="28" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
