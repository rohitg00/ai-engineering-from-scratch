  <rect x="346.48" y="36" width="30.72" height="28" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <rect x="377.2" y="36" width="61.44" height="28" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <rect x="438.64" y="36" width="30.72" height="28" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <rect x="469.36" y="36" width="61.44" height="28" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <rect x="530.8" y="36" width="30.72" height="28" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="70" y="84" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">each request reserves 256 prompt + 512 output = 768 tokens</text>
  <text x="70" y="120" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">A SIXTH REQUEST WOULD NEED 4,608</text>
