  <text x="90" y="232" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">prompt KV</text>
  <rect x="190" y="222" width="14" height="12" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="210" y="232" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">reserved output</text>
  <rect x="350" y="222" width="14" height="12" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="370" y="232" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">free</text>
