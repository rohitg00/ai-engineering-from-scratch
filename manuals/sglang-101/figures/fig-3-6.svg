<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-labelledby="fig-3-6-title fig-3-6-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-6-title">A Mamba prefix resumes only at a snapshot</title>
  <desc id="fig-3-6-desc">A cached conversation drawn as a token ribbon from 0 to 2,048 tokens, with Mamba state snapshots every 256 tokens. A new request matches the first 1,800 tokens. Full-attention KV exists for all 1,800 tokens, but the recurrent state exists only at snapshots, so the request resumes from the snapshot at 1,792 tokens and prefills tokens 1,792 to 1,800 again.</desc>
  <text x="20" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">CACHED CONVERSATION · 2,048 TOKENS</text>
  <rect x="40" y="32" width="560" height="26" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <line x1="40" y1="58" x2="40" y2="70" stroke="var(--m-teal-ink, #18696a)" stroke-width="2"/>
  <text x="40" y="86" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #6f6f6a)">0</text>
  <line x1="110" y1="58" x2="110" y2="70" stroke="var(--m-teal-ink, #18696a)" stroke-width="2"/>
  <line x1="180" y1="58" x2="180" y2="70" stroke="var(--m-teal-ink, #18696a)" stroke-width="2"/>
  <text x="180" y="86" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #6f6f6a)">512</text>
  <line x1="250" y1="58" x2="250" y2="70" stroke="var(--m-teal-ink, #18696a)" stroke-width="2"/>
  <line x1="320" y1="58" x2="320" y2="70" stroke="var(--m-teal-ink, #18696a)" stroke-width="2"/>
  <text x="320" y="86" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #6f6f6a)">1,024</text>
  <line x1="390" y1="58" x2="390" y2="70" stroke="var(--m-teal-ink, #18696a)" stroke-width="2"/>
  <line x1="460" y1="58" x2="460" y2="70" stroke="var(--m-teal-ink, #18696a)" stroke-width="2"/>
  <text x="460" y="86" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #6f6f6a)">1,536</text>
  <line x1="530" y1="58" x2="530" y2="70" stroke="var(--m-teal-ink, #18696a)" stroke-width="2"/>
  <line x1="600" y1="58" x2="600" y2="70" stroke="var(--m-teal-ink, #18696a)" stroke-width="2"/>
  <text x="600" y="86" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #6f6f6a)">2,048</text>
  <text x="40" y="106" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">teal ticks: Mamba state snapshots, every 256 tokens</text>
  <text x="20" y="140" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">NEW REQUEST · MATCHES 1,800 TOKENS</text>
  <rect x="40" y="152" width="490" height="26" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <rect x="530" y="152" width="2.19" height="26" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <line x1="530" y1="146" x2="530" y2="186" stroke="var(--m-teal-ink, #18696a)" stroke-width="2"/>
  <text x="40" y="204" font-size="11.5" fill="var(--m-green-ink, #336b40)">reused: 1,792 tokens, up to the last snapshot</text>
  <text x="40" y="224" font-size="11.5" fill="var(--m-plum-ink, #8a3d72)">prefilled again: 8 tokens from 1,792 to 1,800</text>
  <text x="40" y="256" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Full-attention KV exists for every token. The recurrent state</text>
  <text x="40" y="274" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">exists only where a snapshot was saved.</text>
</svg>
