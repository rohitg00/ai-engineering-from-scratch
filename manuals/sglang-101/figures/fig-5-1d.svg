  <title id="fig-5-1d-title">Requests served and requests served within the target, against offered load</title>
  <desc id="fig-5-1d-desc">Poisson arrivals at 0.5 to 16 requests per second on a GB10 with Qwen3-30B-A3B. Dashed lines show requests completed per second, solid lines show the requests that met a first token under 1 second and a mean time per token under 100 milliseconds. FP8 serves 1.03 requests per second within the target at 1 offered and almost none from 4. BF16 meets the target for almost no request at any load.</desc>
