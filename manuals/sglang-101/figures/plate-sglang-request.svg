<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="plate-sglang-request-title plate-sglang-request-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="plate-sglang-request-title">One request, three processes, one cache</title>
  <desc id="plate-sglang-request-desc">A chat request with a 2,999-token prompt crosses the tokenizer manager, the scheduler, and the detokenizer. The scheduler finds 2,998 tokens in the radix cache, prefills one, and the first token arrives in 34.0 ms. Below, three versions of the same system prompt: unchanged, with a request id at the start, and with the id at the end, with their cached tokens and median time to first token.</desc>
  <defs><marker id="plate-sglang-request-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="plate-sglang-request-head-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-indigo-ink, #4b4f9e)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">ONE REQUEST · ROUND 3 OF THE STABLE SYSTEM PROMPT</text>
  <rect x="20" y="34" width="100" height="56" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="70" y="57.25" font-size="12.5" text-anchor="middle" font-weight="700">client</text>
  <text x="70" y="74.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">2,999 tokens</text>
  <rect x="140" y="34" width="160" height="56" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="220" y="57.25" font-size="12.5" text-anchor="middle" font-weight="700">TokenizerManager</text>
  <text x="220" y="74.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">text to ids</text>
  <rect x="320" y="34" width="140" height="56" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="390" y="57.25" font-size="12.5" text-anchor="middle" font-weight="700">Scheduler</text>
  <text x="390" y="74.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">match_prefix</text>
  <rect x="480" y="34" width="140" height="56" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="550" y="57.25" font-size="12.5" text-anchor="middle" font-weight="700">Detokenizer</text>
  <text x="550" y="74.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ids to text</text>
  <g data-beat="1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/>
  <line x1="120" y1="62" x2="139" y2="62" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#plate-sglang-request-head-ink)"/>
  <circle class="m-packet" r="3.5" fill="var(--m-ink, #1a1a1a)" opacity="0"><animateMotion path="M120 62 L139 62" keyPoints="0;0;1;1" keyTimes="0;0;0.688;1" calcMode="linear" dur="0.8s" begin="indefinite" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0;0.1;0.688;1" dur="0.8s" begin="indefinite" fill="freeze"/></circle>
  </g>
  <g data-beat="2"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.571;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.05s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.571;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.05s" begin="indefinite" fill="freeze"/>
  <line x1="300" y1="62" x2="319" y2="62" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#plate-sglang-request-head-indigo)"/>
  <circle class="m-packet" r="3.5" fill="var(--m-indigo-ink, #4b4f9e)" opacity="0"><animateMotion path="M300 62 L319 62" keyPoints="0;0;1;1" keyTimes="0;0.429;0.821;1" calcMode="linear" dur="1.4s" begin="indefinite" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.429;0.486;0.821;1" dur="1.4s" begin="indefinite" fill="freeze"/></circle>
  </g>
  <g data-beat="3"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.727;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.65s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.727;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.65s" begin="indefinite" fill="freeze"/>
  <line x1="460" y1="62" x2="479" y2="62" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#plate-sglang-request-head-indigo)"/>
  <circle class="m-packet" r="3.5" fill="var(--m-indigo-ink, #4b4f9e)" opacity="0"><animateMotion path="M460 62 L479 62" keyPoints="0;0;1;1" keyTimes="0;0.6;0.875;1" calcMode="linear" dur="2s" begin="indefinite" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.64;0.875;1" dur="2s" begin="indefinite" fill="freeze"/></circle>
  </g>
  <g data-beat="4"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.8;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.25s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.8;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.25s" begin="indefinite" fill="freeze"/>
  <text x="20" y="124" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">THE PROMPT AS THE RADIX CACHE SAW IT</text>
  <rect x="20" y="134" width="590" height="30" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="30" y="154" font-size="12" font-weight="700" fill="var(--m-green-ink, #336b40)">2,998 cached tokens · system prompt and chat template</text>
  </g>
  <g data-beat="5"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.842;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.85s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.842;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.85s" begin="indefinite" fill="freeze"/>
  <rect x="610" y="134" width="10" height="30" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="620" y="184" font-size="11" text-anchor="end" fill="var(--m-plum-ink, #8a3d72)">1 new token</text>
  <text x="20" y="184" font-size="12" font-weight="700" fill="var(--m-plum-ink, #8a3d72)">first token after 34.0 ms</text>
  </g>
  <text x="20" y="226" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">THE SAME SYSTEM PROMPT THREE WAYS · MEDIAN OF ROUNDS 2 TO 5 OR 1 TO 5</text>
  <g data-beat="6"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.87;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="3.45s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.87;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="3.45s" begin="indefinite" fill="freeze"/>
  <rect x="20" y="238" width="260" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="32" y="263.75" font-size="12.5" font-weight="700">unchanged</text>
  <text x="300" y="265" font-size="12" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">2,998 of 2,999 cached</text>
  <text x="620" y="265" font-size="13" text-anchor="end" font-weight="700" fill="var(--m-plum-ink, #8a3d72)">45.1 ms</text>
  </g>
  <g data-beat="7"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.889;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="4.05s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.889;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="4.05s" begin="indefinite" fill="freeze"/>
  <rect x="20" y="294" width="260" height="44" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="32" y="319.75" font-size="12.5" font-weight="700">request id at the start</text>
  <text x="300" y="321" font-size="12" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">5 of 3,034 cached</text>
  <text x="620" y="321" font-size="13" text-anchor="end" font-weight="700" fill="var(--m-rose-ink, #b0344d)">1,255.3 ms</text>
  </g>
  <g data-beat="8"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.903;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="4.65s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.903;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="4.65s" begin="indefinite" fill="freeze"/>
  <rect x="20" y="350" width="260" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="32" y="375.75" font-size="12.5" font-weight="700">request id at the end</text>
  <text x="300" y="377" font-size="12" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">2,985 of 3,028 cached</text>
  <text x="620" y="377" font-size="13" text-anchor="end" font-weight="700" fill="var(--m-plum-ink, #8a3d72)">88.2 ms</text>
  </g>
  <text x="20" y="412" font-size="11" class="m-serif" fill="var(--m-ink-mute, #6f6f6a)">From capture/out/cache-experiment.txt · SGLang 0.5.22 on MLX · Qwen3-0.6B-4bit</text>
</svg>
