<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="fig-4-7-title fig-4-7-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-7-title">The same feature at two batch sizes</title>
  <desc id="fig-4-7-desc">Two panels of output tokens per second for Llama-3.1-8B on one A6000 from issue 5274. At batch 1, without speculation 42.0 and with EAGLE-3 92.5. At concurrency 20, without speculation 217.8 and with EAGLE-3 164.4. Both panels use one vertical scale.</desc>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">A · BATCH 1</text>
  <text x="336" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">B · CONCURRENCY 20</text>
  <line x1="320" y1="8" x2="320" y2="292" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="40" y1="240" x2="300" y2="240" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/>
  <rect x="60" y="205.29" width="80" height="34.71" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)" stroke-dasharray="5 4"/>
  <text x="100" y="199.29" font-size="11" text-anchor="middle">42.0</text>
  <text x="100" y="258" font-size="11" text-anchor="middle">no speculation</text>
  <rect x="180" y="163.55" width="80" height="76.45" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="220" y="157.55" font-size="11" text-anchor="middle">92.5</text>
  <text x="220" y="258" font-size="11" text-anchor="middle">EAGLE-3</text>
  <line x1="360" y1="240" x2="620" y2="240" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/>
  <rect x="380" y="60" width="80" height="180" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)" stroke-dasharray="5 4"/>
  <text x="420" y="54" font-size="11" text-anchor="middle">217.8</text>
  <text x="420" y="258" font-size="11" text-anchor="middle">no speculation</text>
  <rect x="500" y="104.13" width="80" height="135.87" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="540" y="98.13" font-size="11" text-anchor="middle">164.4</text>
  <text x="540" y="258" font-size="11" text-anchor="middle">EAGLE-3</text>
  <text x="20" y="284" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">output tok/s, issue 5274, 2025-04-11</text>
</svg>
