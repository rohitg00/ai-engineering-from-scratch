<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" role="img" aria-labelledby="fig-6-2-title fig-6-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-2-title">One token through an MoE layer</title>
  <desc id="fig-6-2-desc">Four stages from left to right. TopK picks experts for each token. The dispatcher, chosen with moe-a2a-backend, moves tokens to the GPUs that hold those experts. MoeRunner computes the local experts with a grouped matrix multiply chosen with moe-runner-backend. The dispatcher combines the results and moves them back.</desc>
  <defs><marker id="fig-6-2-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-6-2-head-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-indigo-ink, #4b4f9e)"/></marker></defs>
  <text x="20" y="22" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">ONE MOE LAYER, EVERY STEP</text>
  <rect x="20" y="40" width="142" height="92" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="91" y="73.75" font-size="12.5" text-anchor="middle" font-weight="700">TopK</text>
  <text x="91" y="91.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">picks experts</text>
  <text x="91" y="106.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">for each token</text>
  <rect x="176" y="40" width="142" height="92" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="247" y="73.75" font-size="12.5" text-anchor="middle" font-weight="700">dispatch</text>
  <text x="247" y="91.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">tokens move to</text>
  <text x="247" y="106.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">expert GPUs</text>
  <rect x="332" y="40" width="142" height="92" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="403" y="73.75" font-size="12.5" text-anchor="middle" font-weight="700">MoeRunner</text>
  <text x="403" y="91.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">grouped matrix</text>
  <text x="403" y="106.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">multiply</text>
  <rect x="488" y="40" width="142" height="92" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="559" y="73.75" font-size="12.5" text-anchor="middle" font-weight="700">combine</text>
  <text x="559" y="91.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">results move</text>
  <text x="559" y="106.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">back to tokens</text>
  <line x1="162" y1="86" x2="175" y2="86" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-2-head-ink)"/>
  <line x1="318" y1="86" x2="331" y2="86" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#fig-6-2-head-indigo)"/>
  <line x1="474" y1="86" x2="487" y2="86" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#fig-6-2-head-indigo)"/>
  <text x="176" y="156" font-size="11" fill="var(--m-indigo-ink, #4b4f9e)">--moe-a2a-backend</text>
  <text x="332" y="156" font-size="11" fill="var(--m-plum-ink, #8a3d72)">--moe-runner-backend</text>
  <text x="488" y="156" font-size="11" fill="var(--m-indigo-ink, #4b4f9e)">--moe-a2a-backend</text>
  <line x1="20" y1="176" x2="630" y2="176" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.4"/>
  <text x="20" y="198" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">--deepep-mode auto: normal for prefill batches, low_latency for decode</text>
  <text x="20" y="218" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">all-to-all backends set --ep-size to --tp-size</text>
</svg>
