  <text x="64" y="290" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">100</text>
  <line x1="70" y1="233.04" x2="606" y2="233.04" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="237.04" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">300</text>
  <line x1="70" y1="175" x2="606" y2="175" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="179" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">1k</text>
  <line x1="70" y1="122.04" x2="606" y2="122.04" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="126.04" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">3k</text>
  <line x1="70" y1="64" x2="606" y2="64" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="68" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">10k</text>
  <line x1="70" y1="286" x2="606" y2="286" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
