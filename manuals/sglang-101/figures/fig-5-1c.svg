  <title id="fig-5-1c-title">Output throughput against concurrency on a GB10, three seeds per point</title>
  <desc id="fig-5-1c-desc">Qwen3-30B-A3B on one NVIDIA GB10, 512 tokens in and 128 out. FP8 rises to 441 tokens per second at concurrency 64, BF16 to 235. EAGLE-3 leads BF16 up to 32 and reaches 276 at 64. The run without CUDA graphs lies on top of the default. Bands show the lowest and highest of three seeds.</desc>
