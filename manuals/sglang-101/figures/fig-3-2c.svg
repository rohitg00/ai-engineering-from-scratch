<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="fig-3-2c-title fig-3-2c-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-2c-title">A larger pool bought nothing when the pool was never full</title>
  <desc id="fig-3-2c-desc">Output throughput against concurrency from 1 to 64 for Qwen3-30B-A3B on one NVIDIA GB10, three seeds per point, at --mem-fraction-static 0.7 and 0.82. The BF16 pool grew from 234,600 to 383,065 tokens and the FP8 pool from 1,084,458 to 1,378,545, yet each pair of lines lies on top of the other: 235 against 239 tok/s for BF16 and 441 against 443 for FP8 at 64.</desc>
