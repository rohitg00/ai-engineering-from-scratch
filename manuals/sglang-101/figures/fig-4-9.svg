<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="fig-4-9-title fig-4-9-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-9-title">One row reduced in two batches</title>
  <desc id="fig-4-9-desc">Two columns. On the left, a default matrix multiply kernel reduces the same request row in two tiles when the batch has 1 request and in four tiles when the batch has 37 requests, so the partial sums add in different orders and the last bits of the result can differ. On the right, a batch-invariant kernel uses the same fixed split in both batches, so the result is the same bits in both.</desc>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">A · DEFAULT KERNEL</text>
  <text x="336" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">B · BATCH-INVARIANT KERNEL</text>
  <line x1="320" y1="8" x2="320" y2="332" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="20" y="44" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">batch of 1</text>
  <rect x="20" y="54" width="139" height="26" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <rect x="165" y="54" width="139" height="26" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="20" y="100" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">2 partial sums, added in order</text>
  <rect x="20" y="110" width="284" height="36" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="162" y="131.6" font-size="12" text-anchor="middle" font-weight="700">logit x</text>
  <text x="20" y="184" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">batch of 37</text>
  <rect x="20" y="194" width="66.5" height="26" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <rect x="92.5" y="194" width="66.5" height="26" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <rect x="165" y="194" width="66.5" height="26" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <rect x="237.5" y="194" width="66.5" height="26" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="20" y="240" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">4 partial sums, added in order</text>
  <rect x="20" y="250" width="284" height="36" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <text x="162" y="271.6" font-size="12" text-anchor="middle" font-weight="700">logit x, last bits can differ</text>
  <text x="336" y="44" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">batch of 1</text>
  <rect x="336" y="54" width="66.5" height="26" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <rect x="408.5" y="54" width="66.5" height="26" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <rect x="481" y="54" width="66.5" height="26" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <rect x="553.5" y="54" width="66.5" height="26" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="336" y="100" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">4 partial sums, added in order</text>
  <rect x="336" y="110" width="284" height="36" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="478" y="131.6" font-size="12" text-anchor="middle" font-weight="700">logit x</text>
  <text x="336" y="184" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">batch of 37</text>
  <rect x="336" y="194" width="66.5" height="26" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <rect x="408.5" y="194" width="66.5" height="26" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <rect x="481" y="194" width="66.5" height="26" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <rect x="553.5" y="194" width="66.5" height="26" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="336" y="240" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">4 partial sums, added in order</text>
  <rect x="336" y="250" width="284" height="36" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="478" y="271.6" font-size="12" text-anchor="middle" font-weight="700">logit x, same bits</text>
</svg>
