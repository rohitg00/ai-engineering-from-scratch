<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="fig-1-3-title fig-1-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-1-3-title">One /generate request through the three processes</title>
  <desc id="fig-1-3-desc">Four lifelines: the client, the tokenizer manager, the scheduler, and the detokenizer. The client posts a five-token prompt. The tokenizer manager sends token ids to the scheduler over ZMQ. The scheduler matches two cached tokens in the radix cache, prefills three, and returns the first token after 68 ms. Eleven decode steps follow, and the detokenizer returns the text, for 725 ms end to end.</desc>
