<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="fig-3-3c-title fig-3-3c-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-3c-title">The longer the shared prompt, the more the tree saves</title>
  <desc id="fig-3-3c-desc">Median time to first token against the length of a shared system prompt on one NVIDIA L4 with Qwen3-8B, three seeds per point, on a log scale. With the radix cache the median stays between 349 and 479 ms. Without it the median grows from 379 ms with no shared prompt to 14,706 ms with 4,096 shared tokens.</desc>
