<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 196" role="img" aria-labelledby="fig-5-2-title fig-5-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-2-title">One server, two cache hit rates</title>
  <desc id="fig-5-2-desc">Left, the cache_hit_rate gauge, overwritten on each log interval, reads 0.942 for the last prefill interval. Right, the device_hit counter at 182,079 tokens and the input counter at 104,057 tokens give 182,079 divided by 286,136, which is 0.636 over the whole run.</desc>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">A · THE GAUGE</text>
  <text x="340" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">B · THE COUNTERS</text>
  <line x1="320" y1="8" x2="320" y2="188" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="20" y="32" width="280" height="52" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="160" y="53.25" font-size="12.5" text-anchor="middle" font-weight="700">sglang:cache_hit_rate</text>
  <text x="160" y="70.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">gauge, overwritten each log interval</text>
  <text x="160" y="128" font-size="22" text-anchor="middle" font-weight="700" fill="var(--m-green-ink, #336b40)">0.942</text>
  <text x="160" y="152" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the last prefill interval only</text>
  <rect x="340" y="32" width="130" height="52" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="405" y="53.25" font-size="12.5" text-anchor="middle" font-weight="700">device_hit</text>
  <text x="405" y="70.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">182,079 tokens</text>
  <rect x="490" y="32" width="130" height="52" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="555" y="53.25" font-size="12.5" text-anchor="middle" font-weight="700">input</text>
  <text x="555" y="70.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">104,057 tokens</text>
  <line x1="405" y1="84" x2="405" y2="110" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="555" y1="84" x2="555" y2="110" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <rect x="340" y="110" width="280" height="52" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="480" y="131.25" font-size="12.5" text-anchor="middle" font-weight="700">182,079 / 286,136 = 0.636</text>
  <text x="480" y="148.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">all prefill since the server started</text>
</svg>
