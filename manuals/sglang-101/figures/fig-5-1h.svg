<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="fig-5-1h-title fig-5-1h-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-1h-title">Fixed lengths trade a slow first token for smooth decoding</title>
  <desc id="fig-5-1h-desc">Median time to first token and P99 inter-token latency against --random-range-ratio on one NVIDIA L4 with Qwen3-8B, a cap of 16 and 64 prompts, three seeds per point, on a log scale. At a ratio of 1.0 every request has 512 input and 128 output tokens, and the median TTFT is 1,996 ms for BF16 and 1,526 ms for FP8, while P99 ITL is 82 and 55 ms. At a ratio of 0.0 the lengths vary, the median TTFT is 291 and 129 ms, and P99 ITL is 300 and 95 ms.</desc>
  <line x1="70" y1="294" x2="606" y2="294" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="298" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">30</text>
