<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" role="img" aria-labelledby="fig-4-4b-title fig-4-4b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-4b-title">On a mixture-of-experts model the EAGLE-3 gain grows with the batch</title>
  <desc id="fig-4-4b-desc">Speedup of median time per output token with EAGLE-3 over the BF16 default for Qwen3-30B-A3B on a GB10. It is 1.60 times at concurrency 1, rises to 1.89 at 32 and is 1.84 at 64, while the accept length stays near 2.7 tokens per step.</desc>
