  <title id="fig-5-1g-title">The same open loop on a 24 GB L4</title>
  <desc id="fig-5-1g-desc">Poisson arrivals at 0.5 to 16 requests per second on one L4 with Qwen3-8B. Dashed lines show requests completed per second, solid lines show the requests that met a first token under 1 second and a mean time per token under 100 milliseconds. FP8 serves 3.18 requests per second within the target at 4 offered. BF16 peaks at 0.96 within the target at 1 offered, and completes fewer requests as the offered rate rises past 4.</desc>
